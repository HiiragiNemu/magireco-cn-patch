name: Apply audited Totentanz gacha CN overlay

on:
  push:
    branches:
      - research/totentanz-gacha-cn-authority-20260807
    paths:
      - magica/research/totentanz-gacha-cn-overlay/**
      - .github/workflows/gacha-cn-overlay-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/totentanz-gacha-cn-authority-20260807
          fetch-depth: 0

      - name: Apply fail-closed gacha text overlay
        run: python magica/research/totentanz-gacha-cn-overlay/apply_gacha_overlay.py

      - name: Validate JavaScript syntax
        run: |
          node --check magica/js/campaign/box_gacha/CampaignBoxGachaTop.js
          node --check magica/js/gacha/GachaResult.js

      - name: Validate authority terms and preservation boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '协助Pt' magica/js/gacha/GachaResult.js
          grep -q '获得履历' magica/template/gacha/GachaTop.html
          grep -q '掉落率' magica/template/gacha/GachaProbabilityPop.html
          grep -q '扭蛋' magica/template/gacha/GachaResult.html
          ! grep -R -E '支援Pt|获得记录|抽卡概率一览|出货率' \
            magica/js/gacha/GachaResult.js \
            magica/template/gacha/GachaTop.html \
            magica/template/gacha/GachaProbabilityPop.html
          if git diff --name-only f25b445d7bcb9b9710f51d82ca9330995185d623 -- 'magica/css/**' 'magica/resource/**' 'magica/js/libs/**' 'magica/js/quest/puellaHistoria/**' 'magica/template/quest/puellaHistoria/**' | grep -q .; then
            echo 'Forbidden preservation-boundary change detected' >&2
            exit 1
          fi

      - name: Commit audited product layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            magica/js/campaign/box_gacha/CampaignBoxGachaTop.js \
            magica/js/gacha/GachaResult.js \
            magica/template/campaign/box_gacha/CampaignBoxGachaTop.html \
            magica/template/campaign/gacha_lineup/CampaignGachaLineUp.html \
            magica/template/gacha/GachaAnimation.html \
            magica/template/gacha/GachaResult.html \
            magica/template/gacha/SelectableGachaCharaSelect.html \
            magica/template/gacha/SelectableGachaPieceSelect.html \
            magica/template/gacha/GachaTop.html \
            magica/template/gacha/GachaProbabilityPop.html
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 0; }
          git commit -m 'feat(gacha): apply authoritative CN text to current Totentanz structure'
          git push origin HEAD:research/totentanz-gacha-cn-authority-20260807
