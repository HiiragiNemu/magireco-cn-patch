name: 🩹 修复 cn_base 内嵌 prologueBattle3

# ╔════════════════════════════════════════════════════════════════════╗
# ║   一次性修复工作流（workflow_dispatch 手动触发，上游版）            ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║                                                                    ║
# ║ 背景                                                                ║
# ║ ───────                                                            ║
# ║   cn_base_02.zip 内嵌的                                              ║
# ║   madomagi/resource/image_native/scene/quest/prologueBattle3.json   ║
# ║   在历史上游打包时被损坏：6 个战斗单位的 hpStart 被清零              ║
# ║   （wave0 五个「魔女的手下」应为 10000，wave1 BOSS「委员长魔女」     ║
# ║   应为 150000；部位单位 0/0 与晓美焰 hpStart=0 是日文原版设定）。    ║
# ║   敌人 0 血出生 → CONNECT 教学战被打断 → BOSS 登场动画后            ║
# ║   navi 指令永远等不到 turn → 序章卡死在战斗背景。                    ║
# ║   cn_base_01_json.zip 内 madomagi/asset_main.json（游戏本地          ║
# ║   资源清单）记录的是损坏版 md5/size，须一并修正。                    ║
# ║                                                                    ║
# ║ 与下游（MagirecoCN-Revival-Project/patch-front）同名工作流     ║
# ║ 的差异：下游版另有 object-storage 覆盖上传与 edge/ESA/CDN 刷缓存       ║
# ║ 步骤（密钥只存在于下游）；本仓库只需把 Release asset 重传。          ║
# ║ 下游 Release 已先行修复，本流程消除 sync 全量镜像把损坏版            ║
# ║ 盖回下游的回归风险。                                                 ║
# ║                                                                    ║
# ║ 默认 dry-run（confirm=false）：只下载+修补+校验+扫描。               ║
# ║                                                                    ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认执行（false=演练：下载+修补+校验+扫描，不重传）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

env:
  : ${{ secrets. }}
  CONFIRM: ${{ github.event.inputs.confirm }}
  ASSET_A: cn_base_02.zip
  ENTRY_A: madomagi/resource/image_native/scene/quest/prologueBattle3.json
  ASSET_B: cn_base_01_json.zip
  ENTRY_B: madomagi/asset_main.json
  BAD_MD5: bd4ad66aab5cf1c311bad293e042e12d
  FIXED_MD5: 19c3a7535f24895b648a19601264eb30

jobs:
  fix:
    name: 🩹 修补 prologueBattle3
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 检出仓库（取修复版 JSON 与修正后清单）
        uses: actions/checkout@v4

      - name: 🔎 校验修复版 JSON 与清单记录一致
        run: |
          set -euo pipefail
          echo "$FIXED_MD5  fixes/prologueBattle3.json" | md5sum -c -
          python3 - <<'EOF'
          import json
          json.load(open('fixes/prologueBattle3.json'))
          e = next(x for x in json.load(open('madomagi/asset_main.json'))
                   if x['path'].endswith('prologueBattle3.json'))
          assert e['md5'] == '19c3a7535f24895b648a19601264eb30', e
          assert e['file_list'][0]['size'] == 15320, e
          e = next(x for x in json.load(open('asset_main_cn.json'))
                   if x['path'].endswith('prologueBattle3.json'))
          assert e['md5'] == '19c3a7535f24895b648a19601264eb30', e
          assert e['file_list'][0]['size'] == 15320, e
          print("✔ 修复版 JSON md5、两份清单记录均正确")
          EOF

      - name: ⬇️ 下载 latest Release 的两个 asset
        run: |
          set -euo pipefail
          mkdir -p work
          gh release download latest --pattern "$ASSET_A" --dir work --clobber
          gh release download latest --pattern "$ASSET_B" --dir work --clobber
          ls -la work/

      - name: 🔧 A：修补 cn_base_02.zip 条目 + 全量 quest 扫描
        id: patch_a
        run: |
          python3 <<'SCRIPT_END'
          import os, sys, json, zipfile, hashlib, shutil

          sys.stdout.reconfigure(line_buffering=True)

          ASSET  = os.environ['ASSET_A']
          ENTRY  = os.environ['ENTRY_A']
          BAD    = os.environ['BAD_MD5']
          FIXED  = os.environ['FIXED_MD5']
          SRC    = f"work/{ASSET}"
          DST    = f"work/{ASSET}.new"

          def md5(b): return hashlib.md5(b).hexdigest()

          fixed_data = open('fixes/prologueBattle3.json', 'rb').read()
          assert md5(fixed_data) == FIXED, "修复版 JSON md5 不符，拒绝继续"

          zin = zipfile.ZipFile(SRC)
          cur_md5 = md5(zin.read(ENTRY))
          print(f"A 当前内嵌条目 md5={cur_md5}")
          if cur_md5 == FIXED:
              print("✔ A 已是修复版，跳过")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write("already_fixed=true\n")
              sys.exit(0)
          if cur_md5 != BAD:
              print(f"✘ A 条目 md5 既不是损坏版({BAD})也不是修复版({FIXED})，"
                    "出现第三种未知版本，拒绝盲目覆盖")
              sys.exit(1)
          print("A 确认为损坏版，开始重写 zip …")

          with zipfile.ZipFile(DST, 'w', zipfile.ZIP_DEFLATED,
                               compresslevel=6, allowZip64=True) as zout:
              for item in zin.infolist():
                  if item.filename == ENTRY:
                      zi = zipfile.ZipInfo(ENTRY, date_time=item.date_time)
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      zi.external_attr = item.external_attr
                      zout.writestr(zi, fixed_data)
                  else:
                      zout.writestr(item, zin.read(item.filename))
          zin.close()

          zchk = zipfile.ZipFile(DST)
          assert zchk.testzip() is None, "A 重写后的 zip CRC 校验失败"
          assert md5(zchk.read(ENTRY)) == FIXED, "A 重写后条目 md5 仍不对"
          print(f"✔ A 重写完成: {os.path.getsize(DST)} 字节")

          # 全量 quest 扫描：hp>0 但 hpStart==0 的可疑单位
          # 已知原版设定（日文原版即如此，不算异常）：
          KNOWN_OK = {
              # prologueBattle3 playerList[2] 晓美焰：CONNECT 教学剧情单位
              ('prologueBattle3.json', 5000, 0),
          }
          suspects = []
          def walk(o, where):
              if isinstance(o, dict):
                  if o.get('hpStart') == 0 and o.get('hp', 0) > 0:
                      suspects.append((where, o.get('name', '?'),
                                       o.get('hp'), o.get('hpStart')))
                  for k, v in o.items():
                      walk(v, f"{where}/{k}")
              elif isinstance(o, list):
                  for i, v in enumerate(o):
                      walk(v, f"{where}[{i}]")
          n_quest = 0
          for name in zchk.namelist():
              if '/scene/quest/' not in name or not name.endswith('.json'):
                  continue
              n_quest += 1
              base = name.rsplit('/', 1)[-1]
              try:
                  data = json.loads(zchk.read(name))
              except Exception as e:
                  suspects.append((name, f'<JSON 解析失败: {e}>', 0, 0))
                  continue
              walk(data, base)
              suspects[:] = [s for s in suspects
                             if not ((s[0] == base or s[0].startswith(base + '/'))
                                     and (base, s[2], s[3]) in KNOWN_OK)]
          print(f"A 扫描 scene/quest/*.json 共 {n_quest} 个文件，"
                f"可疑 hpStart 清零 {len(suspects)} 处")
          for s in suspects:
              print(f"  ⚠ {s[0]}: {s[1]} hp={s[2]} hpStart={s[3]}")

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write("## 🩹 A: cn_base_02.zip / prologueBattle3\n\n")
              fh.write(f"- 条目 `{ENTRY}`\n")
              fh.write(f"- 损坏版 md5 `{BAD}` → 修复版 md5 `{FIXED}`\n")
              fh.write(f"- 重写后 zip: {os.path.getsize(DST)} 字节\n\n")
              fh.write(f"## 🔎 quest 扫描（{n_quest} 文件）\n\n")
              if suspects:
                  for s in suspects:
                      fh.write(f"- ⚠ `{s[0]}`: {s[1]} hp={s[2]} hpStart={s[3]}\n")
              else:
                  fh.write("- 无可疑 hpStart 清零（已知原版设定除外）\n")

          shutil.move(DST, SRC)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write("already_fixed=false\n")
          SCRIPT_END

      - name: 🔧 B：替换 cn_base_01_json.zip 内嵌清单
        id: patch_b
        run: |
          python3 <<'SCRIPT_END'
          import os, sys, json, zipfile, hashlib, shutil

          sys.stdout.reconfigure(line_buffering=True)

          ASSET = os.environ['ASSET_B']
          ENTRY = os.environ['ENTRY_B']
          SRC   = f"work/{ASSET}"
          DST   = f"work/{ASSET}.new"

          new_manifest = open('madomagi/asset_main.json', 'rb').read()
          e = next(x for x in json.loads(new_manifest)
                   if x['path'].endswith('prologueBattle3.json'))
          assert e['md5'] == os.environ['FIXED_MD5']

          zin = zipfile.ZipFile(SRC)
          cur = json.loads(zin.read(ENTRY))
          e2 = next(x for x in cur if x['path'].endswith('prologueBattle3.json'))
          print(f"B 包内清单当前记录: md5={e2['md5']} "
                f"size={e2['file_list'][0]['size']}")
          if e2['md5'] == os.environ['FIXED_MD5']:
              print("✔ B 已是修正版，跳过")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write("already_fixed=true\n")
              sys.exit(0)

          with zipfile.ZipFile(DST, 'w', zipfile.ZIP_DEFLATED,
                               compresslevel=6, allowZip64=True) as zout:
              for item in zin.infolist():
                  if item.filename == ENTRY:
                      zi = zipfile.ZipInfo(ENTRY, date_time=item.date_time)
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      zi.external_attr = item.external_attr
                      zout.writestr(zi, new_manifest)
                  else:
                      zout.writestr(item, zin.read(item.filename))
          zin.close()

          zchk = zipfile.ZipFile(DST)
          assert zchk.testzip() is None, "B 重写后的 zip CRC 校验失败"
          chk = json.loads(zchk.read(ENTRY))
          e3 = next(x for x in chk if x['path'].endswith('prologueBattle3.json'))
          assert e3['md5'] == os.environ['FIXED_MD5'], "B 重写后记录仍不对"
          print(f"✔ B 重写完成: {os.path.getsize(DST)} 字节")

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write("## 🩹 B: cn_base_01_json.zip / asset_main.json\n\n")
              fh.write("- prologueBattle3 记录 md5 → "
                       f"`{os.environ['FIXED_MD5']}`, size → 15320\n")

          shutil.move(DST, SRC)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write("already_fixed=false\n")
          SCRIPT_END

      - name: 🚀 重传两个 Release asset（先删后传）
        if: >-
          env.CONFIRM == 'true' &&
          (steps.patch_a.outputs.already_fixed == 'false' ||
           steps.patch_b.outputs.already_fixed == 'false')
        run: |
          set -euo pipefail
          if [ "${{ steps.patch_a.outputs.already_fixed }}" = "false" ]; then
            gh release delete-asset latest "$ASSET_A" --yes
            # 注意：本地文件名即 asset name，不要用 <file>#<label> 语法
            gh release upload latest "work/$ASSET_A"
            echo "✔ $ASSET_A 已重传"
          fi
          if [ "${{ steps.patch_b.outputs.already_fixed }}" = "false" ]; then
            gh release delete-asset latest "$ASSET_B" --yes
            gh release upload latest "work/$ASSET_B"
            echo "✔ $ASSET_B 已重传"
          fi
