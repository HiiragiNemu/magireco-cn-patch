name: "🧹 清空CDN缓存"

# ╔════════════════════════════════════════════════════════════════════╗
# ║   v3 —— 双 S3 域名 → 单 object-storage 域名（edge）+ 阿里云 ESA              ║
# ║   ▸ edge：purge_prefix，目标 http://<R2_DOMAIN>/*                ║
# ║   ▸ 阿里云 ESA：PurgeCaches Type=purgeall（整站清空）               ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '请输入 "PURGE_ALL" 以确认清除所有CDN缓存'
        required: true
        default: ''
      domain_choice:
        description: '选择要清空的 CDN'
        required: true
        type: choice
        options:
          - 'both'
          - 'edge'
          - 'esa'

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'PURGE_ALL'
    env:
      PYTHONUNBUFFERED: "1"
      QCLOUD_SECRET_ID:  ${{ secrets.QCLOUD_SECRET_ID }}
      QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
      EDGEONE_ZONE_ID:   ${{ secrets.EDGEONE_ZONE_ID }}
      R2_DOMAIN:         ${{ secrets.R2_DOMAIN }}
      ALIBABA_CLOUD_ACCESS_KEY_ID:     ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      ESA_SITE_ID:       ${{ secrets.ESA_SITE_ID }}
      ESA_DOMAIN:        ${{ secrets.ESA_DOMAIN }}
      DOMAIN_CHOICE:     ${{ github.event.inputs.domain_choice }}

    steps:
      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ 安装依赖
        run: pip install tencentcloud-sdk-python alibabacloud_esa20240910

      - name: 🧹 执行缓存清除
        run: |
          python3 <<'SCRIPT_END'
          import os
          import sys
          import json
          from datetime import datetime
          from tencentcloud.common import credential
          from tencentcloud.common.profile.client_profile import ClientProfile
          from tencentcloud.common.profile.http_profile import HttpProfile
          from tencentcloud.teo.v20220901 import teo_client, models
          from alibabacloud_esa20240910.client import Client as EsaClient
          from alibabacloud_esa20240910 import models as esa_models
          from alibabacloud_tea_openapi import models as open_api_models

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          # ============================================================
          # 颜色 / 样式工具
          # ============================================================
          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              CYAN          = "\033[36m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def warn(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          class ActionGroup:
              @staticmethod
              def start_group(title):
                  print(f"::group::{title}", flush=True)
              @staticmethod
              def end_group():
                  print("::endgroup::", flush=True)

          def mask_task_id(task_id):
              if not task_id or len(str(task_id)) <= 8:
                  return '*' * len(str(task_id)) if task_id else '未知'
              task_id = str(task_id)
              return task_id[:4] + '*' * (len(task_id) - 8) + task_id[-4:]

          # ============================================================
          # edge（腾讯云 TEO）：purge_prefix 全站清除
          # ============================================================
          def purge_edge(secret_id, secret_key, zone_id, domain):
              ActionGroup.start_group(f"🧹 清除 edge（{domain}）")
              header("清除 edge 缓存")
              info(f"域名:    {c(C.BRIGHT_WHITE, domain)}")
              info(f"Zone ID: {c(C.DIM, zone_id)}")

              try:
                  section("建立 edge 连接")
                  cred       = credential.Credential(secret_id, secret_key)
                  hp         = HttpProfile()
                  hp.endpoint = "teo.tencentcloudapi.com"
                  cp         = ClientProfile()
                  cp.httpProfile = hp
                  client     = teo_client.TeoClient(cred, "", cp)
                  ok("edge 客户端已初始化")

                  section("提交全站缓存清除任务")
                  target_url = f"http://{domain}/*"
                  info(f"目标 URL: {c(C.BRIGHT_CYAN, target_url)}")
                  info(f"类型: {c(C.DIM, 'purge_prefix')}")

                  req = models.CreatePurgeTaskRequest()
                  req.from_json_string(json.dumps({
                      "ZoneId":  zone_id,
                      "Type":    "purge_prefix",
                      "Targets": [target_url]
                  }))

                  resp    = client.CreatePurgeTask(req)
                  task_id = resp.RequestId
                  ok(f"任务已提交，ID: {c(C.BRIGHT_CYAN, mask_task_id(task_id))}")

                  ActionGroup.end_group()
                  return True, str(task_id)

              except Exception as e:
                  err(f"清除失败: {e}")
                  ActionGroup.end_group()
                  return False, str(e)

          # ============================================================
          # 阿里云 ESA：PurgeCaches Type=purgeall 整站清除
          # ============================================================
          def purge_esa(access_key_id, access_key_secret, site_id, domain):
              ActionGroup.start_group(f"🧹 清除 阿里云 ESA（{domain}）")
              header("清除 阿里云 ESA 缓存")
              info(f"域名:    {c(C.BRIGHT_WHITE, domain)}")
              info(f"Site ID: {c(C.DIM, str(site_id))}")

              try:
                  section("建立 ESA 连接")
                  cfg = open_api_models.Config(
                      access_key_id=access_key_id,
                      access_key_secret=access_key_secret,
                      endpoint="esa.cn-hangzhou.aliyuncs.com",
                  )
                  client = EsaClient(cfg)
                  ok("ESA 客户端已初始化")

                  section("提交整站缓存清除任务")
                  info(f"类型: {c(C.DIM, 'purgeall（整站清空）')}")

                  req = esa_models.PurgeCachesRequest(
                      site_id=int(site_id),
                      type="purgeall",
                      content=esa_models.PurgeCachesRequestContent(purge_all=True),
                  )
                  resp    = client.purge_caches(req)
                  task_id = getattr(resp.body, "task_id", None) or "已提交"
                  ok(f"任务已提交，ID: {c(C.BRIGHT_CYAN, mask_task_id(task_id))}")

                  ActionGroup.end_group()
                  return True, str(task_id)

              except Exception as e:
                  err(f"清除失败: {e}")
                  ActionGroup.end_group()
                  return False, str(e)

          # ============================================================
          # 主流程
          # ============================================================
          def main():
              start_time    = datetime.now()
              domain_choice = os.environ.get('DOMAIN_CHOICE', 'both')

              header("🚨 全站 CDN 缓存清除")
              info(f"目标范围: {c(C.BRIGHT_YELLOW, domain_choice)}")
              info(f"开始时间: {c(C.DIM, start_time.strftime('%Y-%m-%d %H:%M:%S'))}")

              success_count = 0
              fail_count    = 0
              summary_rows  = []

              # (choice 关键字, 标签, env 域名键, 清除函数)
              targets = []
              if domain_choice in ('edge', 'both'):
                  targets.append((
                      'edge', 'R2_DOMAIN',
                      lambda d: purge_edge(
                          os.environ['QCLOUD_SECRET_ID'],
                          os.environ['QCLOUD_SECRET_KEY'],
                          os.environ['EDGEONE_ZONE_ID'], d)
                  ))
              if domain_choice in ('esa', 'both'):
                  targets.append((
                      '阿里云 ESA', 'ESA_DOMAIN',
                      lambda d: purge_esa(
                          os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],
                          os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],
                          os.environ['ESA_SITE_ID'], d)
                  ))

              for label, env_key, purge_fn in targets:
                  domain = os.environ.get(env_key, '').strip()
                  if not domain:
                      warn(f"{label} 未配置域名（{env_key} 为空），跳过")
                      summary_rows.append(f"| ⚠️ {label} | 未配置 | — |")
                      continue

                  success, result = purge_fn(domain)
                  if success:
                      success_count += 1
                      summary_rows.append(
                          f"| ✅ {label} | `{domain}` | `{mask_task_id(result)}` |"
                      )
                  else:
                      fail_count += 1
                      summary_rows.append(
                          f"| ❌ {label} | `{domain}` | {result} |"
                      )

              end_time = datetime.now()
              elapsed  = (end_time - start_time).total_seconds()

              header("操作完成")
              ok(f"成功: {c(C.BOLD, str(success_count))} 个 CDN")
              if fail_count:
                  err(f"失败: {fail_count} 个 CDN")
              else:
                  ok("全部清除成功，无错误")
              info(f"耗时: {c(C.DIM, f'{elapsed:.2f} 秒')}")

              # ── Step Summary ──────────────────────────────────────
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  lines = [
                      "## 🧹 CDN 缓存清除报告\n",
                      f"**开始时间**: `{start_time.strftime('%Y-%m-%d %H:%M:%S')}`  ",
                      f"**目标范围**: `{domain_choice}`\n",
                      "---\n",
                      "### 📋 清除详情\n",
                      "| CDN | 域名 | 任务 ID |",
                      "|------|------|---------|",
                  ]
                  lines.extend(summary_rows)
                  lines += [
                      "\n---\n",
                      "### 📈 汇总\n",
                      "| 项目 | 值 |",
                      "|------|----|",
                      f"| 成功 | `{success_count}` 个 |",
                      f"| 失败 | `{fail_count}` 个 |",
                      f"| 总耗时   | `{elapsed:.2f}` 秒 |",
                      f"| 结束时间 | `{end_time.strftime('%Y-%m-%d %H:%M:%S')}` |\n",
                      ("🟢 **状态**: 全部清除成功！"
                       if fail_count == 0
                       else f"🟡 **状态**: 完成，但有 {fail_count} 个 CDN 清除失败。"),
                  ]
                  with open(summary_path, 'a', encoding='utf-8') as f:
                      f.write("\n".join(lines))

          if __name__ == "__main__":
              main()
          SCRIPT_END

      - name: ⚙️ 安装依赖
        run: pip install tencentcloud-sdk-python

      - name: 🧹 执行缓存清除
        run: |
          python3 <<'SCRIPT_END'
          import os
          import sys
          import json
          from datetime import datetime
          from tencentcloud.common import credential
          from tencentcloud.common.profile.client_profile import ClientProfile
          from tencentcloud.common.profile.http_profile import HttpProfile
          from tencentcloud.teo.v20220901 import teo_client, models

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          # ============================================================
          # 颜色 / 样式工具
          # ============================================================
          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              CYAN          = "\033[36m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def warn(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          class ActionGroup:
              @staticmethod
              def start_group(title):
                  print(f"::group::{title}", flush=True)
              @staticmethod
              def end_group():
                  print("::endgroup::", flush=True)

          def mask_task_id(task_id):
              if not task_id or len(task_id) <= 8:
                  return '*' * len(task_id) if task_id else '未知'
              return task_id[:4] + '*' * (len(task_id) - 8) + task_id[-4:]

          # ============================================================
          # 清除逻辑
          # ============================================================
          def purge_domain_cache(secret_id, secret_key, zone_id,
                                  domain, domain_label):
              ActionGroup.start_group(f"🧹 清除 {domain_label}（{domain}）")
              header(f"清除 {domain_label} 缓存")
              info(f"域名:    {c(C.BRIGHT_WHITE, domain)}")
              info(f"Zone ID: {c(C.DIM, zone_id)}")

              try:
                  section("建立 edge 连接")
                  cred       = credential.Credential(secret_id, secret_key)
                  hp         = HttpProfile()
                  hp.endpoint = "teo.tencentcloudapi.com"
                  cp         = ClientProfile()
                  cp.httpProfile = hp
                  client     = teo_client.TeoClient(cred, "", cp)
                  ok("edge 客户端已初始化")

                  section("提交全站缓存清除任务")
                  target_url = f"http://{domain}/*"
                  info(f"目标 URL: {c(C.BRIGHT_CYAN, target_url)}")
                  info(f"类型: {c(C.DIM, 'purge_prefix')}")

                  req = models.CreatePurgeTaskRequest()
                  req.from_json_string(json.dumps({
                      "ZoneId":  zone_id,
                      "Type":    "purge_prefix",
                      "Targets": [target_url]
                  }))

                  resp    = client.CreatePurgeTask(req)
                  task_id = mask_task_id(resp.RequestId)
                  ok(f"任务已提交，ID: {c(C.BRIGHT_CYAN, task_id)}")

                  ActionGroup.end_group()
                  return True, resp.RequestId

              except Exception as e:
                  err(f"清除失败: {e}")
                  ActionGroup.end_group()
                  return False, str(e)

          # ============================================================
          # 主流程
          # ============================================================
          def main():
              start_time    = datetime.now()
              domain_choice = os.environ.get('DOMAIN_CHOICE', 'both')

              header("🚨 全站 CDN 缓存清除")
              info(f"目标范围: {c(C.BRIGHT_YELLOW, domain_choice)}")
              info(f"开始时间: {c(C.DIM, start_time.strftime('%Y-%m-%d %H:%M:%S'))}")

              secret_id  = os.environ['QCLOUD_SECRET_ID']
              secret_key = os.environ['QCLOUD_SECRET_KEY']
              zone_id    = os.environ['EDGEONE_ZONE_ID']

              success_count = 0
              fail_count    = 0
              summary_rows  = []

              domains = []
              if domain_choice in ('domain1', 'both'):
                  domains.append(('S3_1_DOMAIN', '域名1'))
              if domain_choice in ('domain2', 'both'):
                  domains.append(('S3_2_DOMAIN', '域名2'))

              for env_key, label in domains:
                  domain = os.environ.get(env_key, '').strip()
                  if not domain:
                      warn(f"{label} 未配置域名（{env_key} 为空），跳过")
                      summary_rows.append(
                          f"| ⚠️ {label} | 未配置 | — |"
                      )
                      continue

                  success, result = purge_domain_cache(
                      secret_id, secret_key, zone_id, domain, label
                  )
                  if success:
                      success_count += 1
                      masked = mask_task_id(result)
                      summary_rows.append(
                          f"| ✅ {label} | `{domain}` | `{masked}` |"
                      )
                  else:
                      fail_count += 1
                      summary_rows.append(
                          f"| ❌ {label} | `{domain}` | {result} |"
                      )

              end_time = datetime.now()
              elapsed  = (end_time - start_time).total_seconds()

              header("操作完成")
              ok(f"成功: {c(C.BOLD, str(success_count))} 个域名")
              if fail_count:
                  err(f"失败: {fail_count} 个域名")
              else:
                  ok("全部清除成功，无错误")
              info(f"耗时: {c(C.DIM, f'{elapsed:.2f} 秒')}")

              # ── Step Summary ──────────────────────────────────────
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  lines = [
                      "## 🧹 CDN 缓存清除报告\n",
                      f"**开始时间**: `{start_time.strftime('%Y-%m-%d %H:%M:%S')}`  ",
                      f"**目标范围**: `{domain_choice}`\n",
                      "---\n",
                      "### 📋 清除详情\n",
                      "| 域名 | 地址 | 任务 ID |",
                      "|------|------|---------|",
                  ]
                  lines.extend(summary_rows)
                  lines += [
                      "\n---\n",
                      "### 📈 汇总\n",
                      "| 项目 | 值 |",
                      "|------|----|",
                      f"| 成功域名 | `{success_count}` 个 |",
                      f"| 失败域名 | `{fail_count}` 个 |",
                      f"| 总耗时   | `{elapsed:.2f}` 秒 |",
                      f"| 结束时间 | `{end_time.strftime('%Y-%m-%d %H:%M:%S')}` |\n",
                      ("🟢 **状态**: 全部清除成功！"
                       if fail_count == 0
                       else f"🟡 **状态**: 完成，但有 {fail_count} 个域名清除失败。"),
                  ]
                  with open(summary_path, 'a', encoding='utf-8') as f:
                      f.write("\n".join(lines))

          if __name__ == "__main__":
              main()
          SCRIPT_END
