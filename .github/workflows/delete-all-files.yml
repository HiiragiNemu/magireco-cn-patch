name: "🗑️ 清空存储桶文件"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '请输入 "DELETE_ALL" 以确认删除两个存储桶中的所有文件'
        required: true
        default: ''
      bucket_choice:
        description: '选择要清空的存储桶'
        required: true
        type: choice
        options:
          - 'bucket1'
          - 'bucket2'
          - 'both'

jobs:
  delete-files:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE_ALL'
    env:
      PYTHONUNBUFFERED: "1"
      S3_1_ENDPOINT:   ${{ secrets.S3_1_ENDPOINT }}
      S3_1_ACCESS_KEY: ${{ secrets.S3_1_ACCESS_KEY }}
      S3_1_SECRET_KEY: ${{ secrets.S3_1_SECRET_KEY }}
      S3_1_REGION:     ${{ secrets.S3_1_REGION }}
      S3_1_BUCKET:     ${{ secrets.S3_1_BUCKET }}
      S3_2_ENDPOINT:   ${{ secrets.S3_2_ENDPOINT }}
      S3_2_ACCESS_KEY: ${{ secrets.S3_2_ACCESS_KEY }}
      S3_2_SECRET_KEY: ${{ secrets.S3_2_SECRET_KEY }}
      S3_2_REGION:     ${{ secrets.S3_2_REGION }}
      S3_2_BUCKET:     ${{ secrets.S3_2_BUCKET }}
      BUCKET_CHOICE:   ${{ github.event.inputs.bucket_choice }}

    steps:
      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ 安装依赖
        run: pip install boto3

      - name: 🗑️ 执行删除操作
        run: |
          python3 <<'SCRIPT_END'
          import os
          import sys
          import boto3
          from botocore.exceptions import ClientError
          from datetime import datetime

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          # ============================================================
          # 颜色 / 样式工具
          # ============================================================
          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              GREEN         = "\033[32m"
              YELLOW        = "\033[33m"
              CYAN          = "\033[36m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def warn(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          def skip(text, indent=0):
              print(f"{'  '*indent}{c(C.DIM, '⏭  ' + text)}", flush=True)

          def progress_bar(current, total, width=30, label=""):
              pct    = current / total if total else 1.0
              filled = int(width * pct)
              bar    = c(C.BRIGHT_GREEN, "█" * filled) + c(C.DIM, "░" * (width - filled))
              pct_s  = c(C.BOLD + C.BRIGHT_WHITE, f"{pct*100:5.1f}%")
              lbl    = c(C.DIM, f" {label}") if label else ""
              print(f"  [{bar}] {pct_s}{lbl}", flush=True)

          class ActionGroup:
              @staticmethod
              def start_group(title):
                  print(f"::group::{title}", flush=True)
              @staticmethod
              def end_group():
                  print("::endgroup::", flush=True)

          # ============================================================
          # 删除逻辑
          # ============================================================
          def delete_bucket_objects(endpoint, access_key, secret_key,
                                    region, bucket_name, bucket_label):
              ActionGroup.start_group(f"🗑️ 清理 {bucket_label}（{bucket_name}）")
              header(f"清理 {bucket_label}")
              info(f"存储桶: {c(C.BRIGHT_WHITE, bucket_name)}")
              info(f"地域:   {c(C.DIM, region)}")

              s3 = boto3.client(
                  's3',
                  endpoint_url=endpoint.rstrip('/'),
                  aws_access_key_id=access_key,
                  aws_secret_access_key=secret_key,
                  region_name=region
              )

              deleted_count = 0
              error_count   = 0

              try:
                  section("枚举对象")
                  paginator  = s3.get_paginator('list_objects_v2')
                  all_keys   = []
                  for page in paginator.paginate(Bucket=bucket_name):
                      if 'Contents' not in page:
                          continue
                      all_keys.extend(obj['Key'] for obj in page['Contents'])

                  total = len(all_keys)
                  if total == 0:
                      skip(f"{bucket_label} 为空，无需操作")
                      ActionGroup.end_group()
                      return 0, 0

                  info(f"共找到 {c(C.BOLD, str(total))} 个对象")

                  section("批量删除")
                  # 每批最多 1000 个（S3 限制）
                  batch_size = 1000
                  batches    = [all_keys[i:i+batch_size]
                                for i in range(0, total, batch_size)]

                  for batch_idx, batch in enumerate(batches):
                      objects_to_delete = [{'Key': k} for k in batch]
                      try:
                          response = s3.delete_objects(
                              Bucket=bucket_name,
                              Delete={'Objects': objects_to_delete}
                          )
                          deleted = response.get('Deleted', [])
                          errors  = response.get('Errors',  [])

                          deleted_count += len(deleted)
                          error_count   += len(errors)

                          for obj in deleted:
                              ok(f"已删除: {c(C.DIM, obj['Key'])}", indent=1)
                          for e in errors:
                              err(f"删除失败: {e['Key']} → {e['Message']}", indent=1)

                      except ClientError as e:
                          err(f"批量删除异常: {e}", indent=1)
                          error_count += len(batch)

                      progress_bar(
                          deleted_count + error_count, total,
                          label=f"批次 {batch_idx+1}/{len(batches)} "
                                f"({deleted_count} 成功 / {error_count} 失败)"
                      )

                  progress_bar(total, total,
                               label=f"完成：{deleted_count} 成功 / {error_count} 失败")

                  if error_count == 0:
                      ok(f"{bucket_label} 清理完成，共删除 "
                         f"{c(C.BOLD, str(deleted_count))} 个对象")
                  else:
                      warn(f"{bucket_label} 清理完成，"
                           f"成功 {deleted_count} / 失败 {c(C.RED, str(error_count))}")

              except Exception as e:
                  err(f"清理 {bucket_label} 时发生错误: {e}")
                  ActionGroup.end_group()
                  return 0, 0

              ActionGroup.end_group()
              return deleted_count, error_count

          # ============================================================
          # 主流程
          # ============================================================
          def main():
              start_time    = datetime.now()
              bucket_choice = os.environ.get('BUCKET_CHOICE', 'both')

              header("🚨 存储桶清空操作")
              info(f"目标范围: {c(C.BRIGHT_YELLOW, bucket_choice)}")
              info(f"开始时间: {c(C.DIM, start_time.strftime('%Y-%m-%d %H:%M:%S'))}")

              total_deleted = 0
              total_errors  = 0
              summary_lines = [
                  "## 🗑️ 存储桶清空操作报告\n",
                  f"**开始时间**: `{start_time.strftime('%Y-%m-%d %H:%M:%S')}`  ",
                  f"**目标存储桶**: `{bucket_choice}`\n",
                  "---\n",
                  "### 📋 清理详情\n",
              ]

              if bucket_choice in ('bucket1', 'both'):
                  deleted, errors = delete_bucket_objects(
                      os.environ['S3_1_ENDPOINT'],
                      os.environ['S3_1_ACCESS_KEY'],
                      os.environ['S3_1_SECRET_KEY'],
                      os.environ['S3_1_REGION'],
                      os.environ['S3_1_BUCKET'],
                      "存储桶1"
                  )
                  total_deleted += deleted
                  total_errors  += errors
                  status = "✅" if errors == 0 else "⚠️"
                  summary_lines.append(
                      f"| {status} 存储桶1 | 删除 `{deleted}` 个 | 失败 `{errors}` 个 |"
                  )

              if bucket_choice in ('bucket2', 'both'):
                  deleted, errors = delete_bucket_objects(
                      os.environ['S3_2_ENDPOINT'],
                      os.environ['S3_2_ACCESS_KEY'],
                      os.environ['S3_2_SECRET_KEY'],
                      os.environ['S3_2_REGION'],
                      os.environ['S3_2_BUCKET'],
                      "存储桶2"
                  )
                  total_deleted += deleted
                  total_errors  += errors
                  status = "✅" if errors == 0 else "⚠️"
                  summary_lines.append(
                      f"| {status} 存储桶2 | 删除 `{deleted}` 个 | 失败 `{errors}` 个 |"
                  )

              end_time = datetime.now()
              elapsed  = (end_time - start_time).total_seconds()

              header("操作完成")
              ok(f"总计删除: {c(C.BOLD, str(total_deleted))} 个对象")
              if total_errors:
                  err(f"总计失败: {total_errors} 个对象")
              else:
                  ok("全部删除成功，无错误")
              info(f"耗时: {c(C.DIM, f'{elapsed:.2f} 秒')}")

              # 写入 Step Summary
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  # 在详情表格前补充表头
                  table_start = next(
                      (i for i, l in enumerate(summary_lines)
                       if l.startswith("| ")), None
                  )
                  if table_start is not None:
                      summary_lines.insert(
                          table_start,
                          "| 存储桶 | 删除数量 | 失败数量 |\n|--------|----------|----------|"
                      )

                  summary_lines += [
                      "\n---\n",
                      "### 📈 汇总\n",
                      f"| 项目 | 值 |\n|------|-----|",
                      f"| 总计删除 | `{total_deleted}` 个 |",
                      f"| 总计失败 | `{total_errors}` 个 |",
                      f"| 总耗时   | `{elapsed:.2f}` 秒 |",
                      f"| 结束时间 | `{end_time.strftime('%Y-%m-%d %H:%M:%S')}` |",
                      f"\n{'🟢 **状态**: 全部删除成功！' if total_errors == 0 else f'🟡 **状态**: 完成，但有 {total_errors} 个对象删除失败。'}",
                  ]

                  with open(summary_path, 'a', encoding='utf-8') as f:
                      f.write("\n".join(summary_lines))

          if __name__ == "__main__":
              main()
          SCRIPT_END
