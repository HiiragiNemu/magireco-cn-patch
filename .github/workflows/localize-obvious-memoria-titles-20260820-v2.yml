name: Localize obvious memoria titles

on:
  push:
    branches:
      - main
    paths:
      - .github/localize-obvious-memoria-titles-trigger-20260820-v2.txt

permissions:
  contents: write

concurrency:
  group: localize-obvious-memoria-titles-20260820-v2
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current patch main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: patch

      - name: Checkout current Wiki authority
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magireco-wiki-data
          path: wiki
          fetch-depth: 1

      - name: Localize title fields only
        shell: bash
        run: |
          set -euo pipefail
          cd patch
          python -X utf8 - <<'PY'
          from __future__ import annotations

          import copy
          import csv
          import hashlib
          import json
          import re
          import unicodedata
          from pathlib import Path
          from typing import Any, Iterable

          root = Path('.')
          piece_path = root / 'magica/js/libs/pieceList.json'
          wiki_path = Path('../wiki/data/memoria.json')
          audit_dir = root / 'magica/i18n_audit/obvious_memoria_title_localization_20260820'
          audit_dir.mkdir(parents=True, exist_ok=True)

          manual_pairs = {
              'Different Story：Rookies': '另一段故事：新人们',
              'Different Story: Rookies': '另一段故事：新人们',
              'As a fashion model': '身为时装模特',
              'Begin a Hunt': '开始狩猎',
              'Splash party!': '水花派对！',
              'Three geniuses': '三位天才',
          }
          title_fields = ('pieceName', 'name', 'title')
          id_fields = ('pieceId', 'piece_id', 'memoriaId', 'memoria_id', 'id')
          cn_name_fields = (
              'name_zh', 'nameZh', 'name_cn', 'nameCn', 'name_sc', 'nameSc',
              'title_zh', 'titleZh', 'title_cn', 'titleCn',
          )

          def norm(value: str) -> str:
              value = unicodedata.normalize('NFKC', value)
              value = re.sub(r'\s+', ' ', value).strip()
              return value.casefold()

          normalized_manual = {norm(k): v for k, v in manual_pairs.items()}

          def has_latin(value: str) -> bool:
              return bool(re.search(r'[A-Za-z]', value))

          def has_han(value: str) -> bool:
              return bool(re.search(r'[\u3400-\u4dbf\u4e00-\u9fff]', value))

          def walk_dicts(value: Any) -> Iterable[dict[str, Any]]:
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk_dicts(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk_dicts(child)

          def stable_id(row: dict[str, Any]) -> str | None:
              for key in id_fields:
                  if key in row and row[key] not in (None, ''):
                      return str(row[key])
              return None

          def chinese_name(row: dict[str, Any]) -> str | None:
              for key in cn_name_fields:
                  value = row.get(key)
                  if isinstance(value, str):
                      value = value.strip()
                      if value and has_han(value):
                          return value
              return None

          original_text = piece_path.read_text(encoding='utf-8-sig')
          pieces = json.loads(original_text)
          before = copy.deepcopy(pieces)
          wiki = json.loads(wiki_path.read_text(encoding='utf-8-sig'))

          wiki_candidates: dict[str, set[str]] = {}
          for row in walk_dicts(wiki):
              sid = stable_id(row)
              cn = chinese_name(row)
              if sid and cn:
                  wiki_candidates.setdefault(sid, set()).add(cn)
          wiki_by_id = {
              sid: next(iter(values))
              for sid, values in wiki_candidates.items()
              if len(values) == 1
          }

          changes: list[dict[str, str]] = []
          conflicts: list[dict[str, str]] = []
          manual_seen_before = {key: 0 for key in normalized_manual}

          for row in walk_dicts(pieces):
              sid = stable_id(row)
              if sid is None:
                  continue
              present_title_fields = [
                  field for field in title_fields
                  if isinstance(row.get(field), str) and row[field].strip()
              ]
              if not present_title_fields:
                  continue
              for field in present_title_fields:
                  current = row[field].strip()
                  current_norm = norm(current)
                  if current_norm in manual_seen_before:
                      manual_seen_before[current_norm] += 1
                  if not has_latin(current):
                      continue

                  wiki_values = wiki_candidates.get(sid, set())
                  if len(wiki_values) > 1:
                      conflicts.append({
                          'piece_id': sid,
                          'field': field,
                          'current': current,
                          'candidates': ' | '.join(sorted(wiki_values)),
                          'reason': '同一 pieceId 对应多个不同 Wiki 中文标题，未自动选择',
                      })
                      wiki_target = None
                  else:
                      wiki_target = wiki_by_id.get(sid)

                  manual_target = normalized_manual.get(current_norm)
                  if wiki_target:
                      target = wiki_target
                      source_tier = '2_wiki_exact_piece_id'
                      source_record = f'data/memoria.json::pieceId={sid}::name_zh/nameZh'
                  elif manual_target:
                      target = manual_target
                      source_tier = '4_user_directed_root_human'
                      source_record = f'user directive 2026-08-20::{current}'
                  else:
                      continue

                  if target == current:
                      continue
                  row[field] = target
                  changes.append({
                      'piece_id': sid,
                      'field': field,
                      'before': current,
                      'after': target,
                      'source_tier': source_tier,
                      'source_record': source_record,
                      'scope': 'memoria-title-only',
                  })

          # Verify that no non-title field changed.
          before_rows = {stable_id(row): row for row in walk_dicts(before) if stable_id(row)}
          after_rows = {stable_id(row): row for row in walk_dicts(pieces) if stable_id(row)}
          for sid, old_row in before_rows.items():
              new_row = after_rows.get(sid)
              if new_row is None:
                  raise AssertionError(f'piece record disappeared: {sid}')
              old_non_title = {k: v for k, v in old_row.items() if k not in title_fields}
              new_non_title = {k: v for k, v in new_row.items() if k not in title_fields}
              if old_non_title != new_non_title:
                  raise AssertionError(f'non-title field changed for pieceId={sid}')

          # Every requested source that existed before must be gone from title fields now.
          remaining_requested: list[str] = []
          for row in walk_dicts(pieces):
              if stable_id(row) is None:
                  continue
              for field in title_fields:
                  value = row.get(field)
                  if isinstance(value, str) and norm(value) in normalized_manual:
                      remaining_requested.append(value)
          if remaining_requested:
              raise AssertionError(f'requested English titles remain: {remaining_requested}')

          # Preserve the file's broad formatting convention.
          compact = '\n' not in original_text
          if compact:
              rendered = json.dumps(pieces, ensure_ascii=False, separators=(',', ':'))
          else:
              rendered = json.dumps(pieces, ensure_ascii=False, indent=2) + '\n'
          piece_path.write_text(rendered, encoding='utf-8')
          json.loads(piece_path.read_text(encoding='utf-8'))

          changes.sort(key=lambda row: (int(row['piece_id']) if row['piece_id'].isdigit() else row['piece_id'], row['field']))
          fields = ['piece_id', 'field', 'before', 'after', 'source_tier', 'source_record', 'scope']
          with (audit_dir / 'APPLIED.tsv').open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              writer.writerows(changes)

          with (audit_dir / 'CONFLICTS.tsv').open('w', encoding='utf-8-sig', newline='') as handle:
              conflict_fields = ['piece_id', 'field', 'current', 'candidates', 'reason']
              writer = csv.DictWriter(handle, fieldnames=conflict_fields, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              writer.writerows(conflicts)

          requested_status = []
          for source_norm, target in normalized_manual.items():
              requested_status.append({
                  'normalized_source': source_norm,
                  'target': target,
                  'occurrences_before': manual_seen_before[source_norm],
                  'status': 'localized' if manual_seen_before[source_norm] else 'source-not-present-on-current-main',
              })

          validation = {
              'schema': 'magireco-cn-obvious-memoria-title-localization/v1',
              'status': 'PASS',
              'scope': 'piece title fields only',
              'title_fields_changed': len(changes),
              'wiki_exact_piece_id_changes': sum(row['source_tier'] == '2_wiki_exact_piece_id' for row in changes),
              'user_directed_changes': sum(row['source_tier'] == '4_user_directed_root_human' for row in changes),
              'wiki_conflicts_retained_for_review': len(conflicts),
              'requested_status': requested_status,
              'intentional_dialogue_english_touched': False,
              'pieceList_sha256_after': hashlib.sha256(piece_path.read_bytes()).hexdigest(),
          }
          (audit_dir / 'validation.json').write_text(
              json.dumps(validation, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          readme = f'''# 明显未汉化记忆结晶标题处理（2026-08-20）

本批次只修改 `magica/js/libs/pieceList.json` 中的标题字段（`pieceName` / `name` / `title`）。

权威顺序：国服官方 > 指定 Wiki 人工中文 > 其他可核验人工来源 > 人工翻译。本批次自动采用同一 `pieceId` 的 Wiki 中文标题；用户明确指出的五组明显英文标题在没有更高权威中文时采用人工中文。

明确不属于本批次：`scenario` 剧情、说明文、角色台词、角色口癖，以及阿莉娜刻意夹用的 `body`、`show`、`fool girl` 等英语。脚本验证所有非标题字段保持不变。

- 标题字段改动：**{len(changes)}**
- Wiki `pieceId` 精确采用：**{validation['wiki_exact_piece_id_changes']}**
- 用户指定人工标题：**{validation['user_directed_changes']}**
- Wiki 冲突留待复核：**{len(conflicts)}**

详见 `APPLIED.tsv`、`CONFLICTS.tsv` 与 `validation.json`。
'''
          (audit_dir / 'README.md').write_text(readme, encoding='utf-8')

          print(json.dumps(validation, ensure_ascii=False, indent=2))
          PY

      - name: Remove one-shot workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          cd patch
          rm -f .github/workflows/localize-obvious-memoria-titles-20260820-v2.yml
          rm -f .github/localize-obvious-memoria-titles-trigger-20260820-v2.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(i18n): localize obvious memoria titles'
          git pull --rebase origin main
          git push origin HEAD:main
