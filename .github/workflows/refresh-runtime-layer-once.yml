name: One-shot refresh runtime layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-runtime-layer-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'HiiragiNemu/magireco-cn-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Rebuild committed runtime layer
        run: |
          set -euo pipefail
          python3 Build_JS_Injector.py
          python3 tools/verify-runtime-layer.py
          git diff --             magica/js/libs/jquery-3.7.1.min.js             magica/i18n_audit/release_v26_authority/runtime_layer_manifest.json             magica/i18n_audit/release_v26_authority/RUNTIME_LAYER_SHA256SUMS.txt
      - name: Commit regenerated authority files
        run: |
          set -euo pipefail
          git config user.name "Hiiragi Nemu"
          git config user.email "128921071+HiiragiNemu@users.noreply.github.com"
          git add             magica/js/libs/jquery-3.7.1.min.js             magica/i18n_audit/release_v26_authority/runtime_layer_manifest.json             magica/i18n_audit/release_v26_authority/RUNTIME_LAYER_SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "runtime layer already current"
            exit 0
          fi
          git commit -m "build: refresh runtime layer from current dictionaries"
          git push origin HEAD:main
