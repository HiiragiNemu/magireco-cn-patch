name: Temporary main publisher for verified libs JSON completion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-libs-json-completion-main-temp.yml

permissions:
  contents: write

concurrency:
  group: publish-libs-json-completion-main-temp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audited publisher
        uses: actions/checkout@v4
        with:
          ref: audit/libs-json-completion-20260820
          path: publisher
          fetch-depth: 1

      - name: Checkout locked product baseline
        uses: actions/checkout@v4
        with:
          ref: cf5965a3916924299c13634b4e849fee1eb2f6f7
          path: base
          fetch-depth: 1

      - name: Checkout exact triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: patch
          fetch-depth: 1

      - name: Checkout pinned Wiki evidence
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/wiki-data
          ref: 2a27d64e3c59c893c177c5349b3a6c8134117aea
          path: wiki
          token: ${{ secrets. }}
          sparse-checkout: data/memoria.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Generate and validate from locked baseline
        run: |
          python -X utf8 publisher/tools/publish-libs-json-completion.py base wiki/data

      - name: Stage generated result on triggering main tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C patch rev-parse HEAD)" = '${{ github.sha }}'
          test "$(sha256sum patch/magica/js/libs/pieceList.json | cut -d' ' -f1)" = \
            'b51addf6e800235df5af37007f5a5546bd5a3d4c35408753b73ded66f4bed69d'
          cp base/magica/js/libs/pieceList.json patch/magica/js/libs/pieceList.json
          rm -rf patch/magica/i18n_audit/libs_json_completion_20260820
          cp -a \
            base/magica/i18n_audit/libs_json_completion_20260820 \
            patch/magica/i18n_audit/libs_json_completion_20260820
          rm patch/.github/workflows/publish-libs-json-completion-main-temp.yml

      - name: Enforce exact tree allowlist
        shell: bash
        run: |
          set -euo pipefail
          cd patch
          git diff --check
          mapfile -t changed < <(
            { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u
          )
          printf 'Changed paths:\n'
          printf '  %s\n' "${changed[@]}"
          expected=(
            '.github/workflows/publish-libs-json-completion-main-temp.yml'
            'magica/i18n_audit/libs_json_completion_20260820/HUMAN_REVIEW_CHECKLIST.tsv'
            'magica/i18n_audit/libs_json_completion_20260820/README.md'
            'magica/i18n_audit/libs_json_completion_20260820/RETAINED_BY_POLICY.tsv'
            'magica/i18n_audit/libs_json_completion_20260820/validation.json'
            'magica/js/libs/pieceList.json'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('.')
          libs = root / 'magica/js/libs'
          files = sorted(libs.glob('*.json'))
          assert len(files) == 23
          for path in files:
              json.loads(path.read_text(encoding='utf-8-sig'))
          validation = json.loads((root / 'magica/i18n_audit/libs_json_completion_20260820/validation.json').read_text(encoding='utf-8'))
          assert validation['status'] == 'PASS'
          with (root / 'magica/i18n_audit/libs_json_completion_20260820/HUMAN_REVIEW_CHECKLIST.tsv').open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle, delimiter='\t'))
          assert len(rows) == 3
          assert [row['stable_id'] for row in rows] == ['pieceId=1603', 'pieceId=1604', 'pieceId=1605']
          PY

      - name: Commit directly to main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cd patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/publish-libs-json-completion-main-temp.yml \
            magica/js/libs/pieceList.json \
            magica/i18n_audit/libs_json_completion_20260820
          git diff --cached --check
          git commit -m 'fix(i18n): complete remaining libs JSON prose translations'
          git push origin HEAD:main
          new_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$new_sha" = "$remote_sha"
          echo "Published main commit: $new_sha"

      - name: Delete temporary audit branch after successful publication
        shell: bash
        run: |
          set -euo pipefail
          git -C publisher push origin --delete audit/libs-json-completion-20260820
