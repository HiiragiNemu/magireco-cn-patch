name: Publish exact final localization assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_REGION: ${{ secrets.R2_REGION }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
      QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
      EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
      EDGEONE_DOMAIN: ${{ secrets.EDGEONE_DOMAIN }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      ESA_SITE_ID: ${{ secrets.ESA_SITE_ID }}
      ESA_DOMAIN: ${{ secrets.ESA_DOMAIN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Download exact release assets
        run: |
          mkdir -p payload
          gh release download latest --repo HiiragiNemu/magireco-cn-patch --pattern cn_js_update.zip --pattern cn_scenario_update.zip --pattern version_js.json --pattern version_scenario.json --dir payload
          test "$(stat -c%s payload/cn_js_update.zip)" = 121388408
          test "$(stat -c%s payload/cn_scenario_update.zip)" = 195637970
          test "$(sha256sum payload/cn_js_update.zip | cut -d' ' -f1)" = d6dd4a9c45631aefba69cdf80f1435cf541715e972ca0ede277036a5fa90aca1
          test "$(sha256sum payload/cn_scenario_update.zip | cut -d' ' -f1)" = ee79c97b46b80c1e2ca152a9d039b10b59777ff8e4e5967a259d6d847eeac7c0
      - name: Upload and verify R2
        run: |
          pip install --quiet boto3
          python3 - <<'PY'
          import os,json,hashlib,boto3
          from botocore.config import Config
          want={'cn_js_update.zip':121388408,'cn_scenario_update.zip':195637970,'version_js.json':72,'version_scenario.json':74}
          s=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'].rstrip('/'),aws_access_key_id=os.environ['R2_ACCESS_KEY'],aws_secret_access_key=os.environ['R2_SECRET_KEY'],region_name=os.environ.get('R2_REGION') or 'auto',config=Config(signature_version='s3v4'))
          out={}
          for n,w in want.items():
            p='payload/'+n; z=os.path.getsize(p)
            if z!=w: raise SystemExit(f'{n}: {z}!={w}')
            s.upload_file(p,os.environ['R2_BUCKET'],n,ExtraArgs={'CacheControl':'no-cache, must-revalidate'})
            got=int(s.head_object(Bucket=os.environ['R2_BUCKET'],Key=n)['ContentLength'])
            if got!=w: raise SystemExit(f'{n}: mirror {got}!={w}')
            out[n]={'bytes':got,'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest()}; print(n,got,out[n]['sha256'])
          json.dump(out,open('publish-evidence.json','w'),indent=2)
          PY
      - name: Purge EdgeOne and ESA
        run: |
          pip install --quiet tencentcloud-sdk-python alibabacloud_esa20240910
          python3 - <<'PY'
          import os,json
          names=['cn_js_update.zip','cn_scenario_update.zip','version_js.json','version_scenario.json']
          try:
            from tencentcloud.common import credential
            from tencentcloud.common.profile.client_profile import ClientProfile
            from tencentcloud.common.profile.http_profile import HttpProfile
            from tencentcloud.teo.v20220901 import teo_client,models
            c=credential.Credential(os.environ['QCLOUD_SECRET_ID'],os.environ['QCLOUD_SECRET_KEY']); h=HttpProfile(); h.endpoint='teo.tencentcloudapi.com'; p=ClientProfile(); p.httpProfile=h; cli=teo_client.TeoClient(c,'',p)
            for n in names:
              r=models.CreatePurgeTaskRequest(); r.from_json_string(json.dumps({'ZoneId':os.environ['EDGEONE_ZONE_ID'],'Type':'purge_url','Targets':[f"http://{os.environ['EDGEONE_DOMAIN']}/{n}"]})); print('edge',n,cli.CreatePurgeTask(r).RequestId)
          except Exception as e: print('edge warning',e)
          try:
            from alibabacloud_esa20240910.client import Client
            from alibabacloud_esa20240910 import models as m
            from alibabacloud_tea_openapi import models as o
            c=o.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],endpoint='esa.cn-hangzhou.aliyuncs.com'); cli=Client(c); r=m.PurgeCachesRequest(site_id=int(os.environ['ESA_SITE_ID']),type='file',content=m.PurgeCachesRequestContent(files=[f"http://{os.environ['ESA_DOMAIN']}/{n}" for n in names])); print('esa',getattr(cli.purge_caches(r).body,'task_id',None))
          except Exception as e: print('esa warning',e)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-mirror-publish-evidence
          path: publish-evidence.json
