name: One-shot vendor verified BGM assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-bgm-assets-once.yml'

permissions:
  contents: read
  actions: read

jobs:
  vendor:
    if: github.repository == 'HiiragiNemu/magireco-cn-patch'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Run #22 artifact
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/run22
          gh run download 35524630427 \
            --repo HiiragiNemu/magireco-cn-patch \
            --name personal-native-main-verified \
            --dir /tmp/run22
          test -s /tmp/run22/magirecocn-legacy-client.apk

      - name: Checkout native main
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magirecocn-legacy-client
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: native

      - name: Vendor the exact verified OGG assets
        run: |
          set -euo pipefail
          cd native
          mkdir -p assets/magia
          unzip -p /tmp/run22/magirecocn-legacy-client.apk assets/magia/bgm1.ogg > assets/magia/bgm1.ogg
          unzip -p /tmp/run22/magirecocn-legacy-client.apk assets/magia/bgm2.ogg > assets/magia/bgm2.ogg
          unzip -p /tmp/run22/magirecocn-legacy-client.apk assets/magia/bgm.json > assets/magia/bgm.json
          test "$(stat -c%s assets/magia/bgm1.ogg)" = "1704705"
          test "$(stat -c%s assets/magia/bgm2.ogg)" = "1590844"
          echo "2fe7ed25ef27f5f4c6dfc3dff289c9175b117f43d72ab834c6078c453d15478d  assets/magia/bgm1.ogg" | sha256sum -c -
          echo "ea5b8cdba066a63b237ec7ffdb235a4390cc8e5f6b367791268d24071102b16d  assets/magia/bgm2.ogg" | sha256sum -c -
          echo "4b8b830a5f40829a87dfb0ccc350f66bd5ae12cb84b7a56560d39f70944011ca  assets/magia/bgm.json" | sha256sum -c -

      - name: Register BGM as Git-pinned repo assets
        run: |
          set -euo pipefail
          cd native
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("baseline/baseline.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          data["ops"] = [
              op for op in data["ops"]
              if not (op.get("kind") == "generated" and op.get("path") == "assets/magia/bgm")
          ]

          wanted = [
              ("assets/magia/bgm1.ogg", "预转码浮层 BGM1；来自已验证 1.0.178 APK，日常构建直接打包，不再重复 HCA 解密/转码"),
              ("assets/magia/bgm2.ogg", "预转码浮层 BGM2；来自已验证 1.0.178 APK，日常构建直接打包，不再重复 HCA 解密/转码"),
              ("assets/magia/bgm.json", "浮层 BGM 循环点与元数据；与固定 OGG 同一已验证产物来源"),
          ]
          existing = {op.get("path") for op in data["ops"]}
          for path, why in wanted:
              if path not in existing:
                  data["ops"].append({
                      "kind": "add",
                      "path": path,
                      "group": "浮层 BGM",
                      "why": why,
                      "from": "repo",
                  })

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          python3 tools/check-baseline.py

      - name: Commit directly to native main
        run: |
          set -euo pipefail
          cd native
          git config user.name "Hiiragi Nemu"
          git config user.email "128921071+HiiragiNemu@users.noreply.github.com"
          git add -f assets/magia/bgm1.ogg assets/magia/bgm2.ogg assets/magia/bgm.json\n          git add baseline/baseline.json
          git diff --cached --stat
          git commit -m "build: vendor verified overlay BGM assets"
          git push origin HEAD:main
