name: ⚙️ 更新、发布热更新包并触发下游更新

on:
  # 监听上游仓库的 push 事件（任何分支）
  push:
    branches:
      - main
      - master
  
  # 监听上游仓库的所有 Release 事件（不仅限于发布）
  release:
    types: [published, unpublished, created, edited, deleted, released, prereleased]
  
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      # 使用你在上游仓库设置的 PAT（用于触发下游）
      : ${{ secrets.DOWNSTREAM_TRIGGER_TOKEN }}
      DOWNSTREAM_OWNER: "MagirecoCN-Revival-Project"
      DOWNSTREAM_REPO: "patch-front"
      
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
          token: ${{ secrets. }}

      - name: 🔧 配置 Git
        run: |
          git config user.name "MagiaCN AutoBot"
          git config user.email "bot@magiacn.com"
          git config rebase.autoStash true

      # ==========================================
      # 1. 检测变动范围
      # ==========================================
      - name: 🔍 检测变动范围
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
          echo "变动文件:"; echo "$CHANGED"
          
          HAS_SCENARIO=0
          HAS_JS=0
          
          echo "$CHANGED" | grep -qE '^madomagi/resource/scenario/json/' && HAS_SCENARIO=1 || true
          echo "$CHANGED" | grep -qE '^magica/' && HAS_JS=1 || true
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HAS_SCENARIO=1
            HAS_JS=1
          fi
          
          echo "has_scenario=$HAS_SCENARIO" >> $GITHUB_OUTPUT
          echo "has_js=$HAS_JS" >> $GITHUB_OUTPUT
          mkdir -p _artifacts

      # ==========================================
      # 2. [JS] JS 补丁打包
      # ==========================================
      - name: "[JS] 打包 cn_js_update.zip"
        if: steps.detect.outputs.has_js == '1'
        run: |
          pip3 install requests 2>/dev/null || true
          python3 Build_JS_Injector.py
          
          zip -r cn_js_update.zip magica/
          
          python3 - <<'PYEOF'
          import json
          import hashlib
          import os
          
          json_file = "version_js.json"
          zip_file = "cn_js_update.zip"
          
          # 读取现有 JSON 或创建新的
          if os.path.exists(json_file):
              with open(json_file, 'r') as f:
                  data = json.load(f)
          else:
              data = {"version": 0, "size": 0, "md5": ""}
          
          # 读取 ZIP 文件并计算 MD5
          with open(zip_file, 'rb') as f:
              zip_data = f.read()
          
          # 更新数据
          data["version"] += 1
          data["size"] = len(zip_data)
          data["md5"] = hashlib.md5(zip_data).hexdigest()
          
          # 保存 JSON
          with open(json_file, 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"✅ version_js.json 已更新: v{data['version']}, size={data['size']}, md5={data['md5']}")
          PYEOF
          
          cp cn_js_update.zip _artifacts/
          cp version_js.json _artifacts/

      # ==========================================
      # 3. [SCENARIO] 剧情热更打包
      # ==========================================
      - name: "[SCENARIO] 打包 cn_scenario_update.zip"
        if: steps.detect.outputs.has_scenario == '1'
        run: |
          mkdir -p _pack_scn/madomagi/resource/scenario/json
          cp -r madomagi/resource/scenario/json/. _pack_scn/madomagi/resource/scenario/json/
          cd _pack_scn && zip -r ../cn_scenario_update.zip madomagi/ && cd ..
          
          python3 - <<'PYEOF'
          import json
          import hashlib
          import os
          
          json_file = "version_scenario.json"
          zip_file = "cn_scenario_update.zip"
          
          # 读取现有 JSON 或创建新的
          if os.path.exists(json_file):
              with open(json_file, 'r') as f:
                  data = json.load(f)
          else:
              data = {"version": 0, "size": 0, "md5": ""}
          
          # 读取 ZIP 文件并计算 MD5
          with open(zip_file, 'rb') as f:
              zip_data = f.read()
          
          # 更新数据
          data["version"] += 1
          data["size"] = len(zip_data)
          data["md5"] = hashlib.md5(zip_data).hexdigest()
          
          # 保存 JSON
          with open(json_file, 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"✅ version_scenario.json 已更新: v{data['version']}, size={data['size']}, md5={data['md5']}")
          PYEOF
          
          cp cn_scenario_update.zip _artifacts/
          cp version_scenario.json _artifacts/

      # ==========================================
      # 4. 提交变更到仓库
      # ==========================================
      - name: 📝 提交更新
        run: |
          git pull --rebase --autostash origin main
          git add version_*.json 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "无变动，跳过提交"
          else
            git commit -m "Auto: 更新前端JS/剧情版本号 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
        env:
          : ${{ secrets. }}

      # ==========================================
      # 5. 发布 Release（包含所有产物）
      # ==========================================
      - name: 🚀 发布产物
        env:
          : ${{ secrets. }}
        run: |
          if [ -z "$(ls -A _artifacts 2>/dev/null)" ]; then
            echo "无产物，跳过发布"
            exit 0
          fi
          
          echo "产物:"; ls -lh _artifacts/
          
          # 删除旧的 latest release（如果存在）
          gh release delete latest --yes || true
          
          # 创建新的 latest release 并上传所有产物（ZIP + JSON）
          gh release create latest _artifacts/* \
            --title "Latest Hotfix" \
            --notes "自动构建的热更新包" \
            --latest

      # ==========================================
      # 6. 🚀 触发下游仓库（无论何种触发源都执行）
      # ==========================================
      - name: 🔔 触发下游仓库同步
        if: always()
        run: |
          echo "获取当前仓库最新 commit SHA..."
          CURRENT_SHA=$(gh api repos/${{ github.repository }}/branches/main --jq '.commit.sha')
          
          echo "触发下游仓库: ${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}"
          
          # 获取最新 Release ID（如果存在）
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/latest --jq '.id' 2>/dev/null || echo "")
          
          gh api repos/${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}/dispatches \
            --method POST \
            --field event_type="upstream-update" \
            --field client_payload[upstream_repo]="${{ github.repository }}" \
            --field client_payload[upstream_sha]="$CURRENT_SHA" \
            --field client_payload[upstream_release_id]="$RELEASE_ID" \
            --field client_payload[triggered_by]="${{ github.actor }}" \
            --field client_payload[event_name]="${{ github.event_name }}"
          
          echo "✅ 下游仓库已收到触发信号"

      # ==========================================
      # 7. 生成运行摘要
      # ==========================================
      - name: 📊 生成摘要
        if: always()
        run: |
          echo "## ⚙️ 热更新构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**仓库**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**触发原因**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**触发者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 构建产物" >> $GITHUB_STEP_SUMMARY
          if [ -d "_artifacts" ]; then
            ls -lh _artifacts/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "无产物" >> $GITHUB_STEP_SUMMARY
          else
            echo "无产物" >> $GITHUB_STEP_SUMMARY
          fi
