name: 同步独立公开资源仓
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-public-resources.yml'
      - 'configures/personal-online-config.json'
      - 'tools/mirror_release.py'
      - 'tools/test-public-resource-mirror.py'
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - 'Publish verified client'
      - '累计补充包发布'
      - 'Personal finalized release delivery'
      - '个人仓库游戏更新发布'
    types: [completed]
permissions:
  contents: read
concurrency:
  group: public-player-resource-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'HiiragiNemu/magireco-cn-patch' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test mirror policy without credentials
        run: |
          python tools/test-public-resource-mirror.py
          node distribution/personal/test-worker.mjs
      - name: Synchronize source-owned public mirror
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python -u tools/mirror_release.py --source "$GITHUB_REPOSITORY" --target HiiragiNemu/ProgettoMagius-1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-resource-mirror-report
          path: mirror-report.json
          if-no-files-found: ignore
          retention-days: 14
