name: 🔄 同步上游和最新 APK 、打包热更新文件并上传到 S3

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制同步（无视指纹）'
        required: false
        default: 'false'
        type: boolean
      publish_hotfix:
        description: '发布热更新包（将 _new 文件覆盖正式文件）'
        required: false
        default: 'false'
        type: boolean
  repository_dispatch:
    types: [upstream-update]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-and-upload:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      S3_1_ENDPOINT: ${{ secrets.S3_1_ENDPOINT }}
      S3_1_ACCESS_KEY: ${{ secrets.S3_1_ACCESS_KEY }}
      S3_1_SECRET_KEY: ${{ secrets.S3_1_SECRET_KEY }}
      S3_1_REGION: ${{ secrets.S3_1_REGION }}
      S3_1_BUCKET: ${{ secrets.S3_1_BUCKET }}
      S3_1_DOMAIN: ${{ secrets.S3_1_DOMAIN }}
      S3_2_ENDPOINT: ${{ secrets.S3_2_ENDPOINT }}
      S3_2_ACCESS_KEY: ${{ secrets.S3_2_ACCESS_KEY }}
      S3_2_SECRET_KEY: ${{ secrets.S3_2_SECRET_KEY }}
      S3_2_REGION: ${{ secrets.S3_2_REGION }}
      S3_2_BUCKET: ${{ secrets.S3_2_BUCKET }}
      S3_2_DOMAIN: ${{ secrets.S3_2_DOMAIN }}
      QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
      QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
      EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
      UPSTREAM_OWNER: "HiiragiNemu"
      UPSTREAM_REPO: "magireco-cn-patch"
      DOWNSTREAM_OWNER: "MagirecoCN-Revival-Project"
      DOWNSTREAM_REPO: "magireco-cn-patch"

    steps:
      - name: 📦 检出下游仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: ${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}
          fetch-depth: 2

      - name: 🔧 配置 Git
        run: |
          git config user.name "MagiaCN AutoBot"
          git config user.email "bot@magiacn.com"
          git config rebase.autoStash true

      - name: 🔍 检查上游内容更新
        id: check_upstream
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              GREEN         = "\033[32m"
              YELLOW        = "\033[33m"
              CYAN          = "\033[36m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def warn(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          def skip(text, indent=0):
              print(f"{'  '*indent}{c(C.DIM, '⏭  ' + text)}", flush=True)

          def set_output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{key}={value}\n")

          UPSTREAM_OWNER = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO  = os.environ["UPSTREAM_REPO"]
          FORCE_SYNC     = os.environ.get("INPUT_FORCE_SYNC", "false")
          PUBLISH_HOTFIX = os.environ.get("INPUT_PUBLISH_HOTFIX", "false")

          header("检查上游内容更新")

          section("获取上游 commit SHA")
          info(f"上游仓库: {c(C.BRIGHT_WHITE, f'{UPSTREAM_OWNER}/{UPSTREAM_REPO}')}")

          result = subprocess.run(
              ["gh", "api",
               f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/branches/main",
               "--jq", ".commit.sha"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              err(f"获取上游 SHA 失败: {result.stderr.strip()}")
              sys.exit(1)

          upstream_sha   = result.stdout.strip()
          last_sync_sha  = os.environ.get("LAST_SYNC_COMMIT_SHA", "0")

          info(f"上游最新 SHA: {c(C.BRIGHT_CYAN, upstream_sha[:7])}")
          info(f"上次同步 SHA: {c(C.DIM, last_sync_sha[:7] if last_sync_sha != '0' else 'N/A')}")

          section("判断是否需要同步")
          if FORCE_SYNC == "true":
              warn("强制同步模式，跳过 SHA 比对")
              should_sync = True
          elif upstream_sha != last_sync_sha:
              ok("检测到新内容，需要同步")
              should_sync = True
          else:
              skip("SHA 一致，无新内容")
              should_sync = False

          section("判断是否发布热更新包")
          if PUBLISH_HOTFIX == "true":
              ok("发布热更新包模式已开启")
          else:
              skip("不发布热更新包")

          set_output("should_sync", "true" if should_sync else "false")
          set_output("commit_sha", upstream_sha)
          set_output("publish_hotfix", PUBLISH_HOTFIX)
          SCRIPT_END
        env:
          INPUT_FORCE_SYNC: ${{ inputs.force_sync }}
          INPUT_PUBLISH_HOTFIX: ${{ inputs.publish_hotfix }}

      - name: 🔄 同步上游 Fork
        if: steps.check_upstream.outputs.should_sync == 'true'
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET        = "\033[0m"
              BOLD         = "\033[1m"
              DIM          = "\033[2m"
              RED          = "\033[31m"
              BRIGHT_GREEN = "\033[92m"
              BRIGHT_BLUE  = "\033[94m"
              BRIGHT_WHITE = "\033[97m"
              CYAN         = "\033[36m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          UPSTREAM_OWNER   = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO    = os.environ["UPSTREAM_REPO"]
          DOWNSTREAM_OWNER = os.environ["DOWNSTREAM_OWNER"]
          DOWNSTREAM_REPO  = os.environ["DOWNSTREAM_REPO"]

          header("同步上游 Fork 内容")
          section("执行 repo sync")
          info(f"来源: {c(C.BRIGHT_WHITE, f'{UPSTREAM_OWNER}/{UPSTREAM_REPO}')}")
          info(f"目标: {c(C.BRIGHT_WHITE, f'{DOWNSTREAM_OWNER}/{DOWNSTREAM_REPO}')}")

          result = subprocess.run([
              "gh", "repo", "sync",
              f"{DOWNSTREAM_OWNER}/{DOWNSTREAM_REPO}",
              "--source", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
              "--branch", "main",
              "--force"
          ], capture_output=True, text=True)

          if result.returncode != 0:
              err(f"同步失败: {result.stderr.strip()}")
              sys.exit(1)

          ok("上游仓库内容同步完成")
          SCRIPT_END

      - name: 📝 更新 Commit SHA
        if: steps.check_upstream.outputs.should_sync == 'true'
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET        = "\033[0m"
              BOLD         = "\033[1m"
              DIM          = "\033[2m"
              RED          = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          sha = os.environ.get("COMMIT_SHA", "")

          header("更新同步状态")
          section("写入 GitHub Variables")
          info(f"SHA: {c(C.BRIGHT_CYAN, sha[:7] if sha else 'N/A')}")

          result = subprocess.run(
              ["gh", "variable", "set", "LAST_SYNC_COMMIT_SHA", "--body", sha],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              err(f"写入失败: {result.stderr.strip()}")
              sys.exit(1)

          ok("LAST_SYNC_COMMIT_SHA 已更新")
          SCRIPT_END
        env:
          COMMIT_SHA: ${{ steps.check_upstream.outputs.commit_sha }}

      - name: 🔍 检测变动范围
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
          echo "变动文件:"; echo "$CHANGED"

          HAS_SCENARIO=0
          HAS_JS=0

          echo "$CHANGED" | grep -qE '^madomagi/resource/scenario/json/' && HAS_SCENARIO=1 || true
          echo "$CHANGED" | grep -qE '^magica/' && HAS_JS=1 || true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HAS_SCENARIO=1
            HAS_JS=1
          fi

          echo "has_scenario=$HAS_SCENARIO" >> $GITHUB_OUTPUT
          echo "has_js=$HAS_JS" >> $GITHUB_OUTPUT
          mkdir -p _artifacts

      - name: "[JS] 打包 cn_js_update_new.zip"
        if: steps.detect.outputs.has_js == '1'
        run: |
          pip3 install requests 2>/dev/null || true
          python3 Build_JS_Injector.py

          zip -r cn_js_update_new.zip magica/

          python3 - <<'PYEOF'
          import json
          import hashlib
          import os

          json_file = "version_js_new.json"
          zip_file  = "cn_js_update_new.zip"

          if os.path.exists(json_file):
              with open(json_file, 'r') as f:
                  data = json.load(f)
          else:
              data = {"version": 0, "size": 0, "md5": ""}

          with open(zip_file, 'rb') as f:
              zip_data = f.read()

          data["version"] += 1
          data["size"]     = len(zip_data)
          data["md5"]      = hashlib.md5(zip_data).hexdigest()

          with open(json_file, 'w') as f:
              json.dump(data, f, indent=2)

          print(f"✅ version_js_new.json 已更新: v{data['version']}, size={data['size']}, md5={data['md5']}")
          PYEOF

          cp cn_js_update_new.zip _artifacts/
          cp version_js_new.json  _artifacts/

      - name: "[SCENARIO] 打包 cn_scenario_update_new.zip"
        if: steps.detect.outputs.has_scenario == '1'
        run: |
          mkdir -p _pack_scn/madomagi/resource/scenario/json
          cp -r madomagi/resource/scenario/json/. _pack_scn/madomagi/resource/scenario/json/
          cd _pack_scn && zip -r ../cn_scenario_update_new.zip madomagi/ && cd ..

          python3 - <<'PYEOF'
          import json
          import hashlib
          import os

          json_file = "version_scenario_new.json"
          zip_file  = "cn_scenario_update_new.zip"

          if os.path.exists(json_file):
              with open(json_file, 'r') as f:
                  data = json.load(f)
          else:
              data = {"version": 0, "size": 0, "md5": ""}

          with open(zip_file, 'rb') as f:
              zip_data = f.read()

          data["version"] += 1
          data["size"]     = len(zip_data)
          data["md5"]      = hashlib.md5(zip_data).hexdigest()

          with open(json_file, 'w') as f:
              json.dump(data, f, indent=2)

          print(f"✅ version_scenario_new.json 已更新: v{data['version']}, size={data['size']}, md5={data['md5']}")
          PYEOF

          cp cn_scenario_update_new.zip _artifacts/
          cp version_scenario_new.json  _artifacts/

      - name: 🚀 上传热更新包到上游 Release
        if: steps.detect.outputs.has_js == '1' || steps.detect.outputs.has_scenario == '1'
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def warn(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          def skip(text, indent=0):
              print(f"{'  '*indent}{c(C.DIM, '⏭  ' + text)}", flush=True)

          UPSTREAM_OWNER   = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO    = os.environ["UPSTREAM_REPO"]
          PUBLISH_HOTFIX   = os.environ.get("PUBLISH_HOTFIX", "false")
          ARTIFACTS_DIR    = "_artifacts"

          NEW_TO_FINAL = {
              "cn_js_update_new.zip":       "cn_js_update.zip",
              "version_js_new.json":        "version_js.json",
              "cn_scenario_update_new.zip": "cn_scenario_update.zip",
              "version_scenario_new.json":  "version_scenario.json",
          }

          header("上传热更新包到上游 Release")

          section("获取上游 Release 信息")
          result = subprocess.run(
              ["gh", "api",
               f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/releases/latest",
               "--jq", ".id"],
              capture_output=True, text=True
          )
          if result.returncode != 0 or not result.stdout.strip():
              err("获取上游 Release 失败，跳过上传")
              sys.exit(1)

          release_id = result.stdout.strip()
          info(f"Release ID: {c(C.BRIGHT_CYAN, release_id)}")

          result = subprocess.run(
              ["gh", "api",
               f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/releases/{release_id}/assets",
               "--jq", "[.[] | {id: .id, name: .name}]"],
              capture_output=True, text=True
          )
          import json
          existing_assets = {}
          if result.returncode == 0 and result.stdout.strip():
              try:
                  for asset in json.loads(result.stdout.strip()):
                      existing_assets[asset['name']] = asset['id']
              except Exception:
                  warn("解析现有 asset 列表失败，将直接尝试上传")

          info(f"现有 asset: {c(C.BRIGHT_WHITE, str(list(existing_assets.keys())))}")

          artifacts = [f for f in os.listdir(ARTIFACTS_DIR) if os.path.isfile(os.path.join(ARTIFACTS_DIR, f))]
          if not artifacts:
              warn("_artifacts 目录为空，跳过上传")
              sys.exit(0)

          section("上传 _new 文件到 Release")
          for fname in artifacts:
              fpath = os.path.join(ARTIFACTS_DIR, fname)
              info(f"上传: {c(C.BRIGHT_WHITE, fname)}")

              if fname in existing_assets:
                  del_result = subprocess.run(
                      ["gh", "api",
                       f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/releases/assets/{existing_assets[fname]}",
                       "--method", "DELETE"],
                      capture_output=True, text=True
                  )
                  if del_result.returncode == 0:
                      ok(f"已删除旧 asset: {fname}", indent=1)
                  else:
                      warn(f"删除旧 asset 失败: {del_result.stderr.strip()}", indent=1)

              up_result = subprocess.run(
                  ["gh", "release", "upload", "latest", fpath,
                   "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                   "--clobber"],
                  capture_output=True, text=True
              )
              if up_result.returncode == 0:
                  ok(f"上传成功: {fname}", indent=1)
              else:
                  err(f"上传失败: {up_result.stderr.strip()}", indent=1)

          if PUBLISH_HOTFIX == "true":
              section("发布热更新包（_new → 正式文件）")

              result = subprocess.run(
                  ["gh", "api",
                   f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/releases/{release_id}/assets",
                   "--jq", "[.[] | {id: .id, name: .name, url: .browser_download_url}]"],
                  capture_output=True, text=True
              )
              current_assets = {}
              if result.returncode == 0 and result.stdout.strip():
                  try:
                      for asset in json.loads(result.stdout.strip()):
                          current_assets[asset['name']] = asset
                  except Exception:
                      err("解析 asset 列表失败")
                      sys.exit(1)

              import urllib.request
              for new_name, final_name in NEW_TO_FINAL.items():
                  if new_name not in current_assets:
                      skip(f"{new_name} 不在 Release 中，跳过")
                      continue

                  info(f"{c(C.BRIGHT_YELLOW, new_name)} → {c(C.BRIGHT_GREEN, final_name)}")

                  try:
                      with urllib.request.urlopen(current_assets[new_name]['url']) as resp:
                          file_data = resp.read()
                  except Exception as e:
                      err(f"下载 {new_name} 失败: {e}", indent=1)
                      continue

                  tmp_path = f"/tmp/{final_name}"
                  with open(tmp_path, 'wb') as f:
                      f.write(file_data)

                  if final_name in current_assets:
                      del_result = subprocess.run(
                          ["gh", "api",
                           f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/releases/assets/{current_assets[final_name]['id']}",
                           "--method", "DELETE"],
                          capture_output=True, text=True
                      )
                      if del_result.returncode == 0:
                          ok(f"已删除旧正式文件: {final_name}", indent=1)
                      else:
                          warn(f"删除旧正式文件失败: {del_result.stderr.strip()}", indent=1)

                  up_result = subprocess.run(
                      ["gh", "release", "upload", "latest", f"{tmp_path}#{final_name}",
                       "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                       "--clobber"],
                      capture_output=True, text=True
                  )
                  if up_result.returncode == 0:
                      ok(f"已发布正式文件: {final_name}", indent=1)
                  else:
                      err(f"发布失败: {up_result.stderr.strip()}", indent=1)

              ok("热更新包发布完成")
          else:
              skip("未开启发布热更新包，_new 文件已上传供预览，正式文件不变")

          SCRIPT_END
        env:
          PUBLISH_HOTFIX: ${{ steps.check_upstream.outputs.publish_hotfix }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: pip install boto3 tencentcloud-sdk-python

      - name: 📲 同步客户端 APK 到上游 Release
        id: sync_apk
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os
          import json
          import urllib.request
          import urllib.error

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def warn(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          def skip(text, indent=0):
              print(f"{'  '*indent}{c(C.DIM, '⏭  ' + text)}", flush=True)

          def human_size(size_bytes):
              for unit in ["B", "KB", "MB", "GB"]:
                  if size_bytes < 1024:
                      return f"{size_bytes:.1f} {unit}"
                  size_bytes /= 1024
              return f"{size_bytes:.1f} TB"

          def set_output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{key}={value}\n")

          UPSTREAM_OWNER = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO  = os.environ["UPSTREAM_REPO"]
          CLIENT_OWNER   = "MagirecoCN-Revival-Project"
          CLIENT_REPO    = "magireco-client-patch"
          GH_TOKEN       = os.environ.get("GH_TOKEN", "")

          GH_HEADERS = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if GH_TOKEN:
              GH_HEADERS["Authorization"] = f"Bearer {GH_TOKEN}"

          def fetch_release(owner, repo):
              url = f"https://api.github.com/repos/{owner}/{repo}/releases/latest"
              req = urllib.request.Request(url, headers=GH_HEADERS)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise

          def delete_asset(asset_id, name):
              url = (
                  f"https://api.github.com/repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
                  f"/releases/assets/{asset_id}"
              )
              req = urllib.request.Request(url, headers=GH_HEADERS, method="DELETE")
              try:
                  with urllib.request.urlopen(req):
                      pass
                  ok(f"已删除旧 asset: {name}", indent=1)
                  return True
              except Exception as e:
                  warn(f"删除 [{name}] 失败: {e}", indent=1)
                  return False

          def upload_asset_to_upstream(release_tag, local_path, display_name):
              upstream_release = fetch_release(UPSTREAM_OWNER, UPSTREAM_REPO)
              if not upstream_release:
                  err("重新获取上游 Release 失败")
                  return False
              cur_map = {a["name"]: a for a in upstream_release.get("assets", [])}
              if display_name in cur_map:
                  delete_asset(cur_map[display_name]["id"], display_name)

              upload_arg = f"{local_path}#{display_name}"
              result = subprocess.run(
                  [
                      "gh", "release", "upload", release_tag, upload_arg,
                      "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                      "--clobber",
                  ],
                  capture_output=True, text=True
              )
              if result.returncode == 0:
                  ok(f"已上传: {display_name}", indent=1)
                  return True
              else:
                  err(f"上传失败 [{display_name}]: {result.stderr.strip()}", indent=1)
                  return False

          def main():
              header("同步客户端 APK 到上游 Release")

              section("读取历史 APK 同步记录")
              result = subprocess.run(
                  ["gh", "variable", "get", "LAST_APK_RELEASE_TAG"],
                  capture_output=True, text=True
              )
              last_apk_tag = result.stdout.strip() if result.returncode == 0 else ""
              if last_apk_tag:
                  info(f"上次同步 tag: {c(C.DIM, last_apk_tag)}")
              else:
                  info("无历史记录，视为首次同步")

              section(f"获取 {CLIENT_OWNER}/{CLIENT_REPO} 最新 Release")
              client_release = fetch_release(CLIENT_OWNER, CLIENT_REPO)
              if not client_release:
                  warn(f"{CLIENT_OWNER}/{CLIENT_REPO} 暂无 Release，跳过 APK 同步")
                  set_output("apk_synced", "false")
                  return

              client_tag  = client_release.get("tag_name", "")
              client_name = client_release.get("name") or client_tag
              info(f"最新 Release: {c(C.BRIGHT_WHITE, client_name)}")
              info(f"Tag:          {c(C.BRIGHT_CYAN, client_tag)}")

              section("比对 tag")
              if client_tag and client_tag == last_apk_tag:
                  skip(f"APK tag 未变化（{client_tag}），无需同步")
                  set_output("apk_synced", "false")
                  return
              ok(f"检测到新 APK: {c(C.BRIGHT_CYAN, client_tag)}")

              section("筛选 APK 文件")
              apk_assets = [
                  a for a in client_release.get("assets", [])
                  if a["name"].lower().endswith(".apk")
              ]
              if not apk_assets:
                  warn("该 Release 中未找到 .apk 文件，跳过")
                  set_output("apk_synced", "false")
                  return

              if len(apk_assets) > 1:
                  warn(f"检测到 {len(apk_assets)} 个 APK，"
                       f"只使用第一个: "
                       f"{c(C.BRIGHT_WHITE, apk_assets[0]['name'])}")
              asset = apk_assets[0]
              fname = asset["name"]
              info(f"原始文件名: {c(C.BRIGHT_WHITE, fname)}")
              info(f"目标文件名: {c(C.BRIGHT_CYAN, 'client.apk')}")
              info(f"大小:       {c(C.DIM, human_size(asset['size']))}")

              section(f"获取 {UPSTREAM_OWNER}/{UPSTREAM_REPO} Release tag")
              upstream_release = fetch_release(UPSTREAM_OWNER, UPSTREAM_REPO)
              if not upstream_release:
                  err("获取上游 Release 失败，无法上传 APK")
                  set_output("apk_synced", "false")
                  sys.exit(1)
              upstream_tag = upstream_release.get("tag_name", "latest")
              info(f"上游 Release tag: {c(C.BRIGHT_CYAN, upstream_tag)}")

              section("下载 APK")
              work_dir = "/tmp/apk_sync"
              os.makedirs(work_dir, exist_ok=True)
              dst_path = os.path.join(work_dir, fname)

              try:
                  dl_req = urllib.request.Request(
                      asset["browser_download_url"], headers=GH_HEADERS
                  )
                  with urllib.request.urlopen(dl_req) as resp:
                      data = resp.read()
                  with open(dst_path, "wb") as f:
                      f.write(data)
                  ok(f"已下载: {fname}  "
                     f"{c(C.DIM, human_size(len(data)))}", indent=1)
              except Exception as e:
                  err(f"下载失败: {e}", indent=1)
                  set_output("apk_synced", "false")
                  sys.exit(1)

              section("上传为 client.apk 到上游 Release")
              info(f"{c(C.BRIGHT_WHITE, fname)} "
                   f"→ {c(C.BRIGHT_CYAN, 'client.apk')}")
              if not upload_asset_to_upstream(upstream_tag, dst_path, "client.apk"):
                  set_output("apk_synced", "false")
                  sys.exit(1)

              section("保存 APK 同步记录")
              save_result = subprocess.run(
                  ["gh", "variable", "set", "LAST_APK_RELEASE_TAG",
                   "--body", client_tag],
                  capture_output=True, text=True
              )
              if save_result.returncode == 0:
                  ok(f"LAST_APK_RELEASE_TAG = {c(C.BRIGHT_CYAN, client_tag)}")
              else:
                  warn(f"保存 tag 失败: {save_result.stderr.strip()}")

              set_output("apk_synced", "true")

              header("APK 同步完成")
              ok(f"来源: {c(C.BRIGHT_WHITE, fname)}  "
                 f"{c(C.DIM, '(' + client_tag + ')')}")
              ok(f"目标: {c(C.BRIGHT_CYAN, 'client.apk')} → 上游 Release")

          if __name__ == "__main__":
              main()
          SCRIPT_END

