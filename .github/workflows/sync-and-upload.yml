              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, i=0): print(f"{'  '*i}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, i=0): print(f"{'  '*i}{c(C.DIM, '⏭  ' + t)}", flush=True)
          def human_size(n):
              for u in ["B", "KB", "MB", "GB"]:
                  if n < 1024: return f"{n:.1f} {u}"
                  n /= 1024
              return f"{n:.1f} TB"

          # ══════════════════════════════════════════════════════════════
          # S3 上传过滤规则 v2
          # ══════════════════════════════════════════════════════════════
          # configure.json     → 必须同步到 S3（客户端从 S3 拉它）
          # version_*.json     → 兼容老客户端，也同步
          # version_*_new.json → 预览版，不上 S3
          # versions.json / offline_package_checksum.txt → schema v2 已废弃
          S3_IGNORE_EXACT = {
              'offline-package.zip',
              'offline_package_checksum.txt',
              'versions.json',
              'puella-historia-splited.tar.xz',
          }
          S3_IGNORE_PREFIXES = (
              'offline-package.zip.',
              'source code',
          )
          S3_IGNORE_SUFFIXES = (
              '_new.zip',
              '_new.json',
          )

          def should_ignore_for_s3(name: str) -> bool:
              if name in S3_IGNORE_EXACT: return True
              if any(name.startswith(p) for p in S3_IGNORE_PREFIXES): return True
              if any(name.endswith(s) for s in S3_IGNORE_SUFFIXES): return True
              return False

          # 强制清理 S3 上的废弃文件（即便它已经不在 Release 中也要删）
          S3_FORCE_PURGE = {
              'versions.json',
              'offline_package_checksum.txt',
          }

          class S3Handler:
              def __init__(self, endpoint, access_key, secret_key,
                           region, bucket, domain, name="S3"):
                  self.name   = name
                  self.bucket = bucket
                  self.domain = domain
                  ep = endpoint.rstrip('/')
                  self.s3_client = boto3.client(
                      's3', endpoint_url=ep,
                      aws_access_key_id=access_key,
                      aws_secret_access_key=secret_key,
                      region_name=region
                  )
              def list_files(self):
                  try:
                      paginator = self.s3_client.get_paginator('list_objects_v2')
                      files = [obj['Key'] for page in paginator.paginate(Bucket=self.bucket)
                               if 'Contents' in page for obj in page['Contents']]
                      info(f"[{c(C.BRIGHT_WHITE, self.name)}] 列出 {c(C.BOLD, str(len(files)))} 个文件")
                      return files
                  except Exception as e:
                      err(f"[{self.name}] 列出文件失败: {e}")
                      return []
              def delete_file(self, filename):
                  try:
                      self.s3_client.delete_object(Bucket=self.bucket, Key=filename)
                      ok(f"[{c(C.BRIGHT_WHITE, self.name)}] 删除: {filename}", indent=1)
                      return True
                  except ClientError as e:
                      if e.response['Error']['Code'] == '404':
                          skip(f"[{self.name}] {filename} 不存在", indent=1)
                          return True
                      err(f"[{self.name}] 删除失败: {e}", indent=1)
                      return False
                  except Exception as e:
                      err(f"[{self.name}] 删除异常: {e}", indent=1)
                      return False
              def upload_file_from_url(self, url, filename):
                  try:
                      info(f"[{c(C.BRIGHT_WHITE, self.name)}] 流式上传: "
                           f"{c(C.BRIGHT_CYAN, filename)}", indent=1)
                      req = urllib.request.Request(url)
                      with urllib.request.urlopen(req) as response:
                          file_data  = response.read()
                          file_size  = len(file_data)
                      self.s3_client.put_object(
                          Bucket=self.bucket, Key=filename,
                          Body=file_data, ContentLength=file_size
                      )
                      ok(f"[{c(C.BRIGHT_WHITE, self.name)}] 上传完成: "
                         f"{filename} {c(C.DIM, '(' + human_size(file_size) + ')')}",
                         indent=1)
                      return True
                  except Exception as e:
                      err(f"[{self.name}] 上传失败: {e}", indent=1)
                      return False

          class EdgeOneHandler:
              def __init__(self, secret_id, secret_key, zone_id):
                  self.zone_id = zone_id
                  cred         = credential.Credential(secret_id, secret_key)
                  hp           = HttpProfile()
                  hp.endpoint  = "teo.tencentcloudapi.com"
                  cp           = ClientProfile()
                  cp.httpProfile = hp
                  self.client  = teo_client.TeoClient(cred, "", cp)
              def purge_cache(self, domain, filename):
                  try:
                      req        = models.CreatePurgeTaskRequest()
                      target_url = f"http://{domain}/{filename}"
                      req.from_json_string(json.dumps({
                          "ZoneId": self.zone_id,
                          "Type": "purge_url",
                          "Targets": [target_url]
                      }))
                      resp    = self.client.CreatePurgeTask(req)
                      task_id = resp.RequestId
                      ok(f"[EdgeOne] 缓存刷新: {c(C.DIM, target_url)}", indent=1)
                      return True, task_id
                  except Exception as e:
                      err(f"[EdgeOne] 刷新失败: {e}", indent=1)
                      return False, str(e)

          def main():
              header("初始化")
              s3_1 = S3Handler(
                  os.environ['S3_1_ENDPOINT'], os.environ['S3_1_ACCESS_KEY'],
                  os.environ['S3_1_SECRET_KEY'], os.environ['S3_1_REGION'],
                  os.environ['S3_1_BUCKET'],    os.environ['S3_1_DOMAIN'], "存储桶1"
              )
              s3_2 = S3Handler(
                  os.environ['S3_2_ENDPOINT'], os.environ['S3_2_ACCESS_KEY'],
                  os.environ['S3_2_SECRET_KEY'], os.environ['S3_2_REGION'],
                  os.environ['S3_2_BUCKET'],    os.environ['S3_2_DOMAIN'], "存储桶2"
              )
              edgeone = EdgeOneHandler(
                  os.environ['QCLOUD_SECRET_ID'],
                  os.environ['QCLOUD_SECRET_KEY'],
                  os.environ['EDGEONE_ZONE_ID']
              )
              ok("S3 × 2 + EdgeOne 已初始化")

              owner = os.environ.get('UPSTREAM_OWNER', 'HiiragiNemu')
              repo  = os.environ.get('UPSTREAM_REPO',  'magireco-cn-patch')

              GH_HEADERS = {
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if os.environ.get('GH_TOKEN'):
                  GH_HEADERS['Authorization'] = f"Bearer {os.environ['GH_TOKEN']}"

              header(f"获取 {owner}/{repo} 最新 Release")
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{owner}/{repo}/releases/latest",
                      headers=GH_HEADERS
                  )
                  with urllib.request.urlopen(req) as resp:
                      release = json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      warn("上游仓库无 Release，跳过")
                      with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                          fh.write("has_zip_changes=false\n")
                      return
                  raise

              info(f"Release: {c(C.BRIGHT_WHITE, release.get('name') or release.get('tag_name'))}")
              current_map = {
                  a['name']: a.get('digest', '')
                  for a in release.get('assets', [])
                  if not should_ignore_for_s3(a['name'])
              }
              info(f"包含 {c(C.BOLD, str(len(current_map)))} 个待同步 asset")

              header("比对文件指纹")
              result = subprocess.run(
                  ['gh', 'variable', 'get', 'LAST_SYNC_FINGERPRINTS'],
                  capture_output=True, text=True
              )
              old_map = {}
              if result.returncode == 0 and result.stdout.strip():
                  try:
                      old_map = json.loads(result.stdout.strip())
                      info(f"历史指纹: {c(C.BOLD, str(len(old_map)))} 个文件")
                  except Exception:
                      warn("历史指纹解析失败，视为首次同步")

              to_process, unchanged, deleted = [], [], []
              for fname, sha in current_map.items():
                  if fname not in old_map:
                      info(f"{c(C.BRIGHT_YELLOW, fname)} → 新文件")
                      to_process.append(fname)
                  elif sha and old_map[fname] != sha:
                      info(f"{c(C.BRIGHT_YELLOW, fname)} → 已更新")
                      to_process.append(fname)
                  elif not sha:
                      to_process.append(fname)
                  else:
                      unchanged.append(fname)
              for fname in old_map:
                  if fname not in current_map:
                      deleted.append(fname)

              has_zip_changes = any(f.endswith(".zip") for f in to_process)
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write(f"has_zip_changes={'true' if has_zip_changes else 'false'}\n")

              header("清理过时 / 强制清理废弃 schema 文件")
              bucket1_files = s3_1.list_files()
              bucket2_files = s3_2.list_files()
              bucket1_targets = {
                  'cn_base_00_db.zip', 'cn_base_01_json.zip', 'cn_base_02.zip',
                  'cn_base_03.zip', 'cn_base_04.zip', 'cn_base_05.zip',
                  'cn_base_06.zip', 'cn_hotupdate.zip', 'cn_js_update.zip',
                  'cn_magica_resource.zip'
              }

              def cleanup_bucket(s3, files, targets, peer):
                  for fname in files:
                      # schema v2 强制清理废弃文件
                      if fname in S3_FORCE_PURGE:
                          warn(f"{fname} → schema v2 已废弃，强制清理", indent=1)
                          s3.delete_file(fname)
                          continue
                      if should_ignore_for_s3(fname):
                          continue
                      if fname in deleted or fname not in current_map:
                          s3.delete_file(fname)
                      elif fname not in targets:
                          warn(f"{fname} 在 {s3.name} 但应在 {peer.name}，纠正", indent=1)
                          try:
                              url = next(a['browser_download_url']
                                         for a in release['assets']
                                         if a['name'] == fname)
                              if peer.upload_file_from_url(url, fname):
                                  s3.delete_file(fname)
                                  if fname in to_process:
                                      to_process.remove(fname)
                          except Exception as e:
                              err(f"纠正失败: {e}", indent=1)

              section("处理存储桶1")
              cleanup_bucket(s3_1, bucket1_files, bucket1_targets, s3_2)
              section("处理存储桶2")
              # 桶2 的"应有"集合 = current_map - bucket1_targets
              bucket2_targets = set(current_map.keys()) - bucket1_targets
              cleanup_bucket(s3_2, bucket2_files, bucket2_targets, s3_1)

              if not to_process:
                  header("无新增/更新文件")
                  return

              header(f"上传 {len(to_process)} 个文件")
              processed = []
              for fname in to_process:
                  target_s3 = s3_1 if fname in bucket1_targets else s3_2
                  url = next(a['browser_download_url']
                             for a in release['assets'] if a['name'] == fname)
                  if target_s3.upload_file_from_url(url, fname):
                      edgeone.purge_cache(target_s3.domain, fname)
                      processed.append(fname)
                  else:
                      err(f"上传失败: {fname}")

              if processed:
                  header("刷新根目录 CDN 缓存")
                  edgeone.purge_cache(s3_1.domain, "")
                  edgeone.purge_cache(s3_2.domain, "")

              header("保存指纹")
              final_map = old_map.copy()
              for fname in unchanged: final_map[fname] = old_map[fname]
              for fname in to_process: final_map[fname] = current_map[fname]
              for fname in deleted: final_map.pop(fname, None)
              subprocess.run(
                  ['gh', 'variable', 'set', 'LAST_SYNC_FINGERPRINTS',
                   '--body', json.dumps(final_map)],
                  check=True
              )
              ok(f"指纹已保存（{c(C.BOLD, str(len(final_map)))} 个）")

          if __name__ == "__main__":
              try:
                  main()
              except Exception as e:
                  err(f"脚本失败: {e}")
                  import traceback; traceback.print_exc()
                  sys.exit(1)
          SCRIPT_END

      # ───────────────────────────────────────────────────────────────
      # 📦 构建并上传 offline-package.zip（分卷）
      #   v2 改动：
      #     - 内层文件 version.json → configure.json
      #       内容 {"offline_package": {"version": "<timestamp>"}}
      #     - 不再写 versions.json / offline_package_checksum.txt
      #     - 改成更新 /configures/configure.json 的 offline_package 子块
      #       并镜像到 / 和 Release
      # ───────────────────────────────────────────────────────────────
      - name: 📦 构建并上传 offline-package.zip（分卷）
        if: |
          steps.sync_script.outputs.has_zip_changes == 'true' ||
          steps.check_upstream.outputs.publish_hotfix == 'true' ||
          steps.check_upstream.outputs.build_offline == 'true'
        run: |
          python3 <<'SCRIPT_END'
          import subprocess, sys, os, json, hashlib, zipfile, math, shutil
          import urllib.request, urllib.error
          from datetime import datetime, timezone

          sys.stdout.reconfigure(line_buffering=True)

          class C:
              RESET = "\033[0m"; BOLD = "\033[1m"; DIM = "\033[2m"; RED = "\033[31m"
              BRIGHT_GREEN = "\033[92m"; BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE = "\033[94m"; BRIGHT_CYAN = "\033[96m"
              BRIGHT_WHITE = "\033[97m"; CYAN = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, i=0): print(f"{'  '*i}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, i=0): print(f"{'  '*i}{c(C.DIM, '⏭  ' + t)}", flush=True)
          def human_size(n):
              for u in ["B", "KB", "MB", "GB"]:
                  if n < 1024: return f"{n:.1f} {u}"
                  n /= 1024
              return f"{n:.1f} TB"

          SPLIT_SIZE = 1900 * 1024 * 1024
          UPSTREAM_OWNER = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO  = os.environ["UPSTREAM_REPO"]
          GH_TOKEN       = os.environ.get("GH_TOKEN", "")
          CFG_DIR        = os.environ["CONFIG_DIR"]
          CFG_FILE       = os.environ["CONFIG_FILE"]
          OFFLINE_PART_PREFIX = "offline-package.zip."

          # 这些文件不能进离线包
          EXCLUDE_FROM_OFFLINE = {
              "offline-package.zip",
              "offline_package_checksum.txt",     # v2 已废弃
              "versions.json",                    # v2 已废弃
              "configure.json",                   # 不打入离线包，离线包内部自带一份精简版
              "puella-historia-splited.tar.xz",
              "client.apk",
          }
          NEW_SUFFIXES = ("_new.zip", "_new.json")

          GH_HEADERS = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if GH_TOKEN:
              GH_HEADERS["Authorization"] = f"Bearer {GH_TOKEN}"

          RELEASE_API = (
              f"https://api.github.com/repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
              "/releases/latest"
          )

          def fetch_release():
              req = urllib.request.Request(RELEASE_API, headers=GH_HEADERS)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  err(f"获取 Release 失败: HTTP {e.code}")
                  sys.exit(1)

          def delete_asset(asset_id, name):
              url = (f"https://api.github.com/repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
                     f"/releases/assets/{asset_id}")
              req = urllib.request.Request(url, headers=GH_HEADERS, method="DELETE")
              try:
                  with urllib.request.urlopen(req): pass
                  ok(f"已删除旧 asset: {name}", indent=1)
                  return True
              except Exception as e:
                  warn(f"删除 [{name}] 失败: {e}", indent=1)
                  return False

          def upload_asset(release_tag, local_path, display_name):
              release_now = fetch_release()
              cur_map = {a["name"]: a for a in release_now.get("assets", [])}
              if display_name in cur_map:
                  delete_asset(cur_map[display_name]["id"], display_name)
              upload_arg = f"{local_path}#{display_name}"
              result = subprocess.run(
                  ["gh", "release", "upload", release_tag, upload_arg,
                   "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                   "--clobber"],
                  capture_output=True, text=True
              )
              if result.returncode == 0:
                  ok(f"已上传: {display_name}", indent=1)
                  return True
              err(f"上传失败 [{display_name}]: {result.stderr.strip()}", indent=1)
              return False

          def split_file(src_path, out_dir, chunk_size):
              parts = []
              with open(src_path, "rb") as f:
                  idx = 1
                  while True:
                      chunk = f.read(chunk_size)
                      if not chunk: break
                      part_name = f"offline-package.zip.{idx:03d}"
                      part_path = os.path.join(out_dir, part_name)
                      with open(part_path, "wb") as pf:
                          pf.write(chunk)
                      parts.append(part_path)
                      ok(f"分卷 {part_name}: {human_size(len(chunk))}", indent=1)
                      idx += 1
              return parts

          def main():
              header("构建 offline-package.zip（v2: 内层 configure.json）")

              section("获取上游 Release")
              release = fetch_release()
              release_tag = release.get("tag_name", "latest")
              info(f"Release: {c(C.BRIGHT_WHITE, release.get('name') or release_tag)}")
              assets = release.get("assets", [])
              asset_map = {a["name"]: a for a in assets}

              section("筛选 zip 文件")
              zip_assets = [
                  a for a in assets
                  if a["name"].endswith(".zip")
                  and a["name"] not in EXCLUDE_FROM_OFFLINE
                  and not a["name"].startswith(OFFLINE_PART_PREFIX)
                  and not any(a["name"].endswith(s) for s in NEW_SUFFIXES)
              ]
              if not zip_assets:
                  warn("Release 无可用 zip，跳过构建")
                  sys.exit(0)
              info(f"共 {c(C.BOLD, str(len(zip_assets)))} 个 zip:")
              for a in zip_assets:
                  info(f"{c(C.BRIGHT_WHITE, a['name'])}  "
                       f"{c(C.DIM, human_size(a['size']))}", indent=1)

              section("下载 zip 文件")
              work_dir = "/tmp/offline_build"
              os.makedirs(work_dir, exist_ok=True)
              downloaded = []
              for a in zip_assets:
                  fname = a["name"]
                  dst_path = os.path.join(work_dir, fname)
                  info(f"下载: {c(C.BRIGHT_CYAN, fname)}")
                  dl_req = urllib.request.Request(a["browser_download_url"],
                                                   headers=GH_HEADERS)
                  with urllib.request.urlopen(dl_req) as resp:
                      data = resp.read()
                  with open(dst_path, "wb") as f:
                      f.write(data)
                  downloaded.append(dst_path)

              section("生成内层 configure.json")
              now_ts = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
              # schema v2：离线包内层只用 offline_package.version；
              # 客户端的 ResourceFlow.readInnerOfflinePackageVersion()
              # 同时支持嵌套对象和扁平字符串两种形式，这里用嵌套形式与
              # 服务端 configure.json 保持一致。
              inner_path = os.path.join(work_dir, CFG_FILE)
              with open(inner_path, "w", encoding="utf-8") as f:
                  json.dump({"offline_package": {"version": now_ts}}, f, indent=2)
              ok(f"内层 {CFG_FILE} = {c(C.BRIGHT_CYAN, now_ts)}")

              section("打包 offline-package.zip")
              offline_zip = "/tmp/offline-package.zip"
              with zipfile.ZipFile(offline_zip, "w", zipfile.ZIP_DEFLATED) as zf:
                  zf.write(inner_path, arcname=CFG_FILE)
                  ok(f"已写入: {CFG_FILE}", indent=1)
                  for fp in downloaded:
                      zf.write(fp, arcname=os.path.basename(fp))
                      ok(f"已写入: {os.path.basename(fp)}", indent=1)
              offline_size = os.path.getsize(offline_zip)
              ok(f"完成: {human_size(offline_size)}")

              section("MD5")
              with open(offline_zip, "rb") as f:
                  offline_md5 = hashlib.md5(f.read()).hexdigest().lower()
              ok(f"MD5: {c(C.BRIGHT_CYAN, offline_md5)}")

              section("分卷 / 单卷")
              need_split = offline_size > SPLIT_SIZE
              parts_dir = "/tmp/offline_parts"
              os.makedirs(parts_dir, exist_ok=True)
              if need_split:
                  total_parts = math.ceil(offline_size / SPLIT_SIZE)
                  warn(f"超 {human_size(SPLIT_SIZE)}，切 {total_parts} 卷")
                  part_paths = split_file(offline_zip, parts_dir, SPLIT_SIZE)
              else:
                  single = os.path.join(parts_dir, "offline-package.zip.001")
                  shutil.copy2(offline_zip, single)
                  part_paths = [single]
                  ok("单卷模式 (offline-package.zip.001)")

              section("清理旧分卷")
              cur_assets = {a["name"]: a for a in fetch_release().get("assets", [])}
              for name in list(cur_assets):
                  if name.startswith(OFFLINE_PART_PREFIX):
                      delete_asset(cur_assets[name]["id"], name)

              section(f"上传 {len(part_paths)} 个分卷")
              for pp in part_paths:
                  if not upload_asset(release_tag, pp, os.path.basename(pp)):
                      sys.exit(1)

              # ── v2 关键改动：把 offline_package 信息写到 configure.json 的 3 处
              section(f"更新 {CFG_DIR}/{CFG_FILE} 的 offline_package 子块")
              cfg_official = os.path.join(CFG_DIR, CFG_FILE)
              if not os.path.isfile(cfg_official):
                  err(f"权威 {cfg_official} 不存在")
                  sys.exit(1)
              with open(cfg_official, "r", encoding="utf-8") as f:
                  cfg = json.load(f)
              if not isinstance(cfg.get("offline_package"), dict):
                  cfg["offline_package"] = {}
              cfg["offline_package"]["version"] = now_ts
              cfg["offline_package"]["md5"]     = offline_md5
              cfg_text = json.dumps(cfg, indent=2, ensure_ascii=False) + "\n"

              # 写到 /configures/configure.json 和 /configure.json
              for dst in [cfg_official, CFG_FILE]:
                  with open(dst, "w", encoding="utf-8") as f:
                      f.write(cfg_text)
                  ok(f"已写入 {dst}")
              # 上传到 Release
              tmp = f"/tmp/{CFG_FILE}"
              with open(tmp, "w", encoding="utf-8") as f:
                  f.write(cfg_text)
              if not upload_asset(release_tag, tmp, CFG_FILE):
                  sys.exit(1)

              header("offline-package 构建完成")
              ok(f"版本号:     {c(C.BRIGHT_CYAN, now_ts)}")
              ok(f"完整包大小: {c(C.BRIGHT_WHITE, human_size(offline_size))}")
              ok(f"完整包 MD5: {c(C.BRIGHT_CYAN, offline_md5)}")
              ok(f"分卷数量:   {c(C.BRIGHT_WHITE, str(len(part_paths)))}")
              ok(f"已同步到 / + /{CFG_DIR}/ + Release 的 {CFG_FILE}")

          if __name__ == "__main__":
              main()
          SCRIPT_END

      # ───────────────────────────────────────────────────────────────
      # 💾 提交全部配置变更回 git
      #   - _new files (always)
      #   - official version_*.json (when publish_hotfix)
      #   - configure.json updates (when publish_hotfix or offline rebuilt)
      # ───────────────────────────────────────────────────────────────
      - name: 💾 提交配置变更回仓库
        if: always()
        run: |
          set -e

          # 二次安全护栏：在真正 push 之前再确认一次 origin URL
          ORIGIN_URL=$(git remote get-url origin)
          if ! echo "$ORIGIN_URL" | grep -qiE "[/:]${DOWNSTREAM_OWNER}/${DOWNSTREAM_REPO}(\.git)?\$"; then
            echo "::error::push 前 origin 校验失败：$ORIGIN_URL"
            exit 1
          fi

          # 只 stage 我们已知名字的配置文件，绝不 git add -A 任意路径，
          # 避免误把别的临时产物（_artifacts/ / 上游同步进来的资源等）
          # 当成配置变更提交回去。
          git add \
              configure.json \
              version_scenario.json version_scenario_new.json \
              version_js.json       version_js_new.json \
              "${CONFIG_DIR}/configure.json" \
              "${CONFIG_DIR}/version_scenario.json" "${CONFIG_DIR}/version_scenario_new.json" \
              "${CONFIG_DIR}/version_js.json"       "${CONFIG_DIR}/version_js_new.json" \
              2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ 配置文件无变更可提交"
            exit 0
          fi

          # commit 消息描述本次干了什么
          MSG="ci: sync configure.json + version_*.json"
          if [ "${{ steps.check_upstream.outputs.publish_hotfix }}" = "true" ]; then
            MSG="$MSG (hotfix published)"
          fi
          if [ "${{ steps.check_upstream.outputs.build_offline }}" = "true" ] || \
             [ "${{ steps.sync_script.outputs.has_zip_changes }}" = "true" ]; then
            MSG="$MSG (offline-package rebuilt)"
          fi
          # [skip ci] 阻止本 push 触发自身
          MSG="$MSG [skip ci]"

          git commit -m "$MSG"

          # 重试推送（最多 4 次，2 / 4 / 8 / 16 秒退避）
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            if git push origin HEAD:main; then
              echo "✔ push 成功"
              exit 0
            fi
            echo "⚠ push 失败，rebase 后重试..."
            git pull --rebase origin main || true
          done
          echo "::warning::配置文件 commit push 失败 4 次，请手动检查"

      - name: 📊 生成运行摘要
        if: always()
        run: |
          echo "## 🎉 同步任务完成（schema v2）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 上游仓库 | \`${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 下游仓库 | \`${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 配置目录 | \`${{ env.CONFIG_DIR }}/${{ env.CONFIG_FILE }}\` (权威) + \`/${{ env.CONFIG_FILE }}\` + Release |" >> $GITHUB_STEP_SUMMARY
          echo "| 同步状态 | ${{ steps.check_upstream.outputs.should_sync == 'true' && '✅ 已同步新内容' || '⏭️ 无新内容' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 热更新发布 | ${{ steps.check_upstream.outputs.publish_hotfix == 'true' && '✅ _new → official + 同步 configure.json#hotfix' || '⏭️ 仅更新 _new 预览' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK 同步 | ${{ steps.sync_apk.outputs.apk_synced == 'true' && '✅ 已同步新 APK' || '⏭️ 无新 APK' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 离线包构建 | ${{ (steps.sync_script.outputs.has_zip_changes == 'true' || steps.check_upstream.outputs.publish_hotfix == 'true' || steps.check_upstream.outputs.build_offline == 'true') && '✅ 已重建（更新 configure.json#offline_package）' || '⏭️ 未触发' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发事件 | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 时间 | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
