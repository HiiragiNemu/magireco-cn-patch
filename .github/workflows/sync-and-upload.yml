name: 🔄 同步上游并上传到 object-storage

# ╔════════════════════════════════════════════════════════════════════╗
# ║   v3 —— 移除 configure.json / 离线包；单 object-storage 桶；                    ║
# ║   edge + 阿里云 ESA + CDN 三 CDN 刷新；                   ║
# ║   object-storage 过时文件需手动确认清理                                         ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║                                                                    ║
# ║ 热更新流程                                                          ║
# ║ ───────                                                            ║
# ║   1. 每次 sync：                                                   ║
# ║        ▸ 重新生成 cn_*_update_new.zip                              ║
# ║        ▸ 写 version_*_new.json（version+1, size, md5）             ║
# ║        ▸ 同步到 /、/configures/、Release 三处                      ║
# ║        ▸ 提交 _new 文件到 git，official 文件不动                    ║
# ║                                                                    ║
# ║   2. 手动勾选 publish_hotfix=true 时：                              ║
# ║        ▸ 把 *_new 文件去掉 _new 后缀覆盖正式文件                     ║
# ║          （Release + /configures/；根目录不放 official version）    ║
# ║        ▸ 转正方式：先在本地把文件复制成最终文件名再上传。           ║
# ║          不要用 `gh release upload <tag> <file>#<name>` —— `#`     ║
# ║          后面只是"显示标签（label）"，asset 真实 name 仍是本地      ║
# ║          文件名，下载 URL 也按 name 走，于是出现"网页端显示正式     ║
# ║          名、点击却下载 _new 文件"的虚空链接 bug                    ║
# ║        ▸ 转正后删除 Release 上对应的 _new 预览 asset，              ║
# ║          避免网页端同时显示带 _new 和不带 _new 两个条目             ║
# ║                                                                    ║
# ║ object-storage 同步                                                            ║
# ║ ───────                                                            ║
# ║   ▸ 黑名单：history-data*（前缀）与 *.apk（后缀）不同步          ║
# ║   ▸ GitHub 上已不存在的文件【不主动删除】，先记入                   ║
# ║       PENDING_DELETIONS 仓库变量并打印警告；手动以                  ║
# ║       confirm_cleanup=true 运行时才真正删除                         ║
# ║                                                                    ║
# ║ CDN 刷新                                                           ║
# ║ ───────                                                            ║
# ║   ▸ 每上传一个文件，刷新 edge（R2_DOMAIN，腾讯云 TEO）、         ║
# ║     阿里云 ESA（ESA_DOMAIN，PurgeCaches Type=file）与               ║
# ║     CDN（R2_DOMAIN，Purge Cache by URL）                     ║
# ║                                                                    ║
# ║ 本仓库快照 Release                                                  ║
# ║ ───────                                                            ║
# ║   ▸ 每次运行把上游最新 Release 的【全部】asset 镜像到本仓库：       ║
# ║       1. YYYYmmdd-HHMMSS（UTC）命名的 Release —— 历史快照          ║
# ║       2. 名为 latest 的 Release —— 滚动覆盖（先删后建）             ║
# ║                                                                    ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制同步（无视指纹）'
        required: false
        default: 'false'
        type: boolean
      publish_hotfix:
        description: '发布热更新包（将 _new 文件覆盖正式文件）'
        required: false
        default: 'false'
        type: boolean
      confirm_cleanup:
        description: '确认清理 object-storage 上 GitHub 已不存在的文件（默认只记录不删除）'
        required: false
        default: 'false'
        type: boolean
  repository_dispatch:
    types: [upstream-update]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-and-upload:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      : ${{ secrets. }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_REGION: ${{ secrets.R2_REGION }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_DOMAIN: ${{ secrets.R2_DOMAIN }}
      QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
      QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
      EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      ESA_SITE_ID: ${{ secrets.ESA_SITE_ID }}
      ESA_DOMAIN: ${{ secrets.ESA_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      UPSTREAM_OWNER: "HiiragiNemu"
      UPSTREAM_REPO: "patch-front"
      DOWNSTREAM_OWNER: "MagirecoCN-Revival-Project"
      DOWNSTREAM_REPO: "patch-front"
      CONFIG_DIR: "configures"

    steps:
      - name: 🛡 安全护栏（校验所有可写仓库都在白名单中）
        # 这是本 workflow 的"硬刹车"。下面列出的三组 owner/repo 是
        # **唯一**允许被本 workflow 读/写/删的仓库——任何一项与白名单
        # 不一致就 fail-fast，绝不向陌生仓库发请求。要新增允许的仓库
        # 请直接改这份白名单，不要绕过它。
        run: |
          python3 <<'SCRIPT_END'
          import os, sys
          ALLOW_UPSTREAM   = {"HiiragiNemu/patch-front"}
          ALLOW_DOWNSTREAM = {"MagirecoCN-Revival-Project/patch-front"}

          upstream   = f"{os.environ['UPSTREAM_OWNER']}/{os.environ['UPSTREAM_REPO']}"
          downstream = f"{os.environ['DOWNSTREAM_OWNER']}/{os.environ['DOWNSTREAM_REPO']}"

          failed = False
          if upstream not in ALLOW_UPSTREAM:
              print(f"::error::上游仓库 {upstream} 不在白名单中")
              print(f"::error::允许: {sorted(ALLOW_UPSTREAM)}")
              failed = True
          if downstream not in ALLOW_DOWNSTREAM:
              print(f"::error::下游仓库 {downstream} 不在白名单中")
              print(f"::error::允许: {sorted(ALLOW_DOWNSTREAM)}")
              failed = True
          if failed:
              print("::error::出于安全考虑，本 workflow 只允许操作上述指定仓库；")
              print("::error::请检查 env / secrets / .github/workflows/syncandupload.yml")
              sys.exit(1)

          print(f"✔ 上游 OK:   {upstream}")
          print(f"✔ 下游 OK:   {downstream}")
          SCRIPT_END

      - name: 📦 检出下游仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets. }}
          repository: ${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}
          # 需要完整历史：detect 步骤要 diff「上次同步点 → 最新」的整个
          # 区间，浅克隆拿不到旧提交
          fetch-depth: 0

      - name: 🛡 安全护栏（校验 origin 指向预期下游仓库）
        # checkout 完后立刻校验本地 git 的 origin URL，确认我们真的
        # 是在操作预期的下游仓库——后续所有 git push 都会推到 origin，
        # 这一步保证那个 origin 不是别的仓库。
        run: |
          ORIGIN_URL=$(git remote get-url origin)
          EXPECTED="${DOWNSTREAM_OWNER}/${DOWNSTREAM_REPO}"
          echo "origin URL : $ORIGIN_URL"
          echo "expected   : $EXPECTED"
          if ! echo "$ORIGIN_URL" | grep -qiE "[/:]${DOWNSTREAM_OWNER}/${DOWNSTREAM_REPO}(\.git)?\$"; then
            echo "::error::origin URL 不匹配预期下游仓库，拒绝继续"
            exit 1
          fi
          echo "✔ origin 校验通过"

      - name: 🔧 配置 Git
        run: |
          git config user.name "MagiaCN AutoBot"
          git config user.email "bot@magiacn.com"
          git config rebase.autoStash true

      - name: 🔍 检查上游内容更新
        id: check_upstream
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(color, text): return f"{color}{text}{C.RESET}"
          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(text): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)
          def info(t, indent=0):  print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, indent=0):    print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, indent=0):  print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, indent=0):   print(f"{'  '*indent}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, indent=0):  print(f"{'  '*indent}{c(C.DIM, '⏭  ' + t)}", flush=True)

          def set_output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{key}={value}\n")

          UPSTREAM_OWNER  = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO   = os.environ["UPSTREAM_REPO"]
          FORCE_SYNC      = os.environ.get("INPUT_FORCE_SYNC", "false")
          PUBLISH_HOTFIX  = os.environ.get("INPUT_PUBLISH_HOTFIX", "false")
          CONFIRM_CLEANUP = os.environ.get("INPUT_CONFIRM_CLEANUP", "false")

          header("检查上游内容更新")

          section("获取上游 commit SHA")
          info(f"上游仓库: {c(C.BRIGHT_WHITE, f'{UPSTREAM_OWNER}/{UPSTREAM_REPO}')}")

          result = subprocess.run(
              ["gh", "api",
               f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/branches/main",
               "--jq", ".commit.sha"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              err(f"获取上游 SHA 失败: {result.stderr.strip()}")
              sys.exit(1)

          upstream_sha  = result.stdout.strip()
          last_sync_sha = os.environ.get("LAST_SYNC_COMMIT_SHA", "0")

          info(f"上游最新 SHA: {c(C.BRIGHT_CYAN, upstream_sha[:7])}")
          info(f"上次同步 SHA: {c(C.DIM, last_sync_sha[:7] if last_sync_sha != '0' else 'N/A')}")

          section("判断是否需要同步")
          if FORCE_SYNC == "true":
              warn("强制同步模式，跳过 SHA 比对")
              should_sync = True
          elif upstream_sha != last_sync_sha:
              ok("检测到新内容，需要同步")
              should_sync = True
          else:
              skip("SHA 一致，无新内容")
              should_sync = False

          section("判断是否发布热更新包")
          if PUBLISH_HOTFIX == "true":
              ok("发布热更新包模式已开启 —— _new → official")
          else:
              skip("不发布热更新包（_new 文件仍会更新供预览）")

          section("判断是否确认清理 object-storage 过时文件")
          if CONFIRM_CLEANUP == "true":
              warn("确认清理模式：PENDING_DELETIONS 及本次检测到的 object-storage 过时文件将被真正删除")
          else:
              skip("不清理 object-storage 过时文件（仅记录到 PENDING_DELETIONS）")

          set_output("should_sync", "true" if should_sync else "false")
          set_output("commit_sha", upstream_sha)
          set_output("publish_hotfix", PUBLISH_HOTFIX)
          set_output("confirm_cleanup", CONFIRM_CLEANUP)
          SCRIPT_END
        env:
          INPUT_FORCE_SYNC: ${{ inputs.force_sync }}
          INPUT_PUBLISH_HOTFIX: ${{ inputs.publish_hotfix }}
          INPUT_CONFIRM_CLEANUP: ${{ inputs.confirm_cleanup }}

      - name: 🔄 同步上游 Fork
        if: steps.check_upstream.outputs.should_sync == 'true'
        run: |
          gh repo sync "${DOWNSTREAM_OWNER}/${DOWNSTREAM_REPO}" \
              --source "${UPSTREAM_OWNER}/${UPSTREAM_REPO}" \
              --branch main --force
          # 记录同步前的下游 HEAD——detect 步骤以它为起点 diff，
          # 这样上游一次推多个 commit 也能全部纳入变动范围
          echo "PRE_SYNC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # 重新拉取，让本地 workspace 含上游最新内容
          git fetch origin main
          git reset --hard origin/main

      - name: 📝 更新 Commit SHA
        if: steps.check_upstream.outputs.should_sync == 'true'
        run: |
          gh variable set LAST_SYNC_COMMIT_SHA --body "${{ steps.check_upstream.outputs.commit_sha }}"

      - name: 🔍 检测变动范围
        id: detect
        run: |
          # 对比「同步前的下游 HEAD → 同步后的最新 HEAD」整个区间，
          # 而不是只看最后一个 commit——否则上游一次推多个 commit 时，
          # 只有 HEAD 那个 commit 的文件会被检测到，其余全部漏掉。
          # PRE_SYNC_SHA 为空说明本次没有同步（无新内容），变动为空。
          if [ -n "$PRE_SYNC_SHA" ]; then
            CHANGED=$(git diff --name-only "$PRE_SYNC_SHA" HEAD 2>/dev/null || echo "ALL")
          else
            CHANGED=""
          fi
          echo "变动文件:"; echo "$CHANGED"

          HAS_SCENARIO=0
          HAS_JS=0

          echo "$CHANGED" | grep -qE '^madomagi/resource/scenario/json/' && HAS_SCENARIO=1 || true
          echo "$CHANGED" | grep -qE '^magica/' && HAS_JS=1 || true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HAS_SCENARIO=1
            HAS_JS=1
          fi

          echo "has_scenario=$HAS_SCENARIO" >> $GITHUB_OUTPUT
          echo "has_js=$HAS_JS" >> $GITHUB_OUTPUT
          mkdir -p _artifacts

      # ───────────────────────────────────────────────────────────────
      # [JS] 打包 cn_js_update_new.zip
      #   ▸ baseline 直接取 /configures/version_js.json#version
      #     （script 内自取，并与已有 _new 取 max，无需外部输入）
      #   ▸ 产物：version_js_new.json 写到 /, /configures/, _artifacts/
      #   ▸ 产物：cn_js_update_new.zip 写到 /, _artifacts/
      # ───────────────────────────────────────────────────────────────
      - name: "[JS] 打包 cn_js_update_new.zip"
        if: steps.detect.outputs.has_js == '1'
        run: |
          pip3 install requests 2>/dev/null || true
          python3 Build_JS_Injector.py

          zip -r cn_js_update_new.zip magica/

          python3 - <<'PYEOF'
          import json, hashlib, os, shutil

          CFG_DIR  = os.environ["CONFIG_DIR"]
          ZIP_NEW  = "cn_js_update_new.zip"
          NAME     = "version_js"            # base name, 没有 _new / .json

          # 权威官方文件——/configures/version_js.json
          official_path = os.path.join(CFG_DIR, f"{NAME}.json")
          # 三处 _new 输出路径
          out_paths = [
              f"{NAME}_new.json",                      # 仓库根目录
              os.path.join(CFG_DIR, f"{NAME}_new.json"),  # /configures/
              os.path.join("_artifacts", f"{NAME}_new.json"),  # 上传 Release 用
          ]

          # version 计数：以 /configures/version_js.json 当前的 version 作为
          # baseline，bump 后写入 _new 文件。也兼容 _new 已经存在的场景：
          # 如果 _new.version > baseline，沿用 _new（避免覆盖）
          base = 0
          if os.path.exists(official_path):
              try:
                  with open(official_path, "r") as f:
                      official = json.load(f)
                  base = max(base, int(official.get("version", 0) or 0))
              except Exception:
                  pass
          existing_new = out_paths[1] if os.path.exists(out_paths[1]) else (
              out_paths[0] if os.path.exists(out_paths[0]) else None
          )
          if existing_new:
              try:
                  with open(existing_new, "r") as f:
                      ex = json.load(f)
                  base = max(base, int(ex.get("version", 0) or 0))
              except Exception:
                  pass

          with open(ZIP_NEW, "rb") as f:
              zip_data = f.read()
          data = {
              "version": base + 1,
              "size":    len(zip_data),
              "md5":     hashlib.md5(zip_data).hexdigest().lower(),
          }
          os.makedirs("_artifacts", exist_ok=True)
          os.makedirs(CFG_DIR, exist_ok=True)
          for p in out_paths:
              with open(p, "w") as f:
                  json.dump(data, f, indent=2)
              print(f"✅ 写入 {p}: v{data['version']}, size={data['size']}, md5={data['md5']}")

          # 把 zip 也复制到 _artifacts 供后续上传 Release
          shutil.copy2(ZIP_NEW, os.path.join("_artifacts", ZIP_NEW))
          PYEOF

      # ───────────────────────────────────────────────────────────────
      # [SCENARIO] 同上
      # ───────────────────────────────────────────────────────────────
      - name: "[SCENARIO] 打包 cn_scenario_update_new.zip"
        if: steps.detect.outputs.has_scenario == '1'
        run: |
          mkdir -p _pack_scn/madomagi/resource/scenario/json
          cp -r madomagi/resource/scenario/json/. _pack_scn/madomagi/resource/scenario/json/
          cd _pack_scn && zip -r ../cn_scenario_update_new.zip madomagi/ && cd ..

          python3 - <<'PYEOF'
          import json, hashlib, os, shutil

          CFG_DIR  = os.environ["CONFIG_DIR"]
          ZIP_NEW  = "cn_scenario_update_new.zip"
          NAME     = "version_scenario"

          official_path = os.path.join(CFG_DIR, f"{NAME}.json")
          out_paths = [
              f"{NAME}_new.json",
              os.path.join(CFG_DIR, f"{NAME}_new.json"),
              os.path.join("_artifacts", f"{NAME}_new.json"),
          ]

          base = 0
          if os.path.exists(official_path):
              try:
                  with open(official_path, "r") as f:
                      official = json.load(f)
                  base = max(base, int(official.get("version", 0) or 0))
              except Exception:
                  pass
          existing_new = out_paths[1] if os.path.exists(out_paths[1]) else (
              out_paths[0] if os.path.exists(out_paths[0]) else None
          )
          if existing_new:
              try:
                  with open(existing_new, "r") as f:
                      ex = json.load(f)
                  base = max(base, int(ex.get("version", 0) or 0))
              except Exception:
                  pass

          with open(ZIP_NEW, "rb") as f:
              zip_data = f.read()
          data = {
              "version": base + 1,
              "size":    len(zip_data),
              "md5":     hashlib.md5(zip_data).hexdigest().lower(),
          }
          os.makedirs("_artifacts", exist_ok=True)
          os.makedirs(CFG_DIR, exist_ok=True)
          for p in out_paths:
              with open(p, "w") as f:
                  json.dump(data, f, indent=2)
              print(f"✅ 写入 {p}: v{data['version']}, size={data['size']}, md5={data['md5']}")

          shutil.copy2(ZIP_NEW, os.path.join("_artifacts", ZIP_NEW))
          PYEOF

      # ───────────────────────────────────────────────────────────────
      # 🚀 上传 _new + (publish_hotfix=true 时) 转正
      #   v3 修复"虚空链接"bug：
      #     旧实现用 `gh release upload <tag> <本地_new文件>#<正式名>` 转正，
      #     但 `#` 后缀只是显示标签（label），asset 的真实 name 仍是
      #     *_new.*——下载 URL 按 name 走，于是网页端显示正式名、点击却
      #     跳到 _new 下载链接；手机端只显示 name（带 _new）。
      #     现在：本地复制成正式文件名再上传，并在转正后删除 _new 预览 asset。
      # ───────────────────────────────────────────────────────────────
      - name: 🚀 上传热更新包到上游 Release
        id: hotfix_publish
        if: steps.detect.outputs.has_js == '1' || steps.detect.outputs.has_scenario == '1'
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os
          import json
          import shutil
          import urllib.request

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, indent=0): print(f"{'  '*indent}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, indent=0): print(f"{'  '*indent}{c(C.DIM, '⏭  ' + t)}", flush=True)

          UPSTREAM_OWNER = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO  = os.environ["UPSTREAM_REPO"]
          PUBLISH        = os.environ.get("PUBLISH_HOTFIX", "false") == "true"
          ARTIFACTS_DIR  = "_artifacts"
          CFG_DIR        = os.environ["CONFIG_DIR"]

          # _new → official 名字映射
          NEW_TO_FINAL = {
              "cn_js_update_new.zip":       "cn_js_update.zip",
              "version_js_new.json":        "version_js.json",
              "cn_scenario_update_new.zip": "cn_scenario_update.zip",
              "version_scenario_new.json":  "version_scenario.json",
          }

          def fetch_assets():
              r = subprocess.run(
                  ["gh", "api", f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/releases/latest"],
                  capture_output=True, text=True
              )
              if r.returncode != 0 or not r.stdout.strip():
                  return None, None
              rel = json.loads(r.stdout)
              return rel, {a["name"]: a for a in rel.get("assets", [])}

          def delete_asset(asset_id, name):
              r = subprocess.run(
                  ["gh", "api",
                   f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
                   f"/releases/assets/{asset_id}",
                   "--method", "DELETE"],
                  capture_output=True, text=True
              )
              if r.returncode == 0:
                  ok(f"已删除 asset: {name}", indent=1)
              else:
                  warn(f"删除 [{name}] 失败: {r.stderr.strip()}", indent=1)

          header("上传热更新包到上游 Release")

          # ── 1. 拿当前 Release 信息（id + asset 列表）
          section("获取上游 Release 信息")
          release, existing_assets = fetch_assets()
          if release is None:
              err("获取上游 Release 失败")
              sys.exit(1)
          release_tag = release.get("tag_name", "latest")
          info(f"Release tag: {c(C.BRIGHT_CYAN, release_tag)}  id={release['id']}")

          # ── 2. 上传所有 _artifacts 里的 _new 文件
          section("上传 _new 文件到 Release（预览）")
          if not os.path.isdir(ARTIFACTS_DIR):
              warn("_artifacts 目录不存在，跳过")
          else:
              for fname in os.listdir(ARTIFACTS_DIR):
                  fpath = os.path.join(ARTIFACTS_DIR, fname)
                  if not os.path.isfile(fpath):
                      continue
                  info(f"上传: {c(C.BRIGHT_WHITE, fname)}")
                  if fname in existing_assets:
                      delete_asset(existing_assets[fname]["id"], fname)
                  up = subprocess.run(
                      ["gh", "release", "upload", release_tag, fpath,
                       "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                       "--clobber"],
                      capture_output=True, text=True
                  )
                  if up.returncode == 0:
                      ok(f"上传成功: {fname}", indent=1)
                  else:
                      err(f"上传失败: {up.stderr.strip()}", indent=1)

          # ── 3. 如果没勾发布热更新，到此为止
          if not PUBLISH:
              section("publish_hotfix=false，跳过转正")
              skip("_new 文件已上传到 Release 供预览，official 文件不变")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("hotfix_published=false\n")
              sys.exit(0)

          # ── 4. publish_hotfix=true：把 _new 文件去掉 _new 后缀
          section("发布热更新包（_new → official，覆盖正式文件）")

          # 重新拉 asset 列表，因为上一步刚上传过新文件
          _, assets2 = fetch_assets()
          if assets2 is None:
              err("重新获取 Release 失败")
              sys.exit(1)

          promote_dir = "/tmp/promote"
          os.makedirs(promote_dir, exist_ok=True)

          for new_name, final_name in NEW_TO_FINAL.items():
              src = os.path.join(ARTIFACTS_DIR, new_name)
              if not os.path.isfile(src):
                  skip(f"{new_name} 在本地 _artifacts/ 不存在（本次未生成），跳过")
                  continue
              info(f"{c(C.BRIGHT_YELLOW, new_name)} → {c(C.BRIGHT_GREEN, final_name)}")

              # 4a. 删 Release 上同名 official asset
              if final_name in assets2:
                  delete_asset(assets2[final_name]["id"], final_name)

              # 4b. 本地复制成正式文件名再上传（不用 #label 语法！），
              #     保证 asset 的 name == final_name，下载链接正确
              staged = os.path.join(promote_dir, final_name)
              shutil.copy2(src, staged)
              up = subprocess.run(
                  ["gh", "release", "upload", release_tag, staged,
                   "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                   "--clobber"],
                  capture_output=True, text=True
              )
              if up.returncode != 0:
                  err(f"上传 official 失败: {up.stderr.strip()}", indent=1)
                  continue
              ok(f"已发布 official: {final_name}", indent=1)

              # 4c. 转正后删除 Release 上的 _new 预览 asset——否则网页端会
              #     同时显示带 _new 和不带 _new 两个条目
              if new_name in assets2:
                  delete_asset(assets2[new_name]["id"], new_name)

              # 4d. 把本地 official JSON 同步到 /configures/（仅 .json）
              #     根目录不再放 official version_*.json——baseline 只以
              #     /configures/ 为准，根目录留一份带 size/md5 的副本
              #     容易误导人
              if final_name.endswith(".json"):
                  with open(src, "rb") as f:
                      data = f.read()
                  with open(os.path.join(CFG_DIR, final_name), "wb") as f:
                      f.write(data)
                  ok(f"同步 official → /{CFG_DIR}/", indent=1)

          ok("热更新包发布完成")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("hotfix_published=true\n")
          SCRIPT_END
        env:
          PUBLISH_HOTFIX: ${{ steps.check_upstream.outputs.publish_hotfix }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: pip install boto3 tencentcloud-sdk-python alibabacloud_esa20240910

      # ───────────────────────────────────────────────────────────────
      # 🚀 同步 Release 文件到 object-storage（单桶）
      #   v3 改动：
      #     - 双 S3 桶 → 单 object-storage 桶
      #     - 黑名单：history-data*（前缀）+ *.apk（后缀）
      #     - GitHub 上已不存在的文件不主动删除，先记入
      #       PENDING_DELETIONS 变量；confirm_cleanup=true 时才删除
      #     - CDN 刷新：edge（R2_DOMAIN）+ 阿里云 ESA（ESA_DOMAIN）
      #       + CDN（R2_DOMAIN）
      # ───────────────────────────────────────────────────────────────
      - name: 🚀 运行同步脚本（上传 Release 文件到 object-storage）
        id: sync_script
        run: |
          python3 <<'SCRIPT_END'
          import os
          import sys
          import json
          import subprocess
          import urllib.request
          import urllib.error

          sys.stdout.reconfigure(line_buffering=True)

          import boto3
          from botocore.exceptions import ClientError
          from tencentcloud.common import credential
          from tencentcloud.common.profile.client_profile import ClientProfile
          from tencentcloud.common.profile.http_profile import HttpProfile
          from tencentcloud.teo.v20220901 import teo_client, models
          from alibabacloud_esa20240910.client import Client as EsaClient
          from alibabacloud_esa20240910 import models as esa_models
          from alibabacloud_tea_openapi import models as open_api_models

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, indent=0): print(f"{'  '*indent}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, indent=0): print(f"{'  '*indent}{c(C.DIM, '⏭  ' + t)}", flush=True)
          def human_size(n):
              for u in ["B", "KB", "MB", "GB"]:
                  if n < 1024: return f"{n:.1f} {u}"
                  n /= 1024
              return f"{n:.1f} TB"

          # ══════════════════════════════════════════════════════════════
          # object-storage 上传过滤规则 v3
          # ══════════════════════════════════════════════════════════════
          # history-data*  → 大体积历史数据包，不走 object-storage
          # *.apk             → 客户端安装包，只留在 GitHub Release
          R2_IGNORE_PREFIXES = (
              'history-data',
          )
          R2_IGNORE_SUFFIXES = (
              '.apk',
          )

          def should_ignore_for_r2(name: str) -> bool:
              if any(name.startswith(p) for p in R2_IGNORE_PREFIXES): return True
              if any(name.endswith(s) for s in R2_IGNORE_SUFFIXES): return True
              return False

          class R2Handler:
              def __init__(self, endpoint, access_key, secret_key,
                           region, bucket, domain, name="object-storage"):
                  self.name   = name
                  self.bucket = bucket
                  self.domain = domain
                  ep = endpoint.rstrip('/')
                  self.s3_client = boto3.client(
                      's3', endpoint_url=ep,
                      aws_access_key_id=access_key,
                      aws_secret_access_key=secret_key,
                      region_name=region
                  )
              def list_files(self):
                  try:
                      paginator = self.s3_client.get_paginator('list_objects_v2')
                      files = [obj['Key'] for page in paginator.paginate(Bucket=self.bucket)
                               if 'Contents' in page for obj in page['Contents']]
                      info(f"[{c(C.BRIGHT_WHITE, self.name)}] 列出 {c(C.BOLD, str(len(files)))} 个文件")
                      return files
                  except Exception as e:
                      err(f"[{self.name}] 列出文件失败: {e}")
                      return []
              def delete_file(self, filename):
                  try:
                      self.s3_client.delete_object(Bucket=self.bucket, Key=filename)
                      ok(f"[{c(C.BRIGHT_WHITE, self.name)}] 删除: {filename}", indent=1)
                      return True
                  except ClientError as e:
                      if e.response['Error']['Code'] == '404':
                          skip(f"[{self.name}] {filename} 不存在", indent=1)
                          return True
                      err(f"[{self.name}] 删除失败: {e}", indent=1)
                      return False
                  except Exception as e:
                      err(f"[{self.name}] 删除异常: {e}", indent=1)
                      return False
              def upload_file_from_url(self, url, filename):
                  try:
                      info(f"[{c(C.BRIGHT_WHITE, self.name)}] 流式上传: "
                           f"{c(C.BRIGHT_CYAN, filename)}", indent=1)
                      req = urllib.request.Request(url)
                      with urllib.request.urlopen(req) as response:
                          file_size = int(
                              response.headers.get('Content-Length') or 0)
                          # 真正的流式：upload_fileobj 分块边下边传
                          # （超过 8MiB 自动走 multipart），不再先把整个
                          # 文件读进内存再一次性 put——大文件耗时近减半
                          self.s3_client.upload_fileobj(
                              response, self.bucket, filename)
                      ok(f"[{c(C.BRIGHT_WHITE, self.name)}] 上传完成: "
                         f"{filename} {c(C.DIM, '(' + human_size(file_size) + ')')}",
                         indent=1)
                      return True
                  except Exception as e:
                      err(f"[{self.name}] 上传失败: {e}", indent=1)
                      return False

          class EdgeOneHandler:
              def __init__(self, secret_id, secret_key, zone_id):
                  self.zone_id = zone_id
                  cred         = credential.Credential(secret_id, secret_key)
                  hp           = HttpProfile()
                  hp.endpoint  = "teo.tencentcloudapi.com"
                  cp           = ClientProfile()
                  cp.httpProfile = hp
                  self.client  = teo_client.TeoClient(cred, "", cp)
              def purge_cache(self, domain, filename):
                  try:
                      req        = models.CreatePurgeTaskRequest()
                      target_url = f"http://{domain}/{filename}"
                      req.from_json_string(json.dumps({
                          "ZoneId": self.zone_id,
                          "Type": "purge_url",
                          "Targets": [target_url]
                      }))
                      resp    = self.client.CreatePurgeTask(req)
                      task_id = resp.RequestId
                      ok(f"[edge] 缓存刷新: {c(C.DIM, target_url)}", indent=1)
                      return True, task_id
                  except Exception as e:
                      err(f"[edge] 刷新失败: {e}", indent=1)
                      return False, str(e)

          class EsaHandler:
              """阿里云 ESA 缓存刷新（PurgeCaches, Type=file）"""
              def __init__(self, access_key_id, access_key_secret, site_id, domain):
                  self.site_id = int(site_id)
                  self.domain  = domain
                  cfg = open_api_models.Config(
                      access_key_id=access_key_id,
                      access_key_secret=access_key_secret,
                      endpoint="esa.cn-hangzhou.aliyuncs.com",
                  )
                  self.client = EsaClient(cfg)
              def purge_files(self, urls):
                  try:
                      req = esa_models.PurgeCachesRequest(
                          site_id=self.site_id,
                          type="file",
                          content=esa_models.PurgeCachesRequestContent(files=urls),
                      )
                      resp = self.client.purge_caches(req)
                      task_id = getattr(resp.body, "task_id", None)
                      ok(f"[ESA] 缓存刷新: {c(C.DIM, ', '.join(urls))}"
                         + (f" (TaskId={task_id})" if task_id else ""), indent=1)
                      return True
                  except Exception as e:
                      err(f"[ESA] 刷新失败: {e}", indent=1)
                      return False
              def purge_cache(self, filename):
                  url = f"http://{self.domain}/{filename}" if filename \
                        else f"http://{self.domain}/"
                  return self.purge_files([url])

          class CloudflareHandler:
              """CDN CDN 缓存刷新（Purge Cache by URL）

              认证方式：API Token（Bearer）。按 URL 精确清除，
              与 edge 的 purge_url 对应。
              """
              API_BASE = "https://api.cloudflare.com/client/v4"

              def __init__(self, api_token, zone_id):
                  self.api_token = api_token
                  self.zone_id   = zone_id

              def purge_cache(self, domain, filename):
                  if not self.api_token or not self.zone_id:
                      warn("[CDN] 未配置 CLOUDFLARE_API_TOKEN / "
                           "CLOUDFLARE_ZONE_ID，跳过", indent=1)
                      return False, "not configured"
                  try:
                      target_url = (f"http://{domain}/{filename}" if filename
                                    else f"http://{domain}/")
                      req = urllib.request.Request(
                          f"{self.API_BASE}/zones/{self.zone_id}/purge_cache",
                          data=json.dumps({"files": [target_url]}).encode(),
                          headers={
                              "Authorization": f"Bearer {self.api_token}",
                              "Content-Type": "application/json",
                          },
                          method="POST",
                      )
                      with urllib.request.urlopen(req) as resp:
                          body = json.loads(resp.read().decode())
                      if not body.get("success"):
                          raise Exception(body.get("errors"))
                      ok(f"[CDN] 缓存刷新: {c(C.DIM, target_url)}",
                         indent=1)
                      return True, target_url
                  except Exception as e:
                      err(f"[CDN] 刷新失败: {e}", indent=1)
                      return False, str(e)

          def get_variable(name):
              r = subprocess.run(['gh', 'variable', 'get', name],
                                 capture_output=True, text=True)
              return r.stdout.strip() if r.returncode == 0 else ""

          def set_variable(name, body):
              subprocess.run(['gh', 'variable', 'set', name, '--body', body],
                             capture_output=True, text=True)

          def main():
              CONFIRM_CLEANUP = os.environ.get("CONFIRM_CLEANUP", "false") == "true"

              header("初始化")
              r2 = R2Handler(
                  os.environ['R2_ENDPOINT'], os.environ['R2_ACCESS_KEY'],
                  os.environ['R2_SECRET_KEY'], os.environ['R2_REGION'],
                  os.environ['R2_BUCKET'],    os.environ['R2_DOMAIN'], "object-storage"
              )
              edge = EdgeOneHandler(
                  os.environ['QCLOUD_SECRET_ID'],
                  os.environ['QCLOUD_SECRET_KEY'],
                  os.environ['EDGEONE_ZONE_ID']
              )
              esa = EsaHandler(
                  os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],
                  os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],
                  os.environ['ESA_SITE_ID'],
                  os.environ['ESA_DOMAIN']
              )
              cloudflare = CloudflareHandler(
                  os.environ.get('CLOUDFLARE_API_TOKEN', ''),
                  os.environ.get('CLOUDFLARE_ZONE_ID', '')
              )
              ok("object-storage + edge + 阿里云 ESA + CDN 已初始化")

              owner = os.environ.get('UPSTREAM_OWNER', 'HiiragiNemu')
              repo  = os.environ.get('UPSTREAM_REPO',  'patch-front')

              GH_HEADERS = {
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if os.environ.get(''):
                  GH_HEADERS['Authorization'] = f"Bearer {os.environ['']}"

              header(f"获取 {owner}/{repo} 最新 Release")
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{owner}/{repo}/releases/latest",
                      headers=GH_HEADERS
                  )
                  with urllib.request.urlopen(req) as resp:
                      release = json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      warn("上游仓库无 Release，跳过")
                      return
                  raise

              info(f"Release: {c(C.BRIGHT_WHITE, release.get('name') or release.get('tag_name'))}")
              current_map = {
                  a['name']: a.get('digest', '')
                  for a in release.get('assets', [])
                  if not should_ignore_for_r2(a['name'])
              }
              info(f"包含 {c(C.BOLD, str(len(current_map)))} 个待同步 asset")

              header("比对文件指纹")
              old_raw = get_variable('LAST_SYNC_FINGERPRINTS')
              old_map = {}
              if old_raw:
                  try:
                      old_map = json.loads(old_raw)
                      info(f"历史指纹: {c(C.BOLD, str(len(old_map)))} 个文件")
                  except Exception:
                      warn("历史指纹解析失败，视为首次同步")

              to_process, unchanged, deleted = [], [], []
              for fname, sha in current_map.items():
                  if fname not in old_map:
                      info(f"{c(C.BRIGHT_YELLOW, fname)} → 新文件")
                      to_process.append(fname)
                  elif sha and old_map[fname] != sha:
                      info(f"{c(C.BRIGHT_YELLOW, fname)} → 已更新")
                      to_process.append(fname)
                  elif not sha:
                      to_process.append(fname)
                  else:
                      unchanged.append(fname)
              for fname in old_map:
                  if fname not in current_map:
                      deleted.append(fname)

              # ════════════════════════════════════════════════════════
              # 过时文件处理（v3：不主动删除，需手动确认）
              #   object-storage 上存在、但 GitHub Release 已不存在的文件 → 记入
              #   PENDING_DELETIONS 变量；只有 confirm_cleanup=true
              #   手动运行时才真正删除。
              # ════════════════════════════════════════════════════════
              header("检查 object-storage 过时文件（GitHub 已不存在）")
              r2_files = r2.list_files()
              stale_now = sorted({
                  f for f in r2_files
                  if not should_ignore_for_r2(f) and f not in current_map
              })

              prev_pending = []
              pend_raw = get_variable('PENDING_DELETIONS')
              if pend_raw:
                  try:
                      prev_pending = json.loads(pend_raw)
                      if not isinstance(prev_pending, list):
                          prev_pending = []
                  except Exception:
                      warn("PENDING_DELETIONS 解析失败，按空列表处理")
              stale_all = sorted(set(stale_now) | set(prev_pending))

              if not stale_all:
                  ok("无过时文件")
                  if CONFIRM_CLEANUP:
                      info("confirm_cleanup=true，但没有待清理文件")
              elif not CONFIRM_CLEANUP:
                  warn(f"检测到 {c(C.BOLD, str(len(stale_all)))} 个 GitHub 上已不存在的文件，"
                       "按规则【不主动删除】：")
                  for fname in stale_all:
                      warn(f"待清理: {fname}", indent=1)
                  warn("确认无误后，请手动运行本 workflow 并勾选 "
                       "confirm_cleanup=true 执行删除")
                  set_variable('PENDING_DELETIONS',
                               json.dumps(stale_all, ensure_ascii=False))
                  ok("待清理列表已写入 PENDING_DELETIONS 仓库变量")
              else:
                  header(f"确认清理：删除 {len(stale_all)} 个 object-storage 过时文件")
                  for fname in stale_all:
                      if r2.delete_file(fname):
                          # 删完顺手刷掉三个 CDN 上的残留缓存
                          edge.purge_cache(r2.domain, fname)
                          esa.purge_cache(fname)
                          cloudflare.purge_cache(r2.domain, fname)
                  set_variable('PENDING_DELETIONS', '[]')
                  ok("PENDING_DELETIONS 已清空")

              if not to_process:
                  header("无新增/更新文件")
                  return

              header(f"上传 {len(to_process)} 个文件")
              processed = []
              for fname in to_process:
                  url = next(a['browser_download_url']
                             for a in release['assets'] if a['name'] == fname)
                  if r2.upload_file_from_url(url, fname):
                      edge.purge_cache(r2.domain, fname)
                      esa.purge_cache(fname)
                      cloudflare.purge_cache(r2.domain, fname)
                      processed.append(fname)
                  else:
                      err(f"上传失败: {fname}")

              if processed:
                  header("刷新根目录 CDN 缓存")
                  edge.purge_cache(r2.domain, "")
                  esa.purge_cache("")
                  cloudflare.purge_cache(r2.domain, "")

              header("保存指纹")
              final_map = old_map.copy()
              for fname in unchanged: final_map[fname] = old_map[fname]
              for fname in to_process: final_map[fname] = current_map[fname]
              for fname in deleted: final_map.pop(fname, None)
              subprocess.run(
                  ['gh', 'variable', 'set', 'LAST_SYNC_FINGERPRINTS',
                   '--body', json.dumps(final_map)],
                  check=True
              )
              ok(f"指纹已保存（{c(C.BOLD, str(len(final_map)))} 个）")

          if __name__ == "__main__":
              try:
                  main()
              except Exception as e:
                  err(f"脚本失败: {e}")
                  import traceback; traceback.print_exc()
                  sys.exit(1)
          SCRIPT_END
        env:
          CONFIRM_CLEANUP: ${{ steps.check_upstream.outputs.confirm_cleanup }}

      # ───────────────────────────────────────────────────────────────
      # 🏷 创建/覆盖本仓库快照 Release（v3 新增）
      #   ▸ 先与下游 latest Release 做 diff（digest/size 比对），
      #     无差异直接跳过——全量镜像很耗时，上游没变就不重跑
      #   ▸ 有差异才把上游最新 Release 的【全部】asset（无黑名单）
      #     镜像到本仓库：
      #       1. 以 UTC 日期时间命名的 Release（YYYYmmdd-HHMMSS，历史快照，
      #          每次有差异时新建一个）
      #       2. 叫 latest 的 Release（滚动最新，先删后建实现"覆盖"）
      #   ▸ 注意：GitHub 单个 asset 上限 2GiB，超限文件跳过并告警
      # ───────────────────────────────────────────────────────────────
      - name: 🏷 创建/覆盖本仓库快照 Release
        id: mirror_release
        if: always()
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os
          import json
          import shutil
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, indent=0): print(f"{'  '*indent}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, indent=0): print(f"{'  '*indent}{c(C.DIM, '⏭  ' + t)}", flush=True)
          def human_size(n):
              for u in ["B", "KB", "MB", "GB"]:
                  if n < 1024: return f"{n:.1f} {u}"
                  n /= 1024
              return f"{n:.1f} TB"
          def set_output(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{k}={v}\n")

          UPSTREAM_OWNER = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO  = os.environ["UPSTREAM_REPO"]
                 = os.environ.get("", "")
          # 本仓库 = workflow 所在仓库（即下游仓库）
          MIRROR_REPO    = os.environ.get("GITHUB_REPOSITORY") or \
                           f"{os.environ['DOWNSTREAM_OWNER']}/{os.environ['DOWNSTREAM_REPO']}"

          # GitHub 单个 Release asset 上限 2GiB
          MAX_ASSET = 2 * 1024**3

          GH_HEADERS = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if :
              GH_HEADERS["Authorization"] = f"Bearer {}"

          def run(args):
              return subprocess.run(args, capture_output=True, text=True)

          def recreate_release(tag, title, notes, files):
              """先删后建，实现"覆盖"语义；再把 files 全部传上去"""
              section(f"重建 Release: {c(C.BRIGHT_CYAN, tag)}")
              view = run(["gh", "release", "view", tag, "--repo", MIRROR_REPO])
              if view.returncode == 0:
                  dl = run(["gh", "release", "delete", tag,
                            "--repo", MIRROR_REPO, "--yes", "--cleanup-tag"])
                  if dl.returncode == 0:
                      ok(f"已删除旧 Release（含 tag）: {tag}", indent=1)
                  else:
                      warn(f"删除旧 Release 失败: {dl.stderr.strip()}", indent=1)

              cr = run(["gh", "release", "create", tag,
                        "--repo", MIRROR_REPO,
                        "--title", title, "--notes", notes])
              if cr.returncode != 0:
                  err(f"创建 Release [{tag}] 失败: {cr.stderr.strip()}", indent=1)
                  return False
              ok(f"已创建 Release: {tag}", indent=1)

              uploaded = 0
              for p in files:
                  up = run(["gh", "release", "upload", tag, p,
                            "--repo", MIRROR_REPO, "--clobber"])
                  if up.returncode == 0:
                      ok(f"已上传: {os.path.basename(p)}", indent=2)
                      uploaded += 1
                  else:
                      err(f"上传失败 [{os.path.basename(p)}]: "
                          f"{up.stderr.strip()}", indent=2)
              ok(f"Release [{tag}] 共上传 {uploaded}/{len(files)} 个文件", indent=1)
              return uploaded == len(files)

          def main():
              header("镜像上游 Release 全部文件到本仓库")
              info(f"来源: {c(C.BRIGHT_WHITE, f'{UPSTREAM_OWNER}/{UPSTREAM_REPO}')}")
              info(f"目标: {c(C.BRIGHT_WHITE, MIRROR_REPO)}")

              section("获取上游最新 Release")
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
                      "/releases/latest",
                      headers=GH_HEADERS
                  )
                  with urllib.request.urlopen(req) as resp:
                      release = json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      warn("上游仓库无 Release，跳过镜像")
                      set_output("snapshot_tag", "")
                      set_output("mirrored", "false")
                      return
                  raise

              upstream_tag = release.get("tag_name", "")
              assets = release.get("assets", [])
              info(f"上游 Release: {c(C.BRIGHT_CYAN, upstream_tag)}"
                   f"（{c(C.BOLD, str(len(assets)))} 个 asset）")
              if not assets:
                  warn("上游 Release 无任何 asset，跳过镜像")
                  set_output("snapshot_tag", "")
                  set_output("mirrored", "false")
                  return

              # ── 先 diff：与下游 latest Release 比对，无差异直接跳过 ──
              #   全量镜像（下载+重建两个 Release）非常耗时，上游 Release
              #   没变时没必要每次重跑。digest 两边都有就比 digest，
              #   否则退化为比 size。
              section("与下游 latest Release 比对（无差异则跳过）")
              upstream_map = {
                  a["name"]: (a.get("digest") or "", a.get("size", 0))
                  for a in assets if a.get("size", 0) <= MAX_ASSET
              }

              downstream_map = {}
              r = run(["gh", "api",
                       f"repos/{MIRROR_REPO}/releases/tags/latest",
                       "--jq",
                       '.assets[] | .name + "\t" + (.digest // "")'
                       ' + "\t" + (.size | tostring)'])
              if r.returncode == 0 and r.stdout.strip():
                  for line in r.stdout.strip().splitlines():
                      parts = line.split("\t")
                      if len(parts) == 3:
                          downstream_map[parts[0]] = (parts[1], int(parts[2]))
              if not downstream_map:
                  info("下游尚无 latest Release（或无 asset），视为全量差异")

              def asset_changed(up, dn):
                  u_digest, u_size = up
                  d_digest, d_size = dn
                  if u_digest and d_digest:
                      return u_digest != d_digest
                  return u_size != d_size

              if set(upstream_map) == set(downstream_map) and all(
                  not asset_changed(upstream_map[n], downstream_map[n])
                  for n in upstream_map
              ):
                  ok("上游 Release 与下游 latest 完全一致，跳过镜像")
                  set_output("snapshot_tag", "")
                  set_output("mirrored", "false")
                  return

              for name in sorted(set(upstream_map) | set(downstream_map)):
                  if name not in downstream_map:
                      info(f"新增: {c(C.BRIGHT_YELLOW, name)}", indent=1)
                  elif name not in upstream_map:
                      info(f"移除: {c(C.BRIGHT_YELLOW, name)}", indent=1)
                  elif asset_changed(upstream_map[name], downstream_map[name]):
                      info(f"更新: {c(C.BRIGHT_YELLOW, name)}", indent=1)

              section("下载全部 asset")
              work_dir = "/tmp/release_mirror"
              os.makedirs(work_dir, exist_ok=True)
              downloaded = []
              for a in assets:
                  fname = a["name"]
                  size  = a.get("size", 0)
                  if size > MAX_ASSET:
                      warn(f"{fname}（{human_size(size)}）超过 2GiB 上限，跳过",
                           indent=1)
                      continue
                  dst = os.path.join(work_dir, fname)
                  info(f"下载: {c(C.BRIGHT_CYAN, fname)}  "
                       f"{c(C.DIM, human_size(size))}", indent=1)
                  try:
                      dl_req = urllib.request.Request(
                          a["browser_download_url"], headers=GH_HEADERS)
                      # 分块流式写盘，不把整个文件读进内存
                      with urllib.request.urlopen(dl_req) as resp, \
                           open(dst, "wb") as f:
                          shutil.copyfileobj(resp, f, 1024 * 1024)
                      downloaded.append(dst)
                  except Exception as e:
                      err(f"下载失败 [{fname}]: {e}", indent=1)

              if not downloaded:
                  err("没有可镜像的文件，终止")
                  set_output("snapshot_tag", "")
                  set_output("mirrored", "false")
                  sys.exit(1)

              ts = datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S")
              notes = (f"上游 {UPSTREAM_OWNER}/{UPSTREAM_REPO} Release "
                       f"`{upstream_tag}` 全量镜像（{ts} UTC，由 workflow 自动生成）")

              # 1. 日期时间命名的历史快照（每次新建）
              recreate_release(ts, ts, notes, downloaded)
              # 2. 滚动 latest（先删后建，覆盖）
              recreate_release("latest", "latest", notes, downloaded)

              header("镜像完成")
              ok(f"快照 Release: {c(C.BRIGHT_CYAN, ts)}")
              ok(f"滚动 Release: {c(C.BRIGHT_CYAN, 'latest')}")
              set_output("snapshot_tag", ts)
              set_output("mirrored", "true")

          if __name__ == "__main__":
              main()
          SCRIPT_END

      # ───────────────────────────────────────────────────────────────
      # 💾 提交全部配置变更回 git
      #   - _new files (always)
      #   - official version_*.json (when publish_hotfix)
      # ───────────────────────────────────────────────────────────────
      - name: 💾 提交配置变更回仓库
        if: always()
        run: |
          set -e

          # 二次安全护栏：在真正 push 之前再确认一次 origin URL
          ORIGIN_URL=$(git remote get-url origin)
          if ! echo "$ORIGIN_URL" | grep -qiE "[/:]${DOWNSTREAM_OWNER}/${DOWNSTREAM_REPO}(\.git)?\$"; then
            echo "::error::push 前 origin 校验失败：$ORIGIN_URL"
            exit 1
          fi

          # 只 stage 我们已知名字的配置文件，绝不 git add -A 任意路径，
          # 避免误把别的临时产物（_artifacts/ / 上游同步进来的资源等）
          # 当成配置变更提交回去。
          # 注意：official version_*.json 只在 /configures/ 下维护，
          # 根目录不再提交 official 副本（_new 预览文件仍写根目录）。
          git add \
              version_scenario_new.json \
              version_js_new.json \
              "${CONFIG_DIR}/version_scenario.json" "${CONFIG_DIR}/version_scenario_new.json" \
              "${CONFIG_DIR}/version_js.json"       "${CONFIG_DIR}/version_js_new.json" \
              2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ 配置文件无变更可提交"
            exit 0
          fi

          # commit 消息描述本次干了什么
          MSG="ci: sync version_*.json"
          if [ "${{ steps.check_upstream.outputs.publish_hotfix }}" = "true" ]; then
            MSG="$MSG (hotfix published)"
          fi
          # [skip ci] 阻止本 push 触发自身
          MSG="$MSG [skip ci]"

          git commit -m "$MSG"

          # 重试推送（最多 4 次，2 / 4 / 8 / 16 秒退避）
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            if git push origin HEAD:main; then
              echo "✔ push 成功"
              exit 0
            fi
            echo "⚠ push 失败，rebase 后重试..."
            git pull --rebase origin main || true
          done
          echo "::warning::配置文件 commit push 失败 4 次，请手动检查"

      - name: 📊 生成运行摘要
        if: always()
        run: |
          echo "## 🎉 同步任务完成（v3）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 上游仓库 | \`${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 下游仓库 | \`${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| object-storage 存储桶 | \`${{ env.R2_BUCKET }}\`（\`${{ env.R2_DOMAIN }}\`） |" >> $GITHUB_STEP_SUMMARY
          echo "| 同步状态 | ${{ steps.check_upstream.outputs.should_sync == 'true' && '✅ 已同步新内容' || '⏭️ 无新内容' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 热更新发布 | ${{ steps.check_upstream.outputs.publish_hotfix == 'true' && '✅ _new → official（已清理 _new 预览 asset）' || '⏭️ 仅更新 _new 预览' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| object-storage 过时文件清理 | ${{ steps.check_upstream.outputs.confirm_cleanup == 'true' && '✅ 已确认清理' || '⏭️ 仅记录待清理列表（见 PENDING_DELETIONS 变量）' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 快照 Release | ${{ steps.mirror_release.outputs.mirrored == 'true' && format('✅ {0} + latest', steps.mirror_release.outputs.snapshot_tag) || '⏭️ 未镜像' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CDN 刷新 | edge（\`${{ env.R2_DOMAIN }}\`）+ 阿里云 ESA（\`${{ env.ESA_DOMAIN }}\`）+ CDN（\`${{ env.R2_DOMAIN }}\`） |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发事件 | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 时间 | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
