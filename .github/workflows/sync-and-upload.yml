name: 🔄 同步上游并上传到 S3

on:
  schedule:
    - cron: '*/15 * * * *'  # 每15分钟运行一次
  workflow_dispatch:  # 允许手动触发
    inputs:
      force_sync:
        description: '强制同步（无视指纹）'
        required: false
        default: 'false'
        type: boolean

# 关键：并发控制，确保同一时间只有一个实例运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # 如果已有运行中的任务，新任务直接取消（不排队）

permissions:
  contents: write  # 需要写入权限来同步 fork 和更新变量

jobs:
  sync-and-upload:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1  # 强制 Python 无缓冲输出
      : ${{ secrets. }}
      # S3 配置
      S3_1_ENDPOINT: ${{ secrets.S3_1_ENDPOINT }}
      S3_1_ACCESS_KEY: ${{ secrets.S3_1_ACCESS_KEY }}
      S3_1_SECRET_KEY: ${{ secrets.S3_1_SECRET_KEY }}
      S3_1_REGION: ${{ secrets.S3_1_REGION }}
      S3_1_BUCKET: ${{ secrets.S3_1_BUCKET }}
      S3_1_DOMAIN: ${{ secrets.S3_1_DOMAIN }}
      S3_2_ENDPOINT: ${{ secrets.S3_2_ENDPOINT }}
      S3_2_ACCESS_KEY: ${{ secrets.S3_2_ACCESS_KEY }}
      S3_2_SECRET_KEY: ${{ secrets.S3_2_SECRET_KEY }}
      S3_2_REGION: ${{ secrets.S3_2_REGION }}
      S3_2_BUCKET: ${{ secrets.S3_2_BUCKET }}
      S3_2_DOMAIN: ${{ secrets.S3_2_DOMAIN }}
      # edge 配置
      QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
      QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
      EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
      # 仓库信息
      UPSTREAM_OWNER: "HiiragiNemu"
      UPSTREAM_REPO: "patch-front"
      DOWNSTREAM_OWNER: "MagirecoCN-Revival-Project"
      DOWNSTREAM_REPO: "patch-front"

    steps:
      - name: 📦 检出下游仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets. }}
          repository: ${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}
          fetch-depth: 0

      - name: 🔍 检查上游更新
        id: check_upstream
        run: |
          echo "检查上游仓库是否有更新..."
          
          # 获取上游最新 Release
          UPSTREAM_RELEASE=$(gh api repos/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}/releases/latest)
          UPSTREAM_TAG=$(echo "$UPSTREAM_RELEASE" | jq -r '.tag_name')
          UPSTREAM_ID=$(echo "$UPSTREAM_RELEASE" | jq -r '.id')
          
          echo "上游最新 Release: $UPSTREAM_TAG (ID: $UPSTREAM_ID)"
          
          # 获取 Variables 中存储的上次同步 ID
          LAST_SYNC_ID="${{ vars.LAST_SYNC_RELEASE_ID || '0' }}"
          
          echo "上次同步 ID: $LAST_SYNC_ID"
          
          # 判断是否强制同步
          FORCE_SYNC="${{ github.event.inputs.force_sync || 'false' }}"
          
          if [ "$FORCE_SYNC" = "true" ] || [ "$UPSTREAM_ID" != "$LAST_SYNC_ID" ]; then
            echo "检测到新版本或强制同步，需要更新"
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "release_id=$UPSTREAM_ID" >> $GITHUB_OUTPUT
            echo "release_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          else
            echo "无新版本，无需同步"
            echo "should_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔄 同步上游 Fork
        if: steps.check_upstream.outputs.should_sync == 'true'
        run: |
          echo "开始同步上游仓库..."
          
          # 使用 GitHub API 同步 fork
          gh repo sync ${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }} \
            --source ${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }} \
            --branch main \
            --force
            
          echo "✅ 上游仓库同步完成"

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          pip install boto3 tencentcloud-sdk-python

      - name: 🚀 运行同步脚本
        id: sync_script
        run: |
          python3 << 'EOF'
          import os
          import sys
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime
          from io import BytesIO

          # 强制无缓冲输出
          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          # 修正：正确的 boto3 导入
          import boto3
          from botocore.exceptions import ClientError
          from tencentcloud.common import credential
          from tencentcloud.common.profile.client_profile import ClientProfile
          from tencentcloud.common.profile.http_profile import HttpProfile
          from tencentcloud.teo.v20220901 import teo_client, models

          # ==========================================
          # 1. GitHub Actions 分组日志工具
          # ==========================================
          class ActionGroup:
              @staticmethod
              def start_group(title):
                  print(f"::group::{title}")
              @staticmethod
              def end_group():
                  print("::endgroup::")

          # ==========================================
          # 2. 日志与输出设置
          # ==========================================
          LOG_COLORS = {
              'INFO': '\033[92m', 'WARN': '\033[93m', 'ERROR': '\033[91m', 'RESET': '\033[0m'
          }

          class ActionLogger:
              def __init__(self):
                  self.step_summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
                  self.file_statuses = {}
                  self.obsolete_files = []
                  self.ignored_files = []
                  self.token_info = {}
                  self.start_time = datetime.now()
                  
              def init_summary(self):
                  if self.step_summary_path:
                      with open(self.step_summary_path, 'w', encoding='utf-8') as f:
                          f.write("## 🚀 Action 运行报告\n\n")
                          f.write(f"⏱️ **开始时间**: `{self.start_time.strftime('%Y-%m-%d %H:%M:%S')}`\n\n")
                          f.write("### 📋 文件处理状态\n\n| 文件名 | 状态 | 详细信息 |\n|--------|------|----------|\n")
              
              def update_file_status(self, filename, status, details=""):
                  self.file_statuses[filename] = {'status': status, 'details': details}
                  if self.step_summary_path:
                      with open(self.step_summary_path, 'w', encoding='utf-8') as f:
                          f.write("## 🚀 Action 运行报告\n\n")
                          f.write(f"⏱️ **开始时间**: `{self.start_time.strftime('%Y-%m-%d %H:%M:%S')}`\n\n")
                          f.write("### 📋 文件处理状态\n\n| 文件名 | 状态 | 详细信息 |\n|--------|------|----------|\n")
                          icons = {'无需操作':'⚪','排队中':'🟡','下载中':'🔵','上传中':'🟣','已上传':'🟢','已完成':'✅','已忽略':'⚫','失败':'❌'}
                          for fname, info in self.file_statuses.items():
                              icon = icons.get(info['status'], '⚪')
                              f.write(f"| {fname} | {icon} {info['status']} | {info['details']} |\n")
                          f.write("\n")
              
              def add_obsolete_files_section(self):
                  if self.step_summary_path and self.obsolete_files:
                      with open(self.step_summary_path, 'a', encoding='utf-8') as f:
                          f.write("### 🗑️ 过时文件清理报告\n\n| 存储桶 | 文件名 | 状态 | 详细信息 |\n|--------|--------|------|----------|\n")
                          for item in self.obsolete_files:
                              icon = '✅' if item['status'] in ['已删除', '已纠正位置'] else '❌'
                              f.write(f"| {item['bucket']} | {item['filename']} | {icon} {item['status']} | {item['details']} |\n")
                          f.write("\n")
              
              def add_token_info_section(self):
                  if self.step_summary_path and self.token_info:
                      with open(self.step_summary_path, 'a', encoding='utf-8') as f:
                          f.write("### 🔑 GitHub API Token 调用信息\n\n| 项目 | 值 |\n|------|----|\n")
                          for key, value in self.token_info.items():
                              f.write(f"| {key} | {value} |\n")
                          f.write("\n")
              
              def log(self, message, level="INFO", filename=None, status=None, details=""):
                  timestamp = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                  color = LOG_COLORS.get(level, '')
                  print(f"{color}[{timestamp}] [{level}] {message}{LOG_COLORS['RESET']}")
                  if filename and status:
                      self.update_file_status(filename, status, details)
              
              def finalize_summary(self, processed_files):
                  if self.step_summary_path:
                      with open(self.step_summary_path, 'a', encoding='utf-8') as f:
                          f.write(f"\n⏱️ **结束时间**: `{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}`\n")
                          f.write(f"⏱️ **总耗时**: `{(datetime.now() - self.start_time).total_seconds():.2f}` 秒\n\n")
                          self.add_token_info_section()
                          success = sum(1 for f in processed_files if f['success'])
                          fail = len(processed_files) - success
                          if fail == 0:
                              f.write("🟢 **状态**: 所有文件处理成功！\n")
                          else:
                              f.write(f"🟡 **状态**: 处理完成，{success} 个成功，{fail} 个失败。\n")

          logger = ActionLogger()
          logger.init_summary()

          # ==========================================
          # 3. GitHub API 客户端
          # ==========================================
          class GitHubAPIClient:
              def __init__(self, token=None):
                  self.token = token
                  self.headers = {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
                  if token:
                      self.headers['Authorization'] = f'Bearer {token}'
                      logger.log("使用 Fine-grained Personal Access Token", "INFO")
                      logger.token_info['Token 类型'] = 'Fine-grained'
                      masked = token[:4] + '*' * (len(token)-8) + token[-4:] if len(token) > 8 else '*'*len(token)
                      logger.token_info['Token 预览'] = masked
                  else:
                      logger.log("未提供 Token，匿名访问（可能受限）", "WARN")
                      logger.token_info['Token 类型'] = '匿名'

              def get_latest_release(self, owner, repo):
                  url = f"https://api.github.com/repos/{owner}/{repo}/releases/latest"
                  logger.log(f"调用 API: GET {url}", "INFO")
                  req = urllib.request.Request(url, headers=self.headers)
                  try:
                      with urllib.request.urlopen(req) as res:
                          logger.token_info['速率限制'] = res.headers.get('X-RateLimit-Limit', 'N/A')
                          logger.token_info['剩余次数'] = res.headers.get('X-RateLimit-Remaining', 'N/A')
                          return json.loads(res.read().decode())
                  except Exception as e:
                      logger.log(f"API 调用失败: {e}", "ERROR")
                      raise

          # ==========================================
          # 4. S3 操作类（流式上传）
          # ==========================================
          class S3Handler:
              def __init__(self, endpoint, access_key, secret_key, region, bucket, domain, name="S3"):
                  self.name = name
                  self.bucket = bucket
                  self.domain = domain
                  if endpoint.endswith('/'): endpoint = endpoint[:-1]
                  self.s3_client = boto3.client('s3', endpoint_url=endpoint, aws_access_key_id=access_key, aws_secret_access_key=secret_key, region_name=region)

              def list_files(self):
                  try:
                      paginator = self.s3_client.get_paginator('list_objects_v2')
                      files = [obj['Key'] for page in paginator.paginate(Bucket=self.bucket) if 'Contents' in page for obj in page['Contents']]
                      logger.log(f"[{self.name}] 列出 {len(files)} 个文件", "INFO")
                      return files
                  except Exception as e:
                      logger.log(f"[{self.name}] 列出文件失败: {e}", "ERROR")
                      return []

              def delete_file(self, filename):
                  try:
                      self.s3_client.delete_object(Bucket=self.bucket, Key=filename)
                      logger.log(f"[{self.name}] 删除 {filename} 成功", "INFO")
                      return True
                  except ClientError as e:
                      if e.response['Error']['Code'] == '404':
                          logger.log(f"[{self.name}] {filename} 不存在", "WARN")
                          return True
                      logger.log(f"[{self.name}] 删除 {filename} 失败: {e}", "ERROR")
                      return False
                  except Exception as e:
                      logger.log(f"[{self.name}] 删除 {filename} 异常: {e}", "ERROR")
                      return False

              def upload_file_from_url(self, url, filename):
                  try:
                      logger.log(f"[{self.name}] 开始流式上传: {filename}", "INFO")
                      req = urllib.request.Request(url)
                      with urllib.request.urlopen(req) as response:
                          file_data = response.read()
                          file_size = len(file_data)
                      self.s3_client.put_object(Bucket=self.bucket, Key=filename, Body=file_data, ContentLength=file_size)
                      logger.log(f"[{self.name}] 流式上传 {filename} ({file_size/1024/1024:.2f} MB) 成功", "INFO")
                      return True
                  except Exception as e:
                      logger.log(f"[{self.name}] 流式上传 {filename} 失败: {e}", "ERROR")
                      return False

          # ==========================================
          # 5. edge 缓存刷新
          # ==========================================
          class EdgeOneHandler:
              def __init__(self, secret_id, secret_key, zone_id):
                  self.zone_id = zone_id
                  cred = credential.Credential(secret_id, secret_key)
                  http_profile = HttpProfile()
                  http_profile.endpoint = "teo.tencentcloudapi.com"
                  client_profile = ClientProfile()
                  client_profile.httpProfile = http_profile
                  self.client = teo_client.TeoClient(cred, "", client_profile)

              def _mask_task_id(self, task_id):
                  if not task_id or len(task_id) <= 8: return '*' * len(task_id) if task_id else '未知'
                  return task_id[:4] + '*' * (len(task_id) - 8) + task_id[-4:]

              def purge_cache(self, domain, filename):
                  try:
                      req = models.CreatePurgeTaskRequest()
                      target_url = f"http://{domain}/{filename}"
                      req.from_json_string(json.dumps({"ZoneId": self.zone_id, "Type": "purge_url", "Targets": [target_url]}))
                      resp = self.client.CreatePurgeTask(req)
                      masked_id = self._mask_task_id(resp.RequestId)
                      logger.log(f"[edge] 提交刷新任务成功: {target_url} (ID: {masked_id})", "INFO")
                      return True, masked_id
                  except Exception as e:
                      logger.log(f"[edge] 刷新缓存失败: {e}", "ERROR")
                      return False, str(e)

          # ==========================================
          # 6. 主逻辑
          # ==========================================
          def main():
              try:
                  # 配置
                  s3_1 = S3Handler(os.environ['S3_1_ENDPOINT'], os.environ['S3_1_ACCESS_KEY'], os.environ['S3_1_SECRET_KEY'], os.environ['S3_1_REGION'], os.environ['S3_1_BUCKET'], os.environ['S3_1_DOMAIN'], "存储桶1")
                  s3_2 = S3Handler(os.environ['S3_2_ENDPOINT'], os.environ['S3_2_ACCESS_KEY'], os.environ['S3_2_SECRET_KEY'], os.environ['S3_2_REGION'], os.environ['S3_2_BUCKET'], os.environ['S3_2_DOMAIN'], "存储桶2")
                  edge = EdgeOneHandler(os.environ['QCLOUD_SECRET_ID'], os.environ['QCLOUD_SECRET_KEY'], os.environ['EDGEONE_ZONE_ID'])
                  
                  gh_client = GitHubAPIClient(os.environ.get('', ''))
                  owner = os.environ.get('DOWNSTREAM_OWNER', 'MagirecoCN-Revival-Project')
                  repo = os.environ.get('DOWNSTREAM_REPO', 'patch-front')
                  
                  # 获取当前 Release 及 SHA256
                  release = gh_client.get_latest_release(owner, repo)
                  current_map = {}
                  for asset in release.get('assets', []):
                      if not asset['name'].startswith('source code'):
                          current_map[asset['name']] = asset.get('digest', '')
                  
                  logger.log(f"当前 Release 包含 {len(current_map)} 个文件。", "INFO")
                  
                  # 从 GitHub Variables 获取上次指纹
                  import subprocess
                  result = subprocess.run(['gh', 'variable', 'get', 'LAST_SYNC_FINGERPRINTS'], capture_output=True, text=True)
                  old_map = {}
                  if result.returncode == 0 and result.stdout.strip():
                      try:
                          old_map = json.loads(result.stdout.strip())
                      except:
                          old_map = {}
                  
                  # 过滤列表
                  IGNORE_FILES = {'history-data-splited.tar.xz'}
                  
                  # SHA256 比对
                  to_process = []
                  unchanged = []
                  deleted = []
                  
                  for fname, sha in current_map.items():
                      if fname in IGNORE_FILES:
                          logger.update_file_status(fname, "已忽略", "过滤列表")
                      elif fname not in old_map:
                          logger.update_file_status(fname, "排队中", "新文件")
                          to_process.append(fname)
                      elif sha and old_map[fname] != sha:
                          logger.update_file_status(fname, "排队中", "文件已更新")
                          to_process.append(fname)
                      elif not sha:
                          logger.update_file_status(fname, "排队中", "无SHA，按新文件处理")
                          to_process.append(fname)
                      else:
                          logger.update_file_status(fname, "无需操作", "文件未变更")
                          unchanged.append(fname)
                  
                  # 检查被删除的文件
                  for fname in old_map:
                      if fname not in current_map and fname not in IGNORE_FILES:
                          deleted.append(fname)
                  
                  # 清理过时文件 & 纠正位置
                  ActionGroup.start_group("🗑️ 清理过时文件 & 纠正位置")
                  
                  bucket1_files = s3_1.list_files()
                  bucket2_files = s3_2.list_files()
                  
                  bucket1_targets = {
                      'cn_base_00_db.zip', 'cn_base_01.json.zip', 'cn_base_02.zip', 
                      'cn_base_03.zip', 'cn_base_04.zip', 'cn_base_05.zip', 
                      'cn_base_06.zip', 'cn_hotupdate.zip', 'cn_js_update.zip', 
                      'cn_magica_resource.zip'
                  }
                  
                  # 处理存储桶1
                  for fname in bucket1_files:
                      if fname in deleted or fname not in current_map:
                          if s3_1.delete_file(fname):
                              logger.update_file_status(fname, "已完成", "已删除过时文件")
                              logger.obsolete_files.append({'bucket':'存储桶1','filename':fname,'status':'已删除','details':'清理过时'})
                      elif fname not in bucket1_targets:
                          logger.log(f"文件 {fname} 在存储桶1中但应属于存储桶2，准备纠正", "WARN")
                          logger.update_file_status(fname, "排队中", "纠正位置（移至存储桶2）")
                          try:
                              url = next(a['browser_download_url'] for a in release['assets'] if a['name'] == fname)
                              if s3_2.upload_file_from_url(url, fname):
                                  if s3_1.delete_file(fname):
                                      logger.update_file_status(fname, "已完成", "已纠正位置（移至存储桶2）")
                                      logger.obsolete_files.append({'bucket':'存储桶1→存储桶2','filename':fname,'status':'已纠正位置','details':'移至正确桶'})
                                      if fname in to_process:
                                          to_process.remove(fname)
                                  else:
                                      logger.update_file_status(fname, "失败", "从原桶删除失败")
                              else:
                                  logger.update_file_status(fname, "失败", "上传到目标桶失败")
                          except Exception as e:
                              logger.update_file_status(fname, "失败", f"纠正失败: {e}")
                  
                  # 处理存储桶2
                  for fname in bucket2_files:
                      if fname in deleted or fname not in current_map:
                          if s3_2.delete_file(fname):
                              logger.update_file_status(fname, "已完成", "已删除过时文件")
                              logger.obsolete_files.append({'bucket':'存储桶2','filename':fname,'status':'已删除','details':'清理过时'})
                      elif fname in bucket1_targets:
                          logger.log(f"文件 {fname} 在存储桶2中但应属于存储桶1，准备纠正", "WARN")
                          logger.update_file_status(fname, "排队中", "纠正位置（移至存储桶1）")
                          try:
                              url = next(a['browser_download_url'] for a in release['assets'] if a['name'] == fname)
                              if s3_1.upload_file_from_url(url, fname):
                                  if s3_2.delete_file(fname):
                                      logger.update_file_status(fname, "已完成", "已纠正位置（移至存储桶1）")
                                      logger.obsolete_files.append({'bucket':'存储桶2→存储桶1','filename':fname,'status':'已纠正位置','details':'移至正确桶'})
                                      if fname in to_process:
                                          to_process.remove(fname)
                                  else:
                                      logger.update_file_status(fname, "失败", "从原桶删除失败")
                              else:
                                  logger.update_file_status(fname, "失败", "上传到目标桶失败")
                          except Exception as e:
                              logger.update_file_status(fname, "失败", f"纠正失败: {e}")
                  
                  logger.add_obsolete_files_section()
                  ActionGroup.end_group()
                  
                  if not to_process:
                      logger.log("✅ 无新增或更新文件，任务结束。", "INFO")
                      logger.finalize_summary([])
                      return
                  
                  # 处理剩余文件
                  processed = []
                  for i, fname in enumerate(to_process, 1):
                      ActionGroup.start_group(f"📦 文件 {i}/{len(to_process)}: {fname}")
                      target_s3 = s3_1 if fname in bucket1_targets else s3_2
                      logger.log(f"分类到 {target_s3.name}", "INFO")
                      
                      url = next(a['browser_download_url'] for a in release['assets'] if a['name'] == fname)
                      logger.update_file_status(fname, "上传中", f"流式传输至 {target_s3.name}")
                      
                      if target_s3.upload_file_from_url(url, fname):
                          logger.update_file_status(fname, "已上传", f"已上传到 {target_s3.name}")
                          success, tid = edge.purge_cache(target_s3.domain, fname)
                          if success:
                              logger.update_file_status(fname, "已完成", f"CDN 已刷新 (ID: {tid})")
                              processed.append({'filename': fname, 'success': True})
                          else:
                              logger.update_file_status(fname, "失败", f"CDN 刷新失败: {tid}")
                              processed.append({'filename': fname, 'success': False})
                      else:
                          logger.update_file_status(fname, "失败", "S3 上传失败")
                          processed.append({'filename': fname, 'success': False})
                      
                      ActionGroup.end_group()
                  
                  # 保存指纹到 GitHub Variables
                  ActionGroup.start_group("💾 保存同步状态")
                  final_map = old_map.copy()
                  for fname in unchanged:
                      final_map[fname] = old_map[fname]
                  for fname in to_process:
                      final_map[fname] = current_map[fname]
                  for fname in deleted:
                      final_map.pop(fname, None)
                  
                  subprocess.run(['gh', 'variable', 'set', 'LAST_SYNC_FINGERPRINTS', '--body', json.dumps(final_map)], check=True)
                  logger.log("✅ 文件指纹已保存到 GitHub Variables", "INFO")
                  ActionGroup.end_group()
                  
                  logger.finalize_summary(processed)
                  
              except Exception as e:
                  logger.log(f"❌ 脚本执行失败: {e}", "ERROR")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF

      - name: 📝 更新 Release 信息
        if: steps.check_upstream.outputs.should_sync == 'true'
        run: |
          echo "更新 Variables 中的 Release ID..."
          gh variable set LAST_SYNC_RELEASE_ID --body "${{ steps.check_upstream.outputs.release_id }}"

      - name: 📊 生成运行摘要
        if: always()
        run: |
          echo "## 🎉 同步任务完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**上游仓库**: ${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "**下游仓库**: ${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "**同步状态**: ${{ steps.check_upstream.outputs.should_sync == 'true' && '已同步新版本' || '无新版本' }}" >> $GITHUB_STEP_SUMMARY
