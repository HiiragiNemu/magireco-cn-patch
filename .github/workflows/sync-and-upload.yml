name: 🔄 打包热更并上传到 object-storage

# ╔════════════════════════════════════════════════════════════════════╗
# ║   v4.1 —— 2026-08-22 与上游断开、转独立私有仓后的拓扑。              ║
# ║   DAG 拓扑：                                                        ║
# ║     [setup] 护栏/检出/detect（不再有「同步上游 fork」这一步）        ║
# ║       ├─ [pack-js] CSS冻结+打包JS  ║ [pack-scenario] 打包SCENARIO    ║
# ║       └─ [publish] 热更发布(gate)                                    ║
# ║            ├─ [r2-sync] object-storage系同步  ║ [doge-sync] Doge系(hk runner)     ║
# ║            ├─ [bump-gate] APK 落地 CDN 后按实况抬版本闸门            ║
# ║            └─ [commit-configs] 提交版本json推 main                    ║
# ║                 └─ [update-cursor] 推进游标 → [summary] 报告         ║
# ║   object-storage 系：单 object-storage 桶 + edge/ESA/CDN 三 CDN 刷新               ║
# ║   Doge 系：多吉云 S3 兼容镜像（临时密钥）+ 多吉云 CDN 刷新，          ║
# ║     2026-08-13 起在 mainland runner 上跑：多吉云服务端 fetch 拉取     ║
# ║     （/oss/fetch.json 轮询），源用国内 CDN 竞速，不再 runner 上传     ║
# ║     指纹存 GitHub variable LAST_DOGE_FINGERPRINTS                    ║
# ║   object-storage 过时文件需手动确认清理；                                       ║
# ║   版本 json 直接 commit 并 push 回本仓库 main（带 [skip ci]）；    ║
# ║   每次新建/同步 Release 后强制校准 Latest 徽标到 tag=latest         ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║                                                                    ║
# ║ 热更新流程                                                          ║
# ║ ───────                                                            ║
# ║   1. 每次 sync：                                                   ║
# ║        ▸ 重新生成 cn_*_update_new.zip                              ║
# ║        ▸ 按包指纹写 version_*_new.json；同预览复用版本，             ║
# ║          不同字节严格越过已观察到的最高版本                         ║
# ║        ▸ 同步到 /、/configures/、Release 三处                      ║
# ║        ▸ 提交 _new 文件到 git（同一 commit 推送并对齐上下游），     ║
# ║          official 文件不动                                         ║
# ║                                                                    ║
# ║   2. 手动勾选 publish_hotfix=true 时：                              ║
# ║        ▸ 把 *_new 文件去掉 _new 后缀覆盖正式文件                     ║
# ║          （Release + /configures/；根目录不放 official version）    ║
# ║        ▸ 转正方式：旧正式 asset 先 PATCH 改为 rollback 名，再把     ║
# ║          已核验的 _new asset PATCH 为正式名；整批失败倒序恢复。      ║
# ║          不要用 `gh release upload <tag> <file>#<name>` —— `#`     ║
# ║          后面只是"显示标签（label）"，asset 真实 name 仍是本地      ║
# ║          文件名，下载 URL 也按 name 走，于是出现"网页端显示正式     ║
# ║          名、点击却下载 _new 文件"的虚空链接 bug                    ║
# ║        ▸ 转正后 _new asset 已改为正式名，不再留下第二个预览条目，    ║
# ║          避免网页端同时显示带 _new 和不带 _new 两个条目             ║
# ║                                                                    ║
# ║ object-storage 同步                                                            ║
# ║ ───────                                                            ║
# ║   ▸ 黑名单：history-data*（前缀）不同步                          ║
# ║   ▸ GitHub 上已不存在的文件【不主动删除】，先记入                   ║
# ║       PENDING_DELETIONS 仓库变量并打印警告；手动以                  ║
# ║       confirm_cleanup=true 运行时才真正删除                         ║
# ║                                                                    ║
# ║ object-storage 系 CDN 刷新                                                      ║
# ║ ───────────                                                         ║
# ║   ▸ 每上传一个文件，刷新 edge（EDGEONE_DOMAIN，腾讯云 TEO）、    ║
# ║     阿里云 ESA（ESA_DOMAIN，PurgeCaches Type=file）与               ║
# ║     CDN（CLOUDFLARE_DOMAIN，Purge Cache by URL）             ║
# ║                                                                    ║
# ║ DogeCloud 系（独立流水线）                                          ║
# ║ ───────────────────                                                 ║
# ║   ▸ scripts/sync-dogecloud.py：tmp_token 换 STS → 上传/删除 →       ║
# ║     POST /cdn/refresh/add.json 刷新（rtype=url，同一 TOKEN 鉴权）   ║
# ║   ▸ 独立指纹 LAST_DOGE_FINGERPRINTS；过滤规则与 object-storage 系一致；          ║
# ║     confirm_cleanup=true 才删 Doge 桶过时文件                        ║
# ║                                                                    ║
# ║ 本仓库 Release                                                      ║
# ║ ───────                                                            ║
# ║   ▸ 2026-08-22 前这里是 [mirror-release] job：把上游 Release 的全部 ║
# ║     asset 镜像进本仓库。断开上游后本仓库就是唯一一份，publish job  ║
# ║     直接把热更包传进本仓库 tag=latest 的 Release，镜像 job 已删除。 ║
# ║   ▸ 日期快照 Release 随镜像 job 一并取消；要回溯历史版本请查        ║
# ║     Release 的 asset 历史或 configures/ 下的版本 json 提交记录。    ║
# ║                                                                    ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      package_scope:
        description: '手动打包范围（js=JS/WebView+引擎表；scenario=仅剧情；all=两者）'
        required: true
        default: 'js'
        type: choice
        options:
          - js
          - scenario
          - all
      force_sync:
        description: '强制同步（无视指纹）'
        required: false
        default: 'false'
        type: boolean
      publish_hotfix:
        description: '发布热更新包（将 _new 文件覆盖正式文件）'
        required: false
        default: 'false'
        type: boolean
      confirm_cleanup:
        description: '确认清理 object-storage 上 GitHub 已不存在的文件（默认只记录不删除）'
        required: false
        default: 'false'
        type: boolean
  # ⚠ event_type 叫 `upstream-update` 是**历史遗留，别按字面理解**。
  # 2026-08-21 起上游那份 call-downstream-action.yml 已删除，这个事件此后的
  # 唯一发送方是**客户端构建流水线**：legacy-client 的
  # build-apk.yml 在 APK 与版本旁注传进 Release 后打过来（见那边「通知资产仓
  # 同步」一步）。也就是说它的真实语义早就是「客户端产物就绪」。
  #
  # 名字保留不改：它是跨仓库的线上标识符，两边不同步改就会静默失联
  # （dispatch 照样成功、这边没人监听），收益抵不过那个窗口的风险。
  repository_dispatch:
    types: [upstream-update]

  # 2026-08-22 新增。本仓库与上游断开、转独立私有仓之后它自己就是事实来源，
  # 改了内容就该重新打包。在此之前，**本仓库 git 内容的变化没有任何自动触发**
  # ——上游联动早已删除，客户端那条只在出 APK 时才发，全靠人记得手动跑一次。
  #
  # ⚠ 不会自激循环：commit-configs 回写版本 json 时提交信息带 [skip ci]
  #   （见那一步的注释），GitHub 据此跳过本次 push 触发。
  push:
    branches: [main]

concurrency:
  # 手动触发与 push 触发分组排队，避免某一事件源的 GitHub 队列死锁
  # 把另一类事件也堵住；同事件源内仍保持严格串行。
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Release promotion changes several related assets.  Queue a later dispatch
  # instead of cancelling between a rename and its verification/rollback.
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      should_sync:    ${{ steps.check_repo.outputs.should_sync }}
      commit_sha:     ${{ steps.check_repo.outputs.commit_sha }}
      publish_hotfix: ${{ steps.check_repo.outputs.publish_hotfix }}
      confirm_cleanup: ${{ steps.check_repo.outputs.confirm_cleanup }}
      has_js:          ${{ steps.detect.outputs.has_js }}
      has_scenario:    ${{ steps.detect.outputs.has_scenario }}
    env:
      PYTHONUNBUFFERED: "1"
      : ${{ secrets. }}
      REPO_OWNER: "MagirecoCN-Revival-Project"
      REPO_NAME: "patch-front"
      CONFIG_OWNER: "MagirecoCN-Revival-Project"
      CONFIG_REPO: "runtime-config"
    steps:
      - name: 🛡 安全护栏（校验所有可写仓库都在白名单中）
        # 这是本 workflow 的"硬刹车"。下面列出的两组 owner/repo 是
        # **唯一**允许被本 workflow 读/写/删的仓库——任何一项与白名单
        # 不一致就 fail-fast，绝不向陌生仓库发请求。要新增允许的仓库
        # 请直接改这份白名单，不要绕过它。
        #
        # 2026-08-22 本仓库与上游断开、转为独立私有仓之后，"上游/下游"两栏
        # 合并成一栏。⚠ 合并时**不能**只把两个变量指向同一个仓库了事——那样
        # 两条判据会退化成同一条恒真检查，白名单看着还在，实际只剩一半防护面。
        # 所以判据也一并删到只剩真实存在的两个仓库。
        run: |
          python3 <<'SCRIPT_END'
          import os, sys
          ALLOW_REPO   = {"MagirecoCN-Revival-Project/patch-front"}
          # 2026-08-21 起本 workflow 还会写在线配置仓库的 client.version
          # （bump-gate job），所以它也必须列在这张白名单里。
          ALLOW_CONFIG = {"MagirecoCN-Revival-Project/runtime-config"}

          repo   = f"{os.environ['REPO_OWNER']}/{os.environ['REPO_NAME']}"
          config = f"{os.environ['CONFIG_OWNER']}/{os.environ['CONFIG_REPO']}"

          failed = False
          if repo not in ALLOW_REPO:
              print(f"::error::本仓库 {repo} 不在白名单中")
              print(f"::error::允许: {sorted(ALLOW_REPO)}")
              failed = True
          if config not in ALLOW_CONFIG:
              print(f"::error::在线配置仓库 {config} 不在白名单中")
              print(f"::error::允许: {sorted(ALLOW_CONFIG)}")
              failed = True
          if failed:
              print("::error::出于安全考虑，本 workflow 只允许操作上述指定仓库；")
              print("::error::请检查 env / secrets / .github/workflows/sync-and-upload.yml")
              sys.exit(1)

          print(f"✔ 本仓库 OK: {repo}")
          print(f"✔ 配置 OK:   {config}")
          SCRIPT_END

      - name: 📦 检出本仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets. }}
          repository: ${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}
          # 需要完整历史：detect 步骤要 diff「上次同步点 → 最新」的整个
          # 区间，浅克隆拿不到旧提交
          fetch-depth: 0

      - name: 🐍 固定热更新构建 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.18'

      - name: 🛡 安全护栏（校验 origin 指向预期下游仓库）
        # checkout 完后立刻校验本地 git 的 origin URL，确认我们真的
        # 是在操作预期的下游仓库——后续所有 git push 都会推到 origin，
        # 这一步保证那个 origin 不是别的仓库。
        run: |
          ORIGIN_URL=$(git remote get-url origin)
          EXPECTED="${REPO_OWNER}/${REPO_NAME}"
          echo "origin URL : $ORIGIN_URL"
          echo "expected   : $EXPECTED"
          if ! echo "$ORIGIN_URL" | grep -qiE "[/:]${REPO_OWNER}/${REPO_NAME}(\.git)?\$"; then
            echo "::error::origin URL 不匹配预期下游仓库，拒绝继续"
            exit 1
          fi
          echo "✔ origin 校验通过"

      - name: 🔧 配置 Git
        run: |
          git config user.name "Hiiragi Nemu"
          git config user.email "128921071+HiiragiNemu@users.noreply.github.com"
          git config rebase.autoStash true

      - name: 🔍 检查本仓库内容更新
        id: check_repo
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(color, text): return f"{color}{text}{C.RESET}"
          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(text): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)
          def info(t, indent=0):  print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, indent=0):    print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, indent=0):  print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, indent=0):   print(f"{'  '*indent}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, indent=0):  print(f"{'  '*indent}{c(C.DIM, '⏭  ' + t)}", flush=True)

          def set_output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{key}={value}\n")

          REPO_OWNER  = os.environ["REPO_OWNER"]
          REPO_NAME   = os.environ["REPO_NAME"]
          FORCE_SYNC      = os.environ.get("INPUT_FORCE_SYNC", "false")
          PUBLISH_HOTFIX  = os.environ.get("INPUT_PUBLISH_HOTFIX", "false")
          CONFIRM_CLEANUP = os.environ.get("INPUT_CONFIRM_CLEANUP", "false")

          header("检查本仓库内容更新")

          section("获取当前 main 的 commit SHA")
          info(f"本仓库: {c(C.BRIGHT_WHITE, f'{REPO_OWNER}/{REPO_NAME}')}")

          result = subprocess.run(
              ["gh", "api",
               f"repos/{REPO_OWNER}/{REPO_NAME}/branches/main",
               "--jq", ".commit.sha"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              err(f"获取 main SHA 失败: {result.stderr.strip()}")
              sys.exit(1)

          head_sha  = result.stdout.strip()
          # 仓库变量不会自动注入 env，必须靠下面 env: 显式带入；
          # 空串也归一化成 "0"（首次运行 / 变量未设置）
          last_sync_sha = os.environ.get("LAST_SYNC_COMMIT_SHA") or "0"

          info(f"当前 main SHA: {c(C.BRIGHT_CYAN, head_sha[:7])}")
          info(f"上次同步 SHA: {c(C.DIM, last_sync_sha[:7] if last_sync_sha != '0' else 'N/A')}")

          section("判断是否需要同步")
          if FORCE_SYNC == "true":
              warn("强制同步模式，跳过 SHA 比对")
              should_sync = True
          elif head_sha != last_sync_sha:
              ok("检测到新内容，需要同步")
              should_sync = True
          else:
              skip("SHA 一致，无新内容")
              should_sync = False

          section("判断是否发布热更新包")
          if PUBLISH_HOTFIX == "true":
              ok("发布热更新包模式已开启 —— _new → official")
          else:
              skip("不发布热更新包（_new 文件仍会更新供预览）")

          section("判断是否确认清理 object-storage 过时文件")
          if CONFIRM_CLEANUP == "true":
              warn("确认清理模式：PENDING_DELETIONS 及本次检测到的 object-storage 过时文件将被真正删除")
          else:
              skip("不清理 object-storage 过时文件（仅记录到 PENDING_DELETIONS）")

          set_output("should_sync", "true" if should_sync else "false")
          set_output("commit_sha", head_sha)
          set_output("publish_hotfix", PUBLISH_HOTFIX)
          set_output("confirm_cleanup", CONFIRM_CLEANUP)
          SCRIPT_END
        env:
          INPUT_FORCE_SYNC: ${{ inputs.force_sync }}
          INPUT_PUBLISH_HOTFIX: ${{ inputs.publish_hotfix }}
          INPUT_CONFIRM_CLEANUP: ${{ inputs.confirm_cleanup }}
          # ⚠ 仓库变量（Settings → Variables）不会自动注入 env，必须显式
          # 带进来——否则 os.environ.get 永远拿到默认值 "0"，SHA 比对形同
          # 虚设，等于每次运行都在强制全量同步
          LAST_SYNC_COMMIT_SHA: ${{ vars.LAST_SYNC_COMMIT_SHA }}

      # 2026-08-22：这里原先有一步「🔄 同步上游 Fork」（`repo sync` 下游
      # --source 上游）。断开上游之后它会变成把仓库同步到它自己，是个既没有
      # 意义、又会掩盖真实状态的动作，所以整步删除。
      #
      # 它顺带做的两件事各自有了归宿：
      #   ▸ PRE_SYNC_SHA（diff 起点）—— 改用同步游标 LAST_SYNC_COMMIT_SHA，
      #     见下一步。语义反而更准：游标记的是「上次成功跑完到哪」，
      #     而原来那个记的是「本次 sync 之前下游在哪」。
      #   ▸ git reset --hard origin/main —— 不需要了，checkout 出来的
      #     本来就是触发本次运行的那个 commit。

      - name: 🔍 记录变动范围
        id: detect
        env:
          LAST_SYNC_COMMIT_SHA: ${{ vars.LAST_SYNC_COMMIT_SHA }}
        run: |
          # 对比「上次成功同步到的 SHA → 本次 HEAD」整个区间，而不是只看最后
          # 一个 commit——否则一次推多个 commit 时，只有 HEAD 那个 commit 的
          # 文件会被检测到，其余全部漏掉。
          #
          # 游标为空/为 0（首次运行、或变量没设）时按「全量」处理：宁可多打一次
          # 包，也不要因为算不出变动范围而静默漏掉内容。
          # 仅作日志/审计用：打包已改为【无条件】，无论变动如何
          # 都同时重打 JS 与 SCENARIO 包（见 pack-js / pack-scenario）。
          BASE="${LAST_SYNC_COMMIT_SHA:-0}"
          if [ "$BASE" != "0" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "ALL")
          else
            echo "⚠ 同步游标为空或已不在历史里（$BASE），按全量处理"
            CHANGED="ALL"
          fi
          echo "变动文件:"; echo "$CHANGED"

          # 自动范围和手动范围共用同一个可测试的产品所有权合同。
          # 剧情包只由剧情 JSON 触发；引擎翻译表只属于 JS 热更新包。
          SCOPE=auto
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCOPE="${{ inputs.package_scope }}"
          fi
          printf '%s\n' "$CHANGED" | python3 scripts/classify_hotupdate_changes.py \
            --scope "$SCOPE" --github-output "$GITHUB_OUTPUT"
          mkdir -p _artifacts

      # ───────────────────────────────────────────────────────────────
      # [JS] 打包 cn_js_update_new.zip
      #   ▸ baseline 从本仓库 tag=latest Release 下载 stable version/zip 并
      #     逐字节交叉核验；Release 中已有完整 _new 同指纹则复用，异指纹
      #     则严格越过两者，并落盘可机审版本决策
      #   ▸ 产物：version_js_new.json 写到 /, /configures/, _artifacts/
      #   ▸ 产物：cn_js_update_new.zip 写到 /, _artifacts/
      # ───────────────────────────────────────────────────────────────
      # ───────────────────────────────────────────────────────────────
      # [JS] CSS 冻结检查
      #   包里放过的 CSS 会被客户端永久优先于服务端（见 scripts 里的注释），
      #   所以每次打包前都要确认它们还和服务端现役版本一致。
      #   不阻断构建：游戏服务端连不上时不该把发版卡死，只标红提示。
      # ───────────────────────────────────────────────────────────────
  pack-js:
    runs-on: ubuntu-24.04
    needs: [setup]
    if: needs.setup.outputs.has_js == '1'
    # 只打 JS/WebView 和引擎表；完整产品双构建并验证。
    #
    # artifact 输出：上传步用的是 if-no-files-found: warn——一个文件都没匹配到时
    # upload-artifact **不会创建 artifact**，只打一条警告，步骤仍然绿。下游若按
    # 「这个 job 成功没有」去 download，就会撞上 Artifact not found 硬失败。
    # 把 artifact-id 透出来，让下游按「到底传上去没有」判。
    outputs:
      artifact: ${{ steps.upload_pack_js.outputs.artifact-id }}
    env:
      PYTHONUNBUFFERED: "1"
      : ${{ secrets. }}
      REPO_OWNER: "MagirecoCN-Revival-Project"
      REPO_NAME: "patch-front"
      CONFIG_DIR: "configures"
    steps:
      - name: 📦 检出本仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets. }}
          repository: ${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}
          # 需要完整历史：build_manifest.py 账本要 diff 上一版
          fetch-depth: 0

      - name: "[JS] 锁定本仓库 latest Release 正式版本基线"
        run: |
          set -euo pipefail
          BASELINE_DIR="_release_baseline/js"
          ASSET_DIR="${BASELINE_DIR}/assets"
          rm -rf "${BASELINE_DIR}"
          mkdir -p "${ASSET_DIR}" _artifacts
          gh api "repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/latest" \
            > "${BASELINE_DIR}/release.json"
          gh release download latest \
            --repo "${REPO_OWNER}/${REPO_NAME}" \
            --dir "${ASSET_DIR}" --clobber \
            --pattern 'version_js.json' \
            --pattern 'version_js_new.json' \
            --pattern 'cn_js_update.zip' \
            --pattern 'cn_js_update_new.zip'
          python3 scripts/hotupdate_release_baseline.py \
            --scope js \
            --release-json "${BASELINE_DIR}/release.json" \
            --asset-dir "${ASSET_DIR}" \
            --out-version "${BASELINE_DIR}/version_js.json" \
            --out-candidate "${BASELINE_DIR}/version_js_new.json" \
            --out-report "_artifacts/version_js_release_baseline.json"

      - name: "[HOTUPDATE] 触发分类与清单所有权回归"
        if: needs.setup.outputs.has_js == '1'
        run: |
          python3 scripts/test_classify_hotupdate_changes.py -v
          python3 scripts/test_hotupdate_workflow_contract.py -v
          python3 scripts/test_hotupdate_version.py -v
          python3 scripts/test_hotupdate_release_baseline.py -v
          python3 scripts/test_hotupdate_promotion.py -v
          python3 scripts/test_release_asset_transaction.py -v
          python3 scripts/test_build_manifest.py -v
          python3 scripts/test_private_asset_fetch.py -v

      - name: "[JS] CSS 冻结检查"
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/check_css_freeze.py 2>&1 | tee _css_freeze.log || {
            {
              echo "### ⚠️ CSS 冻结检查未通过"
              echo
              echo '```'
              cat _css_freeze.log
              echo '```'
              echo
              echo "包里的 CSS 会**永久**盖住服务端版本（热更只写不删），"
              echo "冻住的那几个必须用服务端现役内容覆盖回去再发。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: "[JS] 打包 cn_js_update_new.zip"
        run: |
          pip3 install requests 2>/dev/null || true
          python3 Build_JS_Injector.py
          FIRST_RUNTIME_SHA=$(sha256sum magica/js/libs/jquery-3.7.1.min.js | cut -d' ' -f1)
          python3 Build_JS_Injector.py
          SECOND_RUNTIME_SHA=$(sha256sum magica/js/libs/jquery-3.7.1.min.js | cut -d' ' -f1)
          test "$FIRST_RUNTIME_SHA" = "$SECOND_RUNTIME_SHA" || {
            echo "::error::Build_JS_Injector 双构建不一致"; exit 1;
          }
          python3 tools/verify-runtime-layer.py
          git diff --exit-code -- \
            magica/js/libs/jquery-3.7.1.min.js \
            magica/i18n_audit/release_v26_authority/runtime_layer_manifest.json \
            magica/i18n_audit/release_v26_authority/RUNTIME_LAYER_SHA256SUMS.txt
          python3 tools/test-i18n-build-effective.py -v
          python3 tools/i18n-build-effective.py
          git diff --exit-code -- i18n/generated
          python3 tools/test-i18n-authority-guard.py -v
          python3 tools/test-apply-pass20-suggested-adoptions.py -v
          python3 tools/test-build-pass20-ds-correction-status.py -v
          python3 tools/test-import-pass20-human-review-xlsx.py -v
          python3 tools/test-stage-pass20-human-review-product.py -v
          python3 tools/test-promote-pass20-product-stage.py -v
          python3 tools/test-rollback-pass20-product-stage.py -v
          python3 tools/test-verify-pass20-human-materialization.py -v
          # 人工审查资产只能使用全量 1,564 项工作簿；旧 199 项文件不得
          # 重新进入任何候选发布流程。
          test -f magica/i18n_audit/release_v26_authority/magireco_v26_translation_review_1564.xlsx
          test ! -e magica/i18n_audit/release_v26_authority/pass20_human_review.xlsx
          test -f magica/i18n_audit/release_v26_authority/pass20_human_final_values.tsv
          python3 tools/i18n-authority-guard.py --json | tee _authority_guard.json
          python3 tools/pass20_official_static.py verify --state applied
          # 先重建全量来源/机翻审计，证明清单覆盖当前产品输入；随后仅验证
          # 已提交的高权威基线。这里禁止自动重建保护基线，避免把意外漂移
          # 当场“盖章”为新权威。
          python3 tools/build-v26-machine-review.py
          git diff --exit-code -- \
            magica/i18n_audit/release_v26_authority/machine_translation_review
          python3 tools/test-v26-authority-protection.py -v
          python3 tools/verify-v26-authority-protection.py --json \
            | tee _artifacts/v26_authority_protection_verification.json
          # Preview builds stay available for review. Stable promotion is a
          # hard failure until all 1,564 final values are sealed either as a returned
          # human review or as the explicitly authorized rough-production receipt,
          # the 323 authority resolutions stay outside that queue, and the 25
          # higher-authority-shadowed machine rows prove zero low-tier/product
          # writes through the materialization verifier.
          HUMAN_GATE_ARGS=()
          if [ "${{ needs.setup.outputs.publish_hotfix }}" = "true" ]; then
            HUMAN_GATE_ARGS+=(--require-release-open)
          fi
          python3 tools/validate-dsv4-human-review.py \
            --source magica/i18n_audit/release_v26_authority/dsv4_terminal_handoff/full_review.tsv \
            --final-values magica/i18n_audit/release_v26_authority/pass20_human_final_values.tsv \
            --authority-resolutions magica/i18n_audit/release_v26_authority/pass20_authority_resolutions.tsv \
            --report _artifacts/dsv4_human_release_gate.json \
            "${HUMAN_GATE_ARGS[@]}"
          python3 tools/verify-pass20-human-materialization.py \
            --repo-root . \
            --report _artifacts/pass20_human_materialization_verification.json \
            "${HUMAN_GATE_ARGS[@]}"
          python3 tools/test-i18n-package.py -v
          python3 tools/test-build-v26-package.py -v
          python3 scripts/test_build_manifest.py -v

          # 审计证据保留在仓库，但不进入运行时包。native cocos 翻译表
          # 与 magica/ 并行，解压后落到 files/madomagi/engine_i18n.tsv。
          test -f madomagi/engine_i18n.tsv || {
            echo "::error::缺少 madomagi/engine_i18n.tsv"; exit 1;
          }
          test -f madomagi/repair_manifest.json || {
            echo "::error::缺少 madomagi/repair_manifest.json"; exit 1;
          }
          # 对完整成品进行同一固定工具链双构建，而不只测试小型 fixture。
          python3 tools/build-v26-package.py --out cn_js_update_reprocheck.zip
          python3 tools/build-v26-package.py --out cn_js_update_new.zip
          cmp cn_js_update_reprocheck.zip cn_js_update_new.zip
          python3 - <<'PYEOF'
          import hashlib, json, platform, sys, zlib
          from pathlib import Path
          paths = [Path("cn_js_update_reprocheck.zip"), Path("cn_js_update_new.zip")]
          hashes = [hashlib.sha256(path.read_bytes()).hexdigest() for path in paths]
          assert hashes[0] == hashes[1]
          report = {
              "schema": "magireco-cn-hotupdate-build-environment/v1",
              "status": "PASS",
              "python": sys.version,
              "zlib_compile": zlib.ZLIB_VERSION,
              "zlib_runtime": zlib.ZLIB_RUNTIME_VERSION,
              "platform": platform.platform(),
              "full_product_double_build_sha256": hashes[0],
              "full_product_double_build_identical": True,
          }
          Path("_artifacts").mkdir(exist_ok=True)
          Path("_artifacts/cn_js_update_v26_build_environment.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PYEOF
          rm cn_js_update_reprocheck.zip
          python3 tools/verify-v26-product.py --zip cn_js_update_new.zip \
            --out _artifacts/cn_js_update_v26_verification.json

          python3 - <<'PYEOF'
          import json, hashlib, os, shutil, zipfile

          CFG_DIR  = os.environ["CONFIG_DIR"]
          ZIP_NEW  = "cn_js_update_new.zip"
          NAME     = "version_js"            # base name, 没有 _new / .json

          # 包结构护栏：engine 表必须且只能出现一次；剧情与审计材料不得混入。
          with zipfile.ZipFile(ZIP_NEW) as zf:
              names = zf.namelist()
          engine = "madomagi/engine_i18n.tsv"
          repair_contract = "madomagi/repair_manifest.json"
          repair_prefix = "madomagi/resource/image_native/"
          assert names.count(engine) == 1, f"{engine} count={names.count(engine)}"
          assert names.count(repair_contract) == 1, (
              f"{repair_contract} count={names.count(repair_contract)}"
          )
          repair_manifest = json.load(open("madomagi/repair_manifest.json", encoding="utf-8"))
          expected_repairs = sorted(row["path"] for row in repair_manifest["entries"])
          actual_repairs = sorted(name for name in names if name.startswith(repair_prefix))
          assert actual_repairs == expected_repairs, (
              len(actual_repairs), len(expected_repairs)
          )
          assert not any(n.startswith("madomagi/resource/scenario/") for n in names)
          assert not any(n.startswith(("magica/research/", "magica/i18n_audit/")) for n in names)
          assert not any(
              n.startswith("madomagi/")
              and n != engine
              and n != repair_contract
              and not n.startswith(repair_prefix)
              for n in names
          )

          # 权威正式基线来自本次捕获并交叉核验的本仓库 latest Release；
          # repo /configures 仅是稍后提交的镜像，禁止作为版本分配真相源。
          release_baseline_dir = os.path.join("_release_baseline", "js")
          official_path = os.path.join(release_baseline_dir, f"{NAME}.json")
          release_candidate_path = os.path.join(
              release_baseline_dir, f"{NAME}_new.json"
          )
          # 三处 _new 输出路径
          out_paths = [
              f"{NAME}_new.json",                      # 仓库根目录
              os.path.join(CFG_DIR, f"{NAME}_new.json"),  # /configures/
              os.path.join("_artifacts", f"{NAME}_new.json"),  # 上传 Release 用
          ]

          with open(ZIP_NEW, "rb") as f:
              zip_data = f.read()
          zip_md5 = hashlib.md5(zip_data).hexdigest().lower()
          # 预览、发布和分发重试可跨多次 workflow run；按包指纹复用已经
          # 发布或预览的版本，只有产品字节真正变化时才递增。
          from scripts.hotupdate_version import decide_candidate_version
          decision = decide_candidate_version(
              official_path,
              [release_candidate_path],
              len(zip_data),
              zip_md5,
          )
          candidate_version = decision.version
          data = {
              "version": candidate_version,
              "size":    len(zip_data),
              "md5":     zip_md5,
          }
          os.makedirs("_artifacts", exist_ok=True)
          os.makedirs(CFG_DIR, exist_ok=True)
          with open("_artifacts/version_js_decision.json", "w", encoding="utf-8") as f:
              json.dump(decision.to_dict(), f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(
              f"ℹ JS 版本决策: {decision.strategy}, "
              f"official={decision.official_version}, "
              f"preview={decision.existing_candidate_version}, selected={decision.version}"
          )
          for p in out_paths:
              with open(p, "w") as f:
                  json.dump(data, f, indent=2)
              print(f"✅ 写入 {p}: v{data['version']}, size={data['size']}, md5={data['md5']}")

          # 把 zip 也复制到 _artifacts 供后续上传 Release
          shutil.copy2(ZIP_NEW, os.path.join("_artifacts", ZIP_NEW))
          PYEOF

      # [JS] 只生成作用域候选；绝不在预览阶段覆盖正式 manifest.json。
      # publish job 会把 JS/SCENARIO 候选合并为 manifest_new.json，并在同一
      # Release 事务中最后转正。
      - name: "[JS] 生成预览分块清单候选"
        run: |
          MANIFEST="${CONFIG_DIR}/manifest.json"
          test -f "${MANIFEST}" || { echo "::error::缺少正式分块清单 ${MANIFEST}"; exit 1; }
          python3 scripts/build_chunk_manifest.py --update "${MANIFEST}" \
              --out "_artifacts/manifest_js_new.json" \
              --as "cn_js_update.zip=cn_js_update_new.zip" \
              cn_js_update_new.zip

      # ───────────────────────────────────────────────────────────────
      # [JS] 生成文件清单与累计账本
      #   热更解压只写不删：从包里拿掉一个文件 ≠ 设备上就没有它了。
      #   账本记的是「历史上一共往设备写过哪些路径」——少了谁会在这里报出来。
      # ───────────────────────────────────────────────────────────────
      - name: "[JS] 生成文件清单与账本"
        run: |
          set -o pipefail
          VER=$(python3 -c "import json;print(json.load(open('version_js_new.json'))['version'])")
          LEDGER_MODE=check
          if [ "${{ needs.setup.outputs.publish_hotfix }}" = "true" ]; then
            LEDGER_MODE=update
          fi
          python3 scripts/build_manifest.py \
              --zip cn_js_update_new.zip --package cn_js_update --version "$VER" \
              --out _artifacts --manifest-name cn_js_update_manifest_new.json \
              --ledger-mode "$LEDGER_MODE" \
              | tee _js_manifest.log
          if grep -q '继续盖住服务端' _js_manifest.log; then
            {
              echo "### ⚠️ cn_js_update 这一版少了文件"
              echo
              echo '```'
              sed -n '/这一版比上一版少了/,$p' _js_manifest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ───────────────────────────────────────────────────────────────
      # [SCENARIO] 同上
      # ───────────────────────────────────────────────────────────────
      - name: 📤 上传 pack-js 产物
        id: upload_pack_js
        uses: actions/upload-artifact@v4
        with:
          name: pack-js
          path: |
            version_js_new.json
            configures/version_js_new.json
            manifests/cn_js_update_ledger.json
            _artifacts/cn_js_update_new.zip
            _artifacts/cn_js_update_manifest_new.json
            _artifacts/version_js_new.json
            _artifacts/version_js_decision.json
            _artifacts/version_js_release_baseline.json
            _artifacts/manifest_js_new.json
          if-no-files-found: warn
  pack-scenario:
    runs-on: ubuntu-24.04
    needs: [setup]
    if: needs.setup.outputs.has_scenario == '1'
    # 仅剧情 JSON；engine_i18n.tsv 明确排除。
    # artifact 输出的理由同 pack-js。
    outputs:
      artifact: ${{ steps.upload_pack_scenario.outputs.artifact-id }}
    env:
      PYTHONUNBUFFERED: "1"
      : ${{ secrets. }}
      REPO_OWNER: "MagirecoCN-Revival-Project"
      REPO_NAME: "patch-front"
      CONFIG_DIR: "configures"
    steps:
      - name: 📦 检出本仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets. }}
          repository: ${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}
          # 需要完整历史：build_manifest.py 账本要 diff 上一版
          fetch-depth: 0

      - name: "[SCENARIO] 锁定本仓库 latest Release 正式版本基线"
        run: |
          set -euo pipefail
          python3 scripts/test_hotupdate_release_baseline.py -v
          BASELINE_DIR="_release_baseline/scenario"
          ASSET_DIR="${BASELINE_DIR}/assets"
          rm -rf "${BASELINE_DIR}"
          mkdir -p "${ASSET_DIR}" _artifacts
          gh api "repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/latest" \
            > "${BASELINE_DIR}/release.json"
          gh release download latest \
            --repo "${REPO_OWNER}/${REPO_NAME}" \
            --dir "${ASSET_DIR}" --clobber \
            --pattern 'version_scenario.json' \
            --pattern 'version_scenario_new.json' \
            --pattern 'cn_scenario_update.zip' \
            --pattern 'cn_scenario_update_new.zip'
          python3 scripts/hotupdate_release_baseline.py \
            --scope scenario \
            --release-json "${BASELINE_DIR}/release.json" \
            --asset-dir "${ASSET_DIR}" \
            --out-version "${BASELINE_DIR}/version_scenario.json" \
            --out-candidate "${BASELINE_DIR}/version_scenario_new.json" \
            --out-report "_artifacts/version_scenario_release_baseline.json"

      - name: "[SCENARIO] 打包 cn_scenario_update_new.zip"
        run: |
          rm -rf _pack_scn
          mkdir -p _pack_scn/madomagi/resource/scenario/json
          cp -r madomagi/resource/scenario/json/. _pack_scn/madomagi/resource/scenario/json/
          rm -f cn_scenario_update_new.zip
          cd _pack_scn && zip -r ../cn_scenario_update_new.zip madomagi/ && cd ..

          python3 - <<'PYEOF'
          import json, hashlib, os, shutil, zipfile

          CFG_DIR  = os.environ["CONFIG_DIR"]
          ZIP_NEW  = "cn_scenario_update_new.zip"
          NAME     = "version_scenario"

          # 剧情包不得再次携带 engine 表，避免两个版本通道互相覆盖。
          with zipfile.ZipFile(ZIP_NEW) as zf:
              names = zf.namelist()
          assert "madomagi/engine_i18n.tsv" not in names
          assert any(n.startswith("madomagi/resource/scenario/json/") for n in names)

          release_baseline_dir = os.path.join("_release_baseline", "scenario")
          official_path = os.path.join(release_baseline_dir, f"{NAME}.json")
          release_candidate_path = os.path.join(
              release_baseline_dir, f"{NAME}_new.json"
          )
          out_paths = [
              f"{NAME}_new.json",
              os.path.join(CFG_DIR, f"{NAME}_new.json"),
              os.path.join("_artifacts", f"{NAME}_new.json"),
          ]

          with open(ZIP_NEW, "rb") as f:
              zip_data = f.read()
          zip_md5 = hashlib.md5(zip_data).hexdigest().lower()
          from scripts.hotupdate_version import decide_candidate_version
          decision = decide_candidate_version(
              official_path,
              [release_candidate_path],
              len(zip_data),
              zip_md5,
          )
          candidate_version = decision.version
          data = {
              "version": candidate_version,
              "size":    len(zip_data),
              "md5":     zip_md5,
          }
          os.makedirs("_artifacts", exist_ok=True)
          os.makedirs(CFG_DIR, exist_ok=True)
          with open("_artifacts/version_scenario_decision.json", "w", encoding="utf-8") as f:
              json.dump(decision.to_dict(), f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(
              f"ℹ SCENARIO 版本决策: {decision.strategy}, "
              f"official={decision.official_version}, "
              f"preview={decision.existing_candidate_version}, selected={decision.version}"
          )
          for p in out_paths:
              with open(p, "w") as f:
                  json.dump(data, f, indent=2)
              print(f"✅ 写入 {p}: v{data['version']}, size={data['size']}, md5={data['md5']}")

          shutil.copy2(ZIP_NEW, os.path.join("_artifacts", ZIP_NEW))
          PYEOF

      # [SCENARIO] 同样只生成候选，由 publish job 合并后事务转正。
      - name: "[SCENARIO] 生成预览分块清单候选"
        run: |
          MANIFEST="${CONFIG_DIR}/manifest.json"
          test -f "${MANIFEST}" || { echo "::error::缺少正式分块清单 ${MANIFEST}"; exit 1; }
          python3 scripts/build_chunk_manifest.py --update "${MANIFEST}" \
              --out "_artifacts/manifest_scenario_new.json" \
              --as "cn_scenario_update.zip=cn_scenario_update_new.zip" \
              cn_scenario_update_new.zip

      - name: "[SCENARIO] 生成文件清单与账本"
        run: |
          VER=$(python3 -c "import json;print(json.load(open('version_scenario_new.json'))['version'])")
          LEDGER_MODE=check
          if [ "${{ needs.setup.outputs.publish_hotfix }}" = "true" ]; then
            LEDGER_MODE=update
          fi
          python3 scripts/build_manifest.py \
              --zip cn_scenario_update_new.zip --package cn_scenario_update --version "$VER" \
              --out _artifacts --manifest-name cn_scenario_update_manifest_new.json \
              --ledger-mode "$LEDGER_MODE" \
              | tee _scn_manifest.log
          if grep -q '继续盖住服务端' _scn_manifest.log; then
            {
              echo "### ⚠️ cn_scenario_update 这一版少了文件"
              echo
              echo '```'
              sed -n '/这一版比上一版少了/,$p' _scn_manifest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ───────────────────────────────────────────────────────────────
      # 🚀 上传 _new + (publish_hotfix=true 时) 转正
      #   v3 修复"虚空链接"bug：
      #     旧实现用 `gh release upload <tag> <本地_new文件>#<正式名>` 转正，
      #     但 `#` 后缀只是显示标签（label），asset 的真实 name 仍是
      #     *_new.*——下载 URL 按 name 走，于是网页端显示正式名、点击却
      #     跳到 _new 下载链接；手机端只显示 name（带 _new）。
      #     现在：已核验的 _new 直接 PATCH 为正式名，旧正式 asset 保留为
      #     rollback，整批验证后才删除；失败则倒序恢复。
      # ───────────────────────────────────────────────────────────────
      - name: 📤 上传 pack-scenario 产物
        id: upload_pack_scenario
        uses: actions/upload-artifact@v4
        with:
          name: pack-scenario
          path: |
            version_scenario_new.json
            configures/version_scenario_new.json
            manifests/cn_scenario_update_ledger.json
            _artifacts/cn_scenario_update_new.zip
            _artifacts/cn_scenario_update_manifest_new.json
            _artifacts/version_scenario_new.json
            _artifacts/version_scenario_decision.json
            _artifacts/version_scenario_release_baseline.json
            _artifacts/manifest_scenario_new.json
          if-no-files-found: warn
  publish:
    runs-on: ubuntu-latest
    needs: [setup, pack-js, pack-scenario]
    if: always() && needs.setup.result == 'success'
    # publish-config 只在「热更真的转正了、且 official json 真的写出来了」时才
    # 存在。commit-configs 原先按 setup 的 publish_hotfix **意图**去下它——
    # 意图为真、产物不存在，就是本次 CI 崩掉的直接原因。
    outputs:
      config_artifact: ${{ steps.upload_publish_config.outputs.artifact-id }}
    env:
      PYTHONUNBUFFERED: "1"
      : ${{ secrets. }}
      REPO_OWNER: "MagirecoCN-Revival-Project"
      REPO_NAME: "patch-front"
      PUBLISH_HOTFIX: ${{ needs.setup.outputs.publish_hotfix }}
      CONFIG_DIR: "configures"
    steps:
      - name: 🩹 恢复上次未完成的转正（取消/杀死遗留的半拉配置）
        # 转正把旧正式 asset 改名为 *.rollback-<run> 再上新。若运行被
        # 强制终止，下一次先恢复旧正式名与 _new 预览名，再开始新事务。
        run: |
          python3 <<'SCRIPT_END'
          import json
          import os
          import re
          import subprocess
          import sys

          REPO_SLUG = f"{os.environ['REPO_OWNER']}/{os.environ['REPO_NAME']}"

          def gh(*args):
              path = f"repos/{REPO_SLUG}/" + "/".join(a.lstrip("/") for a in args)
              result = subprocess.run(
                  ["gh", "api", path], capture_output=True, text=True
              )
              if result.returncode != 0:
                  raise RuntimeError(f"gh api 失败: {result.stderr.strip()}")
              return result.stdout

          def fetch_assets():
              release = json.loads(gh("/releases/tags/latest"))
              return {asset["name"]: asset for asset in release.get("assets", [])}

          def rename(asset_id, old_name, new_name):
              result = subprocess.run(
                  [
                      "gh", "api",
                      f"repos/{REPO_SLUG}/releases/assets/{asset_id}",
                      "--method", "PATCH", "-f", f"name={new_name}",
                  ],
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  raise RuntimeError(
                      f"重命名 {old_name} → {new_name} 失败: {result.stderr.strip()}"
                  )

          backups = sorted(
              (name, asset)
              for name, asset in fetch_assets().items()
              if re.search(r"\.rollback-\d+$", name)
          )
          if not backups:
              print("✓ 无残留转正备份，Release 干净")
              sys.exit(0)

          print(f"⚠ 发现 {len(backups)} 个残留转正备份，恢复 Release 到转正前状态：")
          restored = 0
          for backup_name, backup_asset in backups:
              final_name = re.sub(r"\.rollback-\d+$", "", backup_name)
              current = fetch_assets()
              promoted = current.get(final_name)
              if promoted:
                  head, _sep, ext = final_name.rpartition(".")
                  preview_name = f"{head}_new.{ext}"
                  if preview_name in current:
                      raise RuntimeError(
                          f"预览名 {preview_name} 已存在，无法退回（残留冲突）"
                      )
                  rename(promoted["id"], final_name, preview_name)
                  print(f"  退回预览: {final_name} → {preview_name}")
              rename(backup_asset["id"], backup_name, final_name)
              print(f"  还原正式: {backup_name} → {final_name}")
              restored += 1
          print(f"✅ 已恢复 {restored} 个正式资产——Release 回到转正前状态")
          SCRIPT_END
      - name: 🛡 兜底护栏（打包失败即停链）
        if: needs.pack-js.result == 'failure' || needs.pack-scenario.result == 'failure'
        run: |
          echo "::error::JS/SCENARIO 打包失败，停止发布/上传，避免污染 Release"
          exit 1
      - name: 📦 检出本仓库（正式清单基线与事务工具）
        uses: actions/checkout@v4
        with:
          token: ${{ secrets. }}
          repository: ${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}
          fetch-depth: 1
      # 判据是「产物在不在」而不是「前置 job 成功没有」：上传用的是
      # if-no-files-found: warn，job 绿了也可能一个文件都没传上去。
      - name: 📥 下载 pack-js
        if: needs.pack-js.result == 'success' && needs.pack-js.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: pack-js
          path: .
      - name: 📥 下载 pack-scenario
        if: needs.pack-scenario.result == 'success' && needs.pack-scenario.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: pack-scenario
          path: .
      - name: "[HOTUPDATE] 合并并验证 manifest_new.json"
        run: |
          python3 <<'PYEOF'
          import json
          from pathlib import Path

          artifacts = Path("_artifacts")
          baseline_path = Path("configures/manifest.json")
          scopes = (
              ("js", artifacts / "manifest_js_new.json", "cn_js_update.zip"),
              (
                  "scenario",
                  artifacts / "manifest_scenario_new.json",
                  "cn_scenario_update.zip",
              ),
          )
          available = [(scope, path, key) for scope, path, key in scopes if path.is_file()]
          if not available:
              print("ℹ 本次没有热更新候选，不生成 manifest_new.json")
              raise SystemExit(0)
          if not baseline_path.is_file():
              raise SystemExit(f"缺少正式清单基线: {baseline_path}")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          if not isinstance(baseline, dict):
              raise SystemExit("正式清单基线不是 JSON object")

          merged = dict(baseline)
          for scope, path, key in available:
              candidate = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(candidate, dict) or key not in candidate:
                  raise SystemExit(f"{scope} 清单候选缺少 {key}")
              # 每个 pack job 只能改自己拥有的热更新键；base 包和另一作用域
              # 必须逐字义等价于正式基线，避免两个并行 job 相互覆盖。
              for existing_key in set(candidate) | set(baseline):
                  if existing_key == key:
                      continue
                  if candidate.get(existing_key) != baseline.get(existing_key):
                      raise SystemExit(
                          f"{scope} 清单候选越权修改正式基线键: {existing_key}"
                      )
              merged[key] = candidate[key]

          out = artifacts / "manifest_new.json"
          out.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "✔ manifest_new.json 已合并: "
              + ", ".join(scope for scope, _, _ in available)
          )
          PYEOF
      - name: 🚀 上传热更新包到本仓库 Release
        id: hotfix_publish
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os
          import json
          import hashlib
          import shutil
          import urllib.request
          from pathlib import Path

          from scripts.hotupdate_promotion import (
              PromotionError,
              promote_available_assets,
              validate_candidate_triplets,
          )

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, indent=0): print(f"{'  '*indent}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, indent=0): print(f"{'  '*indent}{c(C.DIM, '⏭  ' + t)}", flush=True)

          REPO_OWNER = os.environ["REPO_OWNER"]
          REPO_NAME  = os.environ["REPO_NAME"]
          PUBLISH        = os.environ.get("PUBLISH_HOTFIX", "false") == "true"
          ARTIFACTS_DIR  = "_artifacts"
          CFG_DIR        = os.environ["CONFIG_DIR"]
          PREVIEW_ASSET_NAMES = {
              "cn_js_update_new.zip",
              "cn_js_update_manifest_new.json",
              "version_js_new.json",
              "cn_scenario_update_new.zip",
              "cn_scenario_update_manifest_new.json",
              "version_scenario_new.json",
              "manifest_new.json",
          }

          def fetch_assets():
              r = subprocess.run(
                  ["gh", "api", f"repos/{REPO_OWNER}/{REPO_NAME}/releases/tags/latest"],
                  capture_output=True, text=True
              )
              if r.returncode != 0 or not r.stdout.strip():
                  return None, None
              rel = json.loads(r.stdout)
              if rel.get("tag_name") != "latest":
                  return None, None
              return rel, {a["name"]: a for a in rel.get("assets", [])}

          def delete_asset(asset_id, name):
              r = subprocess.run(
                  ["gh", "api",
                   f"repos/{REPO_OWNER}/{REPO_NAME}"
                   f"/releases/assets/{asset_id}",
                   "--method", "DELETE"],
                  capture_output=True, text=True
              )
              if r.returncode == 0:
                  ok(f"已删除 asset: {name}", indent=1)
                  return True
              else:
                  warn(f"删除 [{name}] 失败: {r.stderr.strip()}", indent=1)
                  return False

          def rename_asset(asset_id, old_name, new_name):
              r = subprocess.run(
                  ["gh", "api",
                   f"repos/{REPO_OWNER}/{REPO_NAME}"
                   f"/releases/assets/{asset_id}",
                   "--method", "PATCH", "-f", f"name={new_name}"],
                  capture_output=True, text=True
              )
              if r.returncode == 0:
                  ok(f"已重命名 asset: {old_name} → {new_name}", indent=1)
                  return True
              err(f"重命名 [{old_name}] → [{new_name}] 失败: {r.stderr.strip()}", indent=1)
              return False

          def verify_uploaded_asset(name, local_path):
              """Verify the exact release name, byte size and GitHub SHA-256."""
              _, current = fetch_assets()
              asset = current.get(name) if current else None
              if asset is None:
                  err(f"上传后找不到 asset: {name}", indent=1)
                  return False
              digest = hashlib.sha256()
              expected_size = 0
              with open(local_path, "rb") as fh:
                  while chunk := fh.read(1024 * 1024):
                      expected_size += len(chunk)
                      digest.update(chunk)
              expected_digest = "sha256:" + digest.hexdigest()
              if asset.get("name") != name:
                  err(f"asset 名称不一致: {asset.get('name')} != {name}", indent=1)
                  return False
              if int(asset.get("size", -1)) != expected_size:
                  err(f"asset 大小不一致: {asset.get('size')} != {expected_size}", indent=1)
                  return False
              if asset.get("digest") != expected_digest:
                  err(f"asset SHA-256 不一致: {asset.get('digest')} != {expected_digest}", indent=1)
                  return False
              ok(f"上传后校验通过: {name} size={expected_size} sha256={expected_digest[7:]}", indent=1)
              return True

          header("上传热更新包到本仓库 Release")

          # 在触碰远端前验证每个 zip/package-manifest/version triplet，及合并后
          # 的 shared chunk manifest。预览和正式发布使用同一个失败关闭门。
          try:
              active_scopes = validate_candidate_triplets(ARTIFACTS_DIR)
          except PromotionError as exc:
              err(f"候选资产预检失败: {exc}")
              sys.exit(1)
          info(f"候选资产预检通过: {', '.join(active_scopes) or 'none'}")

          # ── 1. 拿当前 Release 信息（id + asset 列表）
          section("获取本仓库 Release 信息")
          release, existing_assets = fetch_assets()
          if release is None:
              err("获取本仓库 Release 失败")
              sys.exit(1)
          release_tag = release["tag_name"]
          info(f"Release tag: {c(C.BRIGHT_CYAN, release_tag)}  id={release['id']}")

          # ── 2. 上传所有 _artifacts 里的 _new 文件
          section("上传 _new 文件到 Release（预览）")
          if not os.path.isdir(ARTIFACTS_DIR):
              warn("_artifacts 目录不存在，跳过")
          else:
              for fname in sorted(os.listdir(ARTIFACTS_DIR)):
                  fpath = os.path.join(ARTIFACTS_DIR, fname)
                  if not os.path.isfile(fpath):
                      continue
                  # 只上传可转正候选。版本决策和分作用域中间清单留在
                  # Actions artifact 审计，不污染 Release asset 集合。
                  if fname not in PREVIEW_ASSET_NAMES:
                      skip(f"{fname} 仅作构建审计")
                      continue
                  info(f"上传: {c(C.BRIGHT_WHITE, fname)}")
                  if fname in existing_assets:
                      if not delete_asset(existing_assets[fname]["id"], fname):
                          sys.exit(1)
                  up = subprocess.run(
                      ["gh", "release", "upload", release_tag, fpath,
                       "--repo", f"{REPO_OWNER}/{REPO_NAME}",
                       "--clobber"],
                      capture_output=True, text=True
                  )
                  if up.returncode == 0:
                      ok(f"上传成功: {fname}", indent=1)
                      if not verify_uploaded_asset(fname, fpath):
                          sys.exit(1)
                  else:
                      err(f"上传失败: {up.stderr.strip()}", indent=1)
                      sys.exit(1)

          # ── 3. 如果没勾发布热更新，到此为止
          if not PUBLISH:
              section("publish_hotfix=false，跳过转正")
              skip("_new 文件已上传到 Release 供预览，official 文件不变")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("hotfix_published=false\n")
              sys.exit(0)

          # ── 4. publish_hotfix=true：把 _new 文件去掉 _new 后缀
          section("发布热更新包（_new → official，覆盖正式文件）")
          class GitHubReleaseBackend:
              def list_assets(self):
                  _, assets = fetch_assets()
                  if assets is None:
                      raise PromotionError("无法重新读取 latest assets")
                  return assets
              def rename_asset(self, asset_id, old_name, new_name):
                  return rename_asset(asset_id, old_name, new_name)
              def delete_asset(self, asset_id, name):
                  return delete_asset(asset_id, name)
              def verify_asset(self, name, local_path):
                  return verify_uploaded_asset(name, str(local_path))

          # 行为测试覆盖每个失败点；整个 JS/scenario 批次会在任一失败时倒序
          # 恢复。顺序固定为 zip → manifest → version，version 最后转正。
          try:
              promoted = promote_available_assets(
                  GitHubReleaseBackend(),
                  ARTIFACTS_DIR,
                  os.environ["GITHUB_RUN_ID"],
              )
          except PromotionError as exc:
              err(f"热更新转正事务失败: {exc}")
              sys.exit(1)

          for new_name, final_name in promoted:
              info(f"已转正并校验: {new_name} → {final_name}")
              src = Path(ARTIFACTS_DIR) / new_name
              # 把本地 official version JSON / shared chunk manifest 同步到
              # /configures/；预览阶段绝不修改这些正式路径。
              #     根目录不再放 official version_*.json；/configures/ 只作
              #     Git 镜像，后续版本分配仍重新核验 latest Release 的
              #     version + zip 实字节，避免提交滞后成为错误基线。
              if final_name in (
                  "version_js.json",
                  "version_scenario.json",
                  "manifest.json",
              ):
                  with src.open("rb") as f:
                      data = f.read()
                  with open(os.path.join(CFG_DIR, final_name), "wb") as f:
                      f.write(data)
                  ok(f"同步 official → /{CFG_DIR}/", indent=1)

          ok("热更新包发布完成")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("hotfix_published=true\n")
          SCRIPT_END
        env:
          PUBLISH_HOTFIX: ${{ needs.setup.outputs.publish_hotfix }}

      - name: 📤 上传 publish-config（热更转正后的 official 版本 json）
        id: upload_publish_config
        if: needs.setup.outputs.publish_hotfix == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publish-config
          path: |
            configures/version_js.json
            configures/version_scenario.json
            configures/manifest.json
          if-no-files-found: warn
  r2-sync:
    runs-on: ubuntu-latest
    needs: [setup, publish]
    # always()：APK 的分发不能被热更打包链连坐。没有它时有两条死法——
    #   ① pack-js 红 → publish 的「打包失败即停链」护栏红 → 本 job 被跳过；
    #   ② 没有内容变更 → pack-* 被 skip，而 **skip 会沿 needs 图向下传递**，
    #      即使 publish 靠 always() 仍然成功，本 job 照样被跳过。
    # ② 恰恰是「构建完 APK 再触发过来」这条路的常态：git 内容一个
    # 字节没变。于是 APK 每次都停在 Release 里上不了 CDN，闸门却照抬——
    # 2026-08-20 玩家无限更新的根因（run #236 属 ①，run #239 属 ②，都实证）。
    # publish 失败时本 job 同步的是 Release 上一份自洽的旧状态（热更转正是
    # 事务式的，失败会回滚），不存在把半拉热更推上 CDN 的路径。
    if: always() && needs.setup.result == 'success'
    outputs:
      apk_version: ${{ steps.sync_script.outputs.apk_version }}
      apk_name:    ${{ steps.sync_script.outputs.apk_name }}
      apk_size:    ${{ steps.sync_script.outputs.apk_size }}
    env:
      PYTHONUNBUFFERED: "1"
      : ${{ secrets. }}
      CONFIRM_CLEANUP: ${{ needs.setup.outputs.confirm_cleanup }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_REGION: ${{ secrets.R2_REGION }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
      QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
      EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
      EDGEONE_DOMAIN: ${{ secrets.EDGEONE_DOMAIN }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      ESA_SITE_ID: ${{ secrets.ESA_SITE_ID }}
      ESA_DOMAIN: ${{ secrets.ESA_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
      REPO_OWNER: "MagirecoCN-Revival-Project"
      REPO_NAME: "patch-front"
    steps:
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: pip install boto3 tencentcloud-sdk-python alibabacloud_esa20240910

      # ───────────────────────────────────────────────────────────────
      # 🚀 同步 Release 文件到 object-storage（单桶）
      #   v3 改动：
      #     - 双 S3 桶 → 单 object-storage 桶
      #     - 黑名单：history-data*（前缀）
      #     - GitHub 上已不存在的文件不主动删除，先记入
      #       PENDING_DELETIONS 变量；confirm_cleanup=true 时才删除
      #     - CDN 刷新：edge（EDGEONE_DOMAIN）+ 阿里云 ESA（ESA_DOMAIN）
      #       + CDN（CLOUDFLARE_DOMAIN）
      # ───────────────────────────────────────────────────────────────
      - name: 🚀 [object-storage系] 同步 Release 文件到 object-storage 并刷新三 CDN
        # object-storage 系：单 object-storage 桶 + edge/ESA/CDN 三 CDN 刷新（自成一系，
        # 与下方 Doge 系互不干涉）。
        id: sync_script
        run: |
          python3 <<'SCRIPT_END'
          import os
          import sys
          import json
          import subprocess
          import urllib.request
          import urllib.error

          sys.stdout.reconfigure(line_buffering=True)

          import socket
          # 兜底超时：防止某个 urlopen 无限挂起，把整个 job 卡到 6 小时上限
          socket.setdefaulttimeout(600)

          import boto3
          from botocore.exceptions import ClientError
          from tencentcloud.common import credential
          from tencentcloud.common.profile.client_profile import ClientProfile
          from tencentcloud.common.profile.http_profile import HttpProfile
          from tencentcloud.teo.v20220901 import teo_client, models
          from alibabacloud_esa20240910.client import Client as EsaClient
          from alibabacloud_esa20240910 import models as esa_models
          from alibabacloud_tea_openapi import models as open_api_models

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, indent=0): print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, indent=0): print(f"{'  '*indent}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, indent=0): print(f"{'  '*indent}{c(C.DIM, '⏭  ' + t)}", flush=True)
          def human_size(n):
              for u in ["B", "KB", "MB", "GB"]:
                  if n < 1024: return f"{n:.1f} {u}"
                  n /= 1024
              return f"{n:.1f} TB"

          # ══════════════════════════════════════════════════════════════
          # object-storage 上传过滤规则 v3
          # ══════════════════════════════════════════════════════════════
          # history-data*            → 大体积历史数据包，不走 object-storage
          # apk-overlay-atlas.zip        → 构建期内部资产，不镜像
          # legacy-client-archive*       → 存档 tag 备份，不镜像
          # 非主线 APK（非 magireco-latest*）→ 只留 GitHub Release，不上传
          R2_IGNORE_PREFIXES = (
              'history-data',
              'apk-overlay-atlas.zip',
              'legacy-client-archive',
              'legacy-client-archieve',
          )
          R2_IGNORE_SUFFIXES = (
          )

          def should_ignore_for_r2(name: str) -> bool:
              if any(name.startswith(p) for p in R2_IGNORE_PREFIXES): return True
              if any(name.endswith(s) for s in R2_IGNORE_SUFFIXES): return True
              # 非主线 APK（非 magireco-latest*）不上传，主线 APK 走 edge/object-storage
              if name.endswith('.apk') and not name.startswith('magireco-latest'): return True
              return False

          # 2026-08-22：本仓库与上游断开、转独立私有仓之后，这里原有的
          # LOCAL_OWNED_PREFIXES / is_local_owned 已删除。
          #
          # 它当初区分的是「APK 与版本旁注由构建 CI 传进本仓库 Release，其余
          # asset 来自上游 Release，同名时本仓库优先」——不这么做每次同步都会
          # 拿上游那份旧包盖掉新包。断开之后两个来源合成同一个 Release，
          # "谁优先"没有了对象，那套「全集去掉自有名 ∪ 自有名」的合并在数学上
          # 就是取全集本身。三处（本文件 + sync-dogecloud.py +
          # sync-pan123-webdav.py）已一起拆掉。

          # APK 的版本旁注：构建 CI 与 APK 一起上传，内容是本次构建的
          # client.version / sha256 / size。闸门提升以它为准（见 bump-gate）。
          APK_SIDECAR = 'magireco-latest-legacy-client.version.json'

          class R2Handler:
              def __init__(self, endpoint, access_key, secret_key,
                           region, bucket, name="object-storage"):
                  self.name   = name
                  self.bucket = bucket
                  ep = endpoint.rstrip('/')
                  self.s3_client = boto3.client(
                      's3', endpoint_url=ep,
                      aws_access_key_id=access_key,
                      aws_secret_access_key=secret_key,
                      region_name=region
                  )
              def list_files(self):
                  try:
                      paginator = self.s3_client.get_paginator('list_objects_v2')
                      files = [obj['Key'] for page in paginator.paginate(Bucket=self.bucket)
                               if 'Contents' in page for obj in page['Contents']]
                      info(f"[{c(C.BRIGHT_WHITE, self.name)}] 列出 {c(C.BOLD, str(len(files)))} 个文件")
                      return files
                  except Exception as e:
                      err(f"[{self.name}] 列出文件失败: {e}")
                      return []
              def delete_file(self, filename):
                  try:
                      self.s3_client.delete_object(Bucket=self.bucket, Key=filename)
                      ok(f"[{c(C.BRIGHT_WHITE, self.name)}] 删除: {filename}", indent=1)
                      return True
                  except ClientError as e:
                      if e.response['Error']['Code'] == '404':
                          skip(f"[{self.name}] {filename} 不存在", indent=1)
                          return True
                      err(f"[{self.name}] 删除失败: {e}", indent=1)
                      return False
                  except Exception as e:
                      err(f"[{self.name}] 删除异常: {e}", indent=1)
                      return False
              def upload_file_from_url(self, url, filename, expected_size,
                                       headers):
                  try:
                      info(f"[{c(C.BRIGHT_WHITE, self.name)}] 流式上传: "
                           f"{c(C.BRIGHT_CYAN, filename)}", indent=1)
                      # 带凭据取（见 open_asset_stream）：仓库转私有后匿名取
                      # 一律 404，而这里失败只会记一行红字、指纹不保存，
                      # 下次再来——不会有人立刻意识到是权限问题。
                      with open_asset_stream(url, headers) as response:
                          file_size = int(
                              response.headers.get('Content-Length') or 0)
                          # 真正的流式：upload_fileobj 分块边下边传
                          # （超过 8MiB 自动走 multipart），不再先把整个
                          # 文件读进内存再一次性 put——大文件耗时近减半
                          #
                          # ExtraArgs 必须给：不给的话 object-storage 里存成默认的
                          # binary/octet-stream。对 .zip 无所谓，对 .wasm 是
                          # 致命的——WebAssembly.instantiateStreaming() 会直接
                          # 抛，只能退回 arrayBuffer() 多拷一遍。
                          self.s3_client.upload_fileobj(
                              response, self.bucket, filename,
                              ExtraArgs={'ContentType': content_type_for(filename)})
                      head = self.s3_client.head_object(
                          Bucket=self.bucket, Key=filename)
                      actual_size = int(head.get("ContentLength", -1))
                      if actual_size != int(expected_size):
                          raise RuntimeError(
                              f"上传后大小不一致: {actual_size} != {expected_size}"
                          )
                      ok(f"[{c(C.BRIGHT_WHITE, self.name)}] 上传并核验完成: "
                         f"{filename} {c(C.DIM, '(' + human_size(actual_size) + ')')}",
                         indent=1)
                      return True
                  except Exception as e:
                      err(f"[{self.name}] 上传失败: {e}", indent=1)
                      return False

          # 按扩展名给 Content-Type。object-storage 不会自己猜，上传时不给就是
          # binary/octet-stream，而浏览器对 .wasm / .js 的类型是较真的。
          #
          # 只列真会经过这条流水线的扩展名，剩下的落回 octet-stream——
          # 一份猜得太宽的表比没有表更糟：把某个二进制包标成 text/plain，
          # 浏览器会按文本解码，坏得很隐蔽。
          CONTENT_TYPES = {
              '.zip':  'application/zip',
              '.apk':  'application/vnd.android.package-archive',
              '.json': 'application/json; charset=utf-8',
              '.wasm': 'application/wasm',
              '.js':   'text/javascript; charset=utf-8',
              '.css':  'text/css; charset=utf-8',
              '.html': 'text/html; charset=utf-8',
              '.iso':  'application/octet-stream',
          }

          def content_type_for(name: str) -> str:
              import posixpath
              _, ext = posixpath.splitext(name.lower())
              return CONTENT_TYPES.get(ext, 'application/octet-stream')


          class EdgeOneHandler:
              def __init__(self, secret_id, secret_key, zone_id):
                  self.zone_id = zone_id
                  cred         = credential.Credential(secret_id, secret_key)
                  hp           = HttpProfile()
                  hp.endpoint  = "teo.tencentcloudapi.com"
                  cp           = ClientProfile()
                  cp.httpProfile = hp
                  self.client  = teo_client.TeoClient(cred, "", cp)
              def purge_cache(self, domain, filename):
                  if not domain:
                      warn("[edge] 未配置 EDGEONE_DOMAIN，跳过", indent=1)
                      return False, "not configured"
                  try:
                      req        = models.CreatePurgeTaskRequest()
                      target_url = f"http://{domain}/{filename}"
                      req.from_json_string(json.dumps({
                          "ZoneId": self.zone_id,
                          "Type": "purge_url",
                          "Targets": [target_url]
                      }))
                      resp    = self.client.CreatePurgeTask(req)
                      task_id = resp.RequestId
                      ok(f"[edge] 缓存刷新: {c(C.DIM, target_url)}", indent=1)
                      return True, task_id
                  except Exception as e:
                      err(f"[edge] 刷新失败: {e}", indent=1)
                      return False, str(e)

          class EsaHandler:
              """阿里云 ESA 缓存刷新（PurgeCaches, Type=file）"""
              def __init__(self, access_key_id, access_key_secret, site_id, domain):
                  self.site_id = int(site_id)
                  self.domain  = domain
                  cfg = open_api_models.Config(
                      access_key_id=access_key_id,
                      access_key_secret=access_key_secret,
                      endpoint="esa.cn-hangzhou.aliyuncs.com",
                  )
                  self.client = EsaClient(cfg)
              def purge_files(self, urls):
                  try:
                      req = esa_models.PurgeCachesRequest(
                          site_id=self.site_id,
                          type="file",
                          content=esa_models.PurgeCachesRequestContent(files=urls),
                      )
                      resp = self.client.purge_caches(req)
                      task_id = getattr(resp.body, "task_id", None)
                      ok(f"[ESA] 缓存刷新: {c(C.DIM, ', '.join(urls))}"
                         + (f" (TaskId={task_id})" if task_id else ""), indent=1)
                      return True
                  except Exception as e:
                      err(f"[ESA] 刷新失败: {e}", indent=1)
                      return False
              def purge_cache(self, filename):
                  url = f"http://{self.domain}/{filename}" if filename \
                        else f"http://{self.domain}/"
                  return self.purge_files([url])

          class CloudflareHandler:
              """CDN CDN 缓存刷新（Purge Cache by URL）

              认证方式：API Token（Bearer）。按 URL 精确清除，
              与 edge 的 purge_url 对应。
              """
              API_BASE = "https://api.cloudflare.com/client/v4"

              def __init__(self, api_token, zone_id):
                  self.api_token = api_token
                  self.zone_id   = zone_id

              def purge_cache(self, domain, filename):
                  if not self.api_token or not self.zone_id:
                      warn("[CDN] 未配置 CLOUDFLARE_API_TOKEN / "
                           "CLOUDFLARE_ZONE_ID，跳过", indent=1)
                      return False, "not configured"
                  if not domain:
                      warn("[CDN] 未配置 CLOUDFLARE_DOMAIN，跳过",
                           indent=1)
                      return False, "not configured"
                  try:
                      target_url = (f"http://{domain}/{filename}" if filename
                                    else f"http://{domain}/")
                      req = urllib.request.Request(
                          f"{self.API_BASE}/zones/{self.zone_id}/purge_cache",
                          data=json.dumps({"files": [target_url]}).encode(),
                          headers={
                              "Authorization": f"Bearer {self.api_token}",
                              "Content-Type": "application/json",
                          },
                          method="POST",
                      )
                      with urllib.request.urlopen(req) as resp:
                          body = json.loads(resp.read().decode())
                      if not body.get("success"):
                          raise Exception(body.get("errors"))
                      ok(f"[CDN] 缓存刷新: {c(C.DIM, target_url)}",
                         indent=1)
                      return True, target_url
                  except Exception as e:
                      err(f"[CDN] 刷新失败: {e}", indent=1)
                      return False, str(e)

          def get_variable(name):
              # r2-sync 无 checkout，gh 推不出仓库，必须显式 --repo
              r = subprocess.run(
                  ['gh', 'variable', 'get', name,
                   '--repo', os.environ.get("GITHUB_REPOSITORY", "")],
                  capture_output=True, text=True)
              return r.stdout.strip() if r.returncode == 0 else ""

          def set_variable(name, body):
              subprocess.run(
                  ['gh', 'variable', 'set', name, '--body', body,
                   '--repo', os.environ.get("GITHUB_REPOSITORY", "")],
                  capture_output=True, text=True)

          def gh_output(key, value):
              path = os.environ.get('GITHUB_OUTPUT')
              if not path:
                  return
              with open(path, 'a', encoding='utf-8') as f:
                  f.write(f"{key}={value}\n")

          def asset_source_url(asset):
              """取 asset 的下载地址——优先 API 的 asset 端点。

              私有仓库上 browser_download_url 匿名取是 404；API 端点配
              Accept: application/octet-stream 才是有凭据时的正路。
              """
              return asset.get('url') or asset['browser_download_url']

          def open_asset_stream(url, headers):
              """打开一个 Release asset 的内容流——按**私有仓库**的取法。

              走 API 的 asset 端点 + Accept: application/octet-stream 并带凭据。
              它会 302 到对象存储的签名地址，那一跳**必须把 Authorization
              摘掉**——签名地址自带鉴权，再带一个 Authorization 过去会被拒。
              默认 opener 会把请求头原样带过重定向，所以这里自己接管。

              返回的是 file-like 的响应对象：既能整份 read()，也能直接交给
              boto3 的 upload_fileobj / http.client 当请求体边下边传。
              """
              h = dict(headers)
              h['Accept'] = 'application/octet-stream'

              class _DropAuthOnRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                      new = super().redirect_request(req, fp, code, msg, hdrs,
                                                     newurl)
                      if new is not None:
                          new.headers = {k: v for k, v in new.headers.items()
                                         if k.lower() != 'authorization'}
                      return new

              return urllib.request.build_opener(_DropAuthOnRedirect).open(
                  urllib.request.Request(url, headers=h))

          def download_asset_bytes(asset, headers):
              """整份取一个 Release asset 的内容（旁注这类小文件用）。

              取不到只会「不报版本」→ 闸门不动，安全但极其安静，等发现时已经
              过了好几个版本。所以宁可一开始就按私有仓库写，别等转私有那天再踩。
              """
              with open_asset_stream(asset_source_url(asset), headers) as resp:
                  return resp.read()

          def emit_apk_version(assets, synced, headers):
              """把「CDN 上现在是哪一版 APK」交给 bump-gate。

              闸门只允许跟着**玩家真能装到的那个包**走，所以报告有三个前提，
              少一条就不报。不报的代价是玩家少一次更新提示；报错的代价是
              玩家陷入无限更新——两者不对称，所以这里一律宁可不报：
                · APK 与旁注都处于已同步状态（本次刚传完，或指纹一致说明
                  早就在桶里了）；
                · 旁注里的 sha256 与 Release 上 APK asset 的 digest 一致；
                · 旁注的 apk 字段确实指向这个 APK 名。
              """
              sidecar = assets.get(APK_SIDECAR)
              if sidecar is None:
                  skip(f"Release 上没有 {APK_SIDECAR}，本次不报告客户端版本")
                  return
              if APK_SIDECAR not in synced:
                  skip(f"{APK_SIDECAR} 未处于已同步状态，本次不报告客户端版本")
                  return
              try:
                  meta = json.loads(download_asset_bytes(sidecar, headers).decode())
              except Exception as e:
                  warn(f"读取 {APK_SIDECAR} 失败: {e}，本次不报告客户端版本")
                  return
              apk_name = meta.get('apk') or ''
              apk = assets.get(apk_name)
              if apk is None:
                  warn(f"旁注指向的 {apk_name!r} 不在待同步集合里，不报告版本")
                  return
              if apk_name not in synced:
                  skip(f"{apk_name} 未处于已同步状态，本次不报告客户端版本")
                  return
              want = str(meta.get('sha256') or '').lower()
              got = str(apk.get('digest') or '').lower().replace('sha256:', '')
              if not want or not got or want != got:
                  err(f"{apk_name} 的 digest 与旁注 sha256 不符"
                      f"（旁注 {want[:12] or '空'}… / asset {got[:12] or '空'}…），"
                      "两者不是同一次构建的产物，不报告版本")
                  return
              version = str(meta.get('version') or '')
              if not version:
                  warn(f"{APK_SIDECAR} 里没有 version 字段，不报告版本")
                  return
              size = int(meta.get('size') or apk.get('size', 0))
              ok(f"CDN 上的客户端版本: {c(C.BRIGHT_WHITE, version)}"
                 f"（{apk_name}, {human_size(size)}）")
              gh_output('apk_version', version)
              gh_output('apk_name', apk_name)
              gh_output('apk_size', str(size))

          def main():
              CONFIRM_CLEANUP = os.environ.get("CONFIRM_CLEANUP", "false") == "true"

              header("初始化")
              r2 = R2Handler(
                  os.environ['R2_ENDPOINT'], os.environ['R2_ACCESS_KEY'],
                  os.environ['R2_SECRET_KEY'], os.environ['R2_REGION'],
                  os.environ['R2_BUCKET'], "object-storage"
              )
              edge = EdgeOneHandler(
                  os.environ['QCLOUD_SECRET_ID'],
                  os.environ['QCLOUD_SECRET_KEY'],
                  os.environ['EDGEONE_ZONE_ID']
              )
              edgeone_domain = os.environ.get('EDGEONE_DOMAIN', '').strip()
              esa = EsaHandler(
                  os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],
                  os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],
                  os.environ['ESA_SITE_ID'],
                  os.environ['ESA_DOMAIN']
              )
              cloudflare = CloudflareHandler(
                  os.environ.get('CLOUDFLARE_API_TOKEN', ''),
                  os.environ.get('CLOUDFLARE_ZONE_ID', '')
              )
              cf_domain = os.environ.get('CLOUDFLARE_DOMAIN', '').strip()
              ok("object-storage + edge + 阿里云 ESA + CDN 已初始化")

              # 不给默认值：这两个变量已经过了 job 第一步的白名单护栏，
              # 缺了就该当场炸。原先的默认值是断开前的上游 owner——真要落到
              # 默认值上，这条流水线会安静地去读一个我们已经不再同步的仓库，
              # 然后把它的 Release 当成权威内容推上 CDN。
              owner = os.environ['REPO_OWNER']
              repo  = os.environ['REPO_NAME']

              GH_HEADERS = {
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if os.environ.get(''):
                  GH_HEADERS['Authorization'] = f"Bearer {os.environ['']}"

              def fetch_latest_release(full_name):
                  """取 <owner>/<repo> 的 latest Release；没有 Release 返回 None。"""
                  try:
                      req = urllib.request.Request(
                          f"https://api.github.com/repos/{full_name}/releases/latest",
                          headers=GH_HEADERS
                      )
                      with urllib.request.urlopen(req) as resp:
                          return json.loads(resp.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return None
                      raise

              header(f"获取 {owner}/{repo} 最新 Release")
              release = fetch_latest_release(f"{owner}/{repo}")
              if release is None:
                  warn("本仓库无 Release，跳过")
                  return

              info(f"Release: {c(C.BRIGHT_WHITE, release.get('name') or release.get('tag_name'))}")

              # 待同步集合 = Release 全集（去掉自有名）∪ 本仓库自有名。
              # 顺序不能反：同名时本仓库那份优先——它才是构建 CI 的落点。
              assets_by_name = {
                  a['name']: a
                  for a in release.get('assets', [])
                  if not should_ignore_for_r2(a['name'])
              }

              current_map = {n: (a.get('digest') or '')
                             for n, a in assets_by_name.items()}
              info(f"包含 {c(C.BOLD, str(len(current_map)))} 个待同步 asset")

              header("比对文件指纹")
              old_raw = get_variable('LAST_SYNC_FINGERPRINTS')
              old_map = {}
              if old_raw:
                  try:
                      old_map = json.loads(old_raw)
                      info(f"历史指纹: {c(C.BOLD, str(len(old_map)))} 个文件")
                  except Exception:
                      warn("历史指纹解析失败，视为首次同步")

              to_process, unchanged, deleted = [], [], []
              for fname, sha in current_map.items():
                  if fname not in old_map:
                      info(f"{c(C.BRIGHT_YELLOW, fname)} → 新文件")
                      to_process.append(fname)
                  elif sha and old_map[fname] != sha:
                      info(f"{c(C.BRIGHT_YELLOW, fname)} → 已更新")
                      to_process.append(fname)
                  elif not sha:
                      to_process.append(fname)
                  else:
                      unchanged.append(fname)
              for fname in old_map:
                  if fname not in current_map:
                      deleted.append(fname)

              # 内容包先上传，版本/配置文件最后上传，避免中断时出现
              # “新版本元数据已经可见、实际新内容尚未上传”的短暂错配。
              # 旁注也在此列：它是「这一版 APK 已经在 CDN 上」的凭据，
              # 必须排在 APK 本体之后，否则中断时会留下「版本已宣称、包还没上去」。
              VERSION_LAST = {"version_js.json", "version_scenario.json", "manifest.json",
                              APK_SIDECAR}
              to_process.sort(key=lambda name: (1 if name in VERSION_LAST else 0, name))

              # ════════════════════════════════════════════════════════
              # 过时文件处理（v3：不主动删除，需手动确认）
              #   object-storage 上存在、但 GitHub Release 已不存在的文件 → 记入
              #   PENDING_DELETIONS 变量；只有 confirm_cleanup=true
              #   手动运行时才真正删除。
              # ════════════════════════════════════════════════════════
              header("检查 object-storage 过时文件（GitHub 已不存在）")
              r2_files = r2.list_files()
              stale_now = sorted({
                  f for f in r2_files
                  if not should_ignore_for_r2(f) and f not in current_map
              })

              prev_pending = []
              pend_raw = get_variable('PENDING_DELETIONS')
              if pend_raw:
                  try:
                      prev_pending = json.loads(pend_raw)
                      if not isinstance(prev_pending, list):
                          prev_pending = []
                  except Exception:
                      warn("PENDING_DELETIONS 解析失败，按空列表处理")
              stale_all = sorted(set(stale_now) | set(prev_pending))

              if not stale_all:
                  ok("无过时文件")
                  if CONFIRM_CLEANUP:
                      info("confirm_cleanup=true，但没有待清理文件")
              elif not CONFIRM_CLEANUP:
                  warn(f"检测到 {c(C.BOLD, str(len(stale_all)))} 个 GitHub 上已不存在的文件，"
                       "按规则【不主动删除】：")
                  for fname in stale_all:
                      warn(f"待清理: {fname}", indent=1)
                  warn("确认无误后，请手动运行本 workflow 并勾选 "
                       "confirm_cleanup=true 执行删除")
                  set_variable('PENDING_DELETIONS',
                               json.dumps(stale_all, ensure_ascii=False))
                  ok("待清理列表已写入 PENDING_DELETIONS 仓库变量")
              else:
                  header(f"确认清理：删除 {len(stale_all)} 个 object-storage 过时文件")
                  for fname in stale_all:
                      if r2.delete_file(fname):
                          # 删完顺手刷掉三个 CDN 上的残留缓存
                          edge.purge_cache(edgeone_domain, fname)
                          esa.purge_cache(fname)
                          cloudflare.purge_cache(cf_domain, fname)
                  set_variable('PENDING_DELETIONS', '[]')
                  ok("PENDING_DELETIONS 已清空")

              if not to_process:
                  header("无新增/更新文件")
                  # 没有新文件不等于不用报版本：闸门可能因为上一次 bump-gate
                  # 失败（token 过期之类）还停在旧值，这里照报，让它自愈。
                  emit_apk_version(assets_by_name, set(unchanged), GH_HEADERS)
                  return

              header(f"上传 {len(to_process)} 个文件")
              processed = []
              for fname in to_process:
                  source_asset = assets_by_name[fname]
                  url = asset_source_url(source_asset)
                  if r2.upload_file_from_url(url, fname, source_asset['size'],
                                             GH_HEADERS):
                      edge.purge_cache(edgeone_domain, fname)
                      esa.purge_cache(fname)
                      cloudflare.purge_cache(cf_domain, fname)
                      processed.append(fname)
                  else:
                      err(f"上传失败: {fname}")

              failed = sorted(set(to_process) - set(processed))
              if failed:
                  err(f"object-storage 有 {len(failed)} 个文件上传/核验失败，不保存指纹")
                  for fname in failed:
                      err(fname, indent=1)
                  sys.exit(1)

              if processed:
                  header("刷新根目录 CDN 缓存")
                  edge.purge_cache(edgeone_domain, "")
                  esa.purge_cache("")
                  cloudflare.purge_cache(cf_domain, "")

              header("保存指纹")
              final_map = old_map.copy()
              for fname in unchanged: final_map[fname] = old_map[fname]
              for fname in processed: final_map[fname] = current_map[fname]
              for fname in deleted: final_map.pop(fname, None)
              subprocess.run(
                  ['gh', 'variable', 'set', 'LAST_SYNC_FINGERPRINTS',
                   '--body', json.dumps(final_map),
                   '--repo', os.environ.get("GITHUB_REPOSITORY", "")],
                  check=True
              )
              ok(f"指纹已保存（{c(C.BOLD, str(len(final_map)))} 个）")

              header("报告 CDN 上的客户端版本（供 bump-gate 提升闸门）")
              emit_apk_version(assets_by_name, set(unchanged) | set(processed),
                               GH_HEADERS)

          if __name__ == "__main__":
              try:
                  main()
              except Exception as e:
                  err(f"脚本失败: {e}")
                  import traceback; traceback.print_exc()
                  sys.exit(1)
          SCRIPT_END
        env:
          CONFIRM_CLEANUP: ${{ needs.setup.outputs.confirm_cleanup }}

      # ───────────────────────────────────────────────────────────────
      # 🚀 DogeCloud 系：多吉云 S3 兼容镜像 + 多吉云 CDN 刷新（独立流水线）
      #   ▸ 在 mainland 自托管 runner 上跑 scripts/sync-dogecloud.py：
      #     2026-08-13 起改用多吉云**服务端 fetch 拉取**（/oss/fetch.json +
      #     query.json 轮询），runner 只做控制面，不再下载+上传大文件
      #   ▸ 源 URL 用脚本内 race_source_cdn() 竞速国内 CDN 选最快
      #     （edge/esa/r2，吞吐会变，运行时就地测）
      #   ▸ 排在 r2-sync 之后：CDN 要等 object-storage 系完活才能清缓存+拉到新内容
      #   ▸ 实时日志/成败原生反馈；脚本失败即本 job 红（不静默失效）
      #   ▸ Doge 具体逻辑全在 scripts/sync-dogecloud.py，与 object-storage 系互不干涉；
      #     指纹存 GitHub variable LAST_DOGE_FINGERPRINTS
      #   ▸ 过滤规则与 object-storage 系一致（history-data* 不同步）；
      #     confirm_cleanup=true 才删除 Doge 桶过时文件，否则仅列出
      # ───────────────────────────────────────────────────────────────
  doge-sync:
    runs-on: [self-hosted, mainland]
    # 排在 r2-sync 之后：多吉云从国内 CDN 拉文件，CDN 要等 object-storage 系完活才能
    # 清缓存+拉到新内容（2026-08-13）
    needs: [setup, publish, r2-sync]
    # 可由仓库变量显式停用；缺省开启。停用属于主动选择，不应阻塞游标。
    if: always() && needs.setup.result == 'success' && fromJSON(vars.ENABLE_DOGE_SYNC || 'true')
    env:
      PYTHONUNBUFFERED: "1"
      : ${{ secrets. }}
      DOGE_ACCESS_KEY: ${{ secrets.DOGE_ACCESS_KEY }}
      DOGE_SECRET_KEY: ${{ secrets.DOGE_SECRET_KEY }}
      DOGE_BUCKET:     ${{ secrets.DOGE_BUCKET }}
      DOGE_DOMAIN:     ${{ secrets.DOGE_DOMAIN }}
      DOGE_API_BASE:   "https://api.dogecloud.com"
      REPO_OWNER: "MagirecoCN-Revival-Project"
      REPO_NAME: "patch-front"
      CONFIRM_CLEANUP: ${{ needs.setup.outputs.confirm_cleanup }}
    steps:
      - name: ⬇ 下载脚本（不 clone 1.1GB 仓库）
        run: |
          set -euo pipefail
          mkdir -p scripts
          # 顺序是有讲究的，别再调回去：
          #   ① 带凭据的 contents API 打头。仓库转私有后 raw.githubusercontent
          #      与任何第三方代理都一律 404，只有这条走得通；api.github.com 在
          #      mainland 可达（本 job 的脚本自己也在调它）。
          #   ② gh-proxy 只作公开期的加速回退。从第三方代理拉**要执行的代码**
          #      本身就意味着它能换掉这份代码，不该是常规路径。
          # token 用 ： 不会自动注入到环境变量，本 job 的
          # env 里也没有它——原先那条回退写的是 $，实际发的是空
          # 凭据（401）。也就是说「双保险」一直只有一保，转私有当天两条一起死。
          curl -fsSL -H "Authorization: Bearer $" \
               -H "Accept: application/vnd.github.raw+json" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/sync-dogecloud.py?ref=main" \
               -o scripts/sync-dogecloud.py \
            || curl -fsSL \
                 "https://gh-proxy.org/https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/sync-dogecloud.py" \
                 -o scripts/sync-dogecloud.py
          test -s scripts/sync-dogecloud.py && echo "脚本就绪: $(wc -c < scripts/sync-dogecloud.py) bytes"
      - name: 🐍 确保 boto3 可用
        run: |
          set -euo pipefail
          # 双保险：版本兼容直接过；不兼容/没装则自举 pip 再装。裸机 runner 可能
          # 既没 pip 也没预装依赖；apt 预装的 botocore 可能过旧不支持
          # request_checksum_calculation（2026-08-12 RainYun 新 runner 实测 TypeError）。
          # 判据用 botocore Config 能否接受该参数，而不是只看 boto3 能 import。
          if ! python3 -c "from botocore.config import Config; Config(request_checksum_calculation='when_required')" >/dev/null 2>&1; then
            echo "boto3/botocore 版本不兼容或未装，准备安装…"
            python3 -m pip --version >/dev/null 2>&1 || {
              echo "无 pip，自举…"
              python3 -m ensurepip --upgrade >/dev/null 2>&1 \
                || { sudo apt-get update -qq; sudo apt-get install -y -qq python3-pip; }
            }
            python3 -m pip install --break-system-packages -U -q \
              -i https://mirrors.aliyun.com/pypi/simple/ boto3 botocore
          fi
          python3 -c "import boto3; print('boto3', boto3.__version__)"
      - name: 🚀 [Doge系] 同步 Release 文件到多吉云并刷新多吉云 CDN
        run: |
          set -euo pipefail
          # 在 mainland 自托管 runner 上直接执行；脚本失败即步骤红（不静默失效）
          python3 scripts/sync-dogecloud.py

  # ───────────────────────────────────────────────────────────────
  # ☁️ [123云盘] 上传 Release 文件（WebDAV）
  #   ▸ 123云盘（123pan.com）暴露标准 WebDAV，Basic Auth + PROPFIND/MKCOL/
  #     PUT/DELETE。给「下载引擎不可靠」的玩家一条网盘兜底线路（配合离线包
  #     静态站手动下载）。
  #   ▸ 在 mainland 自托管 runner 跑（runner 从国内 CDN 拉文件、123云盘境内直连；
  #     GitHub 官方 runner 跨太平洋 PUT 大文件会极慢）
  #   ▸ 源站用 race_source_cdn() 竞速国内 CDN 选最快（2026-08-13，不再走 GitHub
  #     的 browser_download_url——objects.githubusercontent.com 从 mainland 被墙）
  #   ▸ 增量：PROPFIND 列远端目录按 getcontentlength 与 Release asset size
  #     比对，相同跳过，只传新增/变更（幂等，重跑不重传）
  #   ▸ 过时文件不主动删，confirm_cleanup=true 才删；目标目录应专用作镜像
  #   ▸ secrets: PAN123_WEBDAV_URL / PAN123_USER / PAN123_PASS
  #   ▸ vars: PAN123_DIR（可选，目标子目录；不配则用 WebDAV 根）
  # ───────────────────────────────────────────────────────────────
  pan123-upload:
    runs-on: [self-hosted, mainland]
    # 排在 r2-sync 之后：runner 从国内 CDN 下载，CDN 要等 object-storage 系完活才能
    # 清缓存+拉到新内容（2026-08-13）
    needs: [setup, publish, r2-sync]
    # 可由仓库变量显式停用；缺省开启。停用属于主动选择，不应阻塞游标。
    if: always() && needs.setup.result == 'success' && fromJSON(vars.ENABLE_PAN123_SYNC || 'true')
    env:
      PYTHONUNBUFFERED: "1"
      : ${{ secrets. }}
      PAN123_WEBDAV_URL: ${{ secrets.PAN123_WEBDAV_URL }}
      PAN123_USER:       ${{ secrets.PAN123_USER }}
      PAN123_PASS:       ${{ secrets.PAN123_PASS }}
      PAN123_DIR:        ${{ vars.PAN123_DIR }}
      REPO_OWNER: "MagirecoCN-Revival-Project"
      REPO_NAME: "patch-front"
      CONFIRM_CLEANUP:   ${{ needs.setup.outputs.confirm_cleanup }}
    steps:
      - name: ⬇ 下载脚本（不 clone 1.1GB 仓库）
        run: |
          set -euo pipefail
          mkdir -p scripts
          # 顺序是有讲究的，别再调回去：
          #   ① 带凭据的 contents API 打头。仓库转私有后 raw.githubusercontent
          #      与任何第三方代理都一律 404，只有这条走得通；api.github.com 在
          #      mainland 可达（本 job 的脚本自己也在调它）。
          #   ② gh-proxy 只作公开期的加速回退。从第三方代理拉**要执行的代码**
          #      本身就意味着它能换掉这份代码，不该是常规路径。
          # token 用 ： 不会自动注入到环境变量，本 job 的
          # env 里也没有它——原先那条回退写的是 $，实际发的是空
          # 凭据（401）。也就是说「双保险」一直只有一保，转私有当天两条一起死。
          curl -fsSL -H "Authorization: Bearer $" \
               -H "Accept: application/vnd.github.raw+json" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/sync-pan123-webdav.py?ref=main" \
               -o scripts/sync-pan123-webdav.py \
            || curl -fsSL \
                 "https://gh-proxy.org/https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/sync-pan123-webdav.py" \
                 -o scripts/sync-pan123-webdav.py
          test -s scripts/sync-pan123-webdav.py && echo "脚本就绪: $(wc -c < scripts/sync-pan123-webdav.py) bytes"
      - name: 🐍 确保 requests 可用
        run: |
          set -euo pipefail
          # 双保险：已装好直接过；没装则自举 pip（ensurepip → apt → get-pip）再装
          if ! python3 -c "import requests" >/dev/null 2>&1; then
            echo "requests 未装，准备安装…"
            python3 -m pip --version >/dev/null 2>&1 || {
              echo "无 pip，自举…"
              python3 -m ensurepip --upgrade >/dev/null 2>&1 \
                || { sudo apt-get update -qq; sudo apt-get install -y -qq python3-pip; }
            }
            python3 -m pip install --break-system-packages -q \
              -i https://mirrors.aliyun.com/pypi/simple/ requests
          fi
          python3 -c "import requests; print('requests', requests.__version__)"
      - name: ☁️ [123云盘] WebDAV 同步 Release 文件
        run: |
          set -euo pipefail
          # 在 mainland 自托管 runner 上执行；脚本失败即步骤红（不静默失效）
          python3 scripts/sync-pan123-webdav.py

      # ───────────────────────────────────────────────────────────────
      # 💾 提交配置变更并推送 main
      #   ▸ 版本 json 在本地 commit 一次，直接 push 到本仓库 main。
      #     2026-08-22 之前这里是「同一个 SHA 推上游、再 gh repo sync 把下游
      #     对齐」的双写，为的是让 fork 页不显示 ahead/behind 分叉；断开上游
      #     之后既没有 fork 页也没有第二个仓库，整套双写已删除。
      #   ▸ stage 只允许已知名字的配置文件，绝不 git add -A；
      #     official version_*.json 只在 /configures/ 下维护，
      #     根目录只放 _new 预览副本。
      #   ▸ commit 信息必须带 [skip ci]：本 workflow 现由 push 触发，
      #     少了它就是无限自激。
      #   ▸  需要对本仓库有 contents:write 权限。
      # ───────────────────────────────────────────────────────────────
  commit-configs:
    runs-on: ubuntu-latest
    needs: [setup, pack-js, pack-scenario, publish]
    if: always() && needs.setup.result == 'success'
    outputs:
      committed:   ${{ steps.commit_configs.outputs.committed }}
      sha:         ${{ steps.commit_configs.outputs.sha }}
      short_sha:   ${{ steps.commit_configs.outputs.short_sha }}
      final_sync_sha: ${{ steps.commit_configs.outputs.final_sync_sha }}
    env:
      PYTHONUNBUFFERED: "1"
      : ${{ secrets. }}
      REPO_OWNER: "MagirecoCN-Revival-Project"
      REPO_NAME: "patch-front"
      CONFIG_DIR: "configures"
    steps:
      - name: 📦 检出本仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets. }}
          repository: MagirecoCN-Revival-Project/patch-front
          # 浅克隆即可：本 job 只 add+commit+push，不需要 diff 完整历史区间
          # （那是 setup/detect 的职责）。fetch-depth: 0 会把数 GB 的 blob
          # 历史全拉下来，实跑卡在 checkout 十几分钟。并发 push 冲突的罕见
          # 场景由 push 重试里的 unshallow 兜底。
          fetch-depth: 1
      - name: 🔧 配置 Git
        run: |
          git config user.name "Hiiragi Nemu"
          git config user.email "128921071+HiiragiNemu@users.noreply.github.com"
          git config rebase.autoStash true
      # 判据是「产物在不在」而不是「前置 job 成功没有」：上传用的是
      # if-no-files-found: warn，job 绿了也可能一个文件都没传上去。
      - name: 📥 下载 pack-js
        if: needs.pack-js.result == 'success' && needs.pack-js.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: pack-js
          path: .
      - name: 📥 下载 pack-scenario
        if: needs.pack-scenario.result == 'success' && needs.pack-scenario.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: pack-scenario
          path: .
      - name: 📥 下载 publish-config（热更转正 official json）
        if: needs.publish.result == 'success' && needs.publish.outputs.config_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: publish-config
          path: .
      # 「本该有却没有」必须说出来，不能静默跳过：那意味着这一轮的 official
      # version json 没跟着提交，客户端会继续读到上一版的版本号。
      - name: ⚠ publish-config 缺失提醒
        if: needs.setup.outputs.publish_hotfix == 'true' && needs.publish.outputs.config_artifact == ''
        run: |
          echo "::warning::setup 判定要转正热更（publish_hotfix=true），但 publish 没有产出 publish-config。"
          echo "::warning::本轮不会提交 configures/version_*.json 与 manifest.json 的 official 版本；请查 publish job 的日志。"
          {
            echo "### ⚠ publish-config 缺失"
            echo ""
            echo "- \`publish_hotfix\` = true，但 publish job 没上传 publish-config"
            echo "- publish job 结果：\`${{ needs.publish.result }}\`"
            echo "- 结果：本轮 official \`version_*.json\` / \`manifest.json\` 未提交，客户端仍读上一版"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 💾 提交配置变更并推送 main
        id: commit_configs
        # 分发或镜像失败时不固化 official 版本；重试仍复用同一候选版本。
        if: success()
        run: |
          set -e

          # 二次安全护栏：在真正 push 之前再确认一次 origin URL
          ORIGIN_URL=$(git remote get-url origin)
          if ! echo "$ORIGIN_URL" | grep -qiE "[/:]${REPO_OWNER}/${REPO_NAME}(\.git)?\$"; then
            echo "::error::push 前 origin 校验失败：$ORIGIN_URL"
            exit 1
          fi
          # push 目标由 env 拼出（env 已在 job 第一步过了白名单），
          # token 只出现在命令行参数里，不落盘到 git remote 配置
          PUSH_URL="https://x-access-token:${}@github.com/${REPO_OWNER}/${REPO_NAME}.git"
          case "$PUSH_URL" in
            *github.com/${REPO_OWNER}/${REPO_NAME}.git) ;;
            *) echo "::error::push URL 异常，拒绝继续"; exit 1 ;;
          esac

          # 正式 manifest.json 只来自 publish job 已完成并核验的 Release
          # 转正事务（publish-config artifact）。预览运行不得在这里用 _new
          # zip 重建正式清单，否则客户端会拿正式 zip 对上预览哈希。

          # 只 stage 我们已知名字的配置文件，绝不 git add -A 任意路径，
          # 避免误把别的临时产物（_artifacts/ / 打包过程落盘的资源等）
          # 当成配置变更提交回去。
          # 注意：official version_*.json 只在 /configures/ 下维护，
          # 根目录不再提交 official 副本（_new 预览文件仍写根目录）。
          git add \
              manifests/cn_js_update_ledger.json \
              manifests/cn_scenario_update_ledger.json \
              version_scenario_new.json \
              version_js_new.json \
              "${CONFIG_DIR}/version_scenario.json" "${CONFIG_DIR}/version_scenario_new.json" \
              "${CONFIG_DIR}/version_js.json"       "${CONFIG_DIR}/version_js_new.json" \
              "${CONFIG_DIR}/manifest.json" \
              2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ 配置文件无变更可提交"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # commit 消息描述本次干了什么
          MSG="ci: sync version_*.json"
          if [ "${{ needs.setup.outputs.publish_hotfix }}" = "true" ]; then
            MSG="$MSG (hotfix published)"
          fi
          # 🔴 [skip ci] 不能删：本 workflow 现在由 push 触发（见文件开头 on:），
          # 这个 commit 自己就是一次 push。没有它就是无限自激循环。
          MSG="$MSG [skip ci]"
          git commit -m "$MSG"
          echo "committed=true" >> "$GITHUB_OUTPUT"

          # 推 main（最多 5 次，0 / 2 / 4 / 8 / 16 秒退避）。
          # main 若在运行期间被别人推过，rebase 把新 commit 包进来再推。
          PUSHED=0
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            if git push "$PUSH_URL" HEAD:main; then
              PUSHED=1
              break
            fi
            echo "⚠ push 失败，rebase 最新 main 后重试..."
            # 浅克隆（fetch-depth: 1）下 rebase 缺历史会失败，先 unshallow 补齐再 rebase
            git pull --rebase "$PUSH_URL" main 2>/dev/null || \
              { git fetch --unshallow "$PUSH_URL" 2>/dev/null && \
                git pull --rebase "$PUSH_URL" main; } || true
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::配置 commit 推送失败 5 次；本次游标不会更新，下次运行自动重建并重推"
            exit 1
          fi

          # 2026-08-22：这里原先还有一步 `gh repo sync 下游 --source 上游`，
          # 用来让 fork 页不显示 ahead/behind 分叉。断开上游之后既没有 fork 页
          # 也没有第二个仓库要对齐，整步删除——留着就是把仓库同步到它自己。

          FINAL_SHA=$(git rev-parse HEAD)
          echo "FINAL_SYNC_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${FINAL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "✔ 已推送 main: ${FINAL_SHA:0:7}"

      # ───────────────────────────────────────────────────────────────
      # 📝 更新同步游标（LAST_SYNC_COMMIT_SHA）
      #   刻意放在所有关键步骤之后、且不带 if: always()——前面任何一步
      #   失败（object-storage 上传 / Release 镜像 / json 回写）本步骤都会被跳过，
      #   游标保持旧值，下次运行才能再次检测到 SHA 差异并重试，
      #   避免"失败却先把游标更新了"导致改动永久丢失。
      # ───────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────
  # 🆙 提升版本闸门（runtime-config 的 client.version）
  #   闸门必须跟着**玩家真能装到的那个包**走，所以它排在 r2-sync 之后、
  #   以 r2-sync 报出的「CDN 上现在是哪一版」为输入。
  #
  #   2026-08-20 之前这一步长在构建 APK 的 CI 里：打完包当场把闸门抬到本次
  #   构建号，与「APK 有没有真的上 CDN」没有任何因果关系。那天 APK 卡在
  #   Release 里没上 CDN（见 r2-sync 的 always() 注释），闸门照抬，全体旧版
  #   客户端装完还是低于闸门 —— 无限更新。搬到这里之后，闸门在因果上不可能
  #   跑到 CDN 前面。
  #
  #   落地前再 HEAD 一次 config.json 里的 apk_url，核对 CDN 边缘真正吐出来的
  #   大小：对不上就不抬。闸门高于玩家能下到的版本，代价是所有人无限更新，
  #   比多红一次贵得多。
  # ───────────────────────────────────────────────────────────────
  bump-gate:
    runs-on: ubuntu-latest
    needs: [r2-sync]
    # apk_version 只在「APK 与旁注都确实处于已同步状态、且旁注 sha256 与
    # asset digest 对得上」时才有值（见 r2-sync 的 emit_apk_version）。
    # 空值 = 这次没有可确认的 APK，本 job 整个跳过，闸门不动。
    if: needs.r2-sync.outputs.apk_version != ''
    env:
      : ${{ secrets. }}
      CONFIG_OWNER: "MagirecoCN-Revival-Project"
      CONFIG_REPO: "runtime-config"
      CONFIG_PATH: "legacy/config.json"
      APK_VERSION: ${{ needs.r2-sync.outputs.apk_version }}
      APK_NAME: ${{ needs.r2-sync.outputs.apk_name }}
      APK_SIZE: ${{ needs.r2-sync.outputs.apk_size }}
    steps:
      - name: 🛡 安全护栏（校验配置仓库在白名单中）
        # 与 setup 那道同源：即便 env 被误改成别的 owner/repo，真正动手写
        # 的这一步也会 fail-fast，绝不往陌生仓库推 commit。
        run: |
          python3 <<'SCRIPT_END'
          import os, sys
          ALLOW_CONFIG = {"MagirecoCN-Revival-Project/runtime-config"}
          target = f"{os.environ['CONFIG_OWNER']}/{os.environ['CONFIG_REPO']}"
          if target not in ALLOW_CONFIG:
              print(f"::error::在线配置仓库 {target} 不在白名单中")
              print(f"::error::允许: {sorted(ALLOW_CONFIG)}")
              sys.exit(1)
          print(f"✔ 配置仓库 OK: {target}")
          SCRIPT_END

      - name: 🔑 预检  够得着配置仓库
        # 三种死法处理办法完全不同，分开报：secret 没配 / token 失效 /
        # token 有效但够不着目标。挤成一句「缺失或无权限」会把人送去查权限
        # 设置，而过期的其实是 token（2026-08-13 就这么浪费过一次）。
        run: |
          set -euo pipefail
          if [ -z "${:-}" ]; then
            echo "::error:: secret 未配置或为空（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Bearer ${}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${CONFIG_OWNER}/${CONFIG_REPO}" || echo 000)
          case "$CODE" in
            200) echo "✔ 够得着 ${CONFIG_OWNER}/${CONFIG_REPO}" ;;
            401) echo "::error:: 无效（HTTP 401 Bad credentials）。这不是权限问题——token 已过期、被撤销，或写进 secret 时混入了换行/空格。请重新签发一枚并更新 secret。"; exit 1 ;;
            403|404) echo "::error::token 有效但够不着 ${CONFIG_OWNER}/${CONFIG_REPO}（HTTP $CODE）。无权限时 GitHub 同样返回 404，所以这既可能是权限不够，也可能是仓库名写错了。闸门写在该仓库的 ${CONFIG_PATH}，token 需要对它有 contents:write。"; exit 1 ;;
            *) echo "::error::读取 ${CONFIG_OWNER}/${CONFIG_REPO} 返回 HTTP $CODE，无法确认凭据"; exit 1 ;;
          esac

      - name: 🆙 按 CDN 实况提升闸门
        run: |
          set -euo pipefail
          echo "r2-sync 报告：CDN 上现在是 ${APK_VERSION}（${APK_NAME}，${APK_SIZE} 字节）"

          rm -rf cfg
          git clone --depth 1 \
            "https://x-access-token:${}@github.com/${CONFIG_OWNER}/${CONFIG_REPO}.git" cfg
          APK_URL=$(python3 -c "import json, os; print(json.load(open(os.path.join('cfg', os.environ['CONFIG_PATH']), encoding='utf-8'))['client']['apk_url'])")
          echo "config.json 里给玩家的下载地址: ${APK_URL}"

          # ── 核对 CDN 边缘真正吐出来的东西 ──
          # r2-sync 已经在 object-storage 侧核过大小并刷了三个 CDN；这里核的是刷新在边缘
          # 生效之后的结果，秒级到分钟级延迟都正常，所以重试几次再判死。
          SEEN=""
          for i in 1 2 3 4 5; do
            LEN=$(curl -sS -I --max-time 60 "$APK_URL" | tr -d '\r' \
                  | awk 'tolower($1)=="content-length:"{print $2}' | tail -1 || true)
            # 写成 if 而不是 `[ ... ] && break`：后者判否时整条返回 1，
            # 一旦哪天它成了循环体最后一句，set -e 会把整步搞成 exit 1。
            if [ -n "$LEN" ]; then
              SEEN="$LEN"
              if [ "$LEN" = "$APK_SIZE" ]; then break; fi
              echo "::notice::第 $i 次：CDN 上是 $LEN 字节，期望 $APK_SIZE，等边缘生效"
            else
              echo "::notice::第 $i 次：HEAD 没拿到 Content-Length"
            fi
            sleep 15
          done

          # 「够不着 CDN」与「CDN 上是旧包」是两回事，处理方式相反
          if [ -z "$SEEN" ]; then
            echo "::warning::够不着 ${APK_URL}（网络 / DNS / 边缘故障），本次不提升闸门。"
            echo "::warning::闸门停在旧值是安全方向：玩家最多少一次更新提示，不会无限更新。"
            {
              echo "### 版本闸门"
              echo
              echo "⚠️ 够不着 \`${APK_URL}\`，本次未提升（闸门停在旧值是安全方向）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SEEN" != "$APK_SIZE" ]; then
            echo "::error::CDN 上那份是 ${SEEN} 字节，本次 APK 是 ${APK_SIZE} 字节，拒绝提升闸门。"
            echo "::error::闸门一旦高于玩家能下到的那一版，全体旧版客户端都会陷入无限更新。"
            echo "::error::先看 r2-sync 的上传与刷新记录确认 object-storage 上那份对不对，再重跑本 workflow。"
            exit 1
          fi
          echo "✔ CDN 上那份与本次 APK 一致（${APK_SIZE} 字节）"

          cd cfg
          python3 - "$APK_VERSION" <<'PY'
          import json, os, re, sys

          def parse_version(value):
              if not isinstance(value, str) or not re.fullmatch(r'[0-9]+(?:\.[0-9]+)*', value):
                  raise SystemExit(f'非法的纯数字点分版本: {value!r}')
              parts = [int(x) for x in value.split('.')]
              while len(parts) > 1 and parts[-1] == 0:
                  parts.pop()
              return tuple(parts)

          ver = sys.argv[1]
          p = os.environ['CONFIG_PATH']
          d = json.load(open(p, encoding='utf-8'))
          old = d.get('client', {}).get('version')
          new_t, old_t = parse_version(ver), parse_version(old)
          if new_t == old_t:
              print(f'闸门已经是 {old}，无需提升')
              raise SystemExit(0)
          if new_t < old_t:
              print(f'::error::CDN 上的 APK 是 {ver}，闸门却已经在 {old}——'
                    '拿到闸门的旧版客户端会装到一个仍然低于闸门的包，无限更新。')
              print('::error::要么把闸门回落到 CDN 实况，要么把真正的新包推上 CDN。'
                    '本步骤不会自动回落闸门：那可能撤销一次人为的强制更新。')
              raise SystemExit(1)
          d.setdefault('client', {})['version'] = ver
          # 与原格式一致（json.dumps indent=2 ensure_ascii=False，无尾换行）
          open(p, 'w', encoding='utf-8').write(json.dumps(d, ensure_ascii=False, indent=2))
          print(f'client.version: {old} -> {ver}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CONFIG_PATH}"
          if git diff --cached --quiet; then
            echo "闸门未变化，跳过提交"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: 提升版本闸门 client.version -> ${APK_VERSION} [skip ci]"
          git push origin HEAD:main
          echo "✅ 闸门已提升到 ${APK_VERSION}"
          {
            echo "### 版本闸门"
            echo
            echo "✅ \`client.version\` 已按 CDN 实况提升到 \`${APK_VERSION}\`"
            echo "（${APK_NAME}，${APK_SIZE} 字节，已核对 ${APK_URL} 的 Content-Length）。"
          } >> "$GITHUB_STEP_SUMMARY"

  update-cursor:
    runs-on: ubuntu-latest
    needs: [setup, commit-configs, r2-sync, doge-sync, pan123-upload]
    # object-storage、镜像和提交必须成功；Doge/123 可被仓库变量主动停用（skipped），
    # 但真实 failure 仍会阻止游标推进。
    if: needs.r2-sync.result == 'success' && needs.doge-sync.result != 'failure' && needs.pan123-upload.result != 'failure' && needs.commit-configs.result == 'success' && (needs.setup.outputs.should_sync == 'true' || needs.commit-configs.outputs.committed == 'true')
    env:
      : ${{ secrets. }}
      FINAL_SYNC_SHA: ${{ needs.commit-configs.outputs.final_sync_sha }}
      COMMIT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - name: 📝 更新 Commit SHA（同步游标）
        run: |
          set -euo pipefail
          SHA="${FINAL_SYNC_SHA:-${COMMIT_SHA:-}}"
          if [ -z "$SHA" ]; then
            echo "::warning::无可用 SHA，游标不推进"
            exit 0
          fi
          # update-cursor 无 checkout，gh 推不出仓库，必须显式 --repo
          gh variable set LAST_SYNC_COMMIT_SHA --body "$SHA" \
            --repo "${{ github.repository }}"
          echo "游标已推进到 $SHA"
  summary:
    runs-on: ubuntu-latest
    needs: [setup, pack-js, pack-scenario, publish, r2-sync, bump-gate, doge-sync, pan123-upload, commit-configs, update-cursor]
    if: always()
    env:
      : ${{ secrets. }}
      REPO_OWNER: "MagirecoCN-Revival-Project"
      REPO_NAME: "patch-front"
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      EDGEONE_DOMAIN: ${{ secrets.EDGEONE_DOMAIN }}
      ESA_DOMAIN: ${{ secrets.ESA_DOMAIN }}
      CLOUDFLARE_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
      DOGE_DOMAIN: ${{ secrets.DOGE_DOMAIN }}
    steps:
      - name: 📊 生成运行摘要
        if: always()
        run: |
          echo "## 🎉 同步任务完成（v3.1）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 仓库 | \`${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}\`（独立私有仓，无上游） |" >> $GITHUB_STEP_SUMMARY
          echo "| 下游仓库 | \`${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| object-storage 存储桶 | \`${{ env.R2_BUCKET }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 同步状态 | ${{ needs.setup.outputs.should_sync == 'true' && '✅ 已同步新内容' || '⏭️ 无新内容' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 手动打包范围 | ${{ github.event_name == 'workflow_dispatch' && inputs.package_scope || '按变更自动判断' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 实际打包 | JS=${{ needs.setup.outputs.has_js }}；Scenario=${{ needs.setup.outputs.has_scenario }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 热更新发布 | ${{ needs.setup.outputs.publish_hotfix == 'true' && '✅ _new → official（已清理 _new 预览 asset）' || '⏭️ 仅更新 _new 预览' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 版本 json 同步 | ${{ needs.commit-configs.outputs.committed == 'true' && format('✅ 同一 commit {0} 已推送并对齐上下游（fork 不分叉）', needs.commit-configs.outputs.short_sha) || '⏭️ 无配置变更' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| object-storage 过时文件清理 | ${{ needs.setup.outputs.confirm_cleanup == 'true' && '✅ 已确认清理' || '⏭️ 仅记录待清理列表（见 PENDING_DELETIONS 变量）' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| object-storage 系 CDN 刷新 | edge（\`${{ env.EDGEONE_DOMAIN }}\`）+ 阿里云 ESA（\`${{ env.ESA_DOMAIN }}\`）+ CDN（\`${{ env.CLOUDFLARE_DOMAIN }}\`） |" >> $GITHUB_STEP_SUMMARY
          echo "| Doge 系同步 | 多吉云（\`${{ env.DOGE_DOMAIN }}\`）：${{ needs.doge-sync.result == 'success' && '✅ 已同步' || (fromJSON(vars.ENABLE_DOGE_SYNC || 'true') && format('⚠️ {0}', needs.doge-sync.result)) || '🚫 已停用' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 123云盘同步 | ${{ needs.pan123-upload.result == 'success' && '✅ 已同步' || (fromJSON(vars.ENABLE_PAN123_SYNC || 'true') && format('⚠️ {0}', needs.pan123-upload.result)) || '🚫 已停用' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 版本闸门 | ${{ needs.bump-gate.result == 'success' && format('✅ 已按 CDN 实况跟进（{0}）', needs.r2-sync.outputs.apk_version) || needs.bump-gate.result == 'skipped' && '⏭️ 本次没有可确认的 APK 版本，闸门不动' || format('⚠️ {0}', needs.bump-gate.result) }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发事件 | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 时间 | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
