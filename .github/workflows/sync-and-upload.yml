name: Finalize audited Totentanz gacha CN overlay

on:
  push:
    branches:
      - research/totentanz-gacha-cn-authority-20260807

permissions:
  contents: write

jobs:
  finalize-gacha:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/totentanz-gacha-cn-authority-20260807
          fetch-depth: 2

      - name: Materialize only the three pending audited outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          from pathlib import Path

          gen = Path('magica/research/totentanz-gacha-cn-overlay/apply_gacha_overlay.py')
          src = gen.read_text(encoding='utf-8')
          tree = ast.parse(src)
          pending = (
              'js/campaign/box_gacha/CampaignBoxGachaTop.js',
              'template/campaign/box_gacha/CampaignBoxGachaTop.html',
              'template/gacha/GachaTop.html',
          )
          selected = []
          for node in tree.body:
              seg = ast.get_source_segment(src, node) or ''
              if isinstance(node, (ast.Import, ast.ImportFrom)):
                  selected.append(seg)
                  continue
              if isinstance(node, ast.Assign):
                  names = {t.id for t in node.targets if isinstance(t, ast.Name)}
                  if names & {'ROOT', 'MAGICA'}:
                      selected.append(seg)
                  continue
              if isinstance(node, ast.FunctionDef) and node.name == 'replace':
                  selected.append(seg)
                  continue
              if any(p in seg for p in pending):
                  selected.append(seg)
          code = '\n\n'.join(selected) + '\n'
          ns = {'__file__': str(gen.resolve())}
          exec(compile(code, '<gacha-finalize>', 'exec'), ns, ns)

          expected = {
              'magica/js/campaign/box_gacha/CampaignBoxGachaTop.js': '17664ae667c33e937db760ed660cec9ae792cca274f4f8bf200d0d28e534cbd3',
              'magica/template/campaign/box_gacha/CampaignBoxGachaTop.html': 'c37a11523c71d0b68aea25cf17c5f8be4235e0a55e45887bc3687cc6c53c309f',
              'magica/template/gacha/GachaTop.html': '601cf07133e81910ec1ea7c1b26933064681df22c8697dcd34f6c754add29b3c',
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha256(data).hexdigest()
              print(path, len(data), got)
              if got != want:
                  raise SystemExit(f'{path}: SHA-256 mismatch: {got} != {want}')
          PY
          node --check magica/js/campaign/box_gacha/CampaignBoxGachaTop.js

      - name: Enforce preservation boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD --)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(magica/css/|magica/resource/|magica/js/libs/|magica/(js|template)/quest/puellaHistoria/)' ; then
            echo 'Forbidden preservation-boundary change detected' >&2
            exit 1
          fi

      - name: Mark product layer fully materialized and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > magica/research/totentanz-gacha-cn-overlay/PRODUCT_APPLICATION_STATUS_20260807.md <<'EOF'
          # Product application status — 2026-08-07

          Base authority/UI integration: `research/totentanz-magica-cn-overlay-pass9-final-20260807@f25b445d7bcb9b9710f51d82ca9330995185d623`.

          ## Fully materialized

          The audited Totentanz gacha CN product layer is now fully materialized. The final three previously generated-only files have been promoted byte-for-byte after fail-closed SHA-256 verification:

          - `magica/js/campaign/box_gacha/CampaignBoxGachaTop.js` — `17664ae667c33e937db760ed660cec9ae792cca274f4f8bf200d0d28e534cbd3`
          - `magica/template/campaign/box_gacha/CampaignBoxGachaTop.html` — `c37a11523c71d0b68aea25cf17c5f8be4235e0a55e45887bc3687cc6c53c309f`
          - `magica/template/gacha/GachaTop.html` — `601cf07133e81910ec1ea7c1b26933064681df22c8697dcd34f6c754add29b3c`

          Together with the previously materialized `GachaResult.js`, `GachaResult.html`, probability, lineup and selectable-gacha templates, there are no remaining generated-only gacha product files in this research layer.

          ## Preservation boundary

          No `magica/css/**`, `magica/resource/**`, Puella Historia route/UI, or `magica/js/libs/**` runtime-authority file is part of this finalization. Pass14 remains an independent runtime-dictionary upgrade and is not a dependency of this gacha/UI layer.
          EOF
          git checkout HEAD^ -- .github/workflows/sync-and-upload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/sync-and-upload.yml \
            magica/js/campaign/box_gacha/CampaignBoxGachaTop.js \
            magica/template/campaign/box_gacha/CampaignBoxGachaTop.html \
            magica/template/gacha/GachaTop.html \
            magica/research/totentanz-gacha-cn-overlay/PRODUCT_APPLICATION_STATUS_20260807.md
          git diff --cached --exit-code --quiet && { echo 'No finalization changes'; exit 1; }
          git commit -m 'feat(gacha): materialize final audited CN product files'
          git push origin HEAD:research/totentanz-gacha-cn-authority-20260807
