                      if not a['name'].startswith('source code')
                      and not any(a['name'].endswith(s) for s in S3_IGNORE_SUFFIXES)
                      and a['name'] not in S3_IGNORE_FILES
                  }
                  info(f"包含 {c(C.BOLD, str(len(current_map)))} 个 asset（已过滤 _new / offline 文件）")

                  header("比对文件指纹")
                  section("读取历史指纹")

                  result = subprocess.run(
                      ['gh', 'variable', 'get', 'LAST_SYNC_FINGERPRINTS'],
                      capture_output=True, text=True
                  )
                  old_map = {}
                  if result.returncode == 0 and result.stdout.strip():
                      try:
                          old_map = json.loads(result.stdout.strip())
                          info(f"历史指纹: {c(C.BOLD, str(len(old_map)))} 个文件")
                      except Exception:
                          warn("历史指纹解析失败，视为首次同步")
                  else:
                      info("无历史指纹，视为首次同步")

                  IGNORE_FILES = {
                      'puella-historia-splited.tar.xz',
                      'offline-package.zip',
                      'offline_package_checksum.txt',
                      'versions.json',
                  }

                  section("SHA256 比对")
                  to_process = []
                  unchanged  = []
                  deleted    = []

                  for fname, sha in current_map.items():
                      if fname in IGNORE_FILES:
                          skip(f"{fname} → 过滤列表")
                          logger.update_file_status(fname, "已忽略", "过滤列表")
                      elif fname not in old_map:
                          info(f"{c(C.BRIGHT_YELLOW, fname)} → 新文件")
                          logger.update_file_status(fname, "排队中", "新文件")
                          to_process.append(fname)
                      elif sha and old_map[fname] != sha:
                          info(f"{c(C.BRIGHT_YELLOW, fname)} → SHA 变更")
                          logger.update_file_status(fname, "排队中", "文件已更新")
                          to_process.append(fname)
                      elif not sha:
                          warn(f"{fname} → 无 SHA，按新文件处理")
                          logger.update_file_status(fname, "排队中", "无SHA，按新文件处理")
                          to_process.append(fname)
                      else:
                          skip(f"{fname} → 无变更")
                          logger.update_file_status(fname, "无需操作", "文件未变更")
                          unchanged.append(fname)

                  for fname in old_map:
                      if fname not in current_map and fname not in IGNORE_FILES:
                          warn(f"{fname} → 已从 Release 中删除")
                          deleted.append(fname)

                  info(f"待处理: {c(C.BRIGHT_YELLOW, str(len(to_process)))} | "
                       f"无变更: {c(C.DIM, str(len(unchanged)))} | "
                       f"已删除: {c(C.RED, str(len(deleted)))}")

                  has_zip_changes = any(f.endswith(".zip") for f in to_process)
                  with open(os.environ["GITHUB_OUTPUT"], "a") as _f:
                      _f.write(f"has_zip_changes={'true' if has_zip_changes else 'false'}\n")
                  info(f"Release zip 文件变化: "
                       f"{c(C.BRIGHT_YELLOW if has_zip_changes else C.DIM, str(has_zip_changes))}")

                  ActionGroup.start_group("🗑️ 清理过时文件 & 纠正位置")
                  header("清理过时文件 & 纠正文件位置")

                  bucket1_files = s3_1.list_files()
                  bucket2_files = s3_2.list_files()

                  bucket1_targets = {
                      'cn_base_00_db.zip', 'cn_base_01_json.zip', 'cn_base_02.zip',
                      'cn_base_03.zip', 'cn_base_04.zip', 'cn_base_05.zip',
                      'cn_base_06.zip', 'cn_hotupdate.zip', 'cn_js_update.zip',
                      'cn_magica_resource.zip'
                  }

                  section("处理存储桶1")
                  for fname in bucket1_files:
                      if fname in deleted or fname not in current_map:
                          if s3_1.delete_file(fname):
                              logger.update_file_status(fname, "已完成", "已删除过时文件")
                              logger.obsolete_files.append({
                                  'bucket': '存储桶1', 'filename': fname,
                                  'status': '已删除', 'details': '清理过时'
                              })
                      elif fname not in bucket1_targets:
                          warn(f"{fname} 位于存储桶1但应属于存储桶2，纠正...", indent=1)
                          logger.update_file_status(fname, "排队中", "纠正位置（移至存储桶2）")
                          try:
                              url = next(
                                  a['browser_download_url']
                                  for a in release['assets'] if a['name'] == fname
                              )
                              if s3_2.upload_file_from_url(url, fname):
                                  if s3_1.delete_file(fname):
                                      logger.update_file_status(fname, "已完成", "已纠正位置（→存储桶2）")
                                      logger.obsolete_files.append({
                                          'bucket': '存储桶1→存储桶2', 'filename': fname,
                                          'status': '已纠正位置', 'details': '移至正确桶'
                                      })
                                      if fname in to_process:
                                          to_process.remove(fname)
                                  else:
                                      logger.update_file_status(fname, "失败", "从原桶删除失败")
                              else:
                                  logger.update_file_status(fname, "失败", "上传到目标桶失败")
                          except Exception as e:
                              logger.update_file_status(fname, "失败", f"纠正失败: {e}")

                  section("处理存储桶2")
                  for fname in bucket2_files:
                      if fname in deleted or fname not in current_map:
                          if s3_2.delete_file(fname):
                              logger.update_file_status(fname, "已完成", "已删除过时文件")
                              logger.obsolete_files.append({
                                  'bucket': '存储桶2', 'filename': fname,
                                  'status': '已删除', 'details': '清理过时'
                              })
                      elif fname in bucket1_targets:
                          warn(f"{fname} 位于存储桶2但应属于存储桶1，纠正...", indent=1)
                          logger.update_file_status(fname, "排队中", "纠正位置（移至存储桶1）")
                          try:
                              url = next(
                                  a['browser_download_url']
                                  for a in release['assets'] if a['name'] == fname
                              )
                              if s3_1.upload_file_from_url(url, fname):
                                  if s3_2.delete_file(fname):
                                      logger.update_file_status(fname, "已完成", "已纠正位置（→存储桶1）")
                                      logger.obsolete_files.append({
                                          'bucket': '存储桶2→存储桶1', 'filename': fname,
                                          'status': '已纠正位置', 'details': '移至正确桶'
                                      })
                                      if fname in to_process:
                                          to_process.remove(fname)
                                  else:
                                      logger.update_file_status(fname, "失败", "从原桶删除失败")
                              else:
                                  logger.update_file_status(fname, "失败", "上传到目标桶失败")
                          except Exception as e:
                              logger.update_file_status(fname, "失败", f"纠正失败: {e}")

                  logger.add_obsolete_files_section()
                  ActionGroup.end_group()

                  if not to_process:
                      header("无需处理")
                      ok("无新增或更新文件，任务结束")
                      logger.finalize_summary([])
                      return

                  header(f"上传文件（共 {len(to_process)} 个）")
                  processed    = []
                  total_files  = len(to_process)

                  for i, fname in enumerate(to_process, 1):
                      ActionGroup.start_group(f"[{i}/{total_files}] 📦 {fname}")

                      print(flush=True)
                      progress_bar(i - 1, total_files,
                                   label=f"文件进度 {i-1}/{total_files}")

                      target_s3 = s3_1 if fname in bucket1_targets else s3_2
                      info(f"文件: {c(C.BRIGHT_WHITE, fname)}")
                      info(f"目标: {c(C.BRIGHT_YELLOW, target_s3.name)}")

                      url = next(
                          a['browser_download_url']
                          for a in release['assets'] if a['name'] == fname
                      )
                      logger.update_file_status(fname, "上传中", f"流式传输至 {target_s3.name}")

                      if target_s3.upload_file_from_url(url, fname):
                          logger.update_file_status(fname, "已上传", f"已上传到 {target_s3.name}")
                          success, tid = edgeone.purge_cache(target_s3.domain, fname)
                          if success:
                              logger.update_file_status(fname, "已完成", f"CDN 已刷新 (ID: {tid})")
                              processed.append({'filename': fname, 'success': True})
                          else:
                              logger.update_file_status(fname, "失败", f"CDN 刷新失败: {tid}")
                              processed.append({'filename': fname, 'success': False})
                      else:
                          logger.update_file_status(fname, "失败", "S3 上传失败")
                          processed.append({'filename': fname, 'success': False})

                      progress_bar(i, total_files,
                                   label=f"文件进度 {i}/{total_files}")
                      ActionGroup.end_group()

                  # ──────────────────────────────────────────────────────────
                  # 新增：清除两个域名根目录的 CDN 缓存
                  # ──────────────────────────────────────────────────────────
                  if processed:
                      ActionGroup.start_group("🧹 清除域名根目录 CDN 缓存")
                      header("清除域名根目录 CDN 缓存")
                      section("刷新存储桶1域名根目录")
                      success1, tid1 = edgeone.purge_cache(s3_1.domain, "")
                      if success1:
                          ok(f"已刷新: http://{s3_1.domain}/ (ID: {tid1})")
                      else:
                          warn(f"刷新失败: {tid1}")

                      section("刷新存储桶2域名根目录")
                      success2, tid2 = edgeone.purge_cache(s3_2.domain, "")
                      if success2:
                          ok(f"已刷新: http://{s3_2.domain}/ (ID: {tid2})")
                      else:
                          warn(f"刷新失败: {tid2}")
                      ActionGroup.end_group()

                  ActionGroup.start_group("💾 保存同步状态")
                  header("保存文件指纹")

                  final_map = old_map.copy()
                  for fname in unchanged:
                      final_map[fname] = old_map[fname]
                  for fname in to_process:
                      final_map[fname] = current_map[fname]
                  for fname in deleted:
                      final_map.pop(fname, None)

                  subprocess.run(
                      ['gh', 'variable', 'set', 'LAST_SYNC_FINGERPRINTS',
                       '--body', json.dumps(final_map)],
                      check=True
                  )
                  ok(f"文件指纹已保存（{c(C.BOLD, str(len(final_map)))} 个）")
                  ActionGroup.end_group()

                  logger.finalize_summary(processed)

                  header("全部完成")
                  success_count = sum(1 for p in processed if p['success'])
                  fail_count    = len(processed) - success_count
                  ok(f"成功: {c(C.BOLD, str(success_count))} 个文件")
                  if fail_count:
                      err(f"失败: {fail_count} 个文件")
                  else:
                      ok("全部文件处理成功，无错误")

              except Exception as e:
                  err(f"脚本执行失败: {e}")
                  import traceback
                  traceback.print_exc()
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          SCRIPT_END

      - name: 📦 构建并上传 offline-package.zip
        if: |
          steps.sync_script.outputs.has_zip_changes == 'true' ||
          steps.check_upstream.outputs.publish_hotfix == 'true'
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os
          import json
          import hashlib
          import zipfile
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def warn(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          def skip(text, indent=0):
              print(f"{'  '*indent}{c(C.DIM, '⏭  ' + text)}", flush=True)

          def human_size(size_bytes):
              for unit in ["B", "KB", "MB", "GB"]:
                  if size_bytes < 1024:
                      return f"{size_bytes:.1f} {unit}"
                  size_bytes /= 1024
              return f"{size_bytes:.1f} TB"

          UPSTREAM_OWNER = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO  = os.environ["UPSTREAM_REPO"]
          GH_TOKEN       = os.environ.get("GH_TOKEN", "")

          EXCLUDE_FROM_OFFLINE = {
              "offline-package.zip",
              "offline_package_checksum.txt",
              "versions.json",
              "puella-historia-splited.tar.xz",
          }
          NEW_SUFFIXES = ("_new.zip", "_new.json")

          GH_HEADERS = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if GH_TOKEN:
              GH_HEADERS["Authorization"] = f"Bearer {GH_TOKEN}"

          RELEASE_API = (
              f"https://api.github.com/repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
              "/releases/latest"
          )

          def fetch_release():
              req = urllib.request.Request(RELEASE_API, headers=GH_HEADERS)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  err(f"获取 Release 失败: HTTP {e.code}")
                  sys.exit(1)

          def delete_asset(release_id, asset_id, name):
              del_url = (
                  f"https://api.github.com/repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
                  f"/releases/assets/{asset_id}"
              )
              del_req = urllib.request.Request(
                  del_url, headers=GH_HEADERS, method="DELETE"
              )
              try:
                  with urllib.request.urlopen(del_req):
                      pass
                  ok(f"已删除旧 asset: {name}", indent=1)
                  return True
              except Exception as e:
                  warn(f"删除 [{name}] 失败: {e}", indent=1)
                  return False

          def upload_asset(release_tag, local_path, display_name):
              release_now = fetch_release()
              cur_map     = {a["name"]: a for a in release_now.get("assets", [])}

              if display_name in cur_map:
                  delete_asset(
                      release_now["id"],
                      cur_map[display_name]["id"],
                      display_name
                  )

              upload_arg = f"{local_path}#{display_name}"
              result = subprocess.run(
                  [
                      "gh", "release", "upload", release_tag, upload_arg,
                      "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                      "--clobber",
                  ],
                  capture_output=True, text=True
              )
              if result.returncode == 0:
                  ok(f"已上传: {display_name}", indent=1)
                  return True
              else:
                  err(f"上传失败 [{display_name}]: {result.stderr.strip()}", indent=1)
                  return False

          def main():
              header("构建 offline-package.zip")

              section("获取上游 Release 信息")
              release     = fetch_release()
              release_tag = release.get("tag_name", "latest")
              info(f"Release: {c(C.BRIGHT_WHITE, release.get('name') or release_tag)}")
              info(f"Tag:     {c(C.BRIGHT_CYAN, release_tag)}")

              assets    = release.get("assets", [])
              asset_map = {a["name"]: a for a in assets}

              section("筛选 zip 文件")
              zip_assets = [
                  a for a in assets
                  if a["name"].endswith(".zip")
                  and a["name"] not in EXCLUDE_FROM_OFFLINE
                  and not any(a["name"].endswith(s) for s in NEW_SUFFIXES)
              ]

              if not zip_assets:
                  warn("Release 中无可用 zip 文件，跳过构建")
                  sys.exit(0)

              info(f"共 {c(C.BOLD, str(len(zip_assets)))} 个 zip 文件将打入离线包:")
              for a in zip_assets:
                  info(f"{c(C.BRIGHT_WHITE, a['name'])}  "
                       f"{c(C.DIM, human_size(a['size']))}", indent=1)

              section("下载 zip 文件")
              work_dir = "/tmp/offline_build"
              os.makedirs(work_dir, exist_ok=True)

              downloaded = []
              for asset in zip_assets:
                  fname    = asset["name"]
                  dl_url   = asset["browser_download_url"]
                  dst_path = os.path.join(work_dir, fname)
                  info(f"下载: {c(C.BRIGHT_CYAN, fname)}  "
                       f"{c(C.DIM, human_size(asset['size']))}")
                  try:
                      dl_req = urllib.request.Request(dl_url, headers=GH_HEADERS)
                      with urllib.request.urlopen(dl_req) as resp:
                          data = resp.read()
                      with open(dst_path, "wb") as f:
                          f.write(data)
                      ok(f"已下载: {fname}  "
                         f"{c(C.DIM, human_size(len(data)))}", indent=1)
                      downloaded.append(dst_path)
                  except Exception as e:
                      err(f"下载失败 [{fname}]: {e}", indent=1)
                      sys.exit(1)

              section("生成 version.json")
              now_ts            = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
              version_json_path = os.path.join(work_dir, "version.json")
              with open(version_json_path, "w", encoding="utf-8") as f:
                  json.dump({"version": now_ts}, f, indent=2)
              ok(f"version = {c(C.BRIGHT_CYAN, now_ts)}")

              section("打包 offline-package.zip")
              offline_zip_path = "/tmp/offline-package.zip"
              with zipfile.ZipFile(
                  offline_zip_path, "w", zipfile.ZIP_DEFLATED
              ) as zf:
                  zf.write(version_json_path, arcname="version.json")
                  ok("已写入: version.json", indent=1)
                  for fpath in downloaded:
                      arcname = os.path.basename(fpath)
                      zf.write(fpath, arcname=arcname)
                      ok(f"已写入: {arcname}", indent=1)

              offline_size = os.path.getsize(offline_zip_path)
              ok(f"打包完成: {c(C.BRIGHT_WHITE, 'offline-package.zip')}  "
                 f"{c(C.DIM, human_size(offline_size))}")

              section("计算 MD5")
              with open(offline_zip_path, "rb") as f:
                  offline_md5 = hashlib.md5(f.read()).hexdigest().lower()
              ok(f"MD5: {c(C.BRIGHT_CYAN, offline_md5)}")

              section("上传 offline-package.zip")
              if not upload_asset(release_tag, offline_zip_path, "offline-package.zip"):
                  sys.exit(1)

              section("更新 versions.json")
              versions_local = "/tmp/versions.json"

              if "versions.json" in asset_map:
                  dl_url = asset_map["versions.json"]["browser_download_url"]
                  try:
                      dl_req = urllib.request.Request(dl_url, headers=GH_HEADERS)
                      with urllib.request.urlopen(dl_req) as resp:
                          existing_versions = json.loads(resp.read().decode())
                      info("已读取现有 versions.json，仅更新 offline-package 键")
                  except Exception as e:
                      warn(f"读取现有 versions.json 失败，新建文件: {e}")
                      existing_versions = {}
              else:
                  info("Release 中无 versions.json，新建文件")
                  existing_versions = {}

              existing_versions["offline-package"] = now_ts
              with open(versions_local, "w", encoding="utf-8") as f:
                  json.dump(existing_versions, f, indent=2, ensure_ascii=False)
              ok(f"versions.json[offline-package] = {c(C.BRIGHT_CYAN, now_ts)}")

              if not upload_asset(release_tag, versions_local, "versions.json"):
                  sys.exit(1)

              section("更新 offline_package_checksum.txt")
              checksum_local = "/tmp/offline_package_checksum.txt"
              with open(checksum_local, "w", encoding="utf-8") as f:
                  f.write(offline_md5)
              info(f"内容: {c(C.BRIGHT_CYAN, offline_md5)}")

              if not upload_asset(
                  release_tag, checksum_local, "offline_package_checksum.txt"
              ):
                  sys.exit(1)

              header("offline-package 构建完成")
              ok(f"版本号:  {c(C.BRIGHT_CYAN, now_ts)}")
              ok(f"包大小:  {c(C.BRIGHT_WHITE, human_size(offline_size))}")
              ok(f"MD5:     {c(C.BRIGHT_CYAN, offline_md5)}")
              ok("以下文件已同步至上游 Release：")
              ok("  offline-package.zip", indent=1)
              ok("  versions.json（仅 offline-package 键已更新）", indent=1)
              ok("  offline_package_checksum.txt", indent=1)

          if __name__ == "__main__":
              main()
          SCRIPT_END

      - name: 📊 生成运行摘要
        if: always()
        run: |
          echo "## 🎉 同步任务完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 上游仓库 | \`${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 下游仓库 | \`${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 同步状态 | ${{ steps.check_upstream.outputs.should_sync == 'true' && '✅ 已同步新内容' || '⏭️ 无新内容' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 热更新发布 | ${{ steps.check_upstream.outputs.publish_hotfix == 'true' && '✅ 已发布正式热更新' || '⏭️ 未发布（预览模式）' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK 同步 | ${{ steps.sync_apk.outputs.apk_synced == 'true' && '✅ 已同步新 APK' || '⏭️ 无新 APK' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 离线包构建 | ${{ (steps.sync_script.outputs.has_zip_changes == 'true' || steps.check_upstream.outputs.publish_hotfix == 'true') && '✅ 已更新离线包' || '⏭️ 未触发' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发事件 | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 时间 | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
