name: 🔄 同步上游并上传到 S3

# ╔════════════════════════════════════════════════════════════════════╗
# ║   schema 迁移 v2 —— 与 magireco-client-patch 4.x 客户端对齐         ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║                                                                    ║
# ║ 配置文件总览                                                        ║
# ║ ───────                                                            ║
# ║   主配置 configure.json：                                          ║
# ║     ▸ 仓库根目录 /configure.json                                   ║
# ║     ▸ /configures/configure.json   ← Action 读取的权威来源          ║
# ║     ▸ 上游 Release asset                                           ║
# ║                                                                    ║
# ║   兼容映射（旧客户端仍能解析）：                                     ║
# ║     ▸ /version_scenario.json /version_js.json                      ║
# ║     ▸ /configures/version_scenario.json /configures/version_js.json║
# ║     ▸ Release 上的同名 asset                                        ║
# ║                                                                    ║
# ║ 热更新流程                                                          ║
# ║ ───────                                                            ║
# ║   1. 每次 sync：                                                   ║
# ║        ▸ 从 /configures/version_*.json 读取当前官方版本号           ║
# ║        ▸ 重新生成 cn_*_update_new.zip                              ║
# ║        ▸ 写 version_*_new.json（version+1, size, md5）             ║
# ║        ▸ 同步到 /、/configures/、Release 三处                      ║
# ║        ▸ 提交 _new 文件到 git，official 文件不动                    ║
# ║                                                                    ║
# ║   2. 手动勾选 publish_hotfix=true 时：                              ║
# ║        ▸ 把 *_new 文件去掉 _new 后缀覆盖正式文件（在 3 处）         ║
# ║        ▸ 同步更新 /configures/configure.json 的 hotfix.{scenario,  ║
# ║          js} 子块（version/size/md5），以及 / 和 Release 的副本    ║
# ║        ▸ 一次性 commit + push 所有 official + configure.json 变更  ║
# ║                                                                    ║
# ║ 离线包流程                                                          ║
# ║ ───────                                                            ║
# ║   ▸ 内层文件不再叫 version.json，改成 configure.json，内容是        ║
# ║       {"offline_package": {"version": "<timestamp>"}}              ║
# ║   ▸ 完整包 MD5 不再写到 offline_package_checksum.txt（已废弃），    ║
# ║       改成写入 /configures/configure.json#offline_package.md5      ║
# ║   ▸ 离线包版本号写入 /configures/configure.json#offline_package    ║
# ║       .version，并镜像到根目录和 Release                            ║
# ║                                                                    ║
# ║ S3 同步                                                            ║
# ║ ───────                                                            ║
# ║   ▸ versions.json / offline_package_checksum.txt 不再生成，        ║
# ║       自动从 S3 桶里清理                                            ║
# ║   ▸ configure.json 同步到 S3（客户端从 S3 拉它）                    ║
# ║   ▸ version_scenario.json / version_js.json 也同步（兼容老客户端）  ║
# ║                                                                    ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制同步（无视指纹）'
        required: false
        default: 'false'
        type: boolean
      publish_hotfix:
        description: '发布热更新包（将 _new 文件覆盖正式文件，同步 configure.json#hotfix）'
        required: false
        default: 'false'
        type: boolean
      build_offline:
        description: '手动构建离线包'
        required: false
        default: 'false'
        type: boolean
  repository_dispatch:
    types: [upstream-update]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-and-upload:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      S3_1_ENDPOINT: ${{ secrets.S3_1_ENDPOINT }}
      S3_1_ACCESS_KEY: ${{ secrets.S3_1_ACCESS_KEY }}
      S3_1_SECRET_KEY: ${{ secrets.S3_1_SECRET_KEY }}
      S3_1_REGION: ${{ secrets.S3_1_REGION }}
      S3_1_BUCKET: ${{ secrets.S3_1_BUCKET }}
      S3_1_DOMAIN: ${{ secrets.S3_1_DOMAIN }}
      S3_2_ENDPOINT: ${{ secrets.S3_2_ENDPOINT }}
      S3_2_ACCESS_KEY: ${{ secrets.S3_2_ACCESS_KEY }}
      S3_2_SECRET_KEY: ${{ secrets.S3_2_SECRET_KEY }}
      S3_2_REGION: ${{ secrets.S3_2_REGION }}
      S3_2_BUCKET: ${{ secrets.S3_2_BUCKET }}
      S3_2_DOMAIN: ${{ secrets.S3_2_DOMAIN }}
      QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
      QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
      EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
      UPSTREAM_OWNER: "HiiragiNemu"
      UPSTREAM_REPO: "magireco-cn-patch"
      DOWNSTREAM_OWNER: "MagirecoCN-Revival-Project"
      DOWNSTREAM_REPO: "magireco-cn-patch"
      # 一处定义、全局复用——所有读写 configure.json 的步骤都拿这两个值
      CONFIG_DIR: "configures"
      CONFIG_FILE: "configure.json"

    steps:
      - name: 🛡 安全护栏（校验所有可写仓库都在白名单中）
        # 这是本 workflow 的"硬刹车"。下面列出的三组 owner/repo 是
        # **唯一**允许被本 workflow 读/写/删的仓库——任何一项与白名单
        # 不一致就 fail-fast，绝不向陌生仓库发请求。要新增允许的仓库
        # 请直接改这份白名单，不要绕过它。
        run: |
          python3 <<'SCRIPT_END'
          import os, sys
          ALLOW_UPSTREAM   = {"HiiragiNemu/magireco-cn-patch"}
          ALLOW_DOWNSTREAM = {"MagirecoCN-Revival-Project/magireco-cn-patch"}
          # APK 源仓库——只 GET、不写，所以白名单宽松一点也行，但仍然写死
          ALLOW_CLIENT     = {"MagirecoCN-Revival-Project/magireco-client-patch"}

          upstream   = f"{os.environ['UPSTREAM_OWNER']}/{os.environ['UPSTREAM_REPO']}"
          downstream = f"{os.environ['DOWNSTREAM_OWNER']}/{os.environ['DOWNSTREAM_REPO']}"

          failed = False
          if upstream not in ALLOW_UPSTREAM:
              print(f"::error::上游仓库 {upstream} 不在白名单中")
              print(f"::error::允许: {sorted(ALLOW_UPSTREAM)}")
              failed = True
          if downstream not in ALLOW_DOWNSTREAM:
              print(f"::error::下游仓库 {downstream} 不在白名单中")
              print(f"::error::允许: {sorted(ALLOW_DOWNSTREAM)}")
              failed = True
          if failed:
              print("::error::出于安全考虑，本 workflow 只允许操作上述指定仓库；")
              print("::error::请检查 env / secrets / .github/workflows/syncandupload.yml")
              sys.exit(1)

          print(f"✔ 上游 OK:   {upstream}")
          print(f"✔ 下游 OK:   {downstream}")
          print(f"✔ APK 源仓库白名单（只读）: {sorted(ALLOW_CLIENT)}")
          SCRIPT_END

      - name: 📦 检出下游仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: ${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}
          fetch-depth: 2

      - name: 🛡 安全护栏（校验 origin 指向预期下游仓库）
        # checkout 完后立刻校验本地 git 的 origin URL，确认我们真的
        # 是在操作预期的下游仓库——后续所有 git push 都会推到 origin，
        # 这一步保证那个 origin 不是别的仓库。
        run: |
          ORIGIN_URL=$(git remote get-url origin)
          EXPECTED="${DOWNSTREAM_OWNER}/${DOWNSTREAM_REPO}"
          echo "origin URL : $ORIGIN_URL"
          echo "expected   : $EXPECTED"
          if ! echo "$ORIGIN_URL" | grep -qiE "[/:]${DOWNSTREAM_OWNER}/${DOWNSTREAM_REPO}(\.git)?\$"; then
            echo "::error::origin URL 不匹配预期下游仓库，拒绝继续"
            exit 1
          fi
          echo "✔ origin 校验通过"

      - name: 🔧 配置 Git
        run: |
          git config user.name "MagiaCN AutoBot"
          git config user.email "bot@magiacn.com"
          git config rebase.autoStash true

      - name: 🔍 检查上游内容更新
        id: check_upstream
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(color, text): return f"{color}{text}{C.RESET}"
          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(text): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)
          def info(t, i=0):  print(f"{'  '*i}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, i=0):    print(f"{'  '*i}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, i=0):  print(f"{'  '*i}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, i=0):   print(f"{'  '*i}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, i=0):  print(f"{'  '*i}{c(C.DIM, '⏭  ' + t)}", flush=True)

          def set_output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{key}={value}\n")

          UPSTREAM_OWNER = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO  = os.environ["UPSTREAM_REPO"]
          FORCE_SYNC     = os.environ.get("INPUT_FORCE_SYNC", "false")
          PUBLISH_HOTFIX = os.environ.get("INPUT_PUBLISH_HOTFIX", "false")
          BUILD_OFFLINE  = os.environ.get("INPUT_BUILD_OFFLINE", "false")

          header("检查上游内容更新")

          section("获取上游 commit SHA")
          info(f"上游仓库: {c(C.BRIGHT_WHITE, f'{UPSTREAM_OWNER}/{UPSTREAM_REPO}')}")

          result = subprocess.run(
              ["gh", "api",
               f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/branches/main",
               "--jq", ".commit.sha"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              err(f"获取上游 SHA 失败: {result.stderr.strip()}")
              sys.exit(1)

          upstream_sha  = result.stdout.strip()
          last_sync_sha = os.environ.get("LAST_SYNC_COMMIT_SHA", "0")

          info(f"上游最新 SHA: {c(C.BRIGHT_CYAN, upstream_sha[:7])}")
          info(f"上次同步 SHA: {c(C.DIM, last_sync_sha[:7] if last_sync_sha != '0' else 'N/A')}")

          section("判断是否需要同步")
          if FORCE_SYNC == "true":
              warn("强制同步模式，跳过 SHA 比对")
              should_sync = True
          elif upstream_sha != last_sync_sha:
              ok("检测到新内容，需要同步")
              should_sync = True
          else:
              skip("SHA 一致，无新内容")
              should_sync = False

          section("判断是否发布热更新包")
          if PUBLISH_HOTFIX == "true":
              ok("发布热更新包模式已开启 —— _new → official + 同步 configure.json#hotfix")
          else:
              skip("不发布热更新包（_new 文件仍会更新供预览）")

          section("判断是否手动构建离线包")
          if BUILD_OFFLINE == "true":
              ok("手动构建离线包模式已开启")
          else:
              skip("不手动构建离线包")

          set_output("should_sync", "true" if should_sync else "false")
          set_output("commit_sha", upstream_sha)
          set_output("publish_hotfix", PUBLISH_HOTFIX)
          set_output("build_offline", BUILD_OFFLINE)
          SCRIPT_END
        env:
          INPUT_FORCE_SYNC: ${{ inputs.force_sync }}
          INPUT_PUBLISH_HOTFIX: ${{ inputs.publish_hotfix }}
          INPUT_BUILD_OFFLINE: ${{ inputs.build_offline }}

      - name: 🔄 同步上游 Fork
        if: steps.check_upstream.outputs.should_sync == 'true'
        run: |
          gh repo sync "${DOWNSTREAM_OWNER}/${DOWNSTREAM_REPO}" \
              --source "${UPSTREAM_OWNER}/${UPSTREAM_REPO}" \
              --branch main --force
          # 重新拉取，让本地 workspace 含上游最新内容
          git fetch origin main
          git reset --hard origin/main

      - name: 📝 更新 Commit SHA
        if: steps.check_upstream.outputs.should_sync == 'true'
        run: |
          gh variable set LAST_SYNC_COMMIT_SHA --body "${{ steps.check_upstream.outputs.commit_sha }}"

      # ───────────────────────────────────────────────────────────────
      # 📋 读取 /configures/configure.json 作为权威基准
      # ───────────────────────────────────────────────────────────────
      - name: 📋 读取 configure.json 基准
        id: read_config
        run: |
          python3 <<'SCRIPT_END'
          import json
          import os
          import sys

          sys.stdout.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, i=0): print(f"{'  '*i}{c(C.RED, '✘')} {t}", flush=True)

          CFG_DIR = os.environ["CONFIG_DIR"]
          CFG_FILE = os.environ["CONFIG_FILE"]
          src = os.path.join(CFG_DIR, CFG_FILE)

          header("读取 /configures/configure.json")
          if not os.path.isfile(src):
              err(f"找不到 {src}！")
              err("请先在仓库 /configures/ 下提交一份初始 configure.json，"
                  "至少包含 client.{version,fake_name,fake_version}、"
                  "available_lines 等静态字段。")
              sys.exit(1)

          with open(src, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          section("当前权威字段")
          info(f"client.version       = {c(C.BRIGHT_CYAN, cfg.get('client', {}).get('version', '?'))}")
          info(f"offline_package.ver  = {c(C.BRIGHT_CYAN, cfg.get('offline_package', {}).get('version', '(unset)'))}")
          info(f"hotfix.scenario.ver  = {c(C.BRIGHT_CYAN, str(cfg.get('hotfix', {}).get('scenario', {}).get('version', 0)))}")
          info(f"hotfix.js.ver        = {c(C.BRIGHT_CYAN, str(cfg.get('hotfix', {}).get('js', {}).get('version', 0)))}")

          # 把当前的 hotfix 版本号导出，供后续 _new 步骤当 baseline
          scn_ver = int(cfg.get("hotfix", {}).get("scenario", {}).get("version", 0) or 0)
          js_ver  = int(cfg.get("hotfix", {}).get("js",       {}).get("version", 0) or 0)
          op_ver  = cfg.get("offline_package", {}).get("version", "")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"scenario_baseline={scn_ver}\n")
              f.write(f"js_baseline={js_ver}\n")
              f.write(f"offline_package_baseline={op_ver}\n")

          ok("基准已导出到 step outputs")
          SCRIPT_END

      - name: 🔍 检测变动范围
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
          echo "变动文件:"; echo "$CHANGED"

          HAS_SCENARIO=0
          HAS_JS=0

          echo "$CHANGED" | grep -qE '^madomagi/resource/scenario/json/' && HAS_SCENARIO=1 || true
          echo "$CHANGED" | grep -qE '^magica/' && HAS_JS=1 || true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HAS_SCENARIO=1
            HAS_JS=1
          fi

          echo "has_scenario=$HAS_SCENARIO" >> $GITHUB_OUTPUT
          echo "has_js=$HAS_JS" >> $GITHUB_OUTPUT
          mkdir -p _artifacts

      # ───────────────────────────────────────────────────────────────
      # [JS] 打包 cn_js_update_new.zip
      #   ▸ baseline = configures/version_js.json#version（从权威源读）
      #   ▸ 产物：version_js_new.json 写到 /, /configures/, _artifacts/
      #   ▸ 产物：cn_js_update_new.zip 写到 /, _artifacts/
      # ───────────────────────────────────────────────────────────────
      - name: "[JS] 打包 cn_js_update_new.zip"
        if: steps.detect.outputs.has_js == '1'
        run: |
          pip3 install requests 2>/dev/null || true
          python3 Build_JS_Injector.py

          zip -r cn_js_update_new.zip magica/

          python3 - <<'PYEOF'
          import json, hashlib, os, shutil

          CFG_DIR  = os.environ["CONFIG_DIR"]
          ZIP_NEW  = "cn_js_update_new.zip"
          NAME     = "version_js"            # base name, 没有 _new / .json
          BASELINE = int(os.environ.get("BASELINE_VERSION", "0") or 0)

          # 权威官方文件——/configures/version_js.json
          official_path = os.path.join(CFG_DIR, f"{NAME}.json")
          # 三处 _new 输出路径
          out_paths = [
              f"{NAME}_new.json",                      # 仓库根目录
              os.path.join(CFG_DIR, f"{NAME}_new.json"),  # /configures/
              os.path.join("_artifacts", f"{NAME}_new.json"),  # 上传 Release 用
          ]

          # version 计数：以 /configures/version_js.json 当前的 version 作为
          # baseline，bump 后写入 _new 文件。也兼容 _new 已经存在的场景：
          # 如果 _new.version > baseline，沿用 _new（避免覆盖）
          base = BASELINE
          if os.path.exists(official_path):
              try:
                  with open(official_path, "r") as f:
                      official = json.load(f)
                  base = max(base, int(official.get("version", 0) or 0))
              except Exception:
                  pass
          existing_new = out_paths[1] if os.path.exists(out_paths[1]) else (
              out_paths[0] if os.path.exists(out_paths[0]) else None
          )
          if existing_new:
              try:
                  with open(existing_new, "r") as f:
                      ex = json.load(f)
                  base = max(base, int(ex.get("version", 0) or 0))
              except Exception:
                  pass

          with open(ZIP_NEW, "rb") as f:
              zip_data = f.read()
          data = {
              "version": base + 1,
              "size":    len(zip_data),
              "md5":     hashlib.md5(zip_data).hexdigest().lower(),
          }
          os.makedirs("_artifacts", exist_ok=True)
          os.makedirs(CFG_DIR, exist_ok=True)
          for p in out_paths:
              with open(p, "w") as f:
                  json.dump(data, f, indent=2)
              print(f"✅ 写入 {p}: v{data['version']}, size={data['size']}, md5={data['md5']}")

          # 把 zip 也复制到 _artifacts 供后续上传 Release
          shutil.copy2(ZIP_NEW, os.path.join("_artifacts", ZIP_NEW))
          PYEOF
        env:
          BASELINE_VERSION: ${{ steps.read_config.outputs.js_baseline }}

      # ───────────────────────────────────────────────────────────────
      # [SCENARIO] 同上
      # ───────────────────────────────────────────────────────────────
      - name: "[SCENARIO] 打包 cn_scenario_update_new.zip"
        if: steps.detect.outputs.has_scenario == '1'
        run: |
          mkdir -p _pack_scn/madomagi/resource/scenario/json
          cp -r madomagi/resource/scenario/json/. _pack_scn/madomagi/resource/scenario/json/
          cd _pack_scn && zip -r ../cn_scenario_update_new.zip madomagi/ && cd ..

          python3 - <<'PYEOF'
          import json, hashlib, os, shutil

          CFG_DIR  = os.environ["CONFIG_DIR"]
          ZIP_NEW  = "cn_scenario_update_new.zip"
          NAME     = "version_scenario"
          BASELINE = int(os.environ.get("BASELINE_VERSION", "0") or 0)

          official_path = os.path.join(CFG_DIR, f"{NAME}.json")
          out_paths = [
              f"{NAME}_new.json",
              os.path.join(CFG_DIR, f"{NAME}_new.json"),
              os.path.join("_artifacts", f"{NAME}_new.json"),
          ]

          base = BASELINE
          if os.path.exists(official_path):
              try:
                  with open(official_path, "r") as f:
                      official = json.load(f)
                  base = max(base, int(official.get("version", 0) or 0))
              except Exception:
                  pass
          existing_new = out_paths[1] if os.path.exists(out_paths[1]) else (
              out_paths[0] if os.path.exists(out_paths[0]) else None
          )
          if existing_new:
              try:
                  with open(existing_new, "r") as f:
                      ex = json.load(f)
                  base = max(base, int(ex.get("version", 0) or 0))
              except Exception:
                  pass

          with open(ZIP_NEW, "rb") as f:
              zip_data = f.read()
          data = {
              "version": base + 1,
              "size":    len(zip_data),
              "md5":     hashlib.md5(zip_data).hexdigest().lower(),
          }
          os.makedirs("_artifacts", exist_ok=True)
          os.makedirs(CFG_DIR, exist_ok=True)
          for p in out_paths:
              with open(p, "w") as f:
                  json.dump(data, f, indent=2)
              print(f"✅ 写入 {p}: v{data['version']}, size={data['size']}, md5={data['md5']}")

          shutil.copy2(ZIP_NEW, os.path.join("_artifacts", ZIP_NEW))
          PYEOF
        env:
          BASELINE_VERSION: ${{ steps.read_config.outputs.scenario_baseline }}

      # ───────────────────────────────────────────────────────────────
      # 🚀 上传 _new + (publish_hotfix=true 时) 转正 + 改 configure.json
      # ───────────────────────────────────────────────────────────────
      - name: 🚀 上传热更新包到上游 Release
        id: hotfix_publish
        if: steps.detect.outputs.has_js == '1' || steps.detect.outputs.has_scenario == '1'
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os
          import json
          import shutil
          import urllib.request

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, i=0): print(f"{'  '*i}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, i=0): print(f"{'  '*i}{c(C.DIM, '⏭  ' + t)}", flush=True)

          UPSTREAM_OWNER = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO  = os.environ["UPSTREAM_REPO"]
          PUBLISH        = os.environ.get("PUBLISH_HOTFIX", "false") == "true"
          ARTIFACTS_DIR  = "_artifacts"
          CFG_DIR        = os.environ["CONFIG_DIR"]
          CFG_FILE       = os.environ["CONFIG_FILE"]

          # _new → official 名字映射
          NEW_TO_FINAL = {
              "cn_js_update_new.zip":       "cn_js_update.zip",
              "version_js_new.json":        "version_js.json",
              "cn_scenario_update_new.zip": "cn_scenario_update.zip",
              "version_scenario_new.json":  "version_scenario.json",
          }

          header("上传热更新包到上游 Release")

          # ── 1. 拿当前 Release 信息（id + asset 列表）
          section("获取上游 Release 信息")
          rel = subprocess.run(
              ["gh", "api", f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/releases/latest"],
              capture_output=True, text=True
          )
          if rel.returncode != 0 or not rel.stdout.strip():
              err("获取上游 Release 失败")
              sys.exit(1)
          release = json.loads(rel.stdout)
          release_id  = release["id"]
          release_tag = release.get("tag_name", "latest")
          existing_assets = {a["name"]: a for a in release.get("assets", [])}
          info(f"Release tag: {c(C.BRIGHT_CYAN, release_tag)}  id={release_id}")

          # ── 2. 上传所有 _artifacts 里的 _new 文件
          section("上传 _new 文件到 Release（预览）")
          if not os.path.isdir(ARTIFACTS_DIR):
              warn("_artifacts 目录不存在，跳过")
          else:
              for fname in os.listdir(ARTIFACTS_DIR):
                  fpath = os.path.join(ARTIFACTS_DIR, fname)
                  if not os.path.isfile(fpath):
                      continue
                  info(f"上传: {c(C.BRIGHT_WHITE, fname)}")
                  if fname in existing_assets:
                      subprocess.run(
                          ["gh", "api",
                           f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
                           f"/releases/assets/{existing_assets[fname]['id']}",
                           "--method", "DELETE"],
                          capture_output=True, text=True
                      )
                  up = subprocess.run(
                      ["gh", "release", "upload", release_tag, fpath,
                       "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                       "--clobber"],
                      capture_output=True, text=True
                  )
                  if up.returncode == 0:
                      ok(f"上传成功: {fname}", indent=1)
                  else:
                      err(f"上传失败: {up.stderr.strip()}", indent=1)

          # ── 3. 如果没勾发布热更新，到此为止
          if not PUBLISH:
              section("publish_hotfix=false，跳过转正")
              skip("_new 文件已上传到 Release 供预览，official + configure.json 不变")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("hotfix_published=false\n")
              sys.exit(0)

          # ── 4. publish_hotfix=true：把 _new 文件去掉 _new 后缀
          section("发布热更新包（_new → official，覆盖正式文件）")

          # 4a. 同 official 名字的 asset 先删
          # 重新拉 asset 列表，因为上一步刚上传过新文件
          rel2 = subprocess.run(
              ["gh", "api", f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/releases/latest"],
              capture_output=True, text=True
          )
          assets2 = {a["name"]: a for a in json.loads(rel2.stdout).get("assets", [])}

          # 4b. 转正：基于本地 _artifacts 文件直接重命名上传
          for new_name, final_name in NEW_TO_FINAL.items():
              src = os.path.join(ARTIFACTS_DIR, new_name)
              if not os.path.isfile(src):
                  skip(f"{new_name} 在本地 _artifacts/ 不存在（本次未生成），跳过")
                  continue
              info(f"{c(C.BRIGHT_YELLOW, new_name)} → {c(C.BRIGHT_GREEN, final_name)}")

              # 删 Release 上同名 official asset
              if final_name in assets2:
                  subprocess.run(
                      ["gh", "api",
                       f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
                       f"/releases/assets/{assets2[final_name]['id']}",
                       "--method", "DELETE"],
                      capture_output=True, text=True
                  )
                  ok(f"已删旧 official: {final_name}", indent=1)

              # 上传 _new 内容作为 official
              up_arg = f"{src}#{final_name}"
              up = subprocess.run(
                  ["gh", "release", "upload", release_tag, up_arg,
                   "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                   "--clobber"],
                  capture_output=True, text=True
              )
              if up.returncode != 0:
                  err(f"上传 official 失败: {up.stderr.strip()}", indent=1)
                  continue
              ok(f"已发布 official: {final_name}", indent=1)

              # 4c. 把本地 official JSON 同步到 / 和 /configures/（仅 .json）
              if final_name.endswith(".json"):
                  with open(src, "rb") as f:
                      data = f.read()
                  for dst in [final_name, os.path.join(CFG_DIR, final_name)]:
                      with open(dst, "wb") as f:
                          f.write(data)
                  ok(f"同步 official → /, /{CFG_DIR}/", indent=1)

          # ── 5. 同步 configure.json#hotfix 子块（在 3 处）
          section("同步 configure.json#hotfix 子块")
          cfg_official = os.path.join(CFG_DIR, CFG_FILE)
          if not os.path.isfile(cfg_official):
              err(f"权威 {cfg_official} 不存在，无法更新 hotfix 块")
              sys.exit(1)
          with open(cfg_official, "r", encoding="utf-8") as f:
              cfg = json.load(f)
          if "hotfix" not in cfg or not isinstance(cfg["hotfix"], dict):
              cfg["hotfix"] = {}

          updated_blocks = []
          for short, ver_name in [("scenario", "version_scenario"),
                                  ("js",       "version_js")]:
              official_json = os.path.join(CFG_DIR, f"{ver_name}.json")
              if not os.path.isfile(official_json):
                  skip(f"{official_json} 不存在，跳过 hotfix.{short}")
                  continue
              with open(official_json, "r", encoding="utf-8") as f:
                  meta = json.load(f)
              cfg["hotfix"][short] = {
                  "version": int(meta.get("version", 0) or 0),
                  "size":    int(meta.get("size",    0) or 0),
                  "md5":     str(meta.get("md5",     "")).lower(),
              }
              updated_blocks.append(short)
              ok(f"hotfix.{short} = v{cfg['hotfix'][short]['version']}, "
                 f"size={cfg['hotfix'][short]['size']}, "
                 f"md5={cfg['hotfix'][short]['md5']}")

          if not updated_blocks:
              warn("没有任何 official version_*.json 可供同步，hotfix 块未更新")
          else:
              # 写回三处
              cfg_text = json.dumps(cfg, indent=2, ensure_ascii=False) + "\n"
              for dst in [cfg_official, CFG_FILE]:  # /configures/configure.json + /configure.json
                  with open(dst, "w", encoding="utf-8") as f:
                      f.write(cfg_text)
                  ok(f"已写入 {dst}")
              # 上传到 Release
              tmp = f"/tmp/{CFG_FILE}"
              with open(tmp, "w", encoding="utf-8") as f:
                  f.write(cfg_text)
              if CFG_FILE in {a["name"] for a in json.loads(
                      subprocess.run(["gh", "api",
                          f"repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}/releases/latest"],
                          capture_output=True, text=True).stdout
                  ).get("assets", [])}:
                  # 删旧再上传
                  pass  # gh release upload --clobber 会自动覆盖
              up = subprocess.run(
                  ["gh", "release", "upload", release_tag, f"{tmp}#{CFG_FILE}",
                   "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                   "--clobber"],
                  capture_output=True, text=True
              )
              if up.returncode == 0:
                  ok(f"已上传 {CFG_FILE} 到 Release")
              else:
                  err(f"上传 {CFG_FILE} 失败: {up.stderr.strip()}")

          ok("热更新包发布 + configure.json#hotfix 同步完成")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("hotfix_published=true\n")
          SCRIPT_END
        env:
          PUBLISH_HOTFIX: ${{ steps.check_upstream.outputs.publish_hotfix }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: pip install boto3 tencentcloud-sdk-python

      - name: 📲 同步客户端 APK 到上游 Release
        id: sync_apk
        run: |
          python3 <<'SCRIPT_END'
          import subprocess
          import sys
          import os
          import json
          import urllib.request
          import urllib.error

          sys.stdout.reconfigure(line_buffering=True)

          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"
              CYAN          = "\033[36m"

          def c(col, t): return f"{col}{t}{C.RESET}"
          def header(t):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {t}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)
          def section(t): print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + t)}", flush=True)
          def info(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_BLUE, 'ℹ')} {t}", flush=True)
          def ok(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_GREEN, '✔')} {t}", flush=True)
          def warn(t, i=0): print(f"{'  '*i}{c(C.BRIGHT_YELLOW, '⚠')} {t}", flush=True)
          def err(t, i=0): print(f"{'  '*i}{c(C.RED, '✘')} {t}", flush=True)
          def skip(t, i=0): print(f"{'  '*i}{c(C.DIM, '⏭  ' + t)}", flush=True)
          def human_size(n):
              for u in ["B", "KB", "MB", "GB"]:
                  if n < 1024: return f"{n:.1f} {u}"
                  n /= 1024
              return f"{n:.1f} TB"
          def set_output(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{k}={v}\n")

          UPSTREAM_OWNER = os.environ["UPSTREAM_OWNER"]
          UPSTREAM_REPO  = os.environ["UPSTREAM_REPO"]
          CLIENT_OWNER   = "MagirecoCN-Revival-Project"
          CLIENT_REPO    = "magireco-client-patch"
          GH_TOKEN       = os.environ.get("GH_TOKEN", "")

          GH_HEADERS = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if GH_TOKEN:
              GH_HEADERS["Authorization"] = f"Bearer {GH_TOKEN}"

          def fetch_release(owner, repo):
              url = f"https://api.github.com/repos/{owner}/{repo}/releases/latest"
              req = urllib.request.Request(url, headers=GH_HEADERS)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  if e.code == 404: return None
                  raise

          def delete_asset(asset_id, name):
              url = (f"https://api.github.com/repos/{UPSTREAM_OWNER}/{UPSTREAM_REPO}"
                     f"/releases/assets/{asset_id}")
              req = urllib.request.Request(url, headers=GH_HEADERS, method="DELETE")
              try:
                  with urllib.request.urlopen(req): pass
                  ok(f"已删除旧 asset: {name}", indent=1)
                  return True
              except Exception as e:
                  warn(f"删除 [{name}] 失败: {e}", indent=1)
                  return False

          def upload_asset_to_upstream(release_tag, local_path, display_name):
              upstream_release = fetch_release(UPSTREAM_OWNER, UPSTREAM_REPO)
              if not upstream_release:
                  err("重新获取上游 Release 失败")
                  return False
              cur_map = {a["name"]: a for a in upstream_release.get("assets", [])}
              if display_name in cur_map:
                  delete_asset(cur_map[display_name]["id"], display_name)
              upload_arg = f"{local_path}#{display_name}"
              result = subprocess.run(
                  ["gh", "release", "upload", release_tag, upload_arg,
                   "--repo", f"{UPSTREAM_OWNER}/{UPSTREAM_REPO}",
                   "--clobber"],
                  capture_output=True, text=True
              )
              if result.returncode == 0:
                  ok(f"已上传: {display_name}", indent=1)
                  return True
              err(f"上传失败 [{display_name}]: {result.stderr.strip()}", indent=1)
              return False

          def main():
              header("同步客户端 APK 到上游 Release")

              section("读取历史 APK 同步记录")
              result = subprocess.run(
                  ["gh", "variable", "get", "LAST_APK_RELEASE_TAG"],
                  capture_output=True, text=True
              )
              last_apk_tag = result.stdout.strip() if result.returncode == 0 else ""
              if last_apk_tag:
                  info(f"上次同步 tag: {c(C.DIM, last_apk_tag)}")
              else:
                  info("无历史记录，视为首次同步")

              section(f"获取 {CLIENT_OWNER}/{CLIENT_REPO} 最新 Release")
              client_release = fetch_release(CLIENT_OWNER, CLIENT_REPO)
              if not client_release:
                  warn(f"{CLIENT_OWNER}/{CLIENT_REPO} 暂无 Release，跳过 APK 同步")
                  set_output("apk_synced", "false")
                  return

              client_tag  = client_release.get("tag_name", "")
              client_name = client_release.get("name") or client_tag
              info(f"最新 Release: {c(C.BRIGHT_WHITE, client_name)}")
              info(f"Tag:          {c(C.BRIGHT_CYAN, client_tag)}")

              section("比对 tag")
              if client_tag and client_tag == last_apk_tag:
                  skip(f"APK tag 未变化（{client_tag}），无需同步")
                  set_output("apk_synced", "false")
                  return
              ok(f"检测到新 APK: {c(C.BRIGHT_CYAN, client_tag)}")

              section("筛选 APK 文件")
              apk_assets = [
                  a for a in client_release.get("assets", [])
                  if a["name"].lower().endswith(".apk")
              ]
              if not apk_assets:
                  warn("该 Release 中未找到 .apk 文件，跳过")
                  set_output("apk_synced", "false")
                  return

              if len(apk_assets) > 1:
                  warn(f"检测到 {len(apk_assets)} 个 APK，"
                       f"只使用第一个: {c(C.BRIGHT_WHITE, apk_assets[0]['name'])}")
              asset = apk_assets[0]
              fname = asset["name"]
              info(f"原始文件名: {c(C.BRIGHT_WHITE, fname)}")
              info(f"目标文件名: {c(C.BRIGHT_CYAN, 'client.apk')}")
              info(f"大小:       {c(C.DIM, human_size(asset['size']))}")

              section(f"获取 {UPSTREAM_OWNER}/{UPSTREAM_REPO} Release tag")
              upstream_release = fetch_release(UPSTREAM_OWNER, UPSTREAM_REPO)
              if not upstream_release:
                  err("获取上游 Release 失败，无法上传 APK")
                  set_output("apk_synced", "false")
                  sys.exit(1)
              upstream_tag = upstream_release.get("tag_name", "latest")
              info(f"上游 Release tag: {c(C.BRIGHT_CYAN, upstream_tag)}")

              section("下载 APK")
              work_dir = "/tmp/apk_sync"
              os.makedirs(work_dir, exist_ok=True)
              dst_path = os.path.join(work_dir, fname)
              try:
                  dl_req = urllib.request.Request(
                      asset["browser_download_url"], headers=GH_HEADERS
                  )
                  with urllib.request.urlopen(dl_req) as resp:
                      data = resp.read()
                  with open(dst_path, "wb") as f:
                      f.write(data)
                  ok(f"已下载: {fname}  {c(C.DIM, human_size(len(data)))}", indent=1)
              except Exception as e:
                  err(f"下载失败: {e}", indent=1)
                  set_output("apk_synced", "false")
                  sys.exit(1)

              section("上传为 client.apk 到上游 Release")
              info(f"{c(C.BRIGHT_WHITE, fname)} → {c(C.BRIGHT_CYAN, 'client.apk')}")
              if not upload_asset_to_upstream(upstream_tag, dst_path, "client.apk"):
                  set_output("apk_synced", "false")
                  sys.exit(1)

              section("保存 APK 同步记录")
              save_result = subprocess.run(
                  ["gh", "variable", "set", "LAST_APK_RELEASE_TAG",
                   "--body", client_tag],
                  capture_output=True, text=True
              )
              if save_result.returncode == 0:
                  ok(f"LAST_APK_RELEASE_TAG = {c(C.BRIGHT_CYAN, client_tag)}")
              else:
                  warn(f"保存 tag 失败: {save_result.stderr.strip()}")

              set_output("apk_synced", "true")
              header("APK 同步完成")
              ok(f"来源: {c(C.BRIGHT_WHITE, fname)}  {c(C.DIM, '(' + client_tag + ')')}")
              ok(f"目标: {c(C.BRIGHT_CYAN, 'client.apk')} → 上游 Release")

          if __name__ == "__main__":
              main()
          SCRIPT_END

      # ───────────────────────────────────────────────────────────────
