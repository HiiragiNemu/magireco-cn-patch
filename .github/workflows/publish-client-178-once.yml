name: One-shot publish verified client 1.0.178

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-client-178-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.repository == 'HiiragiNemu/magireco-cn-patch'
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "35524630427"
      APK_NAME: "magireco-latest-legacy-client.apk"
      META_NAME: "magireco-latest-legacy-client.version.json"
      PAGES_BASE: "https://magireco-personal-release.pages.dev"
    steps:
      - name: Download verified artifact
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name personal-native-main-verified \
            --dir payload
          test -s payload/magirecocn-legacy-client.apk
          test -s "payload/${META_NAME}"
          mv payload/magirecocn-legacy-client.apk "payload/${APK_NAME}"

      - name: Verify artifact identity and mark publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          apk = Path("payload") / os.environ["APK_NAME"]
          meta_path = Path("payload") / os.environ["META_NAME"]
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size

          assert meta["version"] == "1.0.178", meta
          assert meta["apk"] == os.environ["APK_NAME"], meta
          assert meta["sha256"] == digest, (meta["sha256"], digest)
          assert int(meta["size"]) == size, (meta["size"], size)
          assert meta["source_commit"] == "0c1607e7b9d8093cb0e476632f4a7fd4ec33757c", meta
          assert meta["workflow_commit"] == "4b5dbf3681a22330c06ce8f74a3c8619a7042766", meta

          meta["publication"] = "PUBLISHED"
          meta["published_from_run"] = int(os.environ["SOURCE_RUN_ID"])
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APK_SHA256=" + digest + "\n")
              f.write("APK_SIZE=" + str(size) + "\n")
              f.write("APK_VERSION=" + meta["version"] + "\n")
          print("verified", meta["version"], size, digest)
          PY

      - name: Upload verified client to latest Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload latest \
            "payload/${APK_NAME}" \
            "payload/${META_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Verify latest Release bytes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          raw = subprocess.check_output([
              "gh", "api",
              f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/latest"
          ], text=True)
          release = json.loads(raw)
          assets = {a["name"]: a for a in release["assets"]}
          apk = assets[os.environ["APK_NAME"]]
          meta = assets[os.environ["META_NAME"]]
          assert int(apk["size"]) == int(os.environ["APK_SIZE"]), apk
          assert apk.get("digest") == "sha256:" + os.environ["APK_SHA256"], apk
          assert int(meta["size"]) > 0, meta
          print("release verified", apk["name"], apk["size"], apk["digest"])
          PY

      - name: Verify personal Pages transport sees the release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, time

          base = os.environ["PAGES_BASE"]
          meta_url = base + "/" + os.environ["META_NAME"] + "?verify=" + str(time.time_ns())
          req = urllib.request.Request(meta_url, headers={
              "User-Agent": "MadeInMagius-Client-Publish-Verify",
              "Accept-Encoding": "identity",
          })
          with urllib.request.urlopen(req, timeout=60) as response:
              remote = json.loads(response.read().decode())
          assert remote["version"] == os.environ["APK_VERSION"], remote
          assert remote["sha256"] == os.environ["APK_SHA256"], remote
          assert int(remote["size"]) == int(os.environ["APK_SIZE"]), remote

          apk_url = base + "/" + os.environ["APK_NAME"] + "?verify=" + str(time.time_ns())
          req = urllib.request.Request(apk_url, method="HEAD", headers={
              "User-Agent": "MadeInMagius-Client-Publish-Verify",
              "Accept-Encoding": "identity",
          })
          with urllib.request.urlopen(req, timeout=60) as response:
              length = int(response.headers.get("Content-Length") or 0)
          assert length == int(os.environ["APK_SIZE"]), (length, os.environ["APK_SIZE"])
          print("pages transport verified", remote["version"], length)
          PY

      - name: Checkout publication authority
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magireco-cn-patch
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: authority

      - name: Raise client gate only after transport verification
        run: |
          set -euo pipefail
          cd authority
          APK_VERSION="${APK_VERSION}" APK_SHA256="${APK_SHA256}" APK_SIZE="${APK_SIZE}" python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path

          p = Path("configures/personal-online-config.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          client = data["client"]

          old = client.get("version", "")
          assert old in ("1.0.177", "1.0.178"), old

          client["version"] = os.environ["APK_VERSION"]
          client["sha256"] = os.environ["APK_SHA256"]
          client["size"] = int(os.environ["APK_SIZE"])
          client["apk_url"] = "https://magireco-personal-release.pages.dev/magireco-latest-legacy-client.apk"
          data["updated"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"client.version {old} -> {client['version']}")
          PY

          git config user.name "Hiiragi Nemu"
          git config user.email "128921071+HiiragiNemu@users.noreply.github.com"
          git add configures/personal-online-config.json
          if git diff --cached --quiet; then
            echo "client gate already matches verified release"
            exit 0
          fi
          git commit -m "release: publish verified client 1.0.178 [skip ci]"
          git push origin HEAD:main
