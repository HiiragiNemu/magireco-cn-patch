name: Dispatch client 1.0.179 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-client-179-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.repository == 'HiiragiNemu/magireco-cn-patch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger verified client build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run build-personal-client.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_sha=34ea55ee661ef911a7e1eb233d94fc8d0bd66efc \
            -f client_version=1.0.179 \
            -f engine=self \
            -f debug_overlay=false
          echo "dispatched 1.0.179"
