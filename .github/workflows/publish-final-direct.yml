name: Personal finalized release delivery
on:
  push:
    branches: [main]
    paths: ['configures/**', 'distribution/personal/**', '.github/workflows/publish-final-direct.yml']
  workflow_dispatch:
    inputs:
      purge_all:
        description: 'Verify personal release; responses bypass stale caches'
        type: boolean
        default: true
  workflow_run:
    workflows: ['个人仓库游戏更新发布']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: personal-finalized-delivery
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'HiiragiNemu/magireco-cn-patch' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify main-bound finalized assets
        run: |
          mkdir -p payload
          gh release download latest --repo "$GITHUB_REPOSITORY" --dir payload \
            --pattern cn_js_update.zip --pattern cn_scenario_update.zip \
            --pattern cn_js_update_manifest.json --pattern cn_scenario_update_manifest.json \
            --pattern manifest.json --pattern version_js.json --pattern version_scenario.json
          python scripts/publish_finalized_localization.py verify-local
      - name: Verify actual personal transport bodies
        run: python distribution/personal/verify_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-live-release-verification
          path: personal-live-verification.json
