name: Publish finalized localization assets directly

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purge_all:
        description: "刷新根目录 CDN 缓存（仅七个热更新对象）"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'MagirecoCN-Revival-Project/magireco-cn-patch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_REGION: ${{ secrets.R2_REGION }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
      QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
      EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
      EDGEONE_DOMAIN: ${{ secrets.EDGEONE_DOMAIN }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      ESA_SITE_ID: ${{ secrets.ESA_SITE_ID }}
      ESA_DOMAIN: ${{ secrets.ESA_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download main-bound finalized Release assets
        run: |
          set -euo pipefail
          mkdir -p payload
          gh release download latest --repo "${{ github.repository }}" --dir payload \
            --pattern cn_js_update.zip --pattern cn_scenario_update.zip \
            --pattern cn_js_update_manifest.json --pattern cn_scenario_update_manifest.json \
            --pattern manifest.json --pattern version_js.json --pattern version_scenario.json
          python3 scripts/publish_finalized_localization.py verify-local
      - name: Preserve production baseline
        run: |
          python3 -m pip install --quiet boto3
          python3 scripts/publish_finalized_localization.py backup
      - name: Save rollback inputs before publication
        uses: actions/upload-artifact@v4
        with:
          name: localization-production-backup-${{ github.run_id }}
          path: |
            production-backup/
            configures/finalized-localization-assets.json
            scripts/publish_finalized_localization.py
          if-no-files-found: error
      - name: Publish seven objects with full body verification
        run: python3 scripts/publish_finalized_localization.py apply

      - name: Purge EdgeOne and ESA exact URLs
        run: |
          set -euo pipefail
          python3 -m pip install --quiet tencentcloud-sdk-python alibabacloud_esa20240910
          python3 - <<'PY'
          import os,json
          names=['cn_js_update.zip','cn_scenario_update.zip','cn_js_update_manifest.json','cn_scenario_update_manifest.json','manifest.json','version_js.json','version_scenario.json']
          from tencentcloud.common import credential
          from tencentcloud.common.profile.client_profile import ClientProfile
          from tencentcloud.common.profile.http_profile import HttpProfile
          from tencentcloud.teo.v20220901 import teo_client,models
          c=credential.Credential(os.environ['QCLOUD_SECRET_ID'],os.environ['QCLOUD_SECRET_KEY']); hp=HttpProfile(); hp.endpoint='teo.tencentcloudapi.com'; cp=ClientProfile(); cp.httpProfile=hp; cli=teo_client.TeoClient(c,'',cp)
          for n in names:
            q=models.CreatePurgeTaskRequest(); q.from_json_string(json.dumps({'ZoneId':os.environ['EDGEONE_ZONE_ID'],'Type':'purge_url','Targets':[f"{scheme}://{os.environ['EDGEONE_DOMAIN']}/{n}" for scheme in ["http","https"]]})); print('edge',n,cli.CreatePurgeTask(q).RequestId)
          from alibabacloud_esa20240910.client import Client
          from alibabacloud_esa20240910 import models as em
          from alibabacloud_tea_openapi import models as om
          cfg=om.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],endpoint='esa.cn-hangzhou.aliyuncs.com'); ec=Client(cfg); q=em.PurgeCachesRequest(site_id=int(os.environ['ESA_SITE_ID']),type='file',content=em.PurgeCachesRequestContent(files=[f"{scheme}://{os.environ['ESA_DOMAIN']}/{n}" for n in names for scheme in ["http","https"]])); print('esa',getattr(ec.purge_caches(q).body,'task_id',None))
          PY

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalized-localization-publish-evidence
          path: publish-evidence.json
