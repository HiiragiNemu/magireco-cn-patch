name: 个人 main 客户端手动构建
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TREE: work/tree
    steps:
    - name: 🛡️ 安全护栏（fork 不得构建）
      if: ${{ github.event.repository.fork }}
      run: 'echo "::error::这是一个 fork，不允许用本工作流产出对外产物"

        exit 1

        '
    - name: 📦 检出仓库
      uses: actions/checkout@v4
      with:
        repository: ${{ vars.NATIVE_SOURCE_REPO }}
        ref: main
        token: ${{ secrets.GH_TOKEN }}
        persist-credentials: false
    - name: 🔤 取回已审阅的国服补字形字体
      uses: actions/checkout@v4
      with:
        repository: HiiragiNemu/magireco-cn-patch
        ref: 71d3278ea246b58b4a3bc6808a01c96a4e65bdcd
        token: ${{ secrets.GH_TOKEN }}
        persist-credentials: false
        sparse-checkout: |
          magica/fonts/TTDaYuanGB3.ttf
          magica/fonts/TTZhiHeiGB3-W4.ttf
        sparse-checkout-cone-mode: false
        path: .reviewed-fonts
    - name: Verify native main source and monotonic client version
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        REQUESTED_VERSION: ${{ inputs.client_version }}
        CONFIG_URL: ${{ vars.CLIENT_CONFIG_URL }}
        VERSION_FLOOR: ${{ vars.CLIENT_VERSION_FLOOR }}
      run: 'set -euo pipefail


        python3 - <<''PY''

        import json, os, re, subprocess, urllib.request

        sha = subprocess.check_output([''git'', ''rev-parse'', ''HEAD''], text=True).strip()

        assert re.fullmatch(r''[0-9a-f]{40}'', os.environ[''EXPECTED_SOURCE_SHA''])

        assert sha == os.environ[''EXPECTED_SOURCE_SHA''], ''Native main advanced; select the new main commit explicitly''

        version = os.environ[''REQUESTED_VERSION'']

        assert re.fullmatch(r''1\.0\.[1-9][0-9]*'', version), ''Invalid version''

        req = urllib.request.Request(os.environ[''CONFIG_URL''], headers={''User-Agent'': ''MadeInMagius-Build-Verification''})

        with urllib.request.urlopen(req, timeout=45) as response: config = json.load(response)

        floor = os.environ[''VERSION_FLOOR'']

        assert re.fullmatch(r''1\.0\.[1-9][0-9]*'', floor), ''Verified predecessor version floor is required''

        previous = max([floor, config.get(''client'', {}).get(''version'', floor)], key=lambda v: tuple(map(int,
        v.split(''.''))))

        assert tuple(map(int, version.split(''.''))) > tuple(map(int, previous.split(''.''))), ''Version must exceed
        the live gate''

        print(''MAIN_SOURCE_PIN_AND_MONOTONIC_VERSION_PASS'', sha, version)

        with open(os.environ[''GITHUB_ENV''], ''a'') as f: f.write(''NATIVE_SOURCE_SHA='' + sha + ''\n'')

        PY'
    - name: Verify typed native battle skill names
      run: python3 tools/test-battle-skill-name-context.py
    - name: ☕ 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: 🔧 安装构建工具
      run: "set -euo pipefail\nsudo mkdir -p /usr/local/bin\n\n# ── 构建工具 2.9.3 ───────────────────────────────────────────\n\
        curl -sSL -o /tmp/apktool.jar \\\n  \"https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar\"\
        \n# X-C3：下载即校验 sha256（与 baseline.json 的 apktool pin 同值）——\n# 这个 jar 随后被 sudo 装进 /usr/local/bin 执行；release\
        \ 资产被替换\n# 或下载链路被劫持时，没有内容校验就是 CI 远程命令执行入口。\necho \"7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4\
        \  /tmp/apktool.jar\" \\\n  | sha256sum -c -\nsudo mv /tmp/apktool.jar /usr/local/bin/apktool.jar\nprintf\
        \ '#!/bin/bash\\nexec java -jar /usr/local/bin/apktool.jar \"$@\"\\n' \\\n  | sudo tee /usr/local/bin/apktool\
        \ > /dev/null\nsudo chmod +x /usr/local/bin/apktool\n\n# ── 解码器 3.0.9（Google 维护的延续版本，tag 无 v 前缀）──────\n\
        curl -sSL -o /tmp/baksmali.jar \\\n  \"https://github.com/baksmali/smali/releases/download/3.0.9/baksmali-3.0.9-fat-release.jar\"\
        \n# X-C3：sha256 钉死（baksmali-3.0.9-fat-release.jar，实测自官方 release）\necho \"1b206070701b2145bd1e6204abd6c14fea877f335486845cd4df149bf5f79c2e\
        \  /tmp/baksmali.jar\" \\\n  | sha256sum -c -\nsudo mv /tmp/baksmali.jar /usr/local/bin/baksmali.jar\nprintf\
        \ '#!/bin/bash\\nexec java -jar /usr/local/bin/baksmali.jar \"$@\"\\n' \\\n  | sudo tee /usr/local/bin/baksmali\
        \ > /dev/null\nsudo chmod +x /usr/local/bin/baksmali\n\n# ── Android SDK build-tools（d8 / zipalign / apksigner）──────\n\
        BT_DIR=\"$(ls -d \"${ANDROID_HOME}\"/build-tools/*/ 2>/dev/null | sort -r | head -1 || true)\"\nif [ -z\
        \ \"${BT_DIR}\" ]; then\n  yes | \"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager\" \"build-tools;34.0.0\"\
        \ > /dev/null\n  BT_DIR=\"$(ls -d \"${ANDROID_HOME}\"/build-tools/*/ | sort -r | head -1)\"\nfi\necho \"\
        BT_DIR=${BT_DIR%/}\" >> \"$GITHUB_ENV\"\necho \"build-tools: ${BT_DIR}\"\n\napktool --version\n\"${BT_DIR%/}/apksigner\"\
        \ --version\n"
    - name: 📥 准备编译依赖（android.jar + OkHttp）
      run: "set -euo pipefail\n# classpath 只有 android.jar + OkHttp/Okio。\n# 补丁源码只用 JDK 自带能力与 Android 框架，不引第三方库。\n\
        mkdir -p .cache/deps\ncurl -sSL -o .cache/deps/platform.zip \\\n  \"https://dl.google.com/android/repository/platform-33_r02.zip\"\
        \n# X-C3：三个依赖全部 sha256 钉死（platform-33_r02.zip / okhttp /\n# okio，均实测自官方源）——它们进 javac/d8 的 classpath，被污染的\n\
        # jar 会把恶意字节码直接编进补丁 dex。\necho \"f851b13fe89f8510a1250df5e8593e86176b2428f4f3cbe0e304a85818c07bc8  .cache/deps/platform.zip\"\
        \ \\\n  | sha256sum -c -\nunzip -o -q -j .cache/deps/platform.zip \"*/android.jar\" -d .cache/deps\nrm -f\
        \ .cache/deps/platform.zip\ncurl -sSL -o .cache/deps/okhttp.jar \\\n  \"https://repo1.maven.org/maven2/com/squareup/okhttp3/okhttp/3.12.13/okhttp-3.12.13.jar\"\
        \necho \"508234e024ef7e270ab1a6d5b356f5b98e786511239ca986d684fd1e2cf7bc82  .cache/deps/okhttp.jar\" \\\n\
        \  | sha256sum -c -\ncurl -sSL -o .cache/deps/okio.jar \\\n  \"https://repo1.maven.org/maven2/com/squareup/okio/okio/1.17.5/okio-1.17.5.jar\"\
        \necho \"19a7ff48d86d3cf4497f7f250fbf295f430c13a528dd5b7b203f821802b886ad  .cache/deps/okio.jar\" \\\n \
        \ | sha256sum -c -\nls -la .cache/deps\n"
    - name: 🔑 预检必需的构建变量
      env:
        BASELINE_APK_URL: ${{ vars.BASELINE_APK_URL }}
        OVERLAY_URL: ${{ vars.OVERLAY_URL }}
        CLIENT_ROOT_DOMAIN: ${{ vars.CLIENT_ROOT_DOMAIN }}
        CLIENT_PAGES_HOSTS: ${{ vars.CLIENT_PAGES_HOSTS }}
      run: |
        set -euo pipefail
        NEED="BASELINE_APK_URL OVERLAY_URL CLIENT_ROOT_DOMAIN CLIENT_PAGES_HOSTS"
        MISSING=""
        for v in $NEED; do
          if [ -z "${!v:-}" ]; then MISSING="$MISSING $v"; fi
        done
        if [ -n "$MISSING" ]; then
          echo "::error::这些构建变量为空：$MISSING"
          exit 1
        fi
        echo "必需的构建变量都在（$NEED）"
        python3 tools/check-production-endpoints.py
    - name: 🚧 校验 native 入口保护（异常绝不外泄）
      run: |
        python3 tools/check-entry-guard.py
        python3 tools/check-final-flag-parity.py
    - name: 🔒 校验调试开关没伸进安全判据
      run: python3 tools/check-debug-flag-boundary.py
    - name: 🧬 校验基线 patchset 自洽
      run: python3 tools/check-baseline.py
    - name: ⚖️ 第三方组件声明审计（仅提示）
      run: |
        if ! python3 tools/check-third-party-notices.py; then
          echo "::warning::第三方声明审计有待维护；它不影响 APK 字节正确性，因此不阻断本次构建"
        fi
    - name: 🌱 从Totentanz 整包重建工程树
      env:
        OVERLAY_URL: ${{ vars.OVERLAY_URL }}
        BASELINE_APK_URL: ${{ vars.BASELINE_APK_URL }}
      run: "set -euo pipefail\nJ21=\"${JAVA_HOME_21_X64:-}\"\nif [ -z \"$J21\" ] || [ ! -x \"$J21/bin/java\" ];\
        \ then\n  echo \"::error::runner 上找不到 JDK 21（JAVA_HOME_21_X64 未设或不可用）\"\n  exit 1\nfi\nexport JAVA_HOME=\"\
        $J21\"\nexport PATH=\"$JAVA_HOME/bin:$PATH\"\njava -version\npython3 tools/baseline.py fetch --java \"$J21/bin/java\"\
        \npython3 tools/baseline.py apply --out \"${TREE}\"\n# 1.0.181：固定使用 71d3278e… 已审阅补字形字体；原生 MTF/mbm 恢复 6095180 前的 MagiReco CN Medium 载体；Web 字体不变。\ntest \"$(git -C .reviewed-fonts hash-object magica/fonts/TTDaYuanGB3.ttf)\" = \"b121abca3ef624104c84adf2a25de2ea2bea7cf0\"\ntest \"$(git -C .reviewed-fonts hash-object magica/fonts/TTZhiHeiGB3-W4.ttf)\" = \"e588b7ddb4b5a1761bf94d73d732b3330d292413\"\ninstall -m 0644 .reviewed-fonts/magica/fonts/TTDaYuanGB3.ttf \"${TREE}/assets/fonts/TTDaYuanGB3.ttf\"\ninstall -m 0644 .reviewed-fonts/magica/fonts/TTZhiHeiGB3-W4.ttf \"${TREE}/assets/fonts/TTZhiHeiGB3-W4.ttf\"\ninstall -m 0644 assets/fonts/mbm_20160902.ttf \"${TREE}/assets/fonts/MTF4a5kp.ttf\"\ninstall -m 0644 assets/fonts/mbm_20160902.ttf \"${TREE}/assets/fonts/mbm_20160902.ttf\"\necho \"重建树：$(find \"${TREE}\" -type f | wc -l) 个文件\"\
        \n"
    - name: 🚫 正式包剔除悬浮窗权限（F-043）
      if: ${{ inputs.debug_overlay != true }}
      run: "set -euo pipefail\nMANIFEST=\"${TREE}/AndroidManifest.xml\"\nsed -i '/android.permission.SYSTEM_ALERT_WINDOW/d'\
        \ \"$MANIFEST\"\nif grep -q 'SYSTEM_ALERT_WINDOW' \"$MANIFEST\"; then\n  echo \"::error::正式包仍含 SYSTEM_ALERT_WINDOW，剔除失败\"\
        \n  exit 1\nfi\necho \"已剔除悬浮窗权限（release 构建，debug_overlay=false）\"\n"
    - name: 🛠 移除离线导入跳板的 noHistory（F-051）
      run: "set -euo pipefail\nMANIFEST=\"${TREE}/AndroidManifest.xml\"\nsed -i '/CNOfflineImportActivity/s/ android:noHistory=\"\
        true\"//' \"$MANIFEST\"\nif grep 'CNOfflineImportActivity' \"$MANIFEST\" | grep -q 'noHistory=\"true\"';\
        \ then\n  echo \"::error::CNOfflineImportActivity 仍含 noHistory，移除失败\"\n  exit 1\nfi\necho \"已移除 CNOfflineImportActivity\
        \ 的 noHistory（离线导入结果回调可送达）\"\n"
    - name: 🗑 剔除死库：libbacktrace-native / libcrashpad_handler
      run: "set -euo pipefail\n# 这两枚 .so 是游戏原版 APK 里 Backtrace.io 崩溃上报 SDK 的 native\n# 组件（f4samurai 自带；上游 Puella-Care\
        \ 与本项目均未添加，上游\n# 仓库 lib/ 只有 Dobby/cocos/untp，Backtrace.patch 只改游戏自身\n# smali 的上报端点）。1.1.1 → 1.2.0 换基线时已删除全部\
        \ 358 个埋点\n# SDK 类（含 backtrace Java 侧，见 tools/baseline.py 文档），官方\n# 服务器也已停运——没有任何代码再加载它们，纯死重，且 4K 对齐\n#\
        \ 无法重链（无源码）。删掉既省体积又根除 16K 对齐扫描噪音。\n#\n# fail-closed：删之前全树搜引用，搜到即失败。将来换基线若重新\n# 引入加载者，这里红灯拦住，而不是静默出一个启动即崩的包。\n\
        if grep -rlsI -e 'backtrace-native' -e 'crashpad' \\\n     --include='*.smali' --include='*.xml' --include='*.json'\
        \ \\\n     --include='*.java' --include='*.cpp' --include='*.h' \\\n     --include='*.txt' --include='*.yml'\
        \ \\\n     \"${TREE}\"; then\n  echo \"::error::工程树里仍有 backtrace/crashpad 引用（见上），不能删库——请人工核对引用来源后再放行\"\n\
        \  exit 1\nfi\nfor ABI in arm64-v8a armeabi-v7a; do\n  rm -f \"${TREE}/lib/${ABI}/libbacktrace-native.so\"\
        \ \\\n        \"${TREE}/lib/${ABI}/libcrashpad_handler.so\"\ndone\n# 删除必须生效：任何一枚还在就是 rm 没追上基线变化，立即报\nfor\
        \ f in \"${TREE}\"/lib/*/libbacktrace-native.so \"${TREE}\"/lib/*/libcrashpad_handler.so; do\n  if [ -e\
        \ \"$f\" ]; then echo \"::error::$f 删除失败\"; exit 1; fi\ndone\necho \"已剔除 4 枚死库（双 ABI × backtrace-native/crashpad_handler）\"\
        \n"
    - name: 📁 恢复玩家手动文件访问入口（不作为下载条件）
      run: python3 tools/enable-storage-access.py --enable --self-test --tree "${TREE}"
    - name: 🔤 校验字体基线与重定向目标
      run: python3 tools/check-fonts.py --tree "${TREE}"
    - name: 🧪 1.0.178 本地状态 / 媒体默认回归
      run: node tools/localstate-js-test.js
    - name: 🧪 下载页布局契约
      run: |
        python3 tools/check-download-ui-contract.py
        python3 tools/test-download-presentation.py --all-files-access enabled --tree "${TREE}"
        python3 tools/test-slow-download.py
    - name: 🕸 核对 WebView 拦截链的假设
      run: python3 tools/check-webview-interceptor.py
    - name: 🔀 核对代理钩子的启用状态与注释一致
      run: python3 tools/check-proxy-hooks.py
    - name: 🧭 钉住 initLabel 的真实调用 ABI
      run: python3 tools/check-initlabel-abi.py
    - name: 🧵 钉住 native string 双 ABI 布局
      run: 'python3 tools/check-native-string-layout.py

        # libarchive「源码修复 ⇄ shipped 二进制」漂移守卫（补丁 19）：源码防护

        # 缺失 FAIL；archive_jni.cpp 仍不在 CMake 编译目标则 WARN「修复未进

        # 二进制」，每构建必现，不许漂移被遗忘。

        python3 tools/check-cnzip-guards.py

        '
    - name: 🧩 校验 engine i18n 前缀规则无字符集门槛
      run: 'python3 tools/check-engine-i18n-prefix.py

        '
    - name: 🔄 校验 engine i18n 热重载文件身份合同
      run: 'python3 tools/check-engine-i18n-reload.py

        '
    - name: 🔗 URL 规范审计（仅提示）
      run: |
        if ! python3 tools/check-base-urls.py; then
          echo "::warning::发现未登记的绝对 URL；最终端点注入与 APK 内端点校验仍会硬拦真正的部署错误"
        fi
    - name: 🔢 读取客户端版本号（源码）
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os, pathlib, re

        requested = os.environ['REQUESTED_VERSION']
        native = pathlib.Path('magia-native/src/MagiaLegacy.cpp')
        source = native.read_text(encoding='utf-8')
        matches = re.findall(
            r'(?m)^static constexpr char CLIENT_VERSION\[\] = "([^"\n]+)";$',
            source,
        )
        assert len(matches) == 1, 'Native version declaration must match exactly once'
        version = matches[0]
        assert re.fullmatch(r'1\.0\.[1-9][0-9]*', version), f'Invalid source CLIENT_VERSION: {version!r}'
        assert requested == version, (
            f'Requested client_version {requested!r} must match source CLIENT_VERSION {version!r}'
        )

        java = pathlib.Path(
            'patch/src/main/java/io/kamihama/magianative/CNUserAgent.java'
        ).read_text(encoding='utf-8')
        assert 'CNVersionCheck.nativeClientVersion()' in java, 'Java must read the native version'
        assert not re.search(
            r'(?m)^\s*(?:public|private).*String\s+CLIENT_VERSION\s*=',
            java,
        ), 'Duplicate Java version constant'

        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
            out.write('CLIENT_VERSION=' + version + '\n')

        print('SOURCE_CLIENT_VERSION_ACCEPTED', version)
        PY
      env:
        REQUESTED_VERSION: ${{ inputs.client_version }}
    - name: 🌐 注入端点（主域与署名区主机名）
      env:
        CLIENT_ROOT_DOMAIN: ${{ vars.CLIENT_ROOT_DOMAIN }}
        CLIENT_PAGES_HOSTS: ${{ vars.CLIENT_PAGES_HOSTS }}
        CLIENT_CONFIG_URL: ${{ vars.CLIENT_CONFIG_URL }}
        CLIENT_PRIMARY_BASE: ${{ vars.CLIENT_PRIMARY_BASE }}
        CLIENT_SECONDARY_BASE: ${{ vars.CLIENT_SECONDARY_BASE }}
      run: 'set -euo pipefail

        python3 tools/inject-endpoints.py

        ROOT="$(python3 tools/inject-endpoints.py --print-root)"

        echo "::add-mask::$ROOT"

        echo "MAGIA_ROOT_DOMAIN=$ROOT" >> "$GITHUB_ENV"

        '
    - name: 🛠 编译 libMagiaLegacy.so（magia-native）
      run: "set -euo pipefail\n# 取代原先包内两个预编译的 Dobby hook 库：\n#   libuwasa.so   一改：端点重定向（顺带按英文行宽重排剧情文本，正是要去掉的）\n\
        #   libcn_hook.so 二改：拦引擎下载入口接我们的浮层\nNDK_ROOT=\"${ANDROID_NDK_HOME:-}\"\nif [ -z \"$NDK_ROOT\" ] || [ ! -d\
        \ \"$NDK_ROOT\" ]; then\n  NDK_BASE=\"${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk\"\n  NDK_ROOT=\"\
        $(ls -1d $NDK_BASE/* 2>/dev/null | sort -V | tail -1)\"\nfi\nif [ -z \"$NDK_ROOT\" ] || [ ! -d \"$NDK_ROOT\"\
        \ ]; then\n  echo \"::error::找不到 Android NDK\"; exit 1\nfi\necho \"[NDK] 使用 $NDK_ROOT\"\n# shadowhook v2.0.1\
        \ 的 CMakeLists 要求 CMake >= 4.0.2\n# （magia-native/CMakeLists.txt 的 PATCH_COMMAND 已把它降回 3.22；\n# sed 降级补丁的命中由\
        \ FetchContent_MakeAvailable 之后的守卫显式\n# 核对，漏命中即 configure 阶段失败），低于降级后要求的 CMake 会\n# 在 configure 阶段直接失败\n\
        cmake --version | head -1\n\nSTRIP=\"$(find \"$NDK_ROOT/toolchains/llvm/prebuilt\" -name llvm-strip 2>/dev/null\
        \ | head -1)\"\nfor ABI in arm64-v8a armeabi-v7a; do\n  BUILD_DIR=\"magia-native/build/$ABI\"\n  cmake -G\
        \ Ninja \\\n    -DCMAKE_TOOLCHAIN_FILE=\"$NDK_ROOT/build/cmake/android.toolchain.cmake\" \\\n    -DANDROID_ABI=\"\
        $ABI\" -DANDROID_PLATFORM=android-21 \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DMAGIA_ROOT_DOMAIN=\"${MAGIA_ROOT_DOMAIN}\"\
        \ \\\n    -DMAGIA_DEBUG_OVERLAY=${{ inputs.debug_overlay && 1 || 0 }} \\\n    -B \"$BUILD_DIR\" magia-native\n\
        \  cmake --build \"$BUILD_DIR\" --parallel\n  SO=\"$BUILD_DIR/libMagiaLegacy.so\"\n  if [ ! -f \"$SO\" ];\
        \ then echo \"::error::[$ABI] 未产出 libMagiaLegacy.so\"; exit 1; fi\n  cp \"$SO\" \"${TREE}/lib/$ABI/libMagiaLegacy.so\"\
        \n  [ -n \"$STRIP\" ] && \"$STRIP\" --strip-unneeded \"${TREE}/lib/$ABI/libMagiaLegacy.so\"\n  # shadowhook\
        \ 是**动态库**，libMagiaLegacy 对它有 DT_NEEDED，\n  # 必须一并打包——漏了的话 APK 照样能打能签能装，但真机启动时\n  # dlopen failed: library\
        \ \"libshadowhook.so\" not found。这个坑踩过一次。\n  SH=\"$BUILD_DIR/_deps/shadowhook-build/libshadowhook.so\"\n\
        \  if [ ! -f \"$SH\" ]; then echo \"::error::[$ABI] 未产出 libshadowhook.so\"; exit 1; fi\n  cp \"$SH\" \"\
        ${TREE}/lib/$ABI/libshadowhook.so\"\n  [ -n \"$STRIP\" ] && \"$STRIP\" --strip-unneeded \"${TREE}/lib/$ABI/libshadowhook.so\"\
        \n  echo \"[$ABI] MagiaLegacy=$(du -h \"${TREE}/lib/$ABI/libMagiaLegacy.so\" | cut -f1) shadowhook=$(du\
        \ -h \"${TREE}/lib/$ABI/libshadowhook.so\" | cut -f1)\"\ndone\n\n# 旧库必须已从包内移除，否则会与新库对同一地址重复装 hook\nfor f\
        \ in \"${TREE}\"/lib/arm64-v8a/libuwasa.so \"${TREE}\"/lib/armeabi-v7a/libuwasa.so \"${TREE}\"/lib/arm64-v8a/libcn_hook.so;\
        \ do\n  if [ -e \"$f\" ]; then echo \"::error::$f 仍然存在，会与 libMagiaLegacy 冲突\"; exit 1; fi\ndone\n"
    - name: 🚂 注入主下载引擎（构建期默认）
      run: "set -euo pipefail\nENGINE=\"${{ inputs.engine }}\"\ncase \"$ENGINE\" in\n  self|aria2c) ;;\n  *) echo\
        \ \"::error::非法引擎值：$ENGINE（只接受 self / aria2c）\"; exit 1 ;;\nesac\nsed -i -E \"s/MAIN_ENGINE = \\\"[a-z0-9]+\\\
        \"/MAIN_ENGINE = \\\"${ENGINE}\\\"/\" \\\n  patch/src/main/java/io/kamihama/magianative/CNBuildConfig.java\n\
        grep -q \"MAIN_ENGINE = \\\"${ENGINE}\\\"\" \\\n  patch/src/main/java/io/kamihama/magianative/CNBuildConfig.java\
        \ \\\n  || { echo \"::error::引擎注入失败（CNBuildConfig.MAIN_ENGINE 常量没匹配上）\"; exit 1; }\necho \"主下载引擎: ${ENGINE}\"\
        \n"
    - name: ☕ 编译补丁源码 → dex
      run: "set -euo pipefail\nCP=\".cache/deps/android.jar:.cache/deps/okhttp.jar:.cache/deps/okio.jar\"\n\n# RestClient\
        \ 只作为编译期桩存在：真实实现在 smali_classes2 里，\n# 不参与本次 dex 产出（下面 d8 的输入里没有它）。\nmkdir -p .build/stubs/io/kamihama/magianative\n\
        cat > .build/stubs/io/kamihama/magianative/RestClient.java <<'STUB'\npackage io.kamihama.magianative;\n\
        import android.app.Activity;\npublic class RestClient {\n    public static Activity getCurrentActivity()\
        \ { return null; }\n}\nSTUB\n\nmkdir -p .build/classes\nmapfile -t SRC < <(find patch/src/main/java -name\
        \ '*.java')\necho \"编译 ${#SRC[@]} 个补丁源文件\"\njavac -nowarn -source 8 -target 8 -encoding UTF-8 \\\n     \
        \ -cp \"${CP}\" -d .build/classes \\\n      \"${SRC[@]}\" .build/stubs/io/kamihama/magianative/RestClient.java\n\
        \n# d8 撞上「带 this$0 的类」或「implements Comparator<T>」时，只会报一句\n# R8 内部的 NullPointerException，没有行号也没有别的线索。在这里先拦一道，\n\
        # 把它换成能照着改的话。判据与实测记录见脚本头部。\npython3 tools/check-d8-pitfalls.py .build/classes\npython3 tools/test-package-routing.py --classes .build/classes --classpath \"${CP}\"\npython3 tools/test-js-delta-install.py --classes .build/classes --classpath \"${CP}\"\npython3 tools/test-optional-client-update.py --classes .build/classes --classpath \"${CP}\"\npython3 tools/test-manual-route.py --classes .build/classes --classpath \"${CP}\"\n\n# ── 分两组出 dex：UI 类进 classes2，其余补丁类进\
        \ classes3 ──\n# 这个划分必须与仓库里 smali_classes2/ 和 smali_classes3/ 的现状一致，\n# 否则同一个类会在两个 dex 里各出现一次。\n#\n# ⚠ 第二组用「排除法」而不是逐个点名。原先是点名的，结果\
        \ CNBgm 加进来\n# 之后没人记得改这一行，它就**两组都不属于**——编译得出 .class，却进不了\n# 任何 dex。而 CNCNDownloadUI.buildOverlay 里有一句没有兜底的\n\
        # CNBgm.trackCount(act)，真机上会抛 NoClassDefFoundError，浮层直接建不\n# 出来。这种「类静默缺席」的错误静态检查一律看不见，只有装到机器上才炸。\n# 排除法保证以后新加的补丁类默认有归属。\n\
        mkdir -p .build/dexui .build/dex3\nmapfile -t DEX_UI < <(find .build/classes -name 'CNCNDownloadUI*.class'\
        \ | sort)\n# RestClient 是编译期桩，真实实现在 smali_classes2 里，不能进 dex\nmapfile -t DEX_3 < <(find .build/classes -name\
        \ '*.class' \\\n    ! -name 'CNCNDownloadUI*.class' ! -name 'RestClient*.class' | sort)\necho \"classes2\
        \ 组 ${#DEX_UI[@]} 个类，classes3 组 ${#DEX_3[@]} 个类\"\nif [ \"${#DEX_UI[@]}\" -eq 0 ] || [ \"${#DEX_3[@]}\"\
        \ -eq 0 ]; then\n  echo \"::error::dex 分组为空，补丁类没被编译出来\"; exit 1\nfi\n# 每个 .class 都必须恰好落在一组里，否则就是上面那种静默缺席\n\
        TOTAL=$(find .build/classes -name '*.class' ! -name 'RestClient*.class' | wc -l)\nif [ \"$(( ${#DEX_UI[@]}\
        \ + ${#DEX_3[@]} ))\" -ne \"$TOTAL\" ]; then\n  echo \"::error::dex 分组没覆盖全部补丁类（$TOTAL 个）\"; exit 1\nfi\n\
        # ⚠ 两组各自出 dex，但 desugar 需要看见**全部**补丁类，所以整个\n# .build/classes 都要作为 --classpath 传进去（--classpath 只供解析类型，\n\
        # 不会被写进输出 dex——这一点实测过：加与不加，两组 dex 逐字节相同）。\n#\n# 不加会怎样：CNCNDownloadUI$17 实现的 CNOfflineImportActivity$Callback\n\
        # 在另一组里，d8 看不见它，于是每次构建都报\n#     Type `...$Callback` was not found, it is required for default or\n#    \
        \ static interface methods desugaring of `...CNCNDownloadUI$17`\n# 今天这条告警无害——Callback 只有一个抽象方法，没有 default/static，\n\
        # 没东西要 desugar。但 minSdk 21 意味着 default 方法**必须**靠 desugar\n# 才能在 API 21–23 上跑（原生支持是 24+）。哪天有人给某个跨组接口加了\n\
        # default 方法，d8 同样只会报这一句，然后**静默产出装得上、跑起来炸的类**\n# ——而这句话早已天天出现、没人再看。所以：既补上 classpath，也把\n# 「d8 有告警」变成红灯，把这个信号救回来。\n\
        run_d8() {\n  local out=\"$1\"; shift\n  local log=\".build/d8-$(basename \"$out\").log\"\n  if ! \"${BT_DIR}/d8\"\
        \ --min-api 21 --output \"$out\" \\\n       --lib .cache/deps/android.jar --classpath .build/classes \\\n\
        \       \"$@\" > \"$log\" 2>&1; then\n    cat \"$log\"; echo \"::error::d8 失败（$out）\"; exit 1\n  fi\n  cat\
        \ \"$log\"\n  if grep -qE '^(Warning|Error)' \"$log\"; then\n    echo \"::error::d8 出了告警（$out）。desugar 相关的告警在\
        \ minSdk 21 上\"\n    echo \"::error::可能意味着产出的类装得上但跑起来炸，不要当噪音略过。\"\n    exit 1\n  fi\n}\nrun_d8 .build/dexui\
        \ \"${DEX_UI[@]}\"\nrun_d8 .build/dex3  \"${DEX_3[@]}\"\n\nrm -rf .build/smaliui .build/smali3\nbaksmali\
        \ d .build/dexui/classes.dex -o .build/smaliui\nbaksmali d .build/dex3/classes.dex  -o .build/smali3\n"
    - name: Verify multi-source update selection
      run: 'set -euo pipefail

        mkdir -p .build/update-tests

        javac -encoding UTF-8 -source 8 -target 8 -cp ''.build/classes:.cache/deps/*'' -d .build/update-tests tools/MultiSourceUpdateTest.java

        java -cp ''.build/update-tests:.build/classes:.cache/deps/*'' io.kamihama.magianative.MultiSourceUpdateTest

        '
    - name: Verify application APK updater
      run: python3 tools/test-apk-update.py
    - name: 🔁 用编译产物覆盖仓库中的补丁
      run: "set -euo pipefail\n# Java 源码是唯一事实来源：每次构建都用它重新生成补丁类的 smali，\n# 这样仓库里的 .smali 即使被手工改过也不会悄悄влия响产物。\n#\n\
        # 注意：smali_classes2/ 里除补丁类以外的内容（含 RestClient 那处\n# 把 cnDownloadFileFull 委托给 CNHotUpdate 的改动）保持原样，\n# 只删掉并重建\
        \ CNCNDownloadUI*。\nrm -f \"${TREE}\"/smali_classes2/io/kamihama/magianative/CNCNDownloadUI*.smali\ncp .build/smaliui/io/kamihama/magianative/CNCNDownloadUI*.smali\
        \ \\\n   \"${TREE}/smali_classes2/io/kamihama/magianative/\"\n\nrm -rf \"${TREE}/smali_classes3\"\nmkdir\
        \ -p \"${TREE}/smali_classes3\"\ncp -r .build/smali3/. \"${TREE}/smali_classes3/\"\n\necho \"smali_classes2\
        \ 补丁类：$(ls \"${TREE}\"/smali_classes2/io/kamihama/magianative/CNCNDownloadUI*.smali | wc -l) 个\"\necho \"\
        smali_classes3 类：$(find \"${TREE}/smali_classes3\" -name '*.smali' | wc -l) 个\"\n"
    - name: 🔨 重组 APK
      run: 'set -euo pipefail

        apktool b "${TREE}" -o .build/unsigned.apk --use-aapt2

        ls -la .build/unsigned.apk

        '
    - name: 📐 对齐 APK（zipalign）
      run: 'set -euo pipefail

        "${BT_DIR}/zipalign" -f 4 .build/unsigned.apk .build/aligned.apk

        "${BT_DIR}/zipalign" -c 4 .build/aligned.apk

        echo "对齐校验通过"

        '
    - name: 🔏 签名 APK（AOSP testkey）
      run: "set -euo pipefail\n# AOSP 公开测试密钥：与 Totentanz 发行包同一签名身份，产物可直接覆盖安装。\n# 它是公开的测试密钥，**不提供任何真实性保证**，仅用于保持可覆盖安装。\n\
        #\n# googlesource 在 CI 上间歇性不可达（已撞两次 base64: invalid input），\n# 所以加校验 + 多源回退：首选 googlesource（base64），\n#\
        \ 回退 GitHub aosp-mirror 的 raw 二进制（走 gh-proxy，不用解码）。\nmkdir -p .build/key\nfor f in testkey.pk8 testkey.x509.pem;\
        \ do\n  ok=0\n  for attempt in 1 2 3; do\n    if curl -sSL --max-time 60 -o \".build/key/${f}.b64\" \\\n\
        \        \"https://android.googlesource.com/platform/build/+/refs/tags/android-13.0.0_r83/target/product/security/${f}?format=TEXT\"\
        \ \\\n        && base64 -d \".build/key/${f}.b64\" > \".build/key/${f}\" 2>/dev/null \\\n        && [ -s\
        \ \".build/key/${f}\" ]; then\n      ok=1; break\n    fi\n    echo \"⚠ googlesource 第 $attempt 次拉取 $f 失败\"\
        \n    sleep 3\n  done\n  if [ \"$ok\" = 0 ]; then\n    echo \"↪ 回退 gh-proxy + aosp-mirror: $f\"\n    curl\
        \ -sSL --max-time 120 -o \".build/key/${f}\" \\\n      \"https://gh-proxy.org/https://raw.githubusercontent.com/aosp-mirror/platform_build/refs/tags/android-13.0.0_r83/target/product/security/${f}\"\
        \n  fi\n  # 终检：pk8 是 DER 二进制，pem 必须含 BEGIN CERTIFICATE\n  if [ \"$f\" = \"testkey.x509.pem\" ]; then\n \
        \   grep -q \"BEGIN CERTIFICATE\" \".build/key/${f}\" || { echo \"::error::$f 内容无效\"; exit 1; }\n  else\n\
        \    [ -s \".build/key/${f}\" ] || { echo \"::error::$f 为空\"; exit 1; }\n  fi\ndone\n\"${BT_DIR}/apksigner\"\
        \ sign \\\n  --key .build/key/testkey.pk8 \\\n  --cert .build/key/testkey.x509.pem \\\n  --v1-signing-enabled\
        \ true \\\n  --v2-signing-enabled true \\\n  --v3-signing-enabled true \\\n  --out .build/magirecocn-legacy-client.apk\
        \ \\\n  .build/aligned.apk\n\"${BT_DIR}/apksigner\" verify --print-certs .build/magirecocn-legacy-client.apk\n"
    - name: 🔍 构建后自检
      run: "set -euo pipefail\nAPK=.build/magirecocn-legacy-client.apk\necho \"sha256: $(sha256sum \"$APK\" | cut\
        \ -d' ' -f1)\"\necho \"大小:   $(stat -c%s \"$APK\") 字节\"\n# BGM 的 ogg 必须未压缩，否则 AssetManager.openFd() 打不开，\n\
        # 表现为「界面一切正常、就是没声音」——光看界面发现不了\npython3 tools/check-asset-compression.py \"$APK\"\n# 每个 .so 的 DT_NEEDED 都要能在包内或系统里解析到，\n\
        # 否则 dlopen 只在真机启动那一刻才失败，静态自检全都发现不了\npython3 tools/check-so-deps.py \"$APK\"\n# F-F-07：重链/新编的 arm64 库必须满足\
        \ 16KB 页对齐（Android 15+ 上\n# 不满足直接 dlopen 失败）。libarchive 预编译违例由脚本内排除并留痕，\n# 其余库（libMagiaLegacy / libaria2c）违例一票否决。\n\
        python3 tools/check-so-alignment.py\n# R4-03：上面无参调用只扫**入库**的 4 枚预编译库；本次新编的\n# libMagiaLegacy/libshadowhook\
        \ 落在重建树 ${TREE}/lib/arm64-v8a/\n# （见 native 编译 step 的 cp），不进包前的对齐违例必须在这里拦。\n# 注意只逐枚点扫 CI 自建库，**不能**整目录扫：\n\
        # ${TREE} 里还有游戏历史包自带的预编译库（libbacktrace-native /\n# libcrashpad_handler 等），它们不是本工程构建产物、4K 对齐是\n# 既成事实且无法重链，整目录扫会把这些历史库卷进来误报红灯。\n\
        python3 tools/check-so-alignment.py \\\n  \"${TREE}/lib/arm64-v8a/libMagiaLegacy.so\" \\\n  \"${TREE}/lib/arm64-v8a/libshadowhook.so\"\
        \n# 包里的 .so 与补丁类必须都是这次构建的产物。踩过两次「编译了却没进包」：\n# CNBgm 不在任何一组 d8 输入里；libMagiaLegacy.so 忘了拷进 lib/。\n# 两次都能打包、能签名、能安装，只有真机跑起来才暴露，而且现象会把人\n\
        # 引向去查功能逻辑而不是查产物\npython3 tools/check-apk-freshness.py \"$APK\"\npython3 tools/check-built-endpoints.py\
        \ \"$APK\"\n# 签名指纹必须是 AOSP testkey，否则装不上既有设备\nFP=$(\"${BT_DIR}/apksigner\" verify --print-certs \"$APK\"\
        \ \\\n      | grep -m1 'SHA-256 digest' | awk '{print $NF}')\nEXPECT=\"a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc\"\
        \nif [ \"$FP\" != \"$EXPECT\" ]; then\n  echo \"::error::签名指纹不符，实得 $FP\"\n  exit 1\nfi\necho \"签名指纹校验通过（AOSP\
        \ testkey）\"\n# minSdk 必须钉在 21：manifest 由 apktool 从基线 APK 重编码，构建链\n# 从不读 uses-sdk。基线 APK 换代时若换成 minSdk≥24\
        \ 的包，产物会静默\n# 放弃 API 21 设备、CI 照样全绿——只有真机装不上才暴露。这里直接\n# aapt dump badging 断言。\nMIN_SDK=$(\"${BT_DIR}/aapt\"\
        \ dump badging \"$APK\" \\\n          | awk -F\"'\" '/^sdkVersion:/{print $2}')\nTARGET_SDK=$(\"${BT_DIR}/aapt\"\
        \ dump badging \"$APK\" \\\n             | awk -F\"'\" '/^targetSdkVersion:/{print $2}')\nif [ -z \"$MIN_SDK\"\
        \ ]; then\n  echo \"::error::aapt dump badging 读不到 sdkVersion（APK 可能损坏）\"\n  exit 1\nfi\nif [ \"$MIN_SDK\"\
        \ != \"21\" ]; then\n  echo \"::error::产物 minSdkVersion=$MIN_SDK，期望 21——基线换包可能静默抬高了 minSdk，API 21 设备将无法安装\"\
        \n  exit 1\nfi\necho \"minSdkVersion=$MIN_SDK targetSdkVersion=$TARGET_SDK（符合 minSdk 21 约定）\"\n# 登记的高 API\
        \ 符号出现处必须有 SDK_INT 守卫（见 check-api-levels.py）。\n# javac 对 API 33 编译、d8 的 API model 只覆盖 java.*，android.* 框架\n\
        # 高 API 调用编译期零拦截，这条把铁律 3 从约定变成可执行检查。\npython3 tools/check-api-levels.py\n# 补丁类必须真的在产物里\nunzip -l \"$APK\"\
        \ | grep -qE 'classes3\\.dex' \\\n  || { echo \"::error::产物缺少 classes3.dex\"; exit 1; }\necho \"自检通过\"\n"
    - name: Verify existing native version encoding contract
      run: python3 tools/check-no-plain-version.py .build/magirecocn-legacy-client.apk "$CLIENT_VERSION"
    - name: Record verified APK and native source provenance
      run: "set -euo pipefail\npython3 - <<'PY'\nimport datetime, hashlib, json, os, pathlib\napk = pathlib.Path('.build/magirecocn-legacy-client.apk')\n\
        record = {'version': os.environ['CLIENT_VERSION'], 'apk': 'magireco-latest-legacy-client.apk',\n       \
        \   'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(), 'size': apk.stat().st_size,\n          'source_commit':\
        \ os.environ['NATIVE_SOURCE_SHA'], 'workflow_commit': os.environ['GITHUB_SHA'],\n          'source_branch':\
        \ 'main', 'publication': 'NOT_PUBLISHED',\n          'built_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),\n\
        \          'run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/'\
        \ + os.environ['GITHUB_RUN_ID']}\npathlib.Path('.build/magireco-latest-legacy-client.version.json').write_text(json.dumps(record,\
        \ indent=2) + '\\n')\nprint(json.dumps(record))\nPY"
    - name: Export verified APK for explicit publication
      uses: actions/upload-artifact@v4
      with:
        name: personal-native-main-verified
        path: '.build/magirecocn-legacy-client.apk

          .build/magireco-latest-legacy-client.version.json'
        if-no-files-found: error
        retention-days: 14
    - name: 📊 构建报告
      if: always()
      run: "{\n  echo \"## 构建结果\"\n  echo\n  if [ -f .build/magirecocn-legacy-client.apk ]; then\n    echo \"- 状态：✅\
        \ 成功\"\n    echo \"- 客户端版本：\\`${CLIENT_VERSION}\\`（随 APK 一起写进版本旁注；云端闸门不在本流水线提升）\"\n    echo \"- 主下载引擎：\\\
        `${{ inputs.engine }}\\`\"\n    echo \"- 调试悬浮窗：\\`${{ inputs.debug_overlay && '开' || '关' }}\\`（native MAGIA_DEBUG_OVERLAY）\"\
        \n    echo \"- sha256：\\`$(sha256sum .build/magirecocn-legacy-client.apk | cut -d' ' -f1)\\`\"\n    echo\
        \ \"- 大小：$(( $(stat -c%s .build/magirecocn-legacy-client.apk) / 1024 / 1024 )) MB\"\n    echo \"- 签名：AOSP\
        \ testkey（v1+v2+v3）\"\n  else\n    echo \"- 状态：❌ 失败\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Native main commit to verify before building
        required: true
        type: string
      client_version:
        description: Expected client version; must match source CLIENT_VERSION and exceed the live gate
        required: true
        type: string
      engine:
        description: Primary download engine
        type: choice
        options:
        - self
        - aria2c
        default: self
      debug_overlay:
        description: Internal debug overlay; keep off for public builds
        type: boolean
        default: false
concurrency:
  group: personal-main-native-build
  cancel-in-progress: false

