name: "🔄 同步上游仓库"

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制同步（即使没有检测到变化）'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1  # 强制 Python 无缓冲输出
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔍 检查上游 Release 变化
        id: check
        run: |
          python -c "
          import os, urllib.request, json, hashlib;
          
          token = os.environ['GH_TOKEN'];
          headers = {'Accept': 'application/vnd.github+json', 'Authorization': f'Bearer {token}'};
          
          # 获取上游 Release
          upstream_url = 'https://api.github.com/repos/HiiragiNemu/magireco-cn-patch/releases/latest';
          req = urllib.request.Request(upstream_url, headers=headers);
          with urllib.request.urlopen(req) as r:
              upstream = json.loads(r.read().decode());
          
          # 计算指纹
          fingerprints = [];
          for asset in upstream.get('assets', []):
              name = asset['name'];
              digest = asset.get('digest', '');
              fingerprints.append(f'{name}:{digest}');
          fingerprints.sort();
          upstream_fp = hashlib.md5('|'.join(fingerprints).encode()).hexdigest();
          
          # 获取组织 Release
          org_url = 'https://api.github.com/repos/MagirecoCN-Revival-Project/magireco-cn-patch/releases/latest';
          try:
              req = urllib.request.Request(org_url, headers=headers);
              with urllib.request.urlopen(req) as r:
                  org = json.loads(r.read().decode());
              org_fp = hashlib.md5('|'.join(sorted([f'{a[\"name\"]}:{a.get(\"digest\", \"\")}' for a in org['assets']])).encode()).hexdigest();
          except:
              org_fp = '';
          
          if upstream_fp != org_fp:
              print('changed=true');
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('changed=true\\n');
          else:
              print('changed=false');
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('changed=false\\n');
          "
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 📦 同步上游 Release（流式传输）
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force_sync == 'true'
        run: |
          python .github/workflows/sync_release_streaming.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 🚀 触发 R2 上传
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force_sync == 'true'
        uses: ./.github/workflows/upload-to-r2.yml
        secrets: inherit
