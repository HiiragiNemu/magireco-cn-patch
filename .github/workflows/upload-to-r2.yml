name: "⌚️ 检测并同步 Release 文件"

on:
  schedule:
    # 每30分钟运行一次（UTC时间，注意时区转换）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允许手动触发
  push:
    branches: [ main, master ] # 推送到主分支时触发

jobs:
  sync:
    runs-on: ubuntu-latest
    # 防止并发运行
    concurrency: 
      group: release-sync
      cancel-in-progress: false
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets. }}
          fetch-depth: 0

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ 安装依赖
        run: |
          pip install boto3 requests tencentcloud-sdk-python PyGithub

      - name: 🚀 执行同步
        id: sync
        env:
          # GitHub Token（自动提供）
          : ${{ secrets. }}
          REPO_NAME: "HiiragiNemu/patch-front"
          
          # S3 存储桶1
          S3_1_ENDPOINT: ${{ secrets.S3_1_ENDPOINT }}
          S3_1_ACCESS_KEY: ${{ secrets.S3_1_ACCESS_KEY }}
          S3_1_SECRET_KEY: ${{ secrets.S3_1_SECRET_KEY }}
          S3_1_REGION: ${{ secrets.S3_1_REGION }}
          S3_1_BUCKET: ${{ secrets.S3_1_BUCKET }}
          S3_1_DOMAIN: ${{ secrets.S3_1_DOMAIN }}
          
          # S3 存储桶2
          S3_2_ENDPOINT: ${{ secrets.S3_2_ENDPOINT }}
          S3_2_ACCESS_KEY: ${{ secrets.S3_2_ACCESS_KEY }}
          S3_2_SECRET_KEY: ${{ secrets.S3_2_SECRET_KEY }}
          S3_2_REGION: ${{ secrets.S3_2_REGION }}
          S3_2_BUCKET: ${{ secrets.S3_2_BUCKET }}
          S3_2_DOMAIN: ${{ secrets.S3_2_DOMAIN }}
          
          # 腾讯云
          QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
          QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
        run: |
          python .github/workflows/sync_script.py

      - name: 💾 保存状态文件
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/state.json
          git commit -m "chore: update sync state [skip ci]" || echo "No changes"
          git push || echo "Push failed"

      - name: 📊 生成报告
        if: always()
        run: |
          echo "${{ steps.sync.outputs.summary }}" >> $GITHUB_STEP_SUMMARY
