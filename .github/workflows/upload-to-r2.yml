name: "⌚️ 检测并同步 Release 文件"

on:
  schedule:
    - cron: '*/10 * * * *' # 每15分钟运行一次
  workflow_dispatch: # 允许手动触发

jobs:
  sync-job:
    runs-on: ubuntu-latest
    # 为了防止并发运行导致文件状态混乱，设置为取消排队中的旧任务
    concurrency: 
      group: release-sync
      cancel-in-progress: true 
      
    steps:
      - name: 📥 检出代码库
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ 安装 Python 依赖
        run: |
          pip install boto3 requests tencentcloud-sdk-python

      - name: 🚀 执行同步脚本
        id: sync_script
        env:
          # --- 仓库信息 ---
          GH_REPO: "HiiragiNemu/patch-front"
          
          # --- S3 存储桶 1 配置 ---
          S3_1_ENDPOINT: ${{ secrets.S3_1_ENDPOINT }}
          S3_1_ACCESS_KEY: ${{ secrets.S3_1_ACCESS_KEY }}
          S3_1_SECRET_KEY: ${{ secrets.S3_1_SECRET_KEY }}
          S3_1_REGION: ${{ secrets.S3_1_REGION }}
          S3_1_BUCKET: ${{ secrets.S3_1_BUCKET }}
          S3_1_DOMAIN: ${{ secrets.S3_1_DOMAIN }} # 例如 s31.example.com
          
          # --- S3 存储桶 2 配置 ---
          S3_2_ENDPOINT: ${{ secrets.S3_2_ENDPOINT }}
          S3_2_ACCESS_KEY: ${{ secrets.S3_2_ACCESS_KEY }}
          S3_2_SECRET_KEY: ${{ secrets.S3_2_SECRET_KEY }}
          S3_2_REGION: ${{ secrets.S3_2_REGION }}
          S3_2_BUCKET: ${{ secrets.S3_2_BUCKET }}
          S3_2_DOMAIN: ${{ secrets.S3_2_DOMAIN }} # 例如 s32.example.com
          
          # --- 腾讯云 & edge 配置 ---
          QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
          QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
        run: |
          python .github/workflows/script.py

      - name: 📝 生成运行报告
        if: always() # 无论成功失败都生成报告
        run: |
          echo "${{ steps.sync_script.outputs.summary }}" >> $GITHUB_STEP_SUMMARY
