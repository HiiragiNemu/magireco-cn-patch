name: Dispatch client 1.0.180 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-client-180-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.repository == 'HiiragiNemu/magireco-cn-patch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger verified client build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run build-personal-client.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_sha=15f545f29c3738e47c54bad9f4fdcd3bfa75266e \
            -f client_version=1.0.180 \
            -f engine=self \
            -f debug_overlay=false
