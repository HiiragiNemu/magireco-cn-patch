name: 🚀 DogeCloud 同步（hk 跳板机）

# ╔════════════════════════════════════════════════════════════════════╗
# ║  Doge 系独立同步：只在 hk 自托管 runner 上跑                        ║
# ║  ▸ 为什么：GitHub runner(US)→腾讯 COS(上海) 跨太平洋链路极慢，而    ║
# ║    hk → GitHub release 实测 ~8.6MB/s、hk → COS 快，跑在这里才稳     ║
# ║  ▸ 与主 sync-and-upload.yml 分离：主工作流留在 GitHub-hosted        ║
# ║    （object-storage/热更/镜像），本工作流只做 Doge 上传，控制 hk 的流量         ║
# ║  ▸ 触发：主工作流的 [Doge系] 步骤用 gh workflow run 调起本工作流，  ║
# ║    并用 gh run watch 实时转发日志 + 反馈成败；也可手动 dispatch     ║
# ║  ▸ 同步脚本 scripts/sync-dogecloud.py：tmp_token 换 STS → boto3     ║
# ║    上传 → 刷多吉云 CDN；指纹存 Doge 桶 __doge_fingerprint.json     ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: '删除 Doge 桶过时文件（默认只列出）'
        required: false
        default: 'false'
        type: boolean
  repository_dispatch:
    types: [doge-sync]

jobs:
  doge-sync:
    runs-on: [self-hosted, hk]
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      DOGE_ACCESS_KEY: ${{ secrets.DOGE_ACCESS_KEY }}
      DOGE_SECRET_KEY: ${{ secrets.DOGE_SECRET_KEY }}
      DOGE_BUCKET:     ${{ secrets.DOGE_BUCKET }}
      DOGE_DOMAIN:     ${{ secrets.DOGE_DOMAIN }}
      DOGE_API_BASE:   "https://api.dogecloud.com"
      UPSTREAM_OWNER:  "HiiragiNemu"
      UPSTREAM_REPO:   "patch-front"
    steps:
      - name: 📦 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 确保 boto3 可用
        run: |
          python3 -m pip install --break-system-packages -q boto3 2>/dev/null || pip install -q boto3
          python3 -c "import boto3; print('boto3', boto3.__version__)"

      - name: 🚀 运行 Doge 系同步
        run: |
          set -euo pipefail
          python3 scripts/sync-dogecloud.py
        env:
          CONFIRM_CLEANUP: ${{ (inputs.confirm_cleanup == true || github.event.client_payload.confirm_cleanup == 'true') && 'true' || 'false' }}
