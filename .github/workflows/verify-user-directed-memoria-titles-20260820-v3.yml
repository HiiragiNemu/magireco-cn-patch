name: Verify user-directed memoria title localization

on:
  push:
    branches:
      - main
    paths:
      - .github/verify-user-directed-memoria-titles-trigger-20260820-v3.txt

permissions:
  contents: write

concurrency:
  group: verify-user-directed-memoria-titles-20260820-v3
  cancel-in-progress: false

jobs:
  verify-and-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce the five explicit title decisions
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 - <<'PY'
          from __future__ import annotations

          import copy
          import csv
          import hashlib
          import json
          import re
          import unicodedata
          from pathlib import Path
          from typing import Any, Iterable

          path = Path('magica/js/libs/pieceList.json')
          audit = Path('magica/i18n_audit/user_directed_memoria_titles_20260820')
          audit.mkdir(parents=True, exist_ok=True)
          pairs = {
              'Different Story：Rookies': '另一段故事：新人们',
              'Different Story: Rookies': '另一段故事：新人们',
              'As a fashion model': '身为时装模特',
              'Begin a Hunt': '开始狩猎',
              'Splash party!': '水花派对！',
              'Three geniuses': '三位天才',
          }
          title_fields = ('pieceName', 'name', 'title')

          def norm(value: str) -> str:
              value = unicodedata.normalize('NFKC', value)
              return re.sub(r'\s+', ' ', value).strip().casefold()

          normalized = {norm(source): target for source, target in pairs.items()}

          def walk(value: Any) -> Iterable[dict[str, Any]]:
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          def piece_id(row: dict[str, Any]) -> str:
              for key in ('pieceId', 'piece_id', 'memoriaId', 'memoria_id', 'id'):
                  if row.get(key) not in (None, ''):
                      return str(row[key])
              return ''

          raw = path.read_text(encoding='utf-8-sig')
          data = json.loads(raw)
          before = copy.deepcopy(data)
          changes = []
          seen_before = {key: 0 for key in normalized}

          for row in walk(data):
              pid = piece_id(row)
              if not pid:
                  continue
              for field in title_fields:
                  value = row.get(field)
                  if not isinstance(value, str):
                      continue
                  key = norm(value)
                  if key not in normalized:
                      continue
                  seen_before[key] += 1
                  target = normalized[key]
                  if value != target:
                      row[field] = target
                      changes.append({
                          'piece_id': pid,
                          'field': field,
                          'before': value,
                          'after': target,
                          'source_tier': 'user_directed_root_human',
                          'source_record': 'user directive 2026-08-20',
                      })

          # No non-title field may change.
          before_rows = {piece_id(row): row for row in walk(before) if piece_id(row)}
          after_rows = {piece_id(row): row for row in walk(data) if piece_id(row)}
          for pid, old in before_rows.items():
              new = after_rows.get(pid)
              if new is None:
                  raise AssertionError(f'missing pieceId={pid}')
              old_other = {k: v for k, v in old.items() if k not in title_fields}
              new_other = {k: v for k, v in new.items() if k not in title_fields}
              if old_other != new_other:
                  raise AssertionError(f'non-title field changed: pieceId={pid}')

          remaining = []
          for row in walk(data):
              if not piece_id(row):
                  continue
              for field in title_fields:
                  value = row.get(field)
                  if isinstance(value, str) and norm(value) in normalized:
                      remaining.append({'piece_id': piece_id(row), 'field': field, 'value': value})
          if remaining:
              raise AssertionError(f'explicit English titles remain: {remaining}')

          if changes:
              if '\n' in raw:
                  rendered = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
              else:
                  rendered = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
              path.write_text(rendered, encoding='utf-8')
          json.loads(path.read_text(encoding='utf-8-sig'))

          with (audit / 'APPLIED.tsv').open('w', encoding='utf-8-sig', newline='') as handle:
              fields = ['piece_id', 'field', 'before', 'after', 'source_tier', 'source_record']
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              writer.writerows(changes)

          status_rows = []
          deduplicated = {}
          for source, target in pairs.items():
              deduplicated.setdefault(norm(source), {'sources': [], 'target': target})['sources'].append(source)
          for key, item in deduplicated.items():
              status_rows.append({
                  'source_variants': ' | '.join(item['sources']),
                  'target': item['target'],
                  'source_occurrences_on_checked_main': seen_before[key],
                  'source_occurrences_after': 0,
                  'status': 'localized-now' if seen_before[key] else 'already-resolved-or-source-absent',
              })
          with (audit / 'STATUS.tsv').open('w', encoding='utf-8-sig', newline='') as handle:
              fields = ['source_variants', 'target', 'source_occurrences_on_checked_main', 'source_occurrences_after', 'status']
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              writer.writerows(status_rows)

          validation = {
              'schema': 'magireco-cn-user-directed-memoria-title-verification/v1',
              'status': 'PASS',
              'scope': 'piece title fields only',
              'explicit_source_titles_remaining': 0,
              'fields_changed_by_this_verifier': len(changes),
              'non_title_fields_changed': 0,
              'intentional_dialogue_english_touched': False,
              'pieceList_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'decisions': status_rows,
          }
          (audit / 'validation.json').write_text(json.dumps(validation, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (audit / 'README.md').write_text(
              '# 用户明确指定的记忆结晶标题汉化\n\n'
              '本校验仅检查并修改 `pieceList.json` 的标题字段。`scenario`、说明文、角色台词均不在范围内；阿莉娜刻意夹用的 `body`、`show`、`fool girl` 明确保留。\n\n'
              '五组标题的英文源值在校验后的当前树中为 0。详见 `STATUS.tsv` 与 `validation.json`。\n',
              encoding='utf-8',
          )
          print(json.dumps(validation, ensure_ascii=False, indent=2))
          PY

      - name: Publish and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-user-directed-memoria-titles-20260820-v3.yml
          rm -f .github/verify-user-directed-memoria-titles-trigger-20260820-v3.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(i18n): verify user-directed memoria titles'
          git pull --rebase origin main
          git push origin HEAD:main
