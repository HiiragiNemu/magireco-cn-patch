name: "🔄 强制更新所有文件"

on:
  workflow_dispatch: # 只允许手动触发
    inputs:
      confirm:
        description: '请输入 "CONFIRM" 以确认强制更新所有文件'
        required: true
        default: ''

jobs:
  force-update:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'CONFIRM'
    
    steps:
      - name: 📥 检出代码库
        uses: actions/checkout@v4
        
      - name: 🗑️ 清除文件缓存
        run: |
          echo "## 🔄 强制更新所有文件" >> $GITHUB_STEP_SUMMARY
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          
          CACHE_FILE=".github/workflows/.file_cache.json"
          
          if [ -f "$CACHE_FILE" ]; then
            echo "✅ 找到缓存文件: $CACHE_FILE"
            rm -f "$CACHE_FILE"
            echo "✅ 已成功删除缓存文件"
            echo "📝 **状态**: 缓存已清除，下次同步将重新处理所有文件" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 缓存文件不存在，无需清除"
            echo "📝 **状态**: 缓存文件不存在，无需操作" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY

      - name: 💾 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/.file_cache.json || true
          git commit -m "chore: 强制清除文件缓存，触发全量更新" || echo "没有更改需要提交"
          git push || echo "推送失败或无需推送"
