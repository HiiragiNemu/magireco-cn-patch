name: 💊 速效救心丸（抢救文件到 Release）

on:
  workflow_dispatch:
    inputs:
      force_upload:
        description: '强制上传（即使文件已存在）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  rescue-files:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      S3_1_ENDPOINT:   ${{ secrets.S3_1_ENDPOINT }}
      S3_1_ACCESS_KEY: ${{ secrets.S3_1_ACCESS_KEY }}
      S3_1_SECRET_KEY: ${{ secrets.S3_1_SECRET_KEY }}
      S3_1_REGION:     ${{ secrets.S3_1_REGION }}
      S3_1_BUCKET:     ${{ secrets.S3_1_BUCKET }}
      S3_1_DOMAIN:     ${{ secrets.S3_1_DOMAIN }}
      S3_2_ENDPOINT:   ${{ secrets.S3_2_ENDPOINT }}
      S3_2_ACCESS_KEY: ${{ secrets.S3_2_ACCESS_KEY }}
      S3_2_SECRET_KEY: ${{ secrets.S3_2_SECRET_KEY }}
      S3_2_REGION:     ${{ secrets.S3_2_REGION }}
      S3_2_BUCKET:     ${{ secrets.S3_2_BUCKET }}
      S3_2_DOMAIN:     ${{ secrets.S3_2_DOMAIN }}
      :        ${{ secrets. }}
      FORCE_UPLOAD:    ${{ github.event.inputs.force_upload }}

    steps:
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: pip install boto3

      - name: 💊 运行抢救脚本
        run: |
          python3 <<'SCRIPT_END'
          import os
          import sys
          import time
          import urllib.request
          from datetime import datetime

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          import boto3

          # ============================================================
          # 颜色 / 样式工具
          # ============================================================
          class C:
              RESET         = "\033[0m"
              BOLD          = "\033[1m"
              DIM           = "\033[2m"
              RED           = "\033[31m"
              CYAN          = "\033[36m"
              BRIGHT_GREEN  = "\033[92m"
              BRIGHT_YELLOW = "\033[93m"
              BRIGHT_BLUE   = "\033[94m"
              BRIGHT_CYAN   = "\033[96m"
              BRIGHT_WHITE  = "\033[97m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def warn(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_YELLOW, '⚠')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          def progress_bar(current, total, width=30, label=""):
              pct    = current / total if total else 1.0
              filled = int(width * pct)
              bar    = c(C.BRIGHT_GREEN, "█" * filled) + c(C.DIM, "░" * (width - filled))
              pct_s  = c(C.BOLD + C.BRIGHT_WHITE, f"{pct*100:5.1f}%")
              lbl    = c(C.DIM, f" {label}") if label else ""
              print(f"  [{bar}] {pct_s}{lbl}", flush=True)

          def human_size(size_bytes):
              for unit in ["B", "KB", "MB", "GB"]:
                  if size_bytes < 1024:
                      return f"{size_bytes:.1f} {unit}"
                  size_bytes /= 1024
              return f"{size_bytes:.1f} TB"

          class ActionGroup:
              @staticmethod
              def start_group(title):
                  print(f"::group::{title}", flush=True)
              @staticmethod
              def end_group():
                  print("::endgroup::", flush=True)

          # ============================================================
          # S3 操作类
          # ============================================================
          class S3Handler:
              def __init__(self, endpoint, access_key, secret_key,
                           region, bucket, domain, name="S3"):
                  self.name   = name
                  self.bucket = bucket
                  self.domain = domain
                  self.s3     = boto3.client(
                      's3',
                      endpoint_url=endpoint.rstrip('/'),
                      aws_access_key_id=access_key,
                      aws_secret_access_key=secret_key,
                      region_name=region
                  )

              def upload_from_url(self, url, filename):
                  info(f"来源: {c(C.DIM, url)}", indent=1)
                  info(f"目标: {c(C.BRIGHT_WHITE, self.name)} / "
                       f"{c(C.BRIGHT_CYAN, filename)}", indent=1)
                  try:
                      with urllib.request.urlopen(
                          urllib.request.Request(url)
                      ) as resp:
                          data      = resp.read()
                          file_size = len(data)

                      self.s3.put_object(
                          Bucket=self.bucket, Key=filename,
                          Body=data, ContentLength=file_size
                      )
                      ok(f"上传完成 {c(C.DIM, '(' + human_size(file_size) + ')')}",
                         indent=1)
                      return True
                  except Exception as e:
                      err(f"上传失败: {e}", indent=1)
                      return False

          # ============================================================
          # 主流程
          # ============================================================
          def main():
              start_time   = datetime.now()
              force_upload = os.environ.get('FORCE_UPLOAD', 'false').lower() == 'true'

              header("💊 速效救心丸 — 抢救文件")
              info(f"强制模式: {c(C.BRIGHT_YELLOW, str(force_upload))}")
              info(f"开始时间: {c(C.DIM, start_time.strftime('%Y-%m-%d %H:%M:%S'))}")

              section("初始化 S3 客户端")
              s3_1 = S3Handler(
                  os.environ['S3_1_ENDPOINT'], os.environ['S3_1_ACCESS_KEY'],
                  os.environ['S3_1_SECRET_KEY'], os.environ['S3_1_REGION'],
                  os.environ['S3_1_BUCKET'],    os.environ['S3_1_DOMAIN'],
                  "存储桶1"
              )
              s3_2 = S3Handler(
                  os.environ['S3_2_ENDPOINT'], os.environ['S3_2_ACCESS_KEY'],
                  os.environ['S3_2_SECRET_KEY'], os.environ['S3_2_REGION'],
                  os.environ['S3_2_BUCKET'],    os.environ['S3_2_DOMAIN'],
                  "存储桶2"
              )
              ok("S3 × 2 客户端已初始化")

              # 抢救文件清单
              rescue_files = [
                  {"name": "cn_base_00_db.zip",       "s3": s3_1},
                  {"name": "cn_base_01_json.zip",      "s3": s3_1},
                  {"name": "cn_base_02.zip",           "s3": s3_1},
                  {"name": "cn_base_03.zip",           "s3": s3_1},
                  {"name": "cn_base_04.zip",           "s3": s3_1},
                  {"name": "cn_base_05.zip",           "s3": s3_1},
                  {"name": "cn_base_06.zip",           "s3": s3_1},
                  {"name": "cn_js_update.zip",         "s3": s3_1},
                  {"name": "cn_magica_resource.zip",   "s3": s3_1},
                  {"name": "cn_scenario_img.zip",      "s3": s3_1},
                  {"name": "cn_voice_01.zip",          "s3": s3_2},
                  {"name": "cn_voice_02_done.zip",     "s3": s3_2},
                  {"name": "movie.zip",                "s3": s3_2},
                  {"name": "movie2.zip",               "s3": s3_2},
                  {"name": "cn_scenario_update.zip",   "s3": s3_2},
              ]

              total         = len(rescue_files)
              uploaded      = []
              failed        = []

              for i, item in enumerate(rescue_files, 1):
                  fname   = item["name"]
                  handler = item["s3"]
                  url     = f"https://{handler.domain}/{fname}"

                  ActionGroup.start_group(f"[{i}/{total}] 💊 {fname}")
                  print(flush=True)
                  progress_bar(i - 1, total,
                               label=f"文件进度 {i-1}/{total}")

                  try:
                      if handler.upload_from_url(url, fname):
                          uploaded.append((fname, handler.name))
                      else:
                          failed.append((fname, handler.name))
                  except Exception as e:
                      err(f"异常: {e}", indent=1)
                      failed.append((fname, handler.name))

                  progress_bar(i, total, label=f"文件进度 {i}/{total}")
                  ActionGroup.end_group()

                  if i < total:
                      time.sleep(1)

              # ── 汇总 ──────────────────────────────────────────────
              ActionGroup.start_group("📊 抢救结果汇总")
              header("抢救完成")

              info(f"总计尝试: {c(C.BOLD, str(total))} 个文件")
              ok(f"成功抢救: {c(C.BOLD, str(len(uploaded)))} 个文件")
              if failed:
                  err(f"抢救失败: {len(failed)} 个文件")

              if uploaded:
                  section("成功文件")
                  for fname, bucket in uploaded:
                      ok(f"{c(C.BRIGHT_WHITE, fname)} "
                         f"{c(C.DIM, '→ ' + bucket)}", indent=1)

              if failed:
                  section("失败文件")
                  for fname, bucket in failed:
                      err(f"{c(C.BRIGHT_WHITE, fname)} "
                          f"{c(C.DIM, '→ ' + bucket)}", indent=1)

              # ── Step Summary ──────────────────────────────────────
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  elapsed = (datetime.now() - start_time).total_seconds()
                  rows    = []
                  for fname, bucket in uploaded:
                      rows.append(f"| {bucket} | `{fname}` | ✅ 已抢救 |")
                  for fname, bucket in failed:
                      rows.append(f"| {bucket} | `{fname}` | ❌ 失败 |")

                  lines = [
                      "## 💊 速效救心丸抢救报告\n",
                      f"**开始时间**: `{start_time.strftime('%Y-%m-%d %H:%M:%S')}`  ",
                      f"**触发者**: `{os.environ.get('GITHUB_ACTOR', 'unknown')}`  ",
                      f"**强制模式**: `{force_upload}`\n",
                      "---\n",
                      "### 📦 抢救文件列表\n",
                      "| 存储桶 | 文件名 | 状态 |",
                      "|--------|--------|------|",
                  ]
                  lines.extend(rows)
                  lines += [
                      "\n---\n",
                      "### 📈 汇总\n",
                      "| 项目 | 值 |",
                      "|------|----|",
                      f"| 总计尝试 | `{total}` 个 |",
                      f"| 成功抢救 | `{len(uploaded)}` 个 |",
                      f"| 抢救失败 | `{len(failed)}` 个 |",
                      f"| 总耗时   | `{elapsed:.2f}` 秒 |\n",
                      ("🟢 **状态**: 所有文件抢救成功！"
                       if not failed
                       else f"🟡 **状态**: 完成，但有 {len(failed)} 个文件抢救失败。"),
                  ]
                  with open(summary_path, 'a', encoding='utf-8') as f:
                      f.write("\n".join(lines))

              ActionGroup.end_group()

              if failed:
                  warn("部分文件抢救失败，请检查日志")
                  sys.exit(1)
              else:
                  ok("所有文件抢救成功！")

          if __name__ == "__main__":
              main()
          SCRIPT_END

      - name: 🚀 发布到 Release
        run: |
          python3 <<'SCRIPT_END'
          import os
          import sys
          import subprocess
          from datetime import datetime

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          class C:
              RESET        = "\033[0m"
              BOLD         = "\033[1m"
              DIM          = "\033[2m"
              RED          = "\033[31m"
              CYAN         = "\033[36m"
              BRIGHT_GREEN = "\033[92m"
              BRIGHT_BLUE  = "\033[94m"
              BRIGHT_CYAN  = "\033[96m"
              BRIGHT_WHITE = "\033[97m"

          def c(color, text):
              return f"{color}{text}{C.RESET}"

          def header(text):
              bar = "═" * 60
              print(f"\n{c(C.BOLD + C.BRIGHT_BLUE, bar)}")
              print(c(C.BOLD + C.BRIGHT_WHITE, f"  {text}"))
              print(f"{c(C.BOLD + C.BRIGHT_BLUE, bar)}\n", flush=True)

          def section(text):
              print(f"\n{c(C.BOLD + C.CYAN, '┌─ ' + text)}", flush=True)

          def info(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_BLUE, 'ℹ')} {text}", flush=True)

          def ok(text, indent=0):
              print(f"{'  '*indent}{c(C.BRIGHT_GREEN, '✔')} {text}", flush=True)

          def err(text, indent=0):
              print(f"{'  '*indent}{c(C.RED, '✘')} {text}", flush=True)

          header("🚀 创建 Rescue Release")

          timestamp = datetime.utcnow().strftime("%Y%m%d-%H%M%S")
          tag_name  = f"rescue-{timestamp}"
          title     = f"🚑 紧急抢救文件 {timestamp}"
          notes     = "自动抢救的文件，已从 CDN 源站直接上传到 S3 存储桶。"

          section("Release 信息")
          info(f"Tag:   {c(C.BRIGHT_CYAN, tag_name)}")
          info(f"Title: {c(C.BRIGHT_WHITE, title)}")

          section("创建 Release")
          result = subprocess.run([
              "gh", "release", "create", tag_name,
              "--title", title,
              "--notes", notes,
              "--latest"
          ], capture_output=True, text=True)

          if result.returncode == 0:
              ok(f"Release 已创建: {c(C.BRIGHT_CYAN, tag_name)}")
          else:
              err(f"创建失败: {result.stderr.strip()}")
              # 非致命错误，不退出
          SCRIPT_END
