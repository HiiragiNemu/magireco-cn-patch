name: 累计补充包发布
on:
  push:
    branches: [main]
    paths:
      - 'magica/**'
      - '!magica/research/**'
      - '!magica/i18n_audit/**'
      - 'madomagi/engine_i18n.tsv'
      - 'madomagi/repair_manifest.json'
      - 'madomagi/resource/image_native/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: personal-main-hotupdate-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'HiiragiNemu/magireco-cn-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read frozen full JS and last cumulative package
        run: |
          mkdir -p baseline previous
          gh release download latest --repo "$GITHUB_REPOSITORY" --pattern cn_js_update.zip --dir baseline
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets > baseline/assets.json
          python3 - <<'PY'
          import json,os,subprocess
          names={x['name'] for x in json.load(open('baseline/assets.json'))['assets']}
          selected=names & {'cn_js_delta.zip','version_js_delta.json','cn_js_delta_manifest.json'}
          if selected and len(selected)!=3: raise SystemExit('Incomplete previous supplement release; repair before replacing')
          for name in sorted(selected):
              subprocess.run(['gh','release','download','latest','--repo',os.environ['GITHUB_REPOSITORY'],'--pattern',name,'--dir','previous'],check=True)
          cfg=json.load(open('configures/js-delta-baseline.json'))
          subprocess.run(['git','fetch','--depth=1','origin',cfg['base_source_commit']],check=True)
          PY
      - name: Build cumulative overlay without changing full JS
        run: |
          node tools/test-title-localization.cjs .
          python3 tools/test-i18n-delta-package.py
          PREVIOUS=()
          if [ -f previous/cn_js_delta.zip ]; then PREVIOUS=(--previous previous/cn_js_delta.zip); fi
          python3 tools/build-cumulative-js-delta.py --base baseline/cn_js_update.zip --out payload "${PREVIOUS[@]}"
      - name: Publish ZIP first and version identity last with rollback
        run: python3 tools/publish-js-delta.py --payload payload --previous previous
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-delta-publication
          path: |
            payload/cn_js_delta.zip
            payload/version_js_delta.json
            payload/cn_js_delta_manifest.json
            payload/build-receipt.json
            payload/publication-verification.json
            previous/
