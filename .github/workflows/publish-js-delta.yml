name: 统一资源包发布
on:
  push:
    branches: [main]
    paths:
      - 'magica/**'
      - '!magica/research/**'
      - '!magica/i18n_audit/**'
      - 'madomagi/engine_i18n.tsv'
      - 'madomagi/repair_manifest.json'
      - 'madomagi/resource/image_native/**'
      - 'madomagi/resource/scenario/**'
      - 'configures/js-delta-baseline.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-player-resource-mirror
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'HiiragiNemu/magireco-cn-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve existing product and cumulative overlay regression checks
        run: |
          node tools/test-uwasa-names.cjs .
          node tools/test-double-home-caption.cjs .
          node tools/test-title-localization.cjs .
          node tools/test-title-cn-style.cjs .
          python3 tools/test-web-image-cn-originals.py --root .
          python3 tools/test-running-connecting.py --root .
          python3 tools/test-gacha-public-repair.py --root .
          python3 tools/test-compose-item-public-repair.py --root .
          python3 tools/test-nanoha-memoria-public-repair.py --root .
          node tools/test-battle-gap-20260924.cjs .
          python3 tools/test-battle-short-texts.py --root .
          python3 tools/test-battle-cn-authority.py --root .
          node tools/test-existing-skill-proofread.cjs .
          node tools/test-existing-memoria-nanoha.cjs .
          node tools/test-existing-skill-names.cjs .
          node tools/test-existing-skill-terms.cjs .
          node tools/test-existing-voice-context.cjs .
          node tools/test-white-feather-standardization.cjs .
          python3 tools/test-cumulative-extra-paths.py
          python3 tools/test-i18n-delta-package.py
      - name: Reject last-writer regression and version rollback
        run: |
          python3 tools/test_resource_layers.py -v
          python3 tools/test_coherent_publication.py -v
          python3 tools/test-public-resource-mirror.py
      - name: Build from one main tree and publish coherent latest in both repositories
        run: python3 -u tools/publish_coherent_resources.py --work resource-publication --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coherent-resource-publication
          path: |
            resource-publication/prepared-report.json
            resource-publication/publication-report.json
            resource-publication/publication-progress.json
            resource-publication/*-before.json
            resource-publication/payload/*.json
            resource-publication/payload/cn_scenario_update.zip
            resource-publication/payload/cn_js_delta.zip
            resource-publication/before/
          if-no-files-found: warn
          retention-days: 30
