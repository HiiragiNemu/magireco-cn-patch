name: 🚀 触发下游同步

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published, edited, released]
  workflow_dispatch: # 保留手动触发以便测试

permissions:
  contents: read

jobs:
  trigger-downstream:
    runs-on: ubuntu-latest
    env:
      # 关键：这里引用的是上游仓库里你添加的 Secret 名称
      : ${{ secrets.DOWNSTREAM_TRIGGER_TOKEN }}
      DOWNSTREAM_OWNER: "MagirecoCN-Revival-Project"
      DOWNSTREAM_REPO: "patch-front"
      
    steps:
      - name: 🔍 获取上游最新 Commit SHA
        id: get_info
        run: |
          echo "获取上游最新 commit..."
          # 获取上游自身最新 commit 的 SHA
          COMMIT_SHA=$(gh api repos/${{ github.repository }}/branches/main --jq '.commit.sha')
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "最新 commit: $COMMIT_SHA"

      - name: 🚀 触发下游仓库 Action
        run: |
          echo "向上游发送 Repository Dispatch 事件..."
          
          # 向下游仓库发送自定义事件
          gh api repos/${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}/dispatches \
            --method POST \
            --field event_type="upstream-update" \
            --field client_payload[upstream_sha]="${{ steps.get_info.outputs.commit_sha }}" \
            --field client_payload[triggered_by]="${{ github.actor }}"
          
          echo "✅ 下游仓库已成功收到触发信号！"

      - name: 📊 生成运行摘要
        if: always()
        run: |
          echo "## 🚀 触发下游同步报告" >> $GITHUB_STEP_SUMMARY
          echo "- **触发事件**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **上游 Commit**: ${{ steps.get_info.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **目标下游**: ${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}" >> $GITHUB_STEP_SUMMARY
