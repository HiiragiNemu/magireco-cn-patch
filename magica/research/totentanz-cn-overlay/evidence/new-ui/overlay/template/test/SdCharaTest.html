<div id="SdCharaTest">
  <div id="RegularEventGroupBattleBoss" class="hide">
    <div id="battleInfoWrap"></div>
    <div id="gpInfoWrap"></div>
    <div id="footerWrap"></div>
  </div>
  <div id="miniCharaWrap" class="commonFrame1">
    <h2>迷你角色显示</h2>
    <ul id="inputWrap">
      <li>index：<span class="addNumBtn TE" data-add="-1" data-limit="1" data-target="inputIndex">-</span>
        <input type="text" id="inputIndex" class="commonInput" placeholder="输入index" value="1" readonly="readonly" style="width: 50px;">
        <span class="addNumBtn TE" data-add="1" data-target="inputIndex">+
      </li>
      <li>id：<input type="text" id="inputCharaId" class="commonInput" placeholder="输入charaId" value="1015" readonly="readonly">00</li>
      <li>X：<input type="text" id="inputCharaX" class="commonInput" placeholder="输入X坐标" value="300" readonly="readonly"></li>
      <li>Y：<input type="text" id="inputCharaY" class="commonInput" placeholder="输入Y坐标" value="300" readonly="readonly"></li>
      <li>Scale：<input type="text" id="inputCharaScale" class="commonInput" placeholder="输入Scale" value="1.0" readonly="readonly"></li>
      <li>Fade：<input type="text" id="inputCharaFade" class="commonInput" placeholder="输入Fade" value="0.3" readonly="readonly"></li>
      <li> Anime：<select id="animeSelect" class="commonInput" style="width: 105px;font-size: 12px;"> <% var animeArr = ["wait","stance","stance_con","flatline","damage","dead","app","meta","activate","attack_in","attack_out","attackv_in","attackv_out","attackh_in","attackh_out","reaction"]; %> <% _.forEach(animeArr,function(txt){ %> <option value="<%= txt %>"><%= txt %></option> <% }) %> </select>
      </li>
    </ul>
    <div id="reverseBtn" class="sb_gold_01 TE noReverse">翻转</div>
    <p class="common_line lc_beige"></p>
    <!-- <p class="displayCharaBtn mb_pink TE" data-hide="false">chara显示</p> -->
    <!-- <p class="hideCharaBtn mb_pink TE" data-hide="true">chara隐藏</p> -->
    <p class="stockBtn mb_white TE" data-hide="false">库存</p>
    <p class="stockPopupBtn mb_white TE">列表</p>
    <p class="stockClearBtn mb_white TE">删除</p>
    <p class="displayMultiCharaBtn mb_pink TE" data-hide="false" style="margin-left: 50px;">显示库存</p>
    <p class="hideMultiCharaBtn mb_pink TE" data-hide="true">隐藏库存</p>
    <p class="groupBattleBtn mb_pink TE" style="margin-left: 50px;">心魔战UI</p>
  </div>
</div>
