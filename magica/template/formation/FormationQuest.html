<div id="FormationQuest">
	<div id='bonusTextWrap'></div>

	<!-- 通常 -->
	<div id="deckFormationWrap" class="">

		<div id="formationSheetWrap"></div>

		<p id="deckName" class='se_tabs'></p>
		<p id="deckStatus"></p>

		<div id="deckWrap"></div>

		<div id="bottomWrap">
			<div id="cautionText">请点击要更换的魔法少女</div>

				<li class="btn TE se_tabs b_white" id="fomationSheetBtn"><span class="b_screen"></span>魔法阵型</li>

	<!-- フォーメーションシート変更 -->

		<div id="formationSheetPreview"></div>

		<div id="formationSheetListInner">
			<div class="scrollWrap"></div>
		</div>

		<div id="bottomWrap">
			<div id="cautionText">请选择魔法阵型</div>
			<ul class="btnList flexBox">
				<li class="btn se_decide b_pink TE" id="formationSheetSetBtn">确定</li>
			</ul>
		</div>
	</div>

	<!-- デッキ変更 -->
	<div id="deckSelectWrap" class="hide">
		<div id="bottomWrap">
			<div id="cautionText">请点击要编成的队伍</div>
		</div>
	</div>

	<!-- デッキプレビュー -->
	<div id="deckPreviewWrap" class="hide">
		<div id="bottomWrap">
			<div id="cautionText">这是当前编成中队伍的预览</div>
			<ul class="btnList flexBox">
				<li class="btn se_decide b_pink " id="deckPreviewCloseBtn">确定</li>
			</ul>
		</div>
	</div>

	<!-- デッキ詳細 -->
	<div id="deckDetailWrap" class="hide status" data-cnt="0">

			</div>

			</div>
		</div>

		<div id="bottomWrap">

		</div>
	</div>

</div>

<script type="text/template" id="DeckNameChangeTemp">
	<div class="profileChange">
		<input id="commentInput" readonly="readonly" value='<%="<%= model.name %\>"%>' maxlength="50" /><br>
		<span class="commentNotis c_red">不能使用表情符号</span>
		<div class="textCount c_gold"><span id="textCount" class="c_gold"><%="<%= model.name.length %\>"%></span>/10</div>
		<div class="btn b_pink se_decide TE" id="commentDecide"><span class="b_screen"></span>OK</div>
	</div>
</script>

<script type="text/template" id="FormationTemp">
		<%="<% var effectArr = []; %\>"%>
		<div class="formationSheet">
			<%="<% _.forEach(model.formationSheet.positionArr,function(txt,index){ %\>"%>
				<div class='formationMass pos_<%="<%= txt %\>"%>'>
					<div class="formationEffect">
						<%="<% effectArr[index] = model.formationSheet['place'+txt].split(','); %\>"%>
						<%="<% if(effectArr[index][0].split('_')[2].indexOf('0') == -1) { %\>"%>
							<%="<% formationAtt = effectArr[index][0].split('_')[0].toLowerCase(); %\>"%>
							<img class="attIcon" src='/magica/resource/image_web/common/chara/att_<%="<%= formationAtt %\>"%>.png' >

							<%="<% _.forEach(effectArr[index],function(txt){ %\>"%>
								<%="<% var fileName = txt.toLowerCase().split('_')[1]+'_'+txt.toLowerCase().split('_')[2] %\>"%>
								<%="<% if(fileName.indexOf('0') == -1) { %\>"%>
									<img src='/magica/resource/image_web/icon/formation/<%="<%= fileName %\>"%>.png' >
								<%="<% } %\>"%>
							<%="<% }) %\>"%>
						<%="<% } %\>"%>
					</div>
				</div>
			<%="<% }) %\>"%>
		</div>

		<div class="formationHead">
			<%="<% var i = 0; %\>"%>
			<%="<% while(i < 5) { %\>"%>
				<div class='head pos_<%="<%= i+1 %\>"%>'>
					<div class="formationEffect flexBox">
					<%="<% if(effectArr[i][0].split('_')[2].indexOf('0') == -1) { %\>"%>
						<%="<% formationAtt = effectArr[i][0].split('_')[0].toLowerCase(); %\>"%>
						<img class="attIcon" src='/magica/resource/image_web/common/chara/att_<%="<%= formationAtt %\>"%>.png' >
					<%="<% } %\>"%>
					<%="<% _.forEach(effectArr[i],function(txt){ %\>"%>
						<%="<% var fileName = txt.toLowerCase().split('_')[1]+'_'+txt.toLowerCase().split('_')[2] %\>"%>
						<%="<% if(fileName.indexOf('0') == -1) { %\>"%>
							<img src='/magica/resource/image_web/icon/formation/<%="<%= fileName %\>"%>.png' >
						<%="<% } %\>"%>
					<%="<% }) %\>"%>
					</div>

					<div class='formationMiniMap'>
						<%="<% _.forEach(model.formationSheet.positionArr,function(txt){ %\>"%>
							<%="<%if(model.formationSheet.positionArr[i] == txt) { %\>"%>
							<span class='pos_<%="<%= txt %\>"%> on'></span>
							<%="<% } else { %\>"%>
							<span class='pos_<%="<%= txt %\>"%>'></span>
							<%="<% } %\>"%>
						<%="<% }) %\>"%>
					</div>
				</div>

			<%="<% 	i=(i+1)|0; %\>"%>
			<%="<% } %\>"%>
		</div>
</script>
