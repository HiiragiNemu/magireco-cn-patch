<div id="FormationQuest">
	<div id='bonusTextWrap'></div>

	<!-- 通常 -->
	<div id="deckFormationWrap">
		<div id="formationSheetWrap">
			<div class="formationHead">
				<div class="head pos_1">
					<img src="/magica/resource/image_web/common/chara/att_all_f.png" alt="">
				</div>

				<div class="head pos_2">
					<img src="/magica/resource/image_web/common/chara/att_fire_f.png" alt="">
				</div>

				<div class="head pos_3">
					<img src="/magica/resource/image_web/common/chara/att_water_f.png" alt="">
				</div>

				<div class="head pos_4">
					<img src="/magica/resource/image_web/common/chara/att_timber_f.png" alt="">
				</div>

				<div class="head pos_5">
					<img src="/magica/resource/image_web/common/chara/att_light_f.png" alt="">
				</div>

				<div class="head pos_6">
					<img src="/magica/resource/image_web/common/chara/att_dark_f.png" alt="">
				</div>
			</div>
		</div>

		<div id="deckWrap"></div>

		<div id="bottomWrap">
			<div id="cautionText">请设置各属性的支援角色</div>
			<ul class="btnList flexBox">
				<li class="btn se_tabs b_white TE" id="deckResetBtn"><span class="b_screen"></span>解散支援</li>
				<li class="btn se_tabs b_white TE" id="deckDetailBtn"><span class="b_screen"></span>支援详情</li>
			</ul>
			<div id="mainBtn" class='se_decide off TE'>确定</div>
			<div id="questMainBtn" class='TE'>开始</div>
		</div>
	</div>

	<!-- デッキ詳細 -->
	<div id="deckDetailWrap" class="hide status" data-cnt="0">
		<div id="bottomWrap">
			<div id="cautionText">魔法少女的详细信息</div>
 			<ul class="btnList flexBox">
				<li class="btn se_decide b_pink TE" id="deckDetailCloseBtn">确定</li>
			</ul>
			<p id="detailViewCnt" class="ts_gold"><span class="ts_gold">1</span>/4</p>
			<p id="detailViewChange" class="btn se_tabs b_white TE"><span class="b_screen"></span>切换显示</p>
		</div>
	</div>

</div>

<script type="text/template" id="DeckCardPartsTemp">
	<div class="select"></div>
	<%="<% if(model.card) { %\>"%>
		<%="<% if(!model.support) { %\>"%>
			<div class="epSetBtn"></div>
		<%="<% } %\>"%>
		<div class="maskWrap">
			<img class="charaImg"
				 data-nativeimgkey='card_<%="<%= model.displayCardId %\>"%>_v'
				 data-src='resource/image_native/card/image/card_<%="<%= model.displayCardId %\>"%>_v.png' alt=''>

			<div class="status">
				<div id="attribute"><span class='type_f <%="<%= model.card.attributeId %\>"%>'></span></div>
				<p id="level" class="ts_gold">Lv<%="<%= model.level %\>"%></p>
				<div id="rare" class='<%="<%= model.card.rank %\>"%>'>
					<%="<% var i = 0; %\>"%>
					<%="<% var maxRare = model.maxRare || Number(model.card.rank.split('RANK_')[1]); %\>"%>
					<%="<% while(i < maxRare) { %\>"%>
						<span></span>
					<%="<% i=(i+1)|0; %\>"%>
					<%="<% } %\>"%>
				</div>
				<dl>
					<dt class="c_gold">HP</dt><dd><%="<%= model.hp %\>"%></dd>
					<dt class="c_gold">ATK</dt><dd><%="<%= model.attack %\>"%></dd>
					<dt class="c_gold">DEF</dt><dd><%="<%= model.defense %\>"%></dd>
				</dl>
			</div>
		</div>
	<%="<% } %\>"%>
	<div class="bg"></div>
</script>

			</div>

				</div>
			</div>

				</div>

					<p class="skillName"><%="<%= model.card.cardMagia.name %\>"%></p>
				</div>
			</div>

			<div class="detail memoria1">
				<%="<% if(model.equipPiece1) { %\>"%>

						<div class="memoriaImg">
							<img data-nativeimgkey='memoria_<%="<%=  model.equipPiece1.pieceId %\>"%>_s' data-src='resource/image_native/memoria/memoria_<%="<%=  model.equipPiece1.pieceId %\>"%>_s.png'>

						</div>
						<div class="skillName">
							<%="<% if(model.equipPiece1.lbCount > 3 && model.equipPiece1.piece.pieceSkill2) { %\>"%>
								<p><%="<%= model.equipPiece1.piece.pieceSkill2.name %\>"%></p>
							<%="<% } else if(model.equipPiece1.piece.pieceSkill) { %\>"%>

							<%="<% } %\>"%>
						</div>
					</div>

					</div>

						<div class="skillName">
							<p>未装备</p>
						</div>
					</div>
				<%="<% } %\>"%>


			</div>

				<%="<% if(model.revision < 2) { %\>"%>
