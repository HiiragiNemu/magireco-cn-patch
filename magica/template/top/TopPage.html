<div id="TopPage">
	<% if(model.aj2018) { %>
		<style type='text/css'>
			.aj2018Btn {
				width: 128px;
				height: 152px;
				background: url('/magica/resource/image_web/test/aj2018/event_pop.png') left top no-repeat;

				position: absolute;

				bottom: 56px;
				left: 12px;
				z-index: 10000000;
			}
		</style>
		<div class='aj2018Btn linkBtn se_decide TE' data-href='#/RealGachaTop'></div>
	<% } %>

	<p id="transferBtn"><span class="topBtn se_decide c_gold">数据转移与账号关联</span></p>
	<p id="clearBtn"><span class="topBtn se_decide c_gold">清除缓存</span></p>

	<% if(model.user && model.user.tutorialId == 'TU999'){ %>
		<p id="opMovieBtn"><span class="topBtn se_decide c_gold">第二部片头动画</span></p>
	<% } %>

	<% if(model.gameUser && model.gameUser.inviteCode){ %>
		<p id="userIdPannel">玩家ID:<%= model.gameUser.inviteCode %></p>
	<% } %>

	<div>
		<div id="touchScreen" class="se_kettei02">

			<div id="touchBackground"></div>
		</div>
	</div>

	<p id="terms"><span>使用条款</span></p><p id="copy"></p>
	<p id="app_ver" class="c_purple">VER.<span class="c_purple"></span></p>
</div>

<script id="transferInner" type="text/template">
	<div id="transferPopup">
		<span class="leftCol c_gold">数据转移·关联ID</span><span class="rightCol"><input type="text" id="transferId" class="personalId" value=""></span><br>
		<span class="leftCol c_gold">密码</span><span class="rightCol"><input type="password" id="transferPassword" class="password" value=""></span>
		<div class="transferAlert c_red">※密码为8~15个字符。</div>

	</div>
</script>
